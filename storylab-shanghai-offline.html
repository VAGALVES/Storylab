ief":"Faça descrição objetiva; acrescente dois detalhes observáveis e uma relação espacial.","seconds":30},{"id":"challenge-32","scene":"uma loja de tecnologia","mode":"narrativo","brief":"Construa abertura, progressão e conclusão; não invente eventos.","seconds":45},{"id":"challenge-33","scene":"uma loja de tecnologia","mode":"analitico","brief":"Inclua comparação com critério e qualifique uma interpretação.","seconds":60},{"id":"challenge-34","scene":"um pátio interno","mode":"descritivo","brief":"Faça descrição objetiva; acrescente dois detalhes observáveis e uma relação espacial.","seconds":30},{"id":"challenge-35","scene":"um pátio interno","mode":"narrativo","brief":"Construa abertura, progressão e conclusão; não invente eventos.","seconds":45},{"id":"challenge-36","scene":"um pátio interno","mode":"analitico","brief":"Inclua comparação com critério e qualifique uma interpretação.","seconds":60},{"id":"challenge-37","scene":"uma ponte para pedestres","mode":"descritivo","brief":"Faça descrição objetiva; acrescente dois detalhes observáveis e uma relação espacial.","seconds":30},{"id":"challenge-38","scene":"uma ponte para pedestres","mode":"narrativo","brief":"Construa abertura, progressão e conclusão; não invente eventos.","seconds":45},{"id":"challenge-39","scene":"uma ponte para pedestres","mode":"analitico","brief":"Inclua comparação com critério e qualifique uma interpretação.","seconds":60},{"id":"challenge-40","scene":"um corredor iluminado","mode":"descritivo","brief":"Faça descrição objetiva; acrescente dois detalhes observáveis e uma relação espacial.","seconds":30},{"id":"challenge-41","scene":"um corredor iluminado","mode":"narrativo","brief":"Construa abertura, progressão e conclusão; não invente eventos.","seconds":45},{"id":"challenge-42","scene":"um corredor iluminado","mode":"analitico","brief":"Inclua comparação com critério e qualifique uma interpretação.","seconds":60},{"id":"challenge-43","scene":"uma praça movimentada","mode":"descritivo","brief":"Faça descrição objetiva; acrescente dois detalhes observáveis e uma relação espacial.","seconds":30},{"id":"challenge-44","scene":"uma praça movimentada","mode":"narrativo","brief":"Construa abertura, progressão e conclusão; não invente eventos.","seconds":45},{"id":"challenge-45","scene":"uma praça movimentada","mode":"analitico","brief":"Inclua comparação com critério e qualifique uma interpretação.","seconds":60},{"id":"challenge-46","scene":"uma mochila de viagem","mode":"descritivo","brief":"Faça descrição objetiva; acrescente dois detalhes observáveis e uma relação espacial.","seconds":30},{"id":"challenge-47","scene":"uma mochila de viagem","mode":"narrativo","brief":"Construa abertura, progressão e conclusão; não invente eventos.","seconds":45},{"id":"challenge-48","scene":"uma mochila de viagem","mode":"analitico","brief":"Inclua comparação com critério e qualifique uma interpretação.","seconds":60}],"layers":[{"title":"Observar","question":"O que há de fato diante de mim?","example":"Vejo árvores de ambos os lados da rua."},{"title":"Descrever","question":"Que forma, cor ou textura consigo nomear?","example":"As copas formam uma cobertura verde."},{"title":"Sentir","question":"Que sons, luzes e ritmos estão presentes?","example":"A luz atravessa as folhas, enquanto passam bicicletas."},{"title":"Localizar","question":"Onde estão os elementos uns em relação aos outros?","example":"À esquerda estão as vitrines; ao fundo, uma esquina."},{"title":"Contextualizar","question":"O que sei, com fonte e data?","example":"A origem do lugar ainda precisa ser pesquisada."},{"title":"Comparar","question":"Qual critério permite uma comparação justa?","example":"Este trecho parece menos movimentado que a avenida que acabamos de percorrer."},{"title":"Interpretar","question":"Qual hipótese posso apresentar com cautela?","example":"Minha impressão é que a sombra torna a caminhada mais agradável."},{"title":"Humanizar","question":"Que pessoa ou ação dá escala à história?","example":"Um barista prepara café enquanto clientes chegam."},{"title":"Sintetizar","question":"Que ideia legítima fica depois da cena?","example":"Conhecer a cidade também é perceber suas pequenas rotinas."}],"speechDrills":[{"id":"clinic-01","topic":"Precisão lexical","weak":"Que lugar maravilhoso, muito legal mesmo!","strong":"A luz atravessa as copas das árvores e destaca os detalhes das fachadas.","why":"Substitua adjetivos vazios por elementos observáveis da cena.","challenge":"Descreva uma fachada sem bonito, incrível ou legal."},{"id":"clinic-02","topic":"Limite da observação","weak":"Aqui ninguém usa dinheiro em espécie.","strong":"Nos pagamentos que observei hoje, as pessoas utilizaram aplicativos. Não investiguei outras formas de pagamento.","why":"Uma visita limitada não permite concluir o comportamento de toda a cidade.","challenge":"Transforme uma generalização sobre transporte em observação situada."},{"id":"clinic-03","topic":"Causa versus correlação","weak":"Tem fila porque a comida é a melhor do bairro.","strong":"Há uma fila neste horário. Ainda não perguntei às pessoas por que escolheram o restaurante.","why":"Uma cena não revela automaticamente os motivos de quem participa dela.","challenge":"Descreva um lugar cheio sem explicar a causa de forma especulativa."},{"id":"clinic-04","topic":"Detalhes espaciais","weak":"Tem um negócio ali atrás daquilo.","strong":"Ao fundo, à direita do quadro, há uma entrada sob uma marquise de vidro.","why":"Referência de quadro, direção e objeto específico orientam o espectador.","challenge":"Guie uma pessoa imaginária por três elementos do seu enquadramento."},{"id":"clinic-05","topic":"Conexão causal","weak":"Tem sombra. E também tem árvore. E isso é legal.","strong":"As copas das árvores projetam sombra sobre boa parte da calçada. Isso muda a experiência de caminhar aqui neste horário.","why":"Conecte detalhe a consequência sem repetir o mesmo adjetivo.","challenge":"Ligue material, iluminação e sensação em três frases."},{"id":"clinic-06","topic":"Foco narrativo","weak":"Aqui tem muita coisa, loja, árvore, prédio, pessoa, tudo.","strong":"Quero destacar dois elementos: o desenho da fachada e a maneira como a calçada é ocupada.","why":"Selecionar é parte da edição oral: dois pontos bem desenvolvidos valem mais que uma enumeração vaga.","challenge":"Escolha só dois detalhes de uma vitrine e desenvolva cada um."},{"id":"clinic-07","topic":"Contraste fundamentado","weak":"No Brasil não tem nada disso.","strong":"Este procedimento é diferente daquele que eu costumava utilizar no Brasil; vou mostrar as etapas e suas limitações.","why":"Diferencie experiência pessoal e comparação universal entre países.","challenge":"Compare duas formas de pagar sem estereotipar culturas."},{"id":"clinic-08","topic":"Ritmo de locução","weak":"Vamos-entrar-aqui-agora-e-ver-tudo-junto.","strong":"Vamos entrar aqui. [pausa] Primeiro, observe a organização do espaço. Depois, vamos aos detalhes.","why":"Pausas intencionais transformam sequência acelerada em instruções audíveis.","challenge":"Marque três pausas num roteiro de 60 palavras."},{"id":"clinic-09","topic":"Fonte explícita","weak":"Parece que esse lugar tem cem anos.","strong":"O edifício apresenta elementos ornamentais. A data de construção precisa ser verificada em uma fonte histórica.","why":"Estilo e aparência não comprovam idade.","challenge":"Troque três dados históricos supostos por perguntas de pesquisa."},{"id":"clinic-10","topic":"Observação e opinião","weak":"Aquela loja é a mais sofisticada.","strong":"A vitrine combina iluminação discreta e poucos elementos. A composição me transmite uma sensação de sofisticação.","why":"A segunda frase assume a natureza interpretativa da experiência estética.","challenge":"Separe descrição e avaliação em um review de produto."},{"id":"clinic-11","topic":"Linguagem sensorial","weak":"O café é muito bom e delicioso.","strong":"O primeiro gole tem acidez perceptível e um aroma que me lembra frutas cítricas.","why":"Ao relatar sabor, nomeie sensações próprias sem afirmar composição sem comprovação.","challenge":"Descreva uma bebida em aroma, textura e intensidade."},{"id":"clinic-12","topic":"Abordagem de entrevista","weak":"Você não acha que isso está errado?","strong":"Como você avalia essa mudança? O que melhorou e o que se tornou mais difícil?","why":"Perguntas abertas reduzem indução e permitem respostas inesperadas.","challenge":"Crie uma pergunta aberta para um comerciante."},{"id":"clinic-13","topic":"Escuta ativa","weak":"Tá, legal. Próxima pergunta.","strong":"Você mencionou uma dificuldade com o horário. Pode contar um episódio que mostre como isso acontece?","why":"Aprofundar a resposta do entrevistado cria informação, em vez de avançar mecanicamente.","challenge":"Formule duas perguntas de seguimento para uma resposta fictícia."},{"id":"clinic-14","topic":"Reformulação elegante","weak":"É… tipo… sabe… o lugar é bem…","strong":"O que quero destacar é a diferença entre a iluminação interna e a luz da rua.","why":"Recomeçar com uma frase-âncora recupera estrutura sem preencher cada pausa.","challenge":"Grave um comentário de 30 segundos e troque muletas por silêncio."},{"id":"clinic-15","topic":"Hierarquia de informação","weak":"Tem umas pessoas e uma placa e uma calçada e uma obra.","strong":"A mudança principal é a obra na calçada. A sinalização orienta os pedestres para o outro lado da rua.","why":"Primeiro a informação relevante; depois os detalhes que a explicam.","challenge":"Reordene três observações começando pela mais importante."},{"id":"clinic-16","topic":"Cuidado intercultural","weak":"Os chineses são assim mesmo.","strong":"Nesta interação, a pessoa preferiu explicar o procedimento por gestos. Não sei se isso reflete um costume mais amplo.","why":"Não transforme um encontro individual em característica de uma população.","challenge":"Reescreva um comentário cultural para manter curiosidade sem generalização."},{"id":"clinic-17","topic":"Fechamento específico","weak":"E é isso. Lugar incrível. Tchau!","strong":"Começamos observando a fachada; terminamos entendendo como a luz e o movimento da rua mudam sua aparência.","why":"Uma síntese recupera o assunto e mostra progresso de conhecimento.","challenge":"Feche um vídeo retomando uma pergunta lançada na abertura."},{"id":"clinic-18","topic":"Expressividade","weak":"Olha isso! Meu Deus! Insano!","strong":"Repare na altura deste vão. Só quando uma pessoa passa por ele percebemos a escala da estrutura.","why":"A surpresa pode ser comunicada com medida relativa, sem excesso de exclamações.","challenge":"Crie um comentário de surpresa usando escala e comparação."},{"id":"clinic-19","topic":"Apresentação de informação técnica","weak":"Essa câmera tem um sensor melhor, então é perfeita.","strong":"Neste teste com pouca luz, a imagem manteve detalhes nas sombras. Isso não garante o mesmo resultado em todas as cenas.","why":"Relate condições do teste e evite absolutismos de produto.","challenge":"Explique uma especificação mostrando consequência e limitação."},{"id":"clinic-20","topic":"Visual e narração","weak":"Isso é uma bicicleta vermelha, como vocês podem ver.","strong":"A bicicleta entra no quadro e cruza a rua. Vou deixar o som original para observarmos o ritmo da cena.","why":"Quando a imagem já entrega uma característica, a voz pode acrescentar intenção ou contexto.","challenge":"Escreva uma locução que não repita o que o vídeo mostra."},{"id":"clinic-21","topic":"Dado com contexto","weak":"O aluguel custa oito mil!","strong":"Nesta pesquisa, encontrei um anúncio por 8.000 yuans mensais. Ainda preciso confirmar condomínio, contas e condições contratuais.","why":"Preço exige moeda, período, fonte e condições; não é uma média de mercado.","challenge":"Apresente uma cotação sem tratá-la como preço universal."},{"id":"clinic-22","topic":"Pergunta como motor","weak":"Vou filmar essa praça porque ela é bonita.","strong":"Quero descobrir como diferentes pessoas usam esta praça ao longo da manhã.","why":"Uma pergunta verificável cria linha editorial além da contemplação.","challenge":"Formule uma pergunta jornalística para um mercado de rua."},{"id":"clinic-23","topic":"Precisão temporal","weak":"A estação está sempre cheia.","strong":"Às 18h desta quarta-feira, encontrei a plataforma bastante movimentada.","why":"O horário é parte da informação; “sempre” requer dados muito mais amplos.","challenge":"Converta uma afirmação absoluta em relato observacional."},{"id":"clinic-24","topic":"Transição com lógica","weak":"Mas enfim, bora pra outra coisa.","strong":"Entendemos o desenho da vitrine. Agora vamos observar como os produtos são apresentados.","why":"A transição explica por que o próximo assunto vem depois do anterior.","challenge":"Conecte arquitetura externa e experiência dentro de uma loja."}]};

  <script>
window.STORYLAB_ATLAS_GUIDES = [{"scene":"Uma rua com fachada comercial, bancos e árvores","focus":"Formas que organizam a cena: identifique linhas, curvas e padrões sem atribuir estilo arquitetônico sem pesquisa.","terms":[["retilíneo","Que apresenta traçado predominantemente reto.","As linhas retilíneas da fachada contrastam com os galhos das árvores.","Não descreva como retilíneo um contorno com curvas dominantes."],["curvilíneo","Composto por linhas ou superfícies curvas.","O corrimão curvilíneo acompanha a inclinação da escada.","Uma linha levemente inclinada não é necessariamente curva."],["simétrico","Com partes correspondentes em torno de um eixo.","As duas janelas criam uma composição quase simétrica em torno da porta.","Observe diferenças antes de afirmar simetria perfeita."],["orgânico","De formas irregulares ou fluidas inspiradas em padrões naturais.","As linhas orgânicas do canteiro suavizam a geometria da calçada.","Orgânico descreve a forma; não prova que o material seja natural."]],"model":["Na cena proposta, duas fachadas apresentam linhas predominantemente retas.","O desenho curvilíneo dos galhos contrasta com a geometria dos edifícios.","Enquanto a fachada se organiza em eixos regulares, a vegetação ocupa o espaço de maneira menos uniforme.","Minha impressão é que essa diferença de formas torna a caminhada visualmente mais variada."]},{"scene":"Um edifício alto ao lado de pequenas lojas","focus":"Escala e proporção precisam de referências observáveis; altura percebida não é metragem verificada.","terms":[["monumental","De dimensão percebida como muito grande ou imponente em relação ao entorno.","O volume monumental se destaca diante das construções baixas.","Sem medidas, não apresente a altura exata como fato."],["compacto","Com dimensões relativamente contidas e organização concentrada.","O espaço compacto reúne balcão, circulação e vitrines em poucos metros aparentes.","Compacto não equivale necessariamente a apertado ou desconfortável."],["amplo","Que oferece extensão ou espaço perceptivelmente generoso.","O vão amplo permite ver a praça desde a entrada.","Evite usar amplo quando só o enquadramento da lente aumenta a sensação de espaço."],["proporcional","Com relação equilibrada de dimensões entre as partes, segundo critério explicado.","A marquise parece proporcional à largura da entrada.","Equilíbrio visual é avaliação; explique o critério."]],"model":["Neste exercício, um volume alto se destaca ao lado de fachadas comerciais baixas.","O espaço de entrada de uma das lojas é compacto, com vitrine e porta muito próximas.","A diferença entre o edifício e as lojas fica mais clara quando incluímos pessoas no enquadramento como referência de escala.","Na minha leitura, essa variação de proporções ajuda a revelar camadas diferentes da paisagem urbana."]},{"scene":"Uma cafeteria iluminada pela manhã","focus":"Descreva direção, intensidade e qualidade da luz pelo que é visível, não pela temperatura presumida da lâmpada.","terms":[["difusa","Luz espalhada, com sombras pouco definidas.","A luz difusa ilumina a parede sem desenhar sombras duras.","Luz fraca e luz difusa não são sinônimos."],["rasante","Luz que incide em ângulo baixo sobre uma superfície.","A luz rasante destaca as irregularidades do revestimento.","Confirme a direção da incidência antes de usar o termo."],["contrastada","Com diferença marcada entre regiões claras e escuras.","A iluminação contrastada deixa a bancada clara e o corredor em sombra.","Não confunda contraste de iluminação com contraste de cores."],["refletida","Luz que atinge uma superfície depois de rebater em outra.","Uma faixa de luz refletida aparece sobre o vidro da vitrine.","Não é possível concluir a fonte exata de um reflexo sem observação."]],"model":["Na cena de estudo, a luz entra pela janela e alcança a bancada.","Sobre a madeira, a incidência rasante evidencia veios e pequenas irregularidades.","Enquanto o balcão está iluminado, o corredor ao fundo permanece mais escuro, criando contraste.","Para mim, a passagem entre essas áreas de luz e sombra conduz o olhar até o preparo do café."]},{"scene":"Uma vitrine com roupas, letreiros e objetos","focus":"Diferencie matiz, saturação e temperatura percebida; uma cor não prova a intenção de uma marca.","terms":[["monocromático","Que utiliza uma cor ou variações próximas de um mesmo matiz.","A vitrine utiliza uma composição quase monocromática em tons de azul.","Uma única cor não impede variação de luz e saturação."],["saturado","De cor intensa, com pouca aproximação ao cinza.","O letreiro vermelho saturado se destaca contra a parede clara.","Saturação não é sinônimo de luminosidade alta."],["dessaturado","De cor com intensidade reduzida, próxima de tons acinzentados.","Os verdes dessaturados produzem um contraste suave com o piso.","Não chame toda cor pastel de dessaturada sem considerar matiz e luminosidade."],["terroso","De tonalidade associada visualmente a argila, areia, ferrugem ou terra.","Os tons terrosos da coleção aproximam visualmente casacos e acessórios.","Terroso nomeia a aparência, não a composição do corante."]],"model":["A vitrine do exercício reúne peças de tons terrosos e um letreiro colorido.","O vermelho mais saturado do letreiro se destaca diante das roupas de baixa intensidade cromática.","Comparada à parede neutra do fundo, a combinação das peças cria um conjunto cromático mais quente.","Minha impressão é que o contraste ajuda a organizar a atenção, mas a intenção da marca exigiria confirmação."]},{"scene":"Uma loja de objetos com vidro, cerâmica e metal","focus":"Associe textura e acabamento à superfície que você consegue observar; não deduza propriedades invisíveis.","terms":[["fosco","Com reflexão pouco especular, sem brilho definido.","O vaso fosco espalha a luz sem formar reflexos nítidos.","Fosco não significa áspero: acabamento e tato são dimensões distintas."],["polido","Com superfície tratada para reduzir irregularidades e refletir mais nitidamente.","O corrimão polido reflete formas do ambiente.","A aparência brilhante, isoladamente, não confirma o processo de fabricação."],["poroso","Com pequenos espaços ou aberturas na estrutura aparente.","A superfície porosa da peça deixa pequenas cavidades à vista.","Não afirme absorção de água sem teste ou especificação."],["translúcido","Que permite passar luz sem formar imagem totalmente nítida.","O painel translúcido suaviza a visão do espaço interno.","Translúcido é diferente de transparente."]],"model":["Na prateleira observamos superfícies de cerâmica, vidro e metal.","Um vaso de acabamento fosco contrasta com uma peça metálica que produz reflexos mais nítidos.","Enquanto o vidro deixa ver o fundo, o painel translúcido deixa passar luz e desfoca as formas.","Na minha avaliação, essa alternância de materiais dá ritmo à exposição sem precisar de muitos objetos."]},{"scene":"Um salão de chá quase vazio","focus":"Atmosfera é interpretação fundamentada em pistas sensoriais; evite transformar impressão individual em verdade universal.","terms":[["acolhedor","Que transmite sensação subjetiva de recepção ou conforto.","Para mim, a iluminação baixa e os assentos próximos tornam o salão acolhedor.","Acolhedor é percepção; cite os elementos que a motivam."],["intimista","Que favorece proximidade, recolhimento ou escala reduzida.","As mesas pequenas e a música baixa criam uma atmosfera intimista.","Não pressuponha que todos vivenciem o espaço da mesma forma."],["solene","De caráter formal ou cerimonioso.","O silêncio e o alinhamento dos assentos conferem solenidade à apresentação.","Silêncio sozinho não prova cerimônia."],["descontraído","De clima percebido como informal e pouco rígido.","As conversas espontâneas contribuem para um ambiente descontraído.","Evite atribuir estados emocionais a pessoas desconhecidas."]],"model":["Na situação imaginada, há poucas mesas ocupadas e música em volume discreto.","A disposição dos assentos e a iluminação baixa dão ao salão um aspecto intimista.","Ao contrário de um espaço de circulação rápida, este ambiente parece convidar a permanências mais longas.","Eu o descreveria como acolhedor, mas essa é minha impressão diante dos detalhes observados."]},{"scene":"Bicicletas cruzando uma praça","focus":"Identifique padrão, trajetória e velocidade percebida sem transformar um instante em estatística.","terms":[["fluido","Que ocorre sem interrupções ou mudanças bruscas evidentes.","O fluxo de ciclistas permanece fluido durante a tomada.","Uma cena breve não revela o padrão de todo o dia."],["intermitente","Que alterna períodos de atividade e pausa.","O som da campainha aparece de maneira intermitente.","Intermitente não significa necessariamente irregular."],["circular","Que descreve uma trajetória aproximadamente redonda.","Uma criança percorre um trajeto circular ao redor do canteiro.","Distinga trajetória observada de intenção do movimento."],["cadenciado","Que segue um ritmo identificável, marcado por repetições.","Os passos cadenciados se misturam ao ruído das rodas.","Cadenciado não exige velocidade constante."]],"model":["Na cena simulada, bicicletas atravessam uma praça por trajetos distintos.","O fluxo parece contínuo durante alguns segundos, enquanto o toque das campainhas é intermitente.","Quando comparamos a passagem das bicicletas ao deslocamento dos pedestres, percebemos ritmos diferentes no mesmo espaço.","Minha interpretação é que esses ritmos ajudam a contar a história da praça, mesmo sem uma entrevista."]},{"scene":"Uma fachada de edifício com entrada coberta","focus":"Nomeie elementos construtivos corretamente e não atribua data ou autoria sem pesquisa.","terms":[["fachada","Face exterior visível de uma construção.","A fachada apresenta aberturas regulares e uma entrada central.","O aspecto externo não comprova a idade do edifício."],["marquise","Cobertura projetada sobre uma entrada ou trecho externo.","A marquise protege a faixa de acesso imediato ao prédio.","Não confunda marquise com qualquer sacada."],["pilotis","Pilares que sustentam a edificação, liberando parte do térreo.","O pavimento parece elevado por uma sequência de pilotis visíveis.","Verifique se são pilares estruturais antes de classificar."],["volumetria","Organização dos volumes e massas construídas.","A volumetria alterna um bloco alto com um corpo lateral mais baixo.","Não substitua descrição de volumes por rótulos de estilo sem evidência."]],"model":["O edifício da atividade tem fachada regular e entrada protegida por uma marquise.","A volumetria combina um bloco central mais alto e uma ala lateral de menor altura.","Diferentemente de uma construção com frente plana, esse conjunto projeta volumes em profundidades distintas.","Na minha leitura, observar esses recuos ajuda a entender a composição antes mesmo de procurar sua história."]},{"scene":"Uma esquina com comércio, calçada e árvores","focus":"Descreva o espaço público distinguindo observação direta de diagnóstico urbano.","terms":[["calçada","Faixa destinada principalmente à circulação de pedestres ao longo da via.","A calçada se estreita perto da banca, obrigando a desviar do expositor.","Uma imagem isolada não comprova acessibilidade no trajeto inteiro."],["travessia","Ponto ou ação de atravessar de um lado para outro da via.","A travessia sinalizada fica próxima à esquina.","Não presuma segurança apenas porque há pintura no piso."],["arborização","Conjunto de árvores presente ou implantado em um espaço.","A arborização acompanha quase todo o trecho enquadrado.","Não infira espécie, idade ou manejo sem fonte."],["fachada ativa","Frente edificada com usos e aberturas que geram relação direta com a rua.","As vitrines e portas abertas criam uma fachada ativa voltada à calçada.","Um estabelecimento aberto no instante não prova vitalidade permanente."]],"model":["A esquina do exercício reúne lojas voltadas à calçada e árvores alinhadas à via.","Uma vitrine ocupa boa parte da fachada, enquanto a travessia fica próxima ao cruzamento.","Em comparação a uma frente fechada, as portas e vitrines oferecem mais pontos de contato visual com a rua.","Minha impressão é que esses elementos tornam a caminhada mais interessante; para avaliar acessibilidade, seria preciso observar o percurso completo."]},{"scene":"Uma vitrine de alfaiataria contemporânea","focus":"Comunique moda com precisão técnica e diferencie avaliação estética de informação de fabricação.","terms":[["silhueta","Contorno geral que a peça ou conjunto cria no corpo.","O casaco constrói uma silhueta reta, com pouco ajuste na cintura.","Silhueta não determina por si só o público-alvo da marca."],["caimento","Modo como um tecido ou peça se acomoda e se movimenta no corpo.","O tecido forma pregas suaves e um caimento fluido na barra.","Uma foto estática não revela todo o comportamento em movimento."],["pesponto","Costura visível realizada próxima a uma borda, emenda ou detalhe.","O pesponto aparente acompanha o contorno do bolso.","Não atribua função estrutural sem conhecer a construção."],["modelagem","Desenho técnico e geometria das partes que constituem a roupa.","A modelagem parece ampliar o volume nas mangas.","A aparência externa não confirma o molde interno."]],"model":["Na vitrine proposta, um casaco de silhueta reta aparece sobre uma calça ampla.","Um pesponto visível acompanha a borda do bolso e destaca o acabamento.","Enquanto o casaco mantém linhas mais estruturadas, o tecido da calça forma dobras suaves.","Na minha avaliação, o interesse visual está na relação entre rigidez e fluidez; para julgar a modelagem, precisaria examinar a peça."]},{"scene":"Uma refeição recém-servida","focus":"Separe sensações pessoais, técnicas observáveis e ingredientes que ainda precisam ser confirmados.","terms":[["crocante","Que se rompe com resistência e produz estalos ao mastigar.","A cobertura ficou crocante ao primeiro corte e ao provar.","Fotografia isolada não comprova crocância."],["untuoso","De textura gordurosa e deslizante percebida ao paladar.","O molho tem sensação untuosa e recobre a colher.","Untuoso descreve percepção; não determine um ingrediente sem confirmação."],["ácido","Que apresenta sensação gustativa de acidez.","O sabor ácido aparece no final de cada garfada.","Acidez percebida não mede o pH."],["defumado","Com aroma ou sabor associado à fumaça.","Percebi notas defumadas no aroma do prato.","Notas defumadas não comprovam que houve defumação real."]],"model":["Na cena da atividade, um prato chega à mesa com molho espesso e cobertura dourada.","Ao provar, a cobertura parece crocante e o molho oferece sensação untuosa.","Comparando as duas texturas, uma se rompe ao mastigar enquanto a outra permanece mais envolvente.","Para mim, esse contraste é o aspecto mais marcante do prato, mas seus ingredientes devem ser confirmados no cardápio ou com a cozinha."]},{"scene":"O interior de uma estação com anúncios sonoros","focus":"Descrever som exige distinguir fonte, ritmo e fenômenos acústicos sem inventar medidas.","terms":[["reverberação","Persistência breve de sons refletidos por várias superfícies.","A voz do aviso permanece audível por instantes na forma de reverberação.","Reverberação não é sempre eco separado."],["eco","Repetição audível de um som por reflexão com atraso perceptível.","Um chamado se repete como eco no corredor vazio.","Não chame todo som prolongado de eco."],["zumbido","Som contínuo, geralmente grave ou vibratório.","Um zumbido discreto acompanha o funcionamento do equipamento.","Evite inferir qual máquina o produziu se não a identificou."],["cadência","Organização rítmica de uma sequência sonora.","A cadência dos avisos alterna fala e pequenos intervalos.","Cadência não é sinônimo de volume."]],"model":["A estação simulada apresenta avisos ao público e um ruído contínuo ao fundo.","Em alguns pontos do corredor, o anúncio parece permanecer por instantes devido à reverberação.","Enquanto a voz surge em intervalos, o zumbido do ambiente se mantém mais constante durante a gravação.","Na minha escuta, esse contraste de duração ajuda a transmitir a escala do espaço sem precisar nomear equipamentos desconhecidos."]},{"scene":"Uma fotografia de rua feita no fim da tarde","focus":"Explique fotografia com termos técnicos que correspondam à imagem; informe configurações apenas quando conhecidas.","terms":[["contraluz","Situação em que a fonte de luz está atrás do assunto em relação à câmera.","A pessoa foi fotografada em contraluz, com o sol fora do enquadramento.","Contraluz não implica obrigatoriamente silhueta."],["profundidade de campo","Extensão da cena que parece aceitavelmente nítida.","A profundidade de campo reduzida destaca o rosto contra o fundo desfocado.","Não confunda profundidade de campo com distância focal isoladamente."],["perspectiva","Relação visual de tamanhos e posições que sugere profundidade.","As linhas convergentes do corredor reforçam a perspectiva.","Perspectiva não informa automaticamente o tipo de lente."],["enquadramento","Seleção dos elementos incluídos e excluídos dos limites da imagem.","O enquadramento inclui a bicicleta à esquerda como referência de escala.","Não atribua intenção do fotógrafo sem entrevistá-lo."]],"model":["A fotografia do exercício mostra um pedestre diante de uma rua iluminada pelo sol baixo.","O enquadramento coloca a figura em primeiro plano e deixa fachadas desfocadas ao fundo.","Comparada a uma imagem com todos os planos nítidos, essa escolha dirige mais atenção à pessoa.","Na minha leitura, a relação entre figura e ambiente dá unidade à cena; a intenção do fotógrafo precisaria ser confirmada."]},{"scene":"Uma chegada a um bairro desconhecido","focus":"Aprenda a nomear o que sentiu sem projetar emoções sobre moradores e outras pessoas.","terms":[["estranhamento","Sensação de distância ou surpresa diante do que não é familiar.","Senti estranhamento ao encontrar uma organização de lojas diferente da habitual.","Estranhamento descreve sua reação, não um defeito do lugar."],["familiaridade","Percepção subjetiva de reconhecimento ou proximidade.","A disposição das mesas me trouxe uma sensação de familiaridade.","Não presuma experiência idêntica para outros visitantes."],["nostalgia","Emoção de lembrança afetiva do passado.","A música despertou nostalgia de encontros de família.","Nostalgia depende de memória pessoal; não é característica objetiva da música."],["ambivalência","Presença simultânea de sentimentos ou avaliações diferentes.","Senti ambivalência entre entusiasmo pela novidade e cautela diante do desconhecido.","Evite usar ambivalência como mero sinônimo de dúvida factual."]],"model":["Cheguei ao bairro da situação proposta e encontrei lojas com disposições que não reconheci de imediato.","Minha primeira reação foi de estranhamento, mas a música de uma cafeteria trouxe familiaridade.","Em vez de classificar o lugar como estranho, consigo comparar essa reação às experiências que já vivi em outros bairros.","Essa mistura de surpresa e reconhecimento descreve minha percepção pessoal, não uma característica universal do bairro."]},{"scene":"Uma praça com fonte, bancos e canteiros","focus":"Organize o olhar do público usando posições relativas claras e mantendo a orientação da câmera.","terms":[["adjacente","Que fica ao lado, com proximidade direta.","O banco adjacente ao canteiro está parcialmente na sombra.","Não use adjacente para elementos distantes no enquadramento."],["ao fundo","Na parte visualmente mais distante da composição.","Ao fundo, uma escadaria conduz à praça elevada.","A profundidade na imagem depende da perspectiva mostrada."],["sobreposto","Que aparece ou se posiciona parcialmente sobre outro elemento.","A silhueta da árvore fica sobreposta à fachada na imagem.","Sobreposição visual não implica contato físico."],["intercalado","Distribuído em alternância entre outros elementos.","Os bancos aparecem intercalados com pequenos canteiros.","Confirme se existe de fato uma sequência alternada."]],"model":["Na cena simulada, uma fonte ocupa o centro do enquadramento e há bancos nos dois lados.","Um canteiro fica adjacente ao primeiro banco; ao fundo, vemos uma pequena escadaria.","Enquanto a fonte atrai o olhar imediatamente, os bancos intercalados com canteiros conduzem a atenção pelas laterais.","Minha impressão é que essa organização ajuda o visitante a perceber diferentes zonas da praça, embora a experiência varie com o trajeto."]},{"scene":"Um mercado abrindo para o movimento da manhã","focus":"A cronologia deve respeitar a sequência observada; não confunda tempo do vídeo com horário real.","terms":[["gradualmente","De modo progressivo, em pequenas mudanças sucessivas.","O movimento de pessoas aumentou gradualmente ao longo da filmagem.","Uma mudança entre dois cortes não prova progressão contínua."],["repentinamente","De forma inesperada ou abrupta em relação à sequência observada.","Uma rajada repentinamente deslocou as folhas da calçada.","Não use repentinamente para o que já foi apresentado como previsível."],["enquanto isso","Conector que marca simultaneidade de ações.","O funcionário organiza as caixas; enquanto isso, clientes chegam.","Não afirme simultaneidade se as cenas foram gravadas em momentos diferentes."],["na sequência","Expressão que introduz o acontecimento posterior.","Na sequência, a porta foi aberta e as primeiras pessoas entraram.","A ordem da edição não garante a ordem dos acontecimentos."]],"model":["Na gravação imaginada, os comerciantes organizam produtos antes da chegada dos clientes.","Gradualmente, mais pessoas aparecem na passagem central, enquanto um funcionário termina de arrumar as caixas.","Na sequência, o ritmo fica mais intenso do que nos primeiros instantes filmados.","Minha leitura é que essa progressão oferece uma boa estrutura de história, desde que a montagem preserve a cronologia real."]}];

</script>
<script>
/* StoryLab Shanghai · Atlas Descritivo 1.2
   Módulo independente para aprendizado lexical e prática autoral.
   Não envia rascunhos para servidores. */
window.StoryLabAtlas=(()=>{
'use strict';
const LEVELS=[
 ['Observar','20 s','Diga o que a câmera mostra, sem adivinhar história, autoria ou intenção.'],
 ['Descrever','40 s','Acrescente dois detalhes concretos e a relação entre eles.'],
 ['Comparar','60 s','Compare duas partes da cena usando um critério perceptível.'],
 ['Interpretar','90 s','Conclua com uma interpretação pessoal claramente identificada como tal.']
];
const view={topic:0,tab:'explore',word:'',query:'',level:0,show:false,score:3,feedback:null};
let api=null;
function g(){return window.STORYLAB_ATLAS_GUIDES?.[view.topic]}
function key(){return view.topic+':'+view.level}
function draft(){return String(api.getStore().atlasDrafts?.[key()]||'')}
function model(){return g().model.slice(0,view.level+1).join(' ')}
function sayWords(t){return t.trim()?t.trim().split(/\s+/).length:0}
function analyze(t){
 const words=sayWords(t), terms=g().terms.filter(x=>api.norm(t).includes(api.norm(x[0]))).map(x=>x[0]);
 const vague=(api.norm(t).match(/\b(bonito|legal|incrivel|maravilhoso|superlegal)\b/g)||[]).length;
 const tips=[];
 if(words<25)tips.push('Inclua outro detalhe verificável para dar mais substância à descrição.');
 if(terms.length===0)tips.push('Experimente um termo do campo, somente se ele corresponder ao que observou.');
 if(vague)tips.push('Substitua elogios genéricos por forma, posição, textura, luz, som ou movimento.');
 if(view.level>1&&!/compar|enquanto|diferente|ao contr.rio|mais .* que|menos .* que|por outro lado/i.test(api.norm(t)))tips.push('Nesta etapa, torne explícito o critério da comparação.');
 if(view.level===3&&!/minha impress.o|na minha|para mim|eu penso|me parece|considero/i.test(api.norm(t)))tips.push('Identifique claramente a conclusão como sua interpretação.');
 return {words,terms,vague,tips};
}
function button(action,label,cls='',attr=''){return '<button type="button" class="'+cls+'" data-atlas-action="'+action+'" '+attr+'>'+label+'</button>'}
function currentCard(){
 const term=view.word&&api.D.atlas[view.topic].terms.includes(view.word)?view.word:g().terms[0][0];
 return {term,card:g().terms.find(x=>x[0]===term)};
}
function termButtons(){
 const {D,esc,norm}=api;
 if(view.query.trim()){
  const q=norm(view.query),matches=[];
  D.atlas.forEach((group,i)=>group.terms.forEach(term=>{
   const c=window.STORYLAB_ATLAS_GUIDES[i].terms.find(x=>x[0]===term);
   if(norm([group.title,term,...(c||[])].join(' ')).includes(q))matches.push({term,i});
  }));
  return '<div class="atlas12-list"><div class="eyebrow">'+matches.length+' RESULTADOS NO ATLAS</div><div class="atlas12-tags">'+matches.slice(0,70).map(x=>button('word',esc(x.term)+' <small>'+esc(D.atlas[x.i].title)+'</small>','atlas12-term','data-topic="'+x.i+'" data-word="'+esc(x.term)+'"')).join('')+'</div>'+(matches.length>70?'<p class="muted small">Refine sua busca para ver outros resultados.</p>':'')+'</div>';
 }
 const terms=D.atlas[view.topic].terms, selected=currentCard().term;
 return '<div class="atlas12-list"><div class="eyebrow">REPERTÓRIO DO CAMPO</div><div class="atlas12-tags">'+terms.map(term=>{
  const rich=g().terms.some(t=>t[0]===term);
  return button('word',esc(term)+(rich?' <span aria-label="Verbete aprofundado">●</span>':''),'atlas12-term '+(selected===term?'active':''),'data-topic="'+view.topic+'" data-word="'+esc(term)+'"');
 }).join('')+'</div><p class="muted small" style="margin:12px 0 0">● Verbete comentado. Os 160 termos originais continuam disponíveis; 64 têm explicação, exemplo e alerta editorial.</p></div>';
}
function dictionary(){
 const {esc,ico}=api,{term,card}=currentCard(),area=api.D.atlas[view.topic];
 let detail='<div class="panel panel-pad atlas12-detail"><div class="eyebrow">CONCEITO EM CONTEXTO · '+esc(area.title.toUpperCase())+'</div><h2>'+esc(term)+'</h2>';
 if(card)detail+='<p class="atlas12-definition">'+esc(card[1])+'</p><div class="atlas12-example"><div class="eyebrow">DIGA ASSIM</div><p>'+esc(card[2])+'</p></div><div class="atlas12-warning"><div class="eyebrow">PRECISÃO E CUIDADO</div><p>'+esc(card[3])+'</p></div>';
 else detail+='<p class="muted">Termo do repertório essencial. O verbete aprofundado ainda está em construção. Evite empregar uma palavra cujo significado ou aplicação não tenha confirmado.</p><div class="notice info">'+esc(area.prompt)+'</div>';
 detail+='<div class="form-row">'+button('copy',ico('copy',15)+' Copiar termo','btn secondary sm')+button('practice',ico('mic',15)+' Praticar este campo','btn accent sm')+'</div></div>';
 return '<div class="atlas12-columns"><div class="panel panel-pad"><div class="eyebrow">ENCONTRE A PALAVRA PRECISA</div><p class="muted small">'+esc(g().focus)+'</p>'+termButtons()+'</div>'+detail+'</div>';
}
function history(){
 const {esc}=api,st=api.getStore(),h=st.atlasHistory||[];
 return '<div class="panel panel-pad"><div class="eyebrow">CADERNO DE PRÁTICA</div><h3 style="margin:10px 0">'+h.length+' registro(s)</h3>'+(h.length?h.slice(-5).reverse().map(x=>{
  const idx=h.indexOf(x);
  return '<div class="atlas12-history"><strong>'+esc(api.D.atlas[x.topic]?.title||'Campo')+' · Nível '+(x.level+1)+'</strong><p class="muted small">'+esc(x.text.slice(0,105))+'</p><span class="muted small">Autoavaliação: '+x.score+'/5</span> '+button('restore','Reabrir','btn secondary sm','data-index="'+idx+'"')+'</div>';
 }).join(''):'<p class="muted small">Sua primeira descrição registrada aparecerá aqui.</p>')+'</div>';
}
function exercise(){
 const {esc,ico}=api,st=api.getStore(),text=draft(),feedback=view.feedback,level=LEVELS[view.level];
 let card='<div class="panel panel-pad atlas12-work"><div class="eyebrow">EXERCÍCIO GUIADO · CENA HIPOTÉTICA</div><h2>'+esc(g().scene)+'</h2><div class="atlas12-steps" role="group" aria-label="Etapas progressivas">'+LEVELS.map((l,i)=>button('level','0'+(i+1)+' · '+esc(l[0]),'atlas12-step '+(view.level===i?'active':''),'data-level="'+i+'"')).join('')+'</div><p class="muted"><strong>'+esc(level[1])+' sugeridos.</strong> '+esc(level[2])+'</p><div class="notice info">'+esc(g().focus)+'</div><label class="field-label" for="atlas12-writing" style="margin-top:22px">Sua narração</label><textarea id="atlas12-writing" class="field atlas12-writing" data-atlas-writing="1" rows="8" maxlength="3000" placeholder="Descreva somente o que de fato observou...">'+esc(text)+'</textarea><div class="row"><span class="small muted">Rascunho salvo automaticamente</span><span id="atlas12-count" class="small muted">'+sayWords(text)+' palavras</span></div><div class="form-row" style="margin-top:16px">'+button('review',ico('target',14)+' Analisar texto','btn accent')+button('model',ico('book',14)+(view.show?' Ocultar':' Ver')+' exemplo','btn secondary')+'</div>';

 card+='<div class="divider"></div><div class="form-row" style="align-items:end"><div><label class="field-label" for="atlas12-rating">Sua autoavaliação</label><select id="atlas12-rating" data-atlas-rating="1">'+[1,2,3,4,5].map(n=>'<option value="'+n+'" '+(view.score===n?'selected':'')+'>'+n+' / 5</option>').join('')+'</select></div>'+button('save',ico('check',14)+' Registrar prática','btn accent')+button('tele',ico('film',14)+' Teleprompter','btn secondary')+'</div><p class="muted small">Nenhum resultado é tratado como prova de habilidade ou verificação factual automática.</p></div>';

function render(){

}
function init(context){
 api=context;

  const b=event.target.closest('[data-atlas-action]');
  if(!b)return;

  const action=b.dataset.atlasAction,st=api.getStore();
  if(action==='explore'||action==='practice'){view.tab=action;view.feedback=null;view.show=false}
  else if(action==='word'){const i=Number(b.dataset.topic);if(!api.D.atlas[i]?.terms.includes(b.dataset.word))return;view.topic=i;view.word=b.dataset.word;view.query='';view.feedback=null}
  else if(action==='copy'){api.copy(currentCard().term);return}
  else if(action==='level'){const i=Number(b.dataset.level);if(i<0||i>3||!Number.isInteger(i))return;view.level=i;view.show=false;view.feedback=null}
  else if(action==='model')view.show=!view.show;
  else if(action==='review'){const text=draft();if(text.trim().length<20){api.toast('Escreva pelo menos 20 caracteres antes de analisar.');return}view.feedback=analyze(text)}
  else if(action==='listen'){api.say(model());return}
  else if(action==='copy-model'){api.copy(model());return}
  else if(action==='save'){const text=draft().trim();if(text.length<30){api.toast('Escreva ao menos 30 caracteres para registrar.');return}
   const feedback=analyze(text);st.atlasHistory.push({at:new Date().toISOString(),topic:view.topic,level:view.level,score:view.score,text:text.slice(0,3000),words:feedback.words,terms:feedback.terms});st.atlasHistory=st.atlasHistory.slice(-200);api.save();api.toast('Prática registrada no caderno.')}
  else if(action==='tele'){const text=draft().trim();if(text.length<20){api.toast('Escreva uma narração antes de abrir o teleprompter.');return}api.toTele(text);return}
  else if(action==='voice'){api.navigate('voice');return}
  else if(action==='restore'){const item=st.atlasHistory[Number(b.dataset.index)];if(!item||!api.D.atlas[item.topic])return;view.topic=item.topic;view.level=item.level;view.tab='practice';view.score=item.score;view.show=false;view.feedback=null;st.atlasDrafts[key()]=item.text;api.save()}
  api.render();
 });
 document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-atlas-query]')){view.query=t.value;refreshQuery(t)}
  if(t.matches('[data-atlas-writing]')){const st=api.getStore();st.atlasDrafts[key()]=t.value.slice(0,3000);view.feedback=null;api.save();const n=document.getElementById('atlas12-count');if(n)n.textContent=sayWords(t.value)+' palavras'}
 });
 document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-atlas-topic]')){view.topic=Number(t.value);view.word='';view.show=false;view.feedback=null;api.render()}
  if(t.matches('[data-atlas-rating]'))view.score=Number(t.value);
 });
}
return {init,render};
})();

const CLINIC_SCENES=[
 ['Rua arborizada','Descrever a vegetação, a relação entre fachadas e o movimento sem inventar a história do lugar.'],
 ['Vitrine de moda','Relacionar composição, materiais e caimento sem atribuir intenções à marca sem fonte.'],
 ['Cafeteria de bairro','Transformar aroma, som, luz e ações observáveis numa cena narrável.'],
 ['Metrô de Xangai','Apresentar o percurso e suas condições sem generalizar o funcionamento de toda a rede.'],
 ['Mercado e comércio','Construir uma narrativa de consumo, preço ou atendimento com fonte e recorte claros.'],
 ['Fotografia de arquitetura','Explicar forma, escala, perspectiva e iluminação de um edifício.'],
 ['Cena noturna','Construir atmosfera com movimentos, reflexos e sons do ambiente.'],
 ['Produto de tecnologia','Explicar demonstração, resultado observado e limites de um teste pessoal.']
];
function clinicSentence(x){return String(x||'').trim().replace(/[.!?;:,\s]+$/,'').slice(0,1000)}
function composeClinic(){
 const f=ui.clinicInputs;
 const obs=clinicSentence(f.observation),det=clinicSentence(f.detail),ctx=clinicSentence(f.context),src=clinicSentence(f.source),refl=clinicSentence(f.reflection);
 if(obs.length<8||det.length<8){toast('Escreva uma observação e um detalhe concretos antes de construir.');return}
 const scene=CLINIC_SCENES[ui.clinicScene][0];
 const pieces={
  documental:[`Neste registro sobre ${scene.toLowerCase()}, ${obs.charAt(0).toLowerCase()+obs.slice(1)}.`,`Um detalhe que merece atenção: ${det.charAt(0).toLowerCase()+det.slice(1)}.`],
  espontaneo:[`Estou observando ${scene.toLowerCase()} e uma coisa me chamou a atenção: ${obs.charAt(0).toLowerCase()+obs.slice(1)}.`,`Reparem também neste detalhe: ${det.charAt(0).toLowerCase()+det.slice(1)}.`],
  didatico:[`Vamos observar ${scene.toLowerCase()} por dois aspectos. Primeiro: ${obs.charAt(0).toLowerCase()+obs.slice(1)}.`,`Segundo: ${det.charAt(0).toLowerCase()+det.slice(1)}.`],
  contemplativo:[`A cena começa por um detalhe concreto: ${obs.charAt(0).toLowerCase()+obs.slice(1)}.`,`Quando olhamos com mais atenção, percebemos outro: ${det.charAt(0).toLowerCase()+det.slice(1)}.`]
 };
 const lines=[...(pieces[f.style]||pieces.documental)];
 if(ctx){
  if(f.status==='documentado'&&src.length>=4){lines.push(`Segundo a fonte informada (${src}), ${ctx.charAt(0).toLowerCase()+ctx.slice(1)}.`)}
  else {lines.push(`Há uma informação que ainda precisa ser confirmada antes da publicação: ${ctx}.`)}
 }
 if(refl){lines.push(`Minha leitura pessoal é a seguinte: ${refl.charAt(0).toLowerCase()+refl.slice(1)}.`)}
 else lines.push('O que essa observação pode nos ensinar? É uma pergunta que vale acompanhar.');
 ui.clinicGenerated=lines.join('\n\n');
 render();
 toast('Estrutura construída. Releia e verifique antes de publicar.');
}

function builderResult(){const b=ui.builder;const a=(s)=>String(s||'').trim().replace(/[.!?…]+$/,'');let pieces=[];
 if(b.style==='poetico')pieces.push(`Há histórias que começam em pequenos detalhes.${b.place?' Hoje, estou '+a(b.place)+'.':''}`);
 else if(b.style==='espontaneo')pieces.push(`Hoje estou ${b.place?a(b.place):'explorando um ambiente'} e quero mostrar o que encontrei.`);
 else if(b.style==='didatico')pieces.push(`${b.place?'Estamos '+a(b.place)+'. ':''}Vamos observar alguns elementos desta cena e entender por que eles importam.`);
 else pieces.push(`Estamos ${b.place?a(b.place):'diante de uma cena'} que merece um olhar mais atento.`);
 if(b.observation)pieces.push(`A primeira coisa que observo é ${a(b.observation)}.`);
 if(b.detail)pieces.push(`O detalhe que merece atenção é ${a(b.detail)}.`);
 if(b.context)pieces.push(`Para compreender melhor o contexto, ainda precisamos verificar ou atribuir: ${a(b.context)}.`);
 if(b.contrast)pieces.push(`Uma comparação possível, se feita com critérios equivalentes, é ${a(b.contrast)}.`);
 if(b.reflection)pieces.push(`Minha interpretação pessoal é ${a(b.reflection)}.`);
 else pieces.push('O que esta cena nos permite concluir — e o que ainda precisamos investigar?');
 return pieces.join('\n\n')}

function reviewPhrase(id){const before=store.reviews[id]||{level:0,count:0};const level=Math.min(5,before.level+1);const intervals=[0,1,3,7,14,30];store.reviews[id]={level,count:before.count+1,last:Date.now(),next:Date.now()+intervals[level]*86400000};save();toast(`Frase estudada · próxima revisão em ${intervals[level]} dia(s).`);render()}
let recorder=null,stream=null,recChunks=[],recTick=null,recStart=0,recType='audio/webm';
async function startRecording(){ui.voiceError='';if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){ui.voiceError='Gravação indisponível neste navegador. Use HTTPS ou localhost e confira a permissão do microfone.';render();return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});recChunks=[];recType=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'';recorder=new MediaRecorder(stream,recType?{mimeType:recType}:undefined);recorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(recChunks,{type:recorder?.mimeType||'audio/webm'});if(ui.recordUrl)URL.revokeObjectURL(ui.recordUrl);ui.recordUrl=URL.createObjectURL(blob);stream?.getTracks().forEach(t=>t.stop());stream=null;recorder=null;ui.recording=false;clearInterval(recTick);render();toast('Gravação pronta para ouvir ou salvar.')};recorder.start();ui.recording=true;ui.recordElapsed=0;recStart=Date.now();render();recTick=setInterval(()=>{ui.recordElapsed=Math.floor((Date.now()-recStart)/1000);let t=document.getElementById('record-timer');if(t)t.textContent=formatSecs(ui.recordElapsed);if(ui.recordElapsed>=600)stopRecording()},260)}catch(e){stream?.getTracks().forEach(t=>t.stop());stream=null;ui.voiceError='Não foi possível usar o microfone. Verifique permissão e disponibilidade do dispositivo.';render()}}
function stopRecording(){if(recorder&&recorder.state!=='inactive')recorder.stop();else{ui.recording=false;clearInterval(recTick);render()}}
function downloadBlob(content,filename,mime){const blob=content instanceof Blob?content:new Blob([content],{type:mime});let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function updateMissionCheck(id,index,value){if(!ui.missionChecks[id])ui.missionChecks[id]={};ui.missionChecks[id][index]=value;const mission=D.missions.find(m=>m.id===id);const row=document.querySelector('.checklist')?.parentElement?.querySelector('.row .small');if(row&&mission)row.textContent=`${Object.values(ui.missionChecks[id]).filter(Boolean).length} / ${mission.shots.length} itens preparados`}
function exportData(){downloadBlob(JSON.stringify({app:'StoryLab Shanghai',version:1,exportedAt:new Date().toISOString(),data:store},null,2),'storylab-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json;charset=utf-8');toast('Backup exportado. Guarde-o em local seguro.')}
async function importData(file){if(!file)return;try{if(file.size>8*1024*1024)throw Error('Arquivo grande demais.');const obj=JSON.parse(await file.text());if(obj.app!=='StoryLab Shanghai'||obj.version!==1||!obj.data||typeof obj.data!=='object')throw Error('Formato desconhecido.');if(!confirm('Isso substituirá seu progresso atual. Deseja continuar?'))return;const incoming=obj.data;store={...baseState(),...incoming,completed:Array.isArray(incoming.completed)?incoming.completed.filter(v=>typeof v==='string'):[],favorites:Array.isArray(incoming.favorites)?incoming.favorites.filter(v=>typeof v==='string'):[],missions:Array.isArray(incoming.missions)?incoming.missions.filter(v=>typeof v==='string'):[],practice:Array.isArray(incoming.practice)?incoming.practice.filter(v=>v&&Array.isArray(v.scores)).slice(-500):[],clinicDrafts:Array.isArray(incoming.clinicDrafts)?incoming.clinicDrafts.filter(v=>v&&typeof v.text==='string').slice(-60):[],clinicDone:Array.isArray(incoming.clinicDone)?incoming.clinicDone.filter(v=>typeof v==='string'):[],atlasDrafts:incoming.atlasDrafts&&typeof incoming.atlasDrafts==='object'&&!Array.isArray(incoming.atlasDrafts)?Object.fromEntries(Object.entries(incoming.atlasDrafts).filter(([k,v])=>/^\d+:\d+$/.test(k)&&typeof v==='string').slice(0,64).map(([k,v])=>[k,v.slice(0,3000)])):{},atlasHistory:Array.isArray(incoming.atlasHistory)?incoming.atlasHistory.filter(v=>v&&typeof v.text==='string'&&Number.isInteger(v.topic)&&Number.isInteger(v.level)).slice(-200).map(v=>({...v,text:v.text.slice(0,3000)})):[],reviews:incoming.reviews&&typeof incoming.reviews==='object'?incoming.reviews:{},notes:incoming.notes&&typeof incoming.notes==='object'?incoming.notes:{},theme:incoming.theme==='dark'?'dark':'light'};save();ui.showImport=false;render();toast('Backup importado com sucesso.')}catch{toast('Backup inválido ou ilegível. O progresso não foi alterado.')}}
// Event delegation: keeps controls functional even when the page is re-rendered.
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;switch(action){
 case 'navigate':navigate(b.dataset.page);break;
 case 'clinic-tab':ui.clinicTab=id;ui.clinicReveal=false;render();break;
 case 'clinic-clear':ui.clinicInputs={observation:'',detail:'',context:'',source:'',reflection:'',style:ui.clinicInputs.style,status:'pendente'};ui.clinicGenerated='';render();break;
 case 'clinic-build':composeClinic();break;
 case 'clinic-save':if(!ui.clinicGenerated)break;store.clinicDrafts.push({at:new Date().toISOString(),scene:CLINIC_SCENES[ui.clinicScene][0],sceneIndex:ui.clinicScene,style:ui.clinicInputs.style,text:ui.clinicGenerated,inputs:{...ui.clinicInputs}});store.clinicDrafts=store.clinicDrafts.slice(-60);save();render();toast('Roteiro salvo no navegador.');break;
 case 'clinic-copy':if(ui.clinicGenerated)copy(ui.clinicGenerated);break;
 case 'clinic-speak':if(ui.clinicGenerated)say(ui.clinicGenerated);break;
 case 'clinic-to-tele':if(ui.clinicGenerated){ui.teleText=ui.clinicGenerated;ui.studioTab='tele';navigate('studio')}break;
 case 'clinic-restore':{const item=store.clinicDrafts[Number(id)];if(!item)break;ui.clinicInputs={...ui.clinicInputs,...item.inputs};ui.clinicScene=item.sceneIndex??0;ui.clinicGenerated=item.text;ui.clinicTab='compose';render();break}
 case 'clinic-delete':if(!Number.isInteger(Number(id))||!store.clinicDrafts[Number(id)])break;store.clinicDrafts.splice(Number(id),1);save();render();toast('Roteiro excluído deste navegador.');break;
 case 'clinic-reveal':ui.clinicReveal=!ui.clinicReveal;render();break;
 case 'clinic-next':ui.clinicDrill=(ui.clinicDrill+1)%D.speechDrills.length;ui.clinicReveal=false;render();break;
 case 'clinic-mark':{const d=D.speechDrills[ui.clinicDrill];if(!store.clinicDone.includes(d.id))store.clinicDone.push(d.id);save();ui.clinicDrill=(ui.clinicDrill+1)%D.speechDrills.length;ui.clinicReveal=false;render();break}
 case 'clinic-read-example':say(D.speechDrills[ui.clinicDrill].strong);break;
 case 'clinic-phrase-link':navigate('phrases');break;
 case 'menu':ui.menu=!ui.menu;render();break;
 case 'theme':store.theme=store.theme==='dark'?'light':'dark';save();render();break;
 case 'school':ui.school=id;render();break;
 case 'open-course':navigate('course',{courseId:id});break;
 case 'open-lesson':store.lastLesson=id+':'+b.dataset.index;save();navigate('lesson',{courseId:id,module:Number(b.dataset.index)});break;
 case 'complete-lesson':if(!D.deepLessons[id])break;if(store.completed.includes(id))store.completed=store.completed.filter(x=>x!==id);else store.completed.push(id);save();render();toast(store.completed.includes(id)?'Aula concluída.':'Aula reaberta.');break;
 case 'phrase-lang':ui.phraseLang=id;ui.phraseLimit=30;render();break;
 case 'phrase-view':ui.phraseView=id;ui.phraseLimit=30;render();break;
 case 'more-phrases':ui.phraseLimit+=30;render();break;
 case 'expand-phrase':ui.expandedPhrase=ui.expandedPhrase===id?null:id;render();break;
 case 'toggle-fav':store.favorites=store.favorites.includes(id)?store.favorites.filter(x=>x!==id):[...store.favorites,id];save();render();break;
 case 'study-phrase':reviewPhrase(id);break;
 case 'copy-phrase':{const p=D.phrases.find(p=>p.id===id);if(p)copy(p[ui.phraseLang]||p.pt);break}
 case 'speak-phrase':{const p=D.phrases.find(p=>p.id===id);if(p)say(p[ui.phraseLang]||p.pt,{pt:'pt-BR',en:'en-US',zh:'zh-CN'}[ui.phraseLang]);break}
 case 'new-challenge':{const list=D.challenges.map((_,i)=>i).filter(i=>i!==ui.challenge);ui.challenge=list[Math.floor(Math.random()*list.length)];if(ui.recording)stopRecording();if(ui.recordUrl){URL.revokeObjectURL(ui.recordUrl);ui.recordUrl=null}render();break}
 case 'record':if(ui.recording)stopRecording();else await startRecording();break;
 case 'download-record':{if(!ui.recordUrl)break;const a=document.createElement('a');a.href=ui.recordUrl;a.download='storylab-gravacao-'+Date.now()+'.'+(recType.includes('mp4')?'mp4':'webm');document.body.append(a);a.click();a.remove();break}
 case 'remove-record':if(ui.recordUrl)URL.revokeObjectURL(ui.recordUrl);ui.recordUrl=null;render();break;
 case 'save-practice':{const ch=D.challenges[ui.challenge],note=document.getElementById('takeaway')?.value||'';store.practice.push({at:new Date().toISOString(),scene:ch.scene,mode:ch.mode,scores:[...ui.voiceRubric],note:note.slice(0,800)});save();render();toast('Sessão registrada no seu histórico.');break}
 case 'studio-tab':stopTele();ui.studioTab=id;render();break;
 case 'generate-script':ui.script=builderResult();render();toast('Narração construída a partir das suas observações.');break;
 case 'builder-clear':ui.builder={place:'',observation:'',detail:'',context:'',contrast:'',reflection:'',style:'documental'};ui.script='';render();break;
 case 'copy-script':if(ui.script)copy(ui.script);else toast('Construa uma narração primeiro.');break;
 case 'speak-script':if(ui.script)say(ui.script);else toast('Construa uma narração primeiro.');break;
 case 'script-to-tele':if(!ui.script){toast('Construa uma narração primeiro.');break}ui.teleText=ui.script;ui.studioTab='tele';render();break;
 case 'tele-toggle':ui.telePlaying=!ui.telePlaying;if(ui.telePlaying){teleLast=0;teleFrame=requestAnimationFrame(runTele)}else stopTele();{let btn=document.querySelector('[data-action="tele-toggle"]');if(btn)btn.innerHTML=`${ico(ui.telePlaying?'pause':'play')} ${ui.telePlaying?'Pausar':'Iniciar'} rolagem`}break;
 case 'tele-reset':stopTele();{let el=document.getElementById('prompter');if(el)el.scrollTop=0}render();break;
 case 'atlas-pick':ui.atlasIndex=Number(b.dataset.index);render();break;
 case 'copy-term':copy(b.dataset.value);break;
 case 'mission-area':ui.missionArea=id;render();break;
 case 'journey-phrase':ui.phraseFamily=id;ui.phraseQuery='';ui.phraseLang='pt';ui.phraseView='all';ui.phraseLimit=30;navigate('phrases');break;
 case 'open-mission':navigate('mission',{missionId:id});break;
 case 'finish-mission':if(store.missions.includes(id))store.missions=store.missions.filter(x=>x!==id);else store.missions.push(id);save();render();toast(store.missions.includes(id)?'Missão marcada como realizada.':'Missão reaberta.');break;
 case 'export-data':exportData();break;
 case 'show-import':ui.showImport=!ui.showImport;render();break;
 case 'reset-data':if(confirm('Deseja apagar TODO o progresso e as anotações deste navegador? Faça um backup antes, se quiser preservar os dados.')){store=baseState();save();render();toast('Progresso local reiniciado.')}break;
 default:break;
}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.model){const key=t.dataset.model;ui[key]=key==='teleSpeed'?Number(t.value):t.value;if(key==='courseQuery'||key==='phraseQuery'||key==='missionQuery'){render(true)}else if(key==='teleMode'||key==='teleText'){stopTele();const el=document.getElementById('prompter-inner');if(el)el.textContent=teleDisplay()}else if(key==='teleSpeed'){const x=t.parentElement?.querySelector('.field-label');if(x)x.textContent='Velocidade da rolagem · '+ui.teleSpeed}}
 if(t.dataset.clinicField){ui.clinicInputs[t.dataset.clinicField]=t.value;ui.clinicGenerated=''}
 if(t.dataset.builder){ui.builder[t.dataset.builder]=t.value}
 if(t.dataset.rubric!==undefined){const i=Number(t.dataset.rubric);ui.voiceRubric[i]=Number(t.value);let label=document.getElementById('rubric-label-'+i);if(label)label.textContent=t.value+'/5'}
 if(t.dataset.missionNotes){store.notes[t.dataset.missionNotes]=t.value.slice(0,30000);save()}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.clinicSelect){if(t.dataset.clinicSelect==='scene')ui.clinicScene=Number(t.value);else ui.clinicInputs[t.dataset.clinicSelect]=t.value;ui.clinicGenerated='';render();return}
if(t.dataset.model&&(t.tagName==='SELECT')&&['phraseFamily','teleMode'].includes(t.dataset.model)){if(t.dataset.model==='phraseFamily'){ui.phraseLimit=30;render()}else{const el=document.getElementById('prompter-inner');if(el)el.textContent=teleDisplay()}}
 if(t.dataset.missionCheck!==undefined){updateMissionCheck(t.dataset.id,Number(t.dataset.missionCheck),t.checked)}
 if(t.id==='importSave'&&t.files?.[0])importData(t.files[0]);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.menu){ui.menu=false;render()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();navigate('phrases');setTimeout(()=>document.querySelector('[data-model="phraseQuery"]')?.focus(),50)}});
window.addEventListener('online',()=>{let el=document.getElementById('offline-state');if(el)el.style.display='none'});
window.addEventListener('offline',()=>{let el=document.getElementById('offline-state');if(el)el.style.display='inline-flex'});
window.addEventListener('pagehide',()=>{if(recorder&&recorder.state!=='inactive')recorder.stop();stream?.getTracks().forEach(t=>t.stop());stopTele()});
if('serviceWorker'in navigator&&location.protocol==='https:'||('serviceWorker'in navigator&&location.hostname==='localhost'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
if(window.StoryLabAtlas)window.StoryLabAtlas.init({D,getStore:()=>store,save,render,navigate,header,stat,esc,norm,ico,say,copy,toast,toTele:(text)=>{ui.teleText=text;ui.studioTab='tele';navigate('studio')}});
render();
})();
