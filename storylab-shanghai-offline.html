fique datas.","example":"Conferir horário de um museu no site oficial, não num blog de três anos atrás."},{"title":"Contexto do destino","body":"História, costumes, clima e calendário local ajudam a entender o que será visto e evitam gafes.","example":"Saber que na Semana Dourada de outubro os pontos turísticos ficam lotados."},{"title":"Lista de verificação de campo","body":"Leve uma lista do que confirmar pessoalmente: preços, horários, acesso, regras de foto.","example":"Confirmar no local se o ingresso pode ser comprado na hora ou só por aplicativo."}],"assignment":"Pesquise um destino em Xangai e monte um dossiê com contexto, fontes datadas e uma lista de verificação de campo com dez itens.","rubric":"As fontes são oficiais ou recentes? O contexto evita estereótipos? A lista de verificação é prática?"},"jornalismo-viagens:2":{"title":"Informação de serviço não admite erro","intro":"Informações de serviço — preços, horários, transporte, endereços, regras — são as mais usadas pelo público. Precisam estar corretas, datadas e apresentadas de forma clara.","steps":[{"title":"Precisão e data","body":"Preços e horários mudam. Informe sempre a data da verificação e a fonte.","example":"“Ingresso: 50 yuan (verificado em 14/10/2026 no site oficial).”"},{"title":"Clareza e formato","body":"Use listas, tabelas ou boxes. O público deve encontrar a informação rapidamente.","example":"Box com endereço, estação de metrô mais próxima, saída, horário e preço."},{"title":"Avisos e limites","body":"Informe restrições, necessidades de reserva, acessibilidade e alternativas.","example":"“Reserva obrigatória pelo aplicativo; não há venda presencial.”"}],"assignment":"Crie um box de serviço completo para três lugares de Xangai, com informações verificadas, datas, fontes e avisos.","rubric":"Todas as informações têm data e fonte? O formato permite encontrar rapidamente? Incluí avisos relevantes?"},"jornalismo-viagens:3":{"title":"Um roteiro contado, não apenas listado","intro":"O roteiro de viagem contado combina percurso, experiência, informação de serviço e contexto numa narrativa. Ele deve ser útil e agradável de acompanhar.","steps":[{"title":"Estrutura do roteiro","body":"Organize por tempo (manhã, tarde, noite) ou por percurso lógico. Indique deslocamentos e tempos.","example":"Manhã no Yuyuan, almoço na rua Yunnan, tarde no Bund, noite em Lujiazui."},{"title":"Narrativa e serviço integrados","body":"Alterne momentos narrativos com informações práticas. O público deve sentir e planejar ao mesmo tempo.","example":"Cena do jardim + box com preço e horário + dica de quando evitar filas."},{"title":"Verificação final","body":"Revise todas as informações de serviço antes de publicar e indique a data de verificação geral.","example":"“Informações verificadas entre 10 e 14 de outubro de 2026.”"}],"assignment":"Produza um miniguia audiovisual de três a cinco minutos (ou texto de 600 palavras) com roteiro de um dia, narrativa, boxes de serviço e data de verificação.","rubric":"O roteiro tem lógica de percurso? Narrativa e serviço estão equilibrados? Todas as informações foram verificadas?"},"jornalismo-gastronomia:0":{"title":"Palavras para o que a boca sente","intro":"Descrever comida exige vocabulário sensorial preciso: sabor, aroma, textura, temperatura e aparência. Adjetivos genéricos como “delicioso” não informam nada ao público.","steps":[{"title":"Sabores básicos e complexos","body":"Doce, salgado, ácido, amargo e umami. Combinações e intensidades criam perfis específicos.","example":"“Caldo com umami profundo de carne de porco e um fundo levemente adocicado.”"},{"title":"Textura e temperatura","body":"Crocante, macio, elástico, gelatinoso, aerado. Temperatura altera sabor e sensação.","example":"“Massa fina e elástica que se rompe para liberar o caldo quente.”"},{"title":"Aroma e aparência","body":"O cheiro antecipa o sabor. Cor, brilho e formato comunicam frescor e técnica.","example":"“Aroma de gengibre e vinagre escuro; dobras regulares na parte de cima do bolinho.”"}],"assignment":"Descreva três pratos diferentes em 80 palavras cada, sem usar “delicioso”, “gostoso” ou “incrível”, cobrindo sabor, textura, aroma e aparência.","rubric":"Evitei adjetivos genéricos? Cobri todos os sentidos? Um leitor conseguiria imaginar o prato?"},"jornalismo-gastronomia:1":{"title":"Entender como a comida é feita","intro":"Conhecer técnicas e ingredientes permite explicar por que um prato tem determinado sabor ou textura. Isso transforma a reportagem gastronômica em conteúdo informativo, não apenas opinativo.","steps":[{"title":"Técnicas de preparo","body":"Vapor, fritura, braseado, salteado, fermentação. Cada técnica produz resultados específicos.","example":"Explicar por que o shengjianbao é frito numa face e cozido no vapor ao mesmo tempo, criando base crocante e topo macio."},{"title":"Ingredientes e sazonalidade","body":"Origem, qualidade e época dos ingredientes influenciam o resultado. Pergunte aos cozinheiros.","example":"Caranguejo peludo é tradicionalmente mais procurado no outono em Xangai."},{"title":"Observe e pergunte","body":"Peça para observar o preparo e pergunte sobre escolhas, tempos e segredos que o cozinheiro aceite compartilhar.","example":"Perguntar quanto tempo a massa descansa e por quê."}],"assignment":"Acompanhe o preparo de um prato (em restaurante, banca ou casa) e explique em 250 palavras a técnica, os ingredientes e uma escolha do cozinheiro.","rubric":"Expliquei a técnica corretamente? Os ingredientes foram descritos com origem ou contexto? Incluí a explicação do próprio cozinheiro?"},"jornalismo-gastronomia:2":{"title":"Comida carrega história, não exotismo","intro":"Pratos têm origem, migrações e significados culturais. O jornalismo gastronômico responsável apresenta esse contexto sem tratar culinárias diferentes como estranhas ou exóticas.","steps":[{"title":"Procedência e história","body":"De onde vem o prato? Como chegou a Xangai? Como mudou ao longo do tempo? Busque fontes confiáveis.","example":"Explicar que muitos restaurantes de Xangai servem culinárias de outras províncias, trazidas por migrantes."},{"title":"Significado cultural","body":"Alguns pratos estão ligados a festas, estações ou rituais. Contextualize com fontes locais.","example":"Bolinhos de lua (yuebing) associados ao Festival do Meio do Outono."},{"title":"Evite o exotismo","body":"Não descreva comidas como “bizarras” ou “nojentas”. Explique com respeito e compare com referências do público quando ajudar.","example":"Comparar o tofu fermentado a queijos curados, em vez de chamá-lo de “estranho”."}],"assignment":"Escolha um prato servido em Xangai e escreva 300 palavras sobre sua procedência e significado, com duas fontes e sem linguagem exotizante.","rubric":"A procedência está documentada? O significado cultural tem fonte? Evitei linguagem exotizante?"},"jornalismo-gastronomia:3":{"title":"Contar uma refeição inteira","intro":"A reportagem de uma refeição combina ambiente, pessoas, pratos, técnica, contexto e serviço numa narrativa sensorial. É a síntese das aulas de gastronomia.","steps":[{"title":"Ambiente e pessoas","body":"Descreva o lugar, o movimento, os sons e quem cozinha e serve. A refeição acontece num contexto social.","example":"“Doze mesas, cozinha aberta, o dono chama os clientes antigos pelo nome.”"},{"title":"Sequência sensorial","body":"Narre a refeição em ordem, descrevendo cada prato com vocabulário sensorial e técnico.","example":"Entrada fria, prato principal braseado, sobremesa; cada um com textura e sabor descritos."},{"title":"Serviço e transparência","body":"Informe preço, endereço, horário e se a refeição foi paga por você ou oferecida.","example":"“Refeição paga pela reportagem; 120 yuan para duas pessoas.”"}],"assignment":"Narre uma refeição completa (texto de 500 palavras ou vídeo de 3 minutos) com ambiente, pessoas, sequência sensorial, contexto e box de serviço com transparência sobre pagamento.","rubric":"A narrativa transmite a experiência sensorial? Incluí pessoas e contexto? Declarei quem pagou a refeição?"},"jornalismo-tecnologia:0":{"title":"Entender o produto antes de opinar","intro":"Jornalismo de tecnologia começa por entender o que um produto faz, para quem e com que limitações. Isso exige ler especificações, testar e traduzir termos técnicos sem perder precisão.","steps":[{"title":"Função e público","body":"O que o produto promete resolver? Para quem foi feito? Avaliar fora desse propósito gera críticas injustas.","example":"Um tradutor de bolso para turistas não deve ser avaliado como software profissional de tradução."},{"title":"Especificações relevantes","body":"Identifique quais especificações importam para o uso real e explique-as em linguagem acessível.","example":"“Bateria de 5.000 mAh: na prática, cerca de um dia de uso intenso, segundo nosso teste.”"},{"title":"Separar promessa de evidência","body":"O que o fabricante afirma é promessa. O que você testou é evidência. Diferencie sempre.","example":"“O fabricante promete 48 horas; em nosso uso, a bateria durou 30.”"}],"assignment":"Escolha um aparelho ou aplicativo usado em Xangai (pagamento digital, tradução, mobilidade). Descreva função, público, três especificações relevantes e as promessas a testar.","rubric":"Defini função e público? Expliquei as especificações em linguagem acessível? Separei promessa de evidência?"},"jornalismo-tecnologia:1":{"title":"Testar com método","intro":"Um teste confiável segue um método: condições definidas, critérios claros, repetição e registro. Sem método, a avaliação é apenas impressão pessoal.","steps":[{"title":"Defina critérios","body":"O que será avaliado? Velocidade, precisão, duração, facilidade de uso? Escolha critérios ligados ao uso real.","example":"Testar um aplicativo de tradução em: precisão de frases do cotidiano, velocidade e funcionamento sem internet."},{"title":"Padronize condições","body":"Use as mesmas condições para comparações: mesmo lugar, mesmas frases, mesma conexão.","example":"Traduzir as mesmas 20 frases em três aplicativos, na mesma rede Wi-Fi."},{"title":"Registre e repita","body":"Anote resultados e repita testes importantes. Um resultado isolado pode ser exceção.","example":"Medir o tempo de resposta três vezes e registrar a média."}],"assignment":"Crie e execute um protocolo de teste para comparar dois aplicativos ou aparelhos, com cinco critérios, condições padronizadas e pelo menos três repetições por critério.","rubric":"Os critérios estão ligados ao uso real? As condições foram padronizadas? Os resultados estão registrados com repetição?"},"jornalismo-tecnologia:2":{"title":"Nenhum produto é só vantagem","intro":"Toda tecnologia tem benefícios, limites e impactos. Uma avaliação equilibrada considera desempenho, custo, privacidade, acessibilidade e quem pode ficar de fora.","steps":[{"title":"Benefícios concretos","body":"Descreva vantagens observadas em situações reais, não apenas listadas pelo fabricante.","example":"“Pagar com o celular agilizou compras em bancas que não aceitam cartão estrangeiro.”"},{"title":"Limites e problemas","body":"Falhas, custos ocultos, curva de aprendizado e incompatibilidades são informações essenciais.","example":"“O cadastro exigiu verificação de passaporte que levou dois dias.”"},{"title":"Impactos mais amplos","body":"Privacidade de dados, acessibilidade, exclusão de quem não tem acesso. Pergunte quem se beneficia e quem é prejudicado.","example":"Idosos sem smartphone podem ter dificuldade em lugares que só aceitam pagamento digital."}],"assignment":"Avalie uma tecnologia que você usa em Xangai em três colunas: benefícios observados, limites encontrados e impactos mais amplos, com pelo menos três itens em cada.","rubric":"Os benefícios foram observados por mim? Identifiquei limites reais? Considerei impactos sobre outras pessoas?"},"jornalismo-tecnologia:3":{"title":"Mostrar funcionando, explicar sem exagerar","intro":"Um vídeo de demonstração mostra o produto em uso real, explica funções relevantes e separa dados de teste da experiência pessoal. É a síntese das aulas de tecnologia.","steps":[{"title":"Mostre o uso real","body":"Grave o produto em situações cotidianas, não apenas em cenários ideais. Mostre também quando falha.","example":"Usar o tradutor numa conversa real num mercado barulhento."},{"title":"Dados versus experiência","body":"Apresente os resultados do teste com números e, separadamente, sua experiência pessoal marcada como tal.","example":"Gráfico com resultados do teste; depois: “Pessoalmente, achei a interface confusa.”"},{"title":"Transparência","body":"Informe se o produto foi comprado ou cedido, se há patrocínio e quanto tempo foi usado.","example":"“Aparelho comprado pela reportagem; usado por duas semanas.”"}],"assignment":"Produza um vídeo de demonstração de três minutos com uso real, resultados de teste, experiência pessoal marcada e declaração de transparência.","rubric":"Mostrei o uso real, incluindo falhas? Separei dados de experiência? A declaração de transparência está clara?"},"jornalismo-economico:0":{"title":"Economia explicada para quem não é economista","intro":"Jornalismo econômico traduz conceitos como inflação, câmbio, renda e consumo em explicações compreensíveis. Precisão conceitual é indispensável: termos mal usados geram conclusões erradas.","steps":[{"title":"Conceitos básicos","body":"Inflação (aumento geral de preços), câmbio (valor de uma moeda em outra), renda (quanto as pessoas ganham), poder de compra (o que a renda permite adquirir).","example":"Explicar que um café “barato” em reais pode não ser barato para quem ganha em yuan."},{"title":"Nominal versus real","body":"Valores nominais não consideram inflação; valores reais sim. Comparar preços de anos diferentes exige ajuste.","example":"Um aumento de 10% no preço em dois anos pode ser menor que a inflação do período."},{"title":"Fontes confiáveis","body":"Use dados de órgãos oficiais de estatística, bancos centrais e instituições reconhecidas, sempre com data.","example":"Taxa de câmbio do dia, consultada no site do banco central ou instituição oficial."}],"assignment":"Explique em 60 segundos (gravando) três conceitos econômicos usando exemplos do cotidiano de Xangai, com fontes para os dados citados.","rubric":"Os conceitos estão corretos? Os exemplos tornam a explicação compreensível? Os dados têm fonte e data?"},"jornalismo-economico:1":{"title":"Comparar preços de forma justa","intro":"Comparar preços entre países exige considerar câmbio, renda e custo de vida. Converter valores para reais sem contexto produz conclusões enganosas sobre o que é caro ou barato.","steps":[{"title":"Câmbio não basta","body":"Converter o preço pelo câmbio mostra quanto custaria para um brasileiro, mas não quanto pesa para quem mora no país.","example":"Um almoço de 30 yuan convertido em reais parece barato, mas é preciso saber quanto isso representa da renda local."},{"title":"Preço em horas de trabalho","body":"Dividir o preço pelo salário por hora mostra o esforço necessário para comprar algo. É uma comparação mais justa entre países.","example":"“Um café custa cerca de X minutos de trabalho com salário médio local.” (calcule com dados oficiais atuais)"},{"title":"Mesma cesta, mesmas condições","body":"Compare produtos equivalentes: mesma marca ou qualidade, mesmo tamanho, mesmo tipo de estabelecimento.","example":"Comparar o mesmo modelo de tênis em lojas oficiais de cada país, não um importado contra um local."}],"assignment":"Compare o preço de três produtos entre Xangai e uma cidade brasileira usando câmbio do dia e tempo de trabalho com dados oficiais de renda. Explique as diferenças de conclusão entre os dois métodos.","rubric":"Usei câmbio e renda com fonte e data? Os produtos são equivalentes? Expliquei como o método muda a conclusão?"},"jornalismo-economico:2":{"title":"Um indicador nunca fala sozinho","intro":"PIB, inflação, desemprego e índices de confiança são indicadores úteis, mas cada um mede algo específico, com limitações. Interpretar exige contexto, comparação e cuidado com causalidade.","steps":[{"title":"O que o indicador mede","body":"Leia a definição oficial: o que é medido, como, com que frequência e com que abrangência.","example":"Um índice de preços ao consumidor mede uma cesta específica, que pode não refletir o consumo de todos os grupos."},{"title":"Compare no tempo e no espaço","body":"Um número isolado diz pouco. Compare com períodos anteriores e com outras regiões, usando a mesma metodologia.","example":"Comparar a inflação do mês com a do mesmo mês do ano anterior."},{"title":"Correlação não é causa","body":"Dois indicadores que se movem juntos não necessariamente têm relação causal. Busque explicações de especialistas e evidências.","example":"Aumento de vendas de cafés e aumento de renda podem coincidir sem que um cause o outro."}],"assignment":"Escolha um indicador econômico chinês ou de Xangai, explique o que mede e suas limitações, compare dois períodos e escreva uma conclusão que evite afirmar causalidade sem evidência.","rubric":"Expliquei corretamente o que o indicador mede? Comparei períodos com a mesma metodologia? Evitei afirmar causalidade sem evidência?"},"jornalismo-economico:3":{"title":"Contar o consumo com números e pessoas","intro":"A reportagem de consumo une dados econômicos, comparação justa de preços e histórias de pessoas reais. É a síntese das aulas de economia: explicar sem simplificar demais.","steps":[{"title":"Pergunta e dados","body":"Comece com uma pergunta concreta e reúna dados oficiais e coleta própria para respondê-la.","example":"“Quanto uma família gasta por semana com alimentação num bairro de Xangai?”"},{"title":"Personagens e contexto","body":"Entreviste consumidores e comerciantes sobre suas escolhas. Eles explicam motivos que os números não mostram.","example":"Uma família que trocou o supermercado pelo mercado de rua por causa dos preços."},{"title":"Comparação justa e limites","body":"Apresente comparações com método claro e declare os limites da amostra e dos dados.","example":"“Acompanhamos três famílias por uma semana — não é uma média da cidade.”"}],"assignment":"Produza uma reportagem de consumo (texto de 500 palavras ou vídeo de 3 minutos) com pergunta, dados com fonte, dois personagens e comparação de preços com método explicado.","rubric":"A pergunta é concreta? Os dados têm fonte e data? A comparação é justa e os limites estão declarados?"}},"atlas":[{"title":"Formas e geometria","terms":["retilíneo","curvilíneo","angular","arredondado","simétrico","assimétrico","verticalizado","horizontal","modular","orgânico","facetado","escalonado","radial","sinuoso","vazado"],"prompt":"Descreva uma cena de Xangai usando três elementos de formas e geometria e sem recorrer a adjetivos genéricos."},{"title":"Escala e proporção","terms":["monumental","compacto","amplo","estreito","alongado","baixo","esguio","imponente","discreto","proporcional","escala humana","desproporcional","diminuto","robusto","maciço"],"prompt":"Descreva uma cena de Xangai usando três elementos de escala e proporção e sem recorrer a adjetivos genéricos."},{"title":"Luz e sombra","terms":["difusa","direcional","rasante","contrastada","suave","dourada","indireta","irregular","refletida","natural","penumbra","zenital","filtrada","chapada","estourada"],"prompt":"Descreva uma cena de Xangai usando três elementos de luz e sombra e sem recorrer a adjetivos genéricos."},{"title":"Cores e contraste","terms":["monocromático","complementar","neutro","saturado","dessaturado","quente","frio","terroso","vibrante","gradual","tom sobre tom","pastel","desbotado","análogo","acento de cor"],"prompt":"Descreva uma cena de Xangai usando três elementos de cores e contraste e sem recorrer a adjetivos genéricos."},{"title":"Textura e acabamento","terms":["fosco","polido","áspero","liso","granulado","poroso","acetinado","translúcido","metálico","aveludado","rugoso","envernizado","trincado","escovado","oxidado"],"prompt":"Descreva uma cena de Xangai usando três elementos de textura e acabamento e sem recorrer a adjetivos genéricos."},{"title":"Ambiente e atmosfera","terms":["acolhedor","movimentado","contemplativo","intimista","solene","silencioso","agitado","arejado","concentrado","descontraído","austero","efervescente","sóbrio","sereno","impessoal"],"prompt":"Descreva uma cena de Xangai usando três elementos de ambiente e atmosfera e sem recorrer a adjetivos genéricos."},{"title":"Movimentos","terms":["gradual","fluido","brusco","contínuo","intermitente","ritmado","circular","oscilante","acelerado","cadenciado","sincronizado","pendular","errático","convergente","disperso"],"prompt":"Descreva uma cena de Xangai usando três elementos de movimentos e sem recorrer a adjetivos genéricos."},{"title":"Arquitetura","terms":["fachada","pórtico","marquise","cornija","vão","platibanda","pilotis","recuo","arcada","volumetria","empena","beiral","balaustrada","átrio","brise"],"prompt":"Descreva uma cena de Xangai usando três elementos de arquitetura e sem recorrer a adjetivos genéricos."},{"title":"Cidade","terms":["calçada","travessia","esquina","quarteirão","praça","arborização","fluxo","mobiliário urbano","permeabilidade","fachada ativa","adensamento","uso misto","caminhabilidade","gentrificação","espaço residual"],"prompt":"Descreva uma cena de Xangai usando três elementos de cidade e sem recorrer a adjetivos genéricos."},{"title":"Moda","terms":["silhueta","caimento","recorte","pesponto","pregas","aviamentos","volume","modelagem","arremate","acabamento","alfaiataria","sobreposição","drapeado","oversized","atemporal"],"prompt":"Descreva uma cena de Xangai usando três elementos de moda e sem recorrer a adjetivos genéricos."},{"title":"Gastronomia","terms":["crocante","cremoso","fibroso","untuoso","ácido","adocicado","defumado","aromático","aveludado","persistente","umami","picante","adstringente","caramelizado","tostado"],"prompt":"Descreva uma cena de Xangai usando três elementos de gastronomia e sem recorrer a adjetivos genéricos."},{"title":"Som","terms":["ressonância","reverberação","eco","sussurro","estalo","zumbido","ruído","cadência","intensidade","silêncio","timbre","grave","agudo","estridente","paisagem sonora"],"prompt":"Descreva uma cena de Xangai usando três elementos de som e sem recorrer a adjetivos genéricos."},{"title":"Fotografia","terms":["contraluz","primeiro plano","profundidade de campo","perspectiva","enquadramento","reflexo","desfoque","silhueta","panorâmica","exposição","regra dos terços","linhas de condução","plano detalhe","granulação","composição"],"prompt":"Descreva uma cena de Xangai usando três elementos de fotografia e sem recorrer a adjetivos genéricos."},{"title":"Emoções e impressões","terms":["surpresa","curiosidade","encantamento","estranhamento","familiaridade","nostalgia","calma","expectativa","admiração","ambivalência","desconforto","empatia","inquietação","deslumbramento","alívio"],"prompt":"Descreva uma cena de Xangai usando três elementos de emoções e impressões e sem recorrer a adjetivos genéricos."},{"title":"Relações espaciais","terms":["adjacente","ao fundo","na diagonal","em primeiro plano","paralelo","sobreposto","alinhado","intercalado","centralizado","nas extremidades","contíguo","defronte","perpendicular","recuado","à margem"],"prompt":"Descreva uma cena de Xangai usando três elementos de relações espaciais e sem recorrer a adjetivos genéricos."},{"title":"Mudança temporal","terms":["gradualmente","repentinamente","ao amanhecer","no intervalo","enquanto isso","mais adiante","posteriormente","anteriormente","na sequência","ao final","simultaneamente","paulatinamente","de imediato","em seguida","ao longo do dia"],"prompt":"Descreva uma cena de Xangai usando três elementos de mudança temporal e sem recorrer a adjetivos genéricos."},{"title":"Pessoas: aparência","terms":["estatura","compleição","grisalho","cacheado","rabo de cavalo","barbado","rugas de expressão","tatuagem","uniformizado","acessório","cabelo raspado","franja","óculos de grau","maquiagem","crachá"],"prompt":"Descreva uma pessoa que você observou usando três elementos de aparência, sem deduzir idade, origem, profissão ou saúde."},{"title":"Pessoas: expressão e gestos","terms":["semblante","cenho franzido","sorriso contido","olhar fixo","gesticulação","aceno","dar de ombros","braços cruzados","sobrancelhas arqueadas","expressivo","olhar de soslaio","mão no queixo","gargalhada","boquiaberto","apontar"],"prompt":"Descreva uma conversa observada usando expressões e gestos, sem afirmar o que as pessoas sentiam."},{"title":"Pessoas: postura e movimento","terms":["ereto","curvado","apoiado","agachado","inclinado","passo apressado","passo arrastado","imóvel","desenvolto","hesitante","encostado","de pernas cruzadas","em fila","debruçado","em marcha"],"prompt":"Descreva como uma pessoa ocupa e atravessa um espaço usando postura e ritmo de movimento."},{"title":"Objetos: estado e uso","terms":["desgastado","intacto","lascado","enferrujado","remendado","artesanal","industrializado","utilitário","ornamental","portátil","novo em folha","reaproveitado","descartável","quebradiço","conservado"],"prompt":"Descreva um objeto pelo estado de conservação e pelo uso que ele sugere, separando o que vê do que supõe."},{"title":"Objetos: forma e partes","terms":["alça","cabo","tampa","base","haste","bojo","encaixe","dobradiça","empilhável","cilíndrico","gargalo","aro","rosca","borda","pegador"],"prompt":"Descreva um objeto nomeando suas partes e a relação entre elas, como se o público não pudesse vê-lo."},{"title":"Animais: aparência","terms":["pelagem","plumagem","malhado","rajado","focinho","cauda","porte","bico","patas","escamoso","bigodes","orelhas eretas","crista","garras","pelo eriçado"],"prompt":"Descreva um animal observado pela cobertura do corpo, pelas cores e pelas partes visíveis."},{"title":"Animais: comportamento","terms":["ciscar","empoleirado","à espreita","arisco","dócil","enrodilhado","saltitante","em bando","farejar","alerta","bicar","rosnar","ronronar","espreguiçar-se","territorial"],"prompt":"Descreva o que um animal faz durante um intervalo de tempo, sem atribuir a ele intenções humanas."},{"title":"Vista e panorama","terms":["horizonte","skyline","mirante","panorama","vista aérea","ponto de fuga","à distância","emoldurado","desobstruído","recortado","plano geral","vista em mergulho","camadas de profundidade","linha d'água","contorno"],"prompt":"Descreva uma vista ampla organizando planos, distâncias e o que fica no horizonte."},{"title":"Paisagem natural","terms":["relevo","colina","planície","margem","vegetação rasteira","copa","bosque","espelho d'água","curso d'água","ribeirinho","encosta","vale","orla","arbusto","estuário"],"prompt":"Descreva uma paisagem com água, vegetação e relevo, indicando onde cada elemento está."},{"title":"Céu e clima","terms":["encoberto","límpido","neblina","garoa","aguaceiro","mormaço","abafado","crepúsculo","rajada","orvalho","nublado","chuvisco","trovoada","úmido","ventania"],"prompt":"Descreva o céu e o tempo de um momento específico, com hora e efeitos sobre a cena."},{"title":"Conectores e encadeamento","terms":["contudo","portanto","embora","ainda assim","além disso","por sua vez","em contrapartida","ou seja","à medida que","na medida em que"],"prompt":"Narre uma mudança observada encadeando causa, contraste e conclusão com conectores precisos."},{"title":"Verbos de incidência e repercussão","terms":["incidir","recair","repercutir","reverberar","ecoar","refletir","irradiar","propagar-se","desdobrar-se","permear","atravessar","decorrer de","acarretar","suscitar","convergir"],"prompt":"Explique uma mudança observada mostrando onde ela incide e como repercute, com dois verbos deste campo."}],"missions":[{"id":"mission-01","area":"moda","title":"Leitura de vitrine","brief":"Observe uma vitrine e diferencie descrição visual de hipótese sobre identidade da marca.","shots":["Plano geral da vitrine","três detalhes de material e construção","reflex mochila de viagem","mode":"analitico","brief":"Inclua comparação com critério e qualifique uma interpretação.","seconds":60}],"layers":[{"title":"Observar","question":"O que há de fato diante de mim?","example":"Vejo árvores de ambos os lados da rua."},{"title":"Descrever","question":"Que forma, cor ou textura consigo nomear?","example":"As copas formam uma cobertura verde."},{"title":"Sentir","question":"Que sons, luzes e ritmos estão presentes?","example":"A luz atravessa as folhas, enquanto passam bicicletas."},{"title":"Localizar","question":"Onde estão os elementos uns em relação aos outros?","example":"À esquerda estão as vitrines; ao fundo, uma esquina."},{"title":"Contextualizar","question":"O que sei, com fonte e data?","example":"A origem do lugar ainda precisa ser pesquisada."},{"title":"Comparar","question":"Qual critério permite uma comparação justa?","example":"Este trecho parece menos movimentado que a avenida que acabamos de percorrer."},{"title":"Interpretar","question":"Qual hipótese posso apresentar com cautela?","example":"Minha impressão é que a sombra torna a caminhada mais agradável."},{"title":"Humanizar","question":"Que pessoa ou ação dá escala à história?","example":"Um barista prepara café enquanto clientes chegam."},{"title":"Sintetizar","question":"Que ideia legítima fica depois da cena?","example":"Conhecer a cidade também é perceber suas pequenas rotinas."}],"speechDrills":[{"id":"clinic-01","topic":"Precisão lexical","weak":"Que lugar maravilhoso, muito legal mesmo!","strong":"A luz atravessa as copas das árvores e destaca os detalhes das fachadas.","why":"Substitua adjetivos vazios por elementos observáveis da cena.","challenge":"Descreva uma fachada sem bonito, incrível ou legal."},{"id":"clinic-02","topic":"Limite da observação","weak":"Aqui ninguém usa dinheiro em espécie.","strong":"Nos pagamentos que observei hoje, as pessoas utilizaram aplicativos. Não investiguei outras formas de pagamento.","why":"Uma visita limitada não permite concluir o comportamento de toda a cidade.","challenge":"Transforme uma generalização sobre transporte em observação situada."},{"id":"clinic-03","topic":"Causa versus correlação","weak":"Tem fila porque a comida é a melhor do bairro.","strong":"Há uma fila neste horário. Ainda não perguntei às pessoas por que escolheram o restaurante.","why":"Uma cena não revela automaticamente os motivos de quem participa dela.","challenge":"Descreva um lugar cheio sem explicar a causa de forma especulativa."},{"id":"clinic-04","topic":"Detalhes espaciais","weak":"Tem um negócio ali atrás daquilo.","strong":"Ao fundo, à direita do quadro, há uma entrada sob uma marquise de vidro.","why":"Referência de quadro, direção e objeto específico orientam o espectador.","challenge":"Guie uma pessoa imaginária por três elementos do seu enquadramento."},{"id":"clinic-05","topic":"Conexão causal","weak":"Tem sombra. E também tem árvore. E isso é legal.","strong":"As copas das árvores projetam sombra sobre boa parte da calçada. Isso muda a experiência de caminhar aqui neste horário.","why":"Conecte detalhe a consequência sem repetir o mesmo adjetivo.","challenge":"Ligue material, iluminação e sensação em três frases."},{"id":"clinic-06","topic":"Foco narrativo","weak":"Aqui tem muita coisa, loja, árvore, prédio, pessoa, tudo.","strong":"Quero destacar dois elementos: o desenho da fachada e a maneira como a calçada é ocupada.","why":"Selecionar é parte da edição oral: dois pontos bem desenvolvidos valem mais que uma enumeração vaga.","challenge":"Escolha só dois detalhes de uma vitrine e desenvolva cada um."},{"id":"clinic-07","topic":"Contraste fundamentado","weak":"No Brasil não tem nada disso.","strong":"Este procedimento é diferente daquele que eu costumava utilizar no Brasil; vou mostrar as etapas e suas limitações.","why":"Diferencie experiência pessoal e comparação universal entre países.","challenge":"Compare duas formas de pagar sem estereotipar culturas."},{"id":"clinic-08","topic":"Ritmo de locução","weak":"Vamos-entrar-aqui-agora-e-ver-tudo-junto.","strong":"Vamos entrar aqui. [pausa] Primeiro, observe a organização do espaço. Depois, vamos aos detalhes.","why":"Pausas intencionais transformam sequência acelerada em instruções audíveis.","challenge":"Marque três pausas num roteiro de 60 palavras."},{"id":"clinic-09","topic":"Fonte explícita","weak":"Parece que esse lugar tem cem anos.","strong":"O edifício apresenta elementos ornamentais. A data de construção precisa ser verificada em uma fonte histórica.","why":"Estilo e aparência não comprovam idade.","challenge":"Troque três dados históricos supostos por perguntas de pesquisa."},{"id":"clinic-10","topic":"Observação e opinião","weak":"Aquela loja é a mais sofisticada.","strong":"A vitrine combina iluminação discreta e poucos elementos. A composição me transmite uma sensação de sofisticação.","why":"A segunda frase assume a natureza interpretativa da experiência estética.","challenge":"Separe descrição e avaliação em um review de produto."},{"id":"clinic-11","topic":"Linguagem sensorial","weak":"O café é muito bom e delicioso.","strong":"O primeiro gole tem acidez perceptível e um aroma que me lembra frutas cítricas.","why":"Ao relatar sabor, nomeie sensações próprias sem afirmar composição sem comprovação.","challenge":"Descreva uma bebida em aroma, textura e intensidade."},{"id":"clinic-12","topic":"Abordagem de entrevista","weak":"Você não acha que isso está errado?","strong":"Como você avalia essa mudança? O que melhorou e o que se tornou mais difícil?","why":"Perguntas abertas reduzem indução e permitem respostas inesperadas.","challenge":"Crie uma pergunta aberta para um comerciante."},{"id":"clinic-13","topic":"Escuta ativa","weak":"Tá, legal. Próxima pergunta.","strong":"Você mencionou uma dificuldade com o horário. Pode contar um episódio que mostre como isso acontece?","why":"Aprofundar a resposta do entrevistado cria informação, em vez de avançar mecanicamente.","challenge":"Formule duas perguntas de seguimento para uma resposta fictícia."},{"id":"clinic-14","topic":"Reformulação elegante","weak":"É… tipo… sabe… o lugar é bem…","strong":"O que quero destacar é a diferença entre a iluminação interna e a luz da rua.","why":"Recomeçar com uma frase-âncora recupera estrutura sem preencher cada pausa.","challenge":"Grave um comentário de 30 segundos e troque muletas por silêncio."},{"id":"clinic-15","topic":"Hierarquia de informação","weak":"Tem umas pessoas e uma placa e uma calçada e uma obra.","strong":"A mudança principal é a obra na calçada. A sinalização orienta os pedestres para o outro lado da rua.","why":"Primeiro a informação relevante; depois os detalhes que a explicam.","challenge":"Reordene três observações começando pela mais importante."},{"id":"clinic-16","topic":"Cuidado intercultural","weak":"Os chineses são assim mesmo.","strong":"Nesta interação, a pessoa preferiu explicar o procedimento por gestos. Não sei se isso reflete um costume mais amplo.","why":"Não transforme um encontro individual em característica de uma população.","challenge":"Reescreva um comentário cultural para manter curiosidade sem generalização."},{"id":"clinic-17","topic":"Fechamento específico","weak":"E é isso. Lugar incrível. Tchau!","strong":"Começamos observando a fachada; terminamos entendendo como a luz e o movimento da rua mudam sua aparência.","why":"Uma síntese recupera o assunto e mostra progresso de conhecimento.","challenge":"Feche um vídeo retomando uma pergunta lançada na abertura."},{"id":"clinic-18","topic":"Expressividade","weak":"Olha isso! Meu Deus! Insano!","strong":"Repare na altura deste vão. Só quando uma pessoa passa por ele percebemos a escala da estrutura.","why":"A surpresa pode ser comunicada com medida relativa, sem excesso de exclamações.","challenge":"Crie um comentário de surpresa usando escala e comparação."},{"id":"clinic-19","topic":"Apresentação de informação técnica","weak":"Essa câmera tem um sensor melhor, então é perfeita.","strong":"Neste teste com pouca luz, a imagem manteve detalhes nas sombras. Isso não garante o mesmo resultado em todas as cenas.","why":"Relate condições do teste e evite absolutismos de produto.","challenge":"Explique uma especificação mostrando consequência e limitação."},{"id":"clinic-20","topic":"Visual e narração","weak":"Isso é uma bicicleta vermelha, como vocês podem ver.","strong":"A bicicleta entra no quadro e cruza a rua. Vou deixar o som original para observarmos o ritmo da cena.","why":"Quando a imagem já entrega uma característica, a voz pode acrescentar intenção ou contexto.","challenge":"Escreva uma locução que não repita o que o vídeo mostra."},{"id":"clinic-21","topic":"Dado com contexto","weak":"O aluguel custa oito mil!","strong":"Nesta pesquisa, encontrei um anúncio por 8.000 yuans mensais. Ainda preciso confirmar condomínio, contas e condições contratuais.","why":"Preço exige moeda, período, fonte e condições; não é uma média de mercado.","challenge":"Apresente uma cotação sem tratá-la como preço universal."},{"id":"clinic-22","topic":"Pergunta como motor","weak":"Vou filmar essa praça porque ela é bonita.","strong":"Quero descobrir como diferentes pessoas usam esta praça ao longo da manhã.","why":"Uma pergunta verificável cria linha editorial além da contemplação.","challenge":"Formule uma pergunta jornalística para um mercado de rua."},{"id":"clinic-23","topic":"Precisão temporal","weak":"A estação está sempre cheia.","strong":"Às 18h desta quarta-feira, encontrei a plataforma bastante movimentada.","why":"O horário é parte da informação; “sempre” requer dados muito mais amplos.","challenge":"Converta uma afirmação absoluta em relato observacional."},{"id":"clinic-24","topic":"Transição com lógica","weak":"Mas enfim, bora pra outra coisa.","strong":"Entendemos o desenho da vitrine. Agora vamos observar como os produtos são apresentados.","why":"A transição explica por que o próximo assunto vem depois do anterior.","challenge":"Conecte arquitetura externa e experiência dentro de uma loja."}]};

  <script>
window.STORYLAB_ATLAS_GUIDES = [{"scene":"Uma rua com fachada comercial, bancos e árvores","focus":"Formas que organizam a cena: identifique linhas, curvas e padrões sem atribuir estilo arquitetônico sem pesquisa.","terms":[["retilíneo","Que apresenta traçado predominantemente reto.","As linhas retilíneas da fachada contrastam com os galhos das árvores.","Não descreva como retilíneo um contorno com curvas dominantes."],["curvilíneo","Composto por linhas ou superfícies curvas.","O corrimão curvilíneo acompanha a inclinação da escada.","Uma linha levemente inclinada não é necessariamente curva."],["angular","Com quinas e encontros de linhas bem definidos.","A fachada angular alterna planos que se encontram em quinas marcadas.","Não associe automaticamente linhas angulares a um estilo histórico."],["arredondado","Com bordas ou volumes de curvatura suave.","Os bancos arredondados interrompem a sequência de linhas retas.","Arredondado não é necessariamente circular em toda sua extensão."],["simétrico","Com partes correspondentes em torno de um eixo.","As duas janelas criam uma composição quase simétrica em torno da porta.","Observe diferenças antes de afirmar simetria perfeita."],["assimétrico","Sem correspondência de forma ou posição em ambos os lados de um eixo.","A posição assimétrica das janelas destaca a porta lateral.","Assimetria visual não demonstra erro ou falta de planejamento."],["verticalizado","Com predominância da altura e de eixos verticais.","Os painéis verticalizados acentuam a percepção de altura.","Não deduza o número de andares pela orientação da fachada."],["horizontal","Com direção predominante de lado a lado.","Uma marquise horizontal acompanha as vitrines do térreo.","Horizontal não implica ausência de pequenas inclinações."],["modular","Organizado por unidades repetidas ou combináveis.","Os painéis modulares repetem o mesmo desenho na parede.","Repetição visual não prova que os componentes sejam intercambiáveis."],["orgânico","De formas irregulares ou fluidas inspiradas em padrões naturais.","As linhas orgânicas do canteiro suavizam a geometria da calçada.","Orgânico descreve a forma; não prova que o material seja natural."],["facetado","Com várias faces planas que se encontram em ângulos, como um cristal lapidado.","O pavilhão facetado reflete a luz de forma diferente em cada plano de vidro.","Facetado descreve planos angulosos; não use para superfícies curvas ou lisas."],["escalonado","Organizado em degraus ou níveis sucessivos.","O edifício escalonado recua a cada andar, formando terraços.","Escalonado é a forma em degraus; não pressupõe que haja terraços acessíveis."],["radial","Disposto a partir de um centro, como raios de uma roda.","Os caminhos radiais do parque convergem para a fonte central.","Confirme se há de fato um centro comum antes de chamar o desenho de radial."],["sinuoso","Com curvas sucessivas e alternadas, como uma serpente.","Um caminho sinuoso de pedra atravessa o jardim até o pavilhão.","Sinuoso pede curvas alternadas; uma única curva é apenas curva."],["vazado","Com aberturas que deixam passar luz, ar ou visão através do material.","O muro vazado de tijolos deixa ver o pátio por trás.","Vazado descreve a forma; diga se as aberturas formam um padrão regular."]],"model":["Na cena proposta, duas fachadas apresentam linhas predominantemente retas.","O desenho curvilíneo dos galhos contrasta com a geometria dos edifícios.","Enquanto a fachada se organiza em eixos regulares, a vegetação ocupa o espaço de maneira menos uniforme.","Minha impressão é que essa diferença de formas torna a caminhada visualmente mais variada."],"swaps":[{"vague":"bonito","options":["simétrico","orgânico","modular"],"weak":"A fachada é bonita.","strong":"A fachada é quase simétrica: duas janelas iguais ladeiam a porta central.","flag":true},{"vague":"diferente","options":["assimétrico","curvilíneo","angular"],"weak":"O prédio tem um formato diferente.","strong":"O prédio tem um volume curvilíneo que se destaca entre blocos angulares.","flag":true},{"vague":"estranho","options":["assimétrico","orgânico","angular"],"weak":"O banco tem um design estranho.","strong":"O banco tem contorno orgânico, sem linhas retas, ao contrário dos canteiros.","flag":true}]},{"scene":"Um edifício alto ao lado de pequenas lojas","focus":"Escala e proporção precisam de referências observáveis; altura percebida não é metragem verificada.","terms":[["monumental","De dimensão percebida como muito grande ou imponente em relação ao entorno.","O volume monumental se destaca diante das construções baixas.","Sem medidas, não apresente a altura exata como fato."],["compacto","Com dimensões relativamente contidas e organização concentrada.","O espaço compacto reúne balcão, circulação e vitrines em poucos metros aparentes.","Compacto não equivale necessariamente a apertado ou desconfortável."],["amplo","Que oferece extensão ou espaço perceptivelmente generoso.","O vão amplo permite ver a praça desde a entrada.","Evite usar amplo quando só o enquadramento da lente aumenta a sensação de espaço."],["estreito","De largura pequena em relação à profundidade ou ao entorno.","O corredor estreito desemboca num salão mais amplo.","Use uma referência antes de afirmar que a largura é reduzida."],["alongado","Com comprimento relativamente grande diante da largura.","O balcão alongado conduz o olhar até a cozinha.","A lente pode acentuar proporções; observe por outro ângulo."],["baixo","De altura reduzida quando comparado a uma referência.","O muro baixo permite ver o jardim do outro lado.","Não invente metragem ou avaliação de segurança."],["esguio","De formato alto e relativamente estreito.","O poste esguio cria um eixo vertical ao lado do edifício.","A aparência esguia não comprova fragilidade estrutural."],["imponente","Que causa forte impressão visual pela escala ou composição.","As portas altas tornam a entrada visualmente imponente.","É percepção: mostre quais elementos justificam o adjetivo."],["discreto","Que se destaca pouco perante os demais elementos visuais.","O letreiro discreto quase se mistura à cor da parede.","Não presuma que a marca pretendia ocultá-lo."],["proporcional","Com relação equilibrada de dimensões entre as partes, segundo critério explicado.","A marquise parece proporcional à largura da entrada.","Equilíbrio visual é avaliação; explique o critério."],["escala humana","Dimensão compatível com o corpo e a percepção de quem caminha.","As lojas térreas e os toldos baixos mantêm a rua em escala humana.","É um conceito de urbanismo; explique em que a escala favorece o pedestre."],["desproporcional","Com partes de tamanhos que não guardam relação equilibrada entre si.","O letreiro parece desproporcional à fachada estreita da loja.","Diga em relação a quê; desproporção é sempre comparativa."],["diminuto","Muito pequeno, de dimensões reduzidas.","Um altar diminuto ocupa um nicho na parede da banca.","Prefira diminuto a “pequenininho” no texto; na fala, “bem pequeno” é mais natural."],["robusto","De estrutura sólida e aparência resistente.","Pilares robustos sustentam a passarela sobre a avenida.","Robusto descreve a aparência; resistência real exige informação técnica."],["maciço","Compacto e pesado na aparência, com pouca ou nenhuma abertura.","O bloco maciço de concreto contrasta com as fachadas de vidro ao redor.","Prefira “maciço” a “massivo”, anglicismo comum que soa impreciso."]],"model":["Neste exercício, um volume alto se destaca ao lado de fachadas comerciais baixas.","O espaço de entrada de uma das lojas é compacto, com vitrine e porta muito próximas.","A diferença entre o edifício e as lojas fica mais clara quando incluímos pessoas no enquadramento como referência de escala.","Na minha leitura, essa variação de proporções ajuda a revelar camadas diferentes da paisagem urbana."],"swaps":[{"vague":"grande","options":["monumental","amplo","imponente"],"weak":"É um prédio grande.","strong":"É um edifício monumental: a torre ocupa todo o campo de visão a partir da calçada.","flag":true},{"vague":"pequeno","options":["compacto","estreito","baixo"],"weak":"A loja é pequena.","strong":"A loja é estreita: cabe apenas um balcão e duas pessoas lado a lado.","flag":true},{"vague":"enorme","options":["monumental","alongado","imponente"],"weak":"A avenida é enorme.","strong":"A avenida é ampla e alongada; atravessá-la exige duas fases de semáforo.","flag":true}]},{"scene":"Uma cafeteria iluminada pela manhã","focus":"Descreva direção, intensidade e qualidade da luz pelo que é visível, não pela temperatura presumida da lâmpada.","terms":[["difusa","Luz espalhada, com sombras pouco definidas.","A luz difusa ilumina a parede sem desenhar sombras duras.","Luz fraca e luz difusa não são sinônimos."],["direcional","Luz com direção de incidência predominante perceptível.","A iluminação direcional projeta sombras para a direita.","As sombras não identificam, por si, a fonte luminosa."],["rasante","Luz que incide em ângulo baixo sobre uma superfície.","A luz rasante destaca as irregularidades do revestimento.","Confirme a direção da incidência antes de usar o termo."],["contrastada","Com diferença marcada entre regiões claras e escuras.","A iluminação contrastada deixa a bancada clara e o corredor em sombra.","Não confunda contraste de iluminação com contraste de cores."],["suave","Luz com transição pouco abrupta entre claridade e sombra.","A luz suave preserva detalhes no rosto e na parede.","Suavidade não significa necessariamente pouca intensidade."],["dourada","Luz de aparência amarela ou âmbar.","A luz dourada colore os contornos dos prédios.","Não confirme horário ou temperatura de cor só pela aparência."],["indireta","Luz que chega após reflexão ou distribuição por outra superfície.","A luz indireta ilumina a mesa sem ofuscar o rosto.","Uma fonte fora do quadro não comprova iluminação indireta."],["irregular","Com distribuição desigual da iluminação na cena.","A luz irregular desenha manchas entre os galhos.","Não confunda diferença de iluminação com defeito da câmera."],["refletida","Luz que atinge uma superfície depois de rebater em outra.","Uma faixa de luz refletida aparece sobre o vidro da vitrine.","Não é possível concluir a fonte exata de um reflexo sem observação."],["natural","Proveniente de fontes luminosas naturais, como o sol.","A luz natural alcança as mesas perto da janela.","Aparência natural não prova ausência de luz artificial."],["penumbra","Zona de luz fraca, entre a claridade e a sombra total.","Na penumbra do salão, só as mesas próximas à janela são bem visíveis.","Penumbra não é escuridão completa; descreva o que ainda se enxerga."],["zenital","Luz que vem de cima, do alto do céu ou de uma abertura no teto.","Uma claraboia deixa entrar luz zenital sobre o pátio interno.","Ao meio-dia, a luz natural é zenital e cria sombras curtas e duras."],["filtrada","Luz que atravessa algo — folhas, cortinas, tecido — antes de chegar à cena.","A luz filtrada pelos plátanos desenha manchas sobre a calçada.","Diga o que filtra a luz; isso explica a textura das manchas."],["chapada","Luz uniforme e frontal que elimina sombras e achata volumes.","Sob luz chapada, a fachada perde relevo e parece plana.","Termo de fotografia; na conversa comum, prefira “luz uniforme, sem sombras”."],["estourada","Área tão clara na imagem que perde detalhes e vira branco.","O céu ficou estourado na foto, sem nenhuma nuvem visível.","Jargão de fotografia e vídeo; explique o termo se o público for leigo."]],"model":["Na cena de estudo, a luz entra pela janela e alcança a bancada.","Sobre a madeira, a incidência rasante evidencia veios e pequenas irregularidades.","Enquanto o balcão está iluminado, o corredor ao fundo permanece mais escuro, criando contraste.","Para mim, a passagem entre essas áreas de luz e sombra conduz o olhar até o preparo do café."],"swaps":[{"vague":"claro","options":["difusa","natural","refletida"],"weak":"O café é bem claro.","strong":"O café recebe luz natural difusa pelas janelas altas, sem sombras marcadas.","flag":false},{"vague":"escuro","options":["indireta","contrastada","irregular"],"weak":"O corredor é escuro.","strong":"O corredor tem iluminação indireta e irregular: só o fundo recebe luz.","flag":false},{"vague":"bonita","options":["dourada","rasante","suave"],"weak":"A luz da tarde estava bonita.","strong":"A luz dourada e rasante da tarde revela a textura dos tijolos.","flag":false}]},{"scene":"Uma vitrine com roupas, letreiros e objetos","focus":"Diferencie matiz, saturação e temperatura percebida; uma cor não prova a intenção de uma marca.","terms":[["monocromático","Que utiliza uma cor ou variações próximas de um mesmo matiz.","A vitrine utiliza uma composição quase monocromática em tons de azul.","Uma única cor não impede variação de luz e saturação."],["complementar","Relação entre cores opostas em determinado círculo cromático.","O vermelho do cartaz contrasta com detalhes verdes.","Considere o modelo cromático antes de classificar as cores."],["neutro","Tom pouco marcado cromaticamente, como cinza ou bege.","O fundo neutro evidencia as peças mais coloridas.","Cor neutra ainda produz efeito visual e simbólico."],["saturado","De cor intensa, com pouca aproximação ao cinza.","O letreiro vermelho saturado se destaca contra a parede clara.","Saturação não é sinônimo de luminosidade alta."],["dessaturado","De cor com intensidade reduzida, próxima de tons acinzentados.","Os verdes dessaturados produzem um contraste suave com o piso.","Não chame toda cor pastel de dessaturada sem considerar matiz e luminosidade."],["quente","Tonalidade percebida como próxima do vermelho, laranja ou amarelo.","Os tons quentes aproximam visualmente os móveis de madeira.","Temperatura visual não é temperatura física."],["frio","Tonalidade percebida como próxima do azul ou de certos verdes.","O azul frio do letreiro contrasta com a parede bege.","Não atribua uma sensação idêntica a todas as pessoas."],["terroso","De tonalidade associada visualmente a argila, areia, ferrugem ou terra.","Os tons terrosos da coleção aproximam visualmente casacos e acessórios.","Terroso nomeia a aparência, não a composição do corante."],["vibrante","Com presença visual intensa, frequentemente por saturação ou contraste.","Uma faixa vibrante de amarelo destaca a entrada.","Explique se o impacto vem de saturação, contraste ou área ocupada."],["gradual","Com transição progressiva de tom, cor ou intensidade.","O mural passa gradualmente de azul a cinza.","Blocos de cor separados não representam necessariamente gradiente."],["tom sobre tom","Combinação de variações de uma mesma cor, mais claras e mais escuras.","A vitrine é montada em tom sobre tom, do bege ao marrom.","Diferencie de monocromático: tom sobre tom pressupõe variações perceptíveis."],["pastel","Cor clara e suave, com muito branco na mistura.","As fachadas em tons pastel suavizam o contraste com o céu cinza.","Pastel é luminosidade e suavidade, não uma cor específica."],["desbotado","Que perdeu intensidade de cor com o tempo, o sol ou as lavagens.","O toldo vermelho está desbotado nas partes mais expostas ao sol.","Desbotado indica perda de cor; não confirma idade nem descuido."],["análogo","Cores vizinhas no círculo cromático, como amarelo, laranja e vermelho.","O cartaz usa cores análogas, do amarelo ao vermelho, sem contraste forte.","Análogo é o oposto de complementar; use quando a harmonia vem da vizinhança."],["acento de cor","Pequeno ponto de cor que se destaca num conjunto neutro.","Um guarda-chuva amarelo é o único acento de cor na rua cinzenta.","Use quando o elemento colorido for pequeno em relação à cena."]],"model":["A vitrine do exercício reúne peças de tons terrosos e um letreiro colorido.","O vermelho mais saturado do letreiro se destaca diante das roupas de baixa intensidade cromática.","Comparada à parede neutra do fundo, a combinação das peças cria um conjunto cromático mais quente.","Minha impressão é que o contraste ajuda a organizar a atenção, mas a intenção da marca exigiria confirmação."],"swaps":[{"vague":"colorido","options":["saturado","vibrante","complementar"],"weak":"A vitrine é colorida.","strong":"A vitrine usa cores saturadas, com vermelho e verde em contraste complementar.","flag":true},{"vague":"sem graça","options":["neutro","dessaturado","monocromático"],"weak":"As roupas são sem graça.","strong":"As peças seguem uma paleta neutra e dessaturada, em cinzas e beges.","flag":true},{"vague":"chamativo","options":["vibrante","saturado","quente"],"weak":"O letreiro é chamativo.","strong":"O letreiro usa tons quentes e vibrantes que se destacam do concreto.","flag":true}]},{"scene":"Uma loja de objetos com vidro, cerâmica e metal","focus":"Associe textura e acabamento à superfície que você consegue observar; não deduza propriedades invisíveis.","terms":[["fosco","Com reflexão pouco especular, sem brilho definido.","O vaso fosco espalha a luz sem formar reflexos nítidos.","Fosco não significa áspero: acabamento e tato são dimensões distintas."],["polido","Com superfície tratada para reduzir irregularidades e refletir mais nitidamente.","O corrimão polido reflete formas do ambiente.","A aparência brilhante, isoladamente, não confirma o processo de fabricação."],["áspero","Que apresenta irregularidades ou atrito perceptíveis.","A pedra parece áspera pelas saliências reveladas pela luz.","Sem tocar, apresente aspereza como impressão visual."],["liso","Com superfície relativamente regular e sem saliências notáveis.","A mesa lisa reflete uma faixa de iluminação.","O enquadramento pode esconder irregularidades pequenas."],["granulado","Com grãos ou pontos pequenos visíveis na superfície.","O vaso tem uma textura granulada em close-up.","Grãos na imagem podem resultar do ruído da câmera."],["poroso","Com pequenos espaços ou aberturas na estrutura aparente.","A superfície porosa da peça deixa pequenas cavidades à vista.","Não afirme absorção de água sem teste ou especificação."],["acetinado","Com brilho moderado e difuso, entre fosco e brilhante.","O tecido acetinado recebe uma faixa discreta de luz.","O brilho não comprova composição de cetim ou seda."],["translúcido","Que permite passar luz sem formar imagem totalmente nítida.","O painel translúcido suaviza a visão do espaço interno.","Translúcido é diferente de transparente."],["metálico","Com aparência, brilho ou tonalidade associados a metal.","O acabamento metálico reflete a vitrine vizinha.","Aparência metálica não comprova o material da peça."],["aveludado","De aspecto visual macio, semelhante à superfície de veludo.","O revestimento aveludado espalha a luz sem reflexos fortes.","A aparência não comprova composição nem toque real."],["rugoso","Com saliências e reentrâncias irregulares na superfície.","O tronco rugoso do plátano contrasta com o banco de metal liso.","Rugoso é mais irregular que áspero; observe se há relevo visível."],["envernizado","Coberto por camada de verniz, com brilho e proteção.","O balcão envernizado reflete as luminárias do teto.","Brilho não comprova verniz; pode ser polimento ou outro acabamento."],["trincado","Com pequenas rachaduras, sem se separar em partes.","O piso trincado da entrada revela o desgaste dos anos de passagem.","Trinca é rachadura fina; não confunda com lasca, que perde material."],["escovado","Metal com acabamento de riscos finos e paralelos, sem brilho espelhado.","O elevador tem portas de aço escovado.","Escovado tem textura linear; polido é espelhado."],["oxidado","Com camada de óxido formada na superfície do metal, como a pátina esverdeada do cobre.","O sino de bronze oxidado ganhou tons esverdeados.","Oxidação nem sempre é dano: em bronze e cobre pode ser intencional."]],"model":["Na prateleira observamos superfícies de cerâmica, vidro e metal.","Um vaso de acabamento fosco contrasta com uma peça metálica que produz reflexos mais nítidos.","Enquanto o vidro deixa ver o fundo, o painel translúcido deixa passar luz e desfoca as formas.","Na minha avaliação, essa alternância de materiais dá ritmo à exposição sem precisar de muitos objetos."],"swaps":[{"vague":"macio","options":["acetinado","aveludado","polido"],"weak":"A cerâmica é macia.","strong":"A cerâmica tem acabamento acetinado: reflete pouco e parece suave ao toque.","flag":true},{"vague":"brilhante","options":["polido","metálico","translúcido"],"weak":"O balcão é brilhante.","strong":"O balcão de aço polido reflete as luminárias do teto.","flag":true},{"vague":"velho","options":["áspero","poroso","fosco"],"weak":"A parede é velha.","strong":"A parede tem reboco áspero e poroso, com pintura fosca descascando.","flag":true}]},{"scene":"Um salão de chá quase vazio","focus":"Atmosfera é interpretação fundamentada em pistas sensoriais; evite transformar impressão individual em verdade universal.","terms":[["acolhedor","Que transmite sensação subjetiva de recepção ou conforto.","Para mim, a iluminação baixa e os assentos próximos tornam o salão acolhedor.","Acolhedor é percepção; cite os elementos que a motivam."],["movimentado","Com múltiplas atividades ou deslocamentos observáveis.","O corredor parece movimentado durante a gravação da manhã.","Não represente um instante como padrão de todo o dia."],["contemplativo","Que favorece observação prolongada ou reflexão pessoal.","A vista do jardim me convida a um momento contemplativo.","A sensação é pessoal; não a atribua a todos os visitantes."],["intimista","Que favorece proximidade, recolhimento ou escala reduzida.","As mesas pequenas e a música baixa criam uma atmosfera intimista.","Não pressuponha que todos vivenciem o espaço da mesma forma."],["solene","De caráter formal ou cerimonioso.","O silêncio e o alinhamento dos assentos conferem solenidade à apresentação.","Silêncio sozinho não prova cerimônia."],["silencioso","Com poucos sons perceptíveis diante da referência utilizada.","O pátio está silencioso quando comparado à avenida.","Silencioso não é ausência absoluta de som."],["agitado","Com atividade intensa ou mudanças rápidas no ambiente.","O cruzamento parece agitado com ônibus e bicicletas passando.","Identifique quais ações sustentam essa impressão."],["arejado","Que transmite sensação de espaço aberto ou ventilado.","O salão parece arejado, com janelas abertas e teto alto.","Aparência não equivale à medição de ventilação ou qualidade do ar."],["concentrado","Reunido em uma área delimitada do espaço observado.","O movimento está concentrado nas bancas próximas à entrada.","A concentração visual não revela o público total."],["descontraído","De clima percebido como informal e pouco rígido.","As conversas espontâneas contribuem para um ambiente descontraído.","Evite atribuir estados emocionais a pessoas desconhecidas."],["austero","Sóbrio ao extremo, sem ornamentos nem concessões ao conforto.","A sala de espera é austera: bancos de madeira e paredes nuas.","Austero descreve o espaço; não atribua rigidez às pessoas que estão nele."],["efervescente","Com grande movimento, energia e atividade simultânea.","À noite, a rua dos bares fica efervescente.","Use para descrever atividade observável, não como elogio genérico."],["sóbrio","Contido, sem excessos visuais ou sonoros.","O restaurante tem decoração sóbria, em madeira e linho cru.","Sóbrio é contenção, não ausência de estilo."],["sereno","Calmo e sem agitação perceptível.","Às seis da manhã, o parque está sereno; só se ouvem pássaros.","Descreva o que torna o ambiente sereno; a sensação é sua."],["impessoal","Sem marcas de identidade, personalidade ou história local.","O saguão do hotel é impessoal: poderia estar em qualquer cidade.","É uma avaliação; sustente com elementos observáveis."]],"model":["Na situação imaginada, há poucas mesas ocupadas e música em volume discreto.","A disposição dos assentos e a iluminação baixa dão ao salão um aspecto intimista.","Ao contrário de um espaço de circulação rápida, este ambiente parece convidar a permanências mais longas.","Eu o descreveria como acolhedor, mas essa é minha impressão diante dos detalhes observados."],"swaps":[{"vague":"legal","options":["acolhedor","descontraído","arejado"],"weak":"O lugar é legal.","strong":"O salão é arejado e descontraído: mesas espaçadas e conversa em voz baixa.","flag":true},{"vague":"cheio","options":["movimentado","agitado","concentrado"],"weak":"O restaurante estava cheio.","strong":"O restaurante estava movimentado: todas as mesas ocupadas e fila na porta às 12h.","flag":false},{"vague":"tranquilo","options":["contemplativo","silencioso","intimista"],"weak":"O jardim é tranquilo.","strong":"O jardim é silencioso e contemplativo; ouve-se apenas a água do lago.","flag":false}]},{"scene":"Bicicletas cruzando uma praça","focus":"Identifique padrão, trajetória e velocidade percebida sem transformar um instante em estatística.","terms":[["gradual","Que se altera pouco a pouco num intervalo de tempo.","A sombra se desloca gradualmente sobre a calçada.","Um corte de edição não prova mudança contínua."],["fluido","Que ocorre sem interrupções ou mudanças bruscas evidentes.","O fluxo de ciclistas permanece fluido durante a tomada.","Uma cena breve não revela o padrão de todo o dia."],["brusco","Que se modifica rapidamente, com transição pouco perceptível.","Uma parada brusca interrompe o percurso da bicicleta.","Não deduza a causa da parada sem evidência."],["contínuo","Que segue sem interrupção visível durante o registro.","O movimento contínuo da esteira domina esta tomada.","Delimite o período observado, sem generalizar todo o funcionamento."],["intermitente","Que alterna períodos de atividade e pausa.","O som da campainha aparece de maneira intermitente.","Intermitente não significa necessariamente irregular."],["ritmado","Organizado em repetições com padrão de tempo identificável.","Os passos ritmados se alternam com o som das rodas.","O ritmo ouvido não informa velocidade exata."],["circular","Que descreve uma trajetória aproximadamente redonda.","Uma criança percorre um trajeto circular ao redor do canteiro.","Distinga trajetória observada de intenção do movimento."],["oscilante","Que alterna posição ou direção num movimento de vaivém.","Uma placa oscilante balança suavemente com o vento.","Oscilação não é a mesma coisa que rotação completa."],["acelerado","Que ganha velocidade ao longo de um intervalo observado.","O carrinho parece acelerar ao sair do corredor estreito.","Movimento rápido isolado não comprova aceleração."],["cadenciado","Que segue um ritmo identificável, marcado por repetições.","Os passos cadenciados se misturam ao ruído das rodas.","Cadenciado não exige velocidade constante."],["sincronizado","Que acontece ao mesmo tempo e no mesmo ritmo que outro movimento.","Os praticantes de dança na praça se movem de forma sincronizada.","Sincronia exata é rara; “quase sincronizado” costuma ser mais honesto."],["pendular","Que vai e volta de um ponto a outro, como um pêndulo.","O movimento pendular dos trabalhadores enche os trens às 8h e às 18h.","Em urbanismo, “movimento pendular” é o deslocamento diário casa–trabalho."],["errático","Sem direção ou padrão previsível.","Um drone de brinquedo faz um voo errático sobre a fonte.","Errático descreve a trajetória; não pressupõe defeito ou intenção."],["convergente","Que se dirige para um mesmo ponto.","Fluxos convergentes de pedestres se encontram na saída do metrô.","Diga para onde o movimento converge."],["disperso","Espalhado, sem concentração num ponto.","Depois do show, o público sai disperso pelas ruas vizinhas.","Disperso é distribuição no espaço, não desorganização."]],"model":["Na cena simulada, bicicletas atravessam uma praça por trajetos distintos.","O fluxo parece contínuo durante alguns segundos, enquanto o toque das campainhas é intermitente.","Quando comparamos a passagem das bicicletas ao deslocamento dos pedestres, percebemos ritmos diferentes no mesmo espaço.","Minha interpretação é que esses ritmos ajudam a contar a história da praça, mesmo sem uma entrevista."],"swaps":[{"vague":"rápido","options":["acelerado","brusco","contínuo"],"weak":"As bicicletas passam rápido.","strong":"As bicicletas passam em fluxo contínuo e acelerado quando o sinal abre.","flag":false},{"vague":"devagar","options":["gradual","cadenciado","fluido"],"weak":"As pessoas andam devagar.","strong":"Os praticantes de tai chi se movem de forma cadenciada e fluida.","flag":false},{"vague":"confuso","options":["intermitente","oscilante","brusco"],"weak":"O trânsito é confuso.","strong":"O trânsito é intermitente: avança em blocos e para de forma brusca.","flag":true}]},{"scene":"Uma fachada de edifício com entrada coberta","focus":"Nomeie elementos construtivos corretamente e não atribua data ou autoria sem pesquisa.","terms":[["fachada","Face exterior visível de uma construção.","A fachada apresenta aberturas regulares e uma entrada central.","O aspecto externo não comprova a idade do edifício."],["pórtico","Entrada ou passagem marcada por arcos, pilares ou moldura arquitetônica.","O pórtico da entrada separa o passeio do pátio interno.","Nem toda moldura de porta constitui um pórtico."],["marquise","Cobertura projetada sobre uma entrada ou trecho externo.","A marquise protege a faixa de acesso imediato ao prédio.","Não confunda marquise com qualquer sacada."],["cornija","Elemento saliente de arremate, geralmente horizontal, de fachada.","Uma cornija cria uma faixa de sombra abaixo da cobertura.","Não confunda cornija com marquise ou calha."],["vão","Abertura ou espaço livre entre partes de uma construção.","O vão da entrada enquadra uma pequena praça ao fundo.","O tamanho aparente não informa capacidade estrutural."],["platibanda","Mureta de fachada que se eleva acima do plano da cobertura.","A platibanda oculta o telhado visto da rua.","Não a identifique sem observar a extremidade superior da construção."],["pilotis","Pilares que sustentam a edificação, liberando parte do térreo.","O pavimento parece elevado por uma sequência de pilotis visíveis.","Verifique se são pilares estruturais antes de classificar."],["recuo","Afastamento em relação a um alinhamento de referência.","O recuo da porta cria um espaço protegido antes da entrada.","Recuo visível não prova conformidade com regras urbanísticas."],["arcada","Sequência de arcos arquitetônicos repetidos.","A arcada forma uma sucessão de sombras ao longo do corredor.","Um arco isolado não caracteriza necessariamente uma arcada."],["volumetria","Organização dos volumes e massas construídas.","A volumetria alterna um bloco alto com um corpo lateral mais baixo.","Não substitua descrição de volumes por rótulos de estilo sem evidência."],["empena","Parede lateral de um edifício, geralmente sem janelas.","A empena cega do prédio recebeu um mural de dez andares.","Empena cega é a sem aberturas; confirme antes de usar o termo."],["beiral","Prolongamento do telhado além da parede, que protege da chuva.","Sob o beiral largo, os vendedores se abrigam da garoa.","Não confunda beiral (parte do telhado) com marquise (estrutura independente)."],["balaustrada","Guarda-corpo formado por pequenas colunas (balaústres) e um corrimão.","Uma balaustrada de pedra contorna a varanda do primeiro andar.","Guarda-corpos de vidro ou grade não são balaustradas."],["átrio","Espaço interno amplo, geralmente com pé-direito alto e iluminação natural.","O átrio do shopping sobe seis andares até a cobertura de vidro.","Use para espaços internos de circulação; pátio é aberto ao céu."],["brise","Elemento de fachada que controla a entrada de sol, como lâminas ou aletas.","Brises verticais de alumínio sombreiam as janelas voltadas para oeste.","Do francês “brise-soleil”; diga se as lâminas são fixas ou móveis."]],"model":["O edifício da atividade tem fachada regular e entrada protegida por uma marquise.","A volumetria combina um bloco central mais alto e uma ala lateral de menor altura.","Diferentemente de uma construção com frente plana, esse conjunto projeta volumes em profundidades distintas.","Na minha leitura, observar esses recuos ajuda a entender a composição antes mesmo de procurar sua história."],"swaps":[{"vague":"prédio antigo","options":["fachada","cornija","arcada"],"weak":"É um prédio antigo bonito.","strong":"A fachada de pedra termina numa cornija ornamentada e abre-se em arcada no térreo.","flag":false},{"vague":"entrada","options":["pórtico","marquise","vão"],"weak":"A entrada é grande.","strong":"Um pórtico de colunas marca a entrada, protegido por uma marquise de vidro.","flag":false},{"vague":"moderno","options":["volumetria","pilotis","recuo"],"weak":"O edifício é moderno.","strong":"O edifício se apoia em pilotis e tem volumetria de blocos sobrepostos, com recuo da calçada.","flag":false}]},{"scene":"Uma esquina com comércio, calçada e árvores","focus":"Descreva o espaço público distinguindo observação direta de diagnóstico urbano.","terms":[["calçada","Faixa destinada principalmente à circulação de pedestres ao longo da via.","A calçada se estreita perto da banca, obrigando a desviar do expositor.","Uma imagem isolada não comprova acessibilidade no trajeto inteiro."],["travessia","Ponto ou ação de atravessar de um lado para outro da via.","A travessia sinalizada fica próxima à esquina.","Não presuma segurança apenas porque há pintura no piso."],["esquina","Local em que duas ruas ou frentes de um quarteirão se encontram.","Na esquina, uma cafeteria ocupa a frente voltada às duas vias.","Esquina não indica automaticamente o sentido do tráfego."],["quarteirão","Trecho urbano delimitado por ruas ou limites de circulação.","Neste quarteirão, as lojas se concentram no térreo.","Evite representar todo um bairro por um único quarteirão."],["praça","Espaço aberto de uso coletivo, com funções de circulação ou permanência.","A praça reúne bancos, canteiros e caminhos de pedestres.","Um pátio de aparência pública pode ter acesso privado."],["arborização","Conjunto de árvores presente ou implantado em um espaço.","A arborização acompanha quase todo o trecho enquadrado.","Não infira espécie, idade ou manejo sem fonte."],["fluxo","Movimento de pessoas ou veículos ao longo de um percurso.","O fluxo de pedestres aumenta junto à saída do metrô.","Sem contagem, descreva qualitativamente e delimite o período."],["mobiliário urbano","Conjunto de bancos, lixeiras, suportes e outros objetos do espaço público.","Os bancos compõem o mobiliário urbano junto ao canteiro.","Um objeto temporário não é necessariamente parte de mobiliário oficial."],["permeabilidade","Facilidade ou possibilidade de atravessar ou acessar um espaço.","As entradas em lados distintos aumentam a permeabilidade da galeria.","A permeabilidade visual não confirma acesso permitido."],["fachada ativa","Frente edificada com usos e aberturas que geram relação direta com a rua.","As vitrines e portas abertas criam uma fachada ativa voltada à calçada.","Um estabelecimento aberto no instante não prova vitalidade permanente."],["adensamento","Aumento do número de pessoas, moradias ou construções numa área.","O adensamento do bairro trouxe torres onde antes havia casas.","É um processo; afirme-o com dados ou fontes, não só pela paisagem."],["uso misto","Combinação de moradia, comércio e serviços no mesmo edifício ou quarteirão.","O prédio de uso misto tem lojas no térreo e apartamentos acima.","Confirme os usos reais; nem toda loja térrea indica moradia acima."],["caminhabilidade","Qualidade de um lugar para ser percorrido a pé com conforto e segurança.","Calçadas largas e sombra aumentam a caminhabilidade da rua.","Termo técnico de urbanismo; explique os critérios que você observou."],["gentrificação","Transformação de um bairro com valorização imobiliária e substituição de moradores por grupos de maior renda.","Moradores antigos associam a gentrificação ao aumento dos aluguéis.","Termo carregado e debatido; sustente com dados de renda e moradia, não só com cafés novos."],["espaço residual","Área urbana que sobra entre construções ou vias, sem função definida.","Sob o viaduto, um espaço residual virou estacionamento improvisado.","Residual não significa inútil; observe como as pessoas o ocupam."]],"model":["A esquina do exercício reúne lojas voltadas à calçada e árvores alinhadas à via.","Uma vitrine ocupa boa parte da fachada, enquanto a travessia fica próxima ao cruzamento.","Em comparação a uma frente fechada, as portas e vitrines oferecem mais pontos de contato visual com a rua.","Minha impressão é que esses elementos tornam a caminhada mais interessante; para avaliar acessibilidade, seria preciso observar o percurso completo."],"swaps":[{"vague":"movimentado","options":["fluxo","travessia","fachada ativa"],"weak":"A rua é movimentada.","strong":"A rua tem fluxo intenso de pedestres e fachada ativa: lojas abertas em toda a quadra.","flag":false},{"vague":"agradável","options":["arborização","mobiliário urbano","permeabilidade"],"weak":"A praça é agradável.","strong":"A praça tem arborização densa, bancos sombreados e permeabilidade para várias ruas.","flag":true},{"vague":"lugar","options":["esquina","quarteirão","praça"],"weak":"Fui a um lugar perto do metrô.","strong":"Fui a uma esquina a um quarteirão da saída 3 do metrô.","flag":false}]},{"scene":"Uma vitrine de alfaiataria contemporânea","focus":"Comunique moda com precisão técnica e diferencie avaliação estética de informação de fabricação.","terms":[["silhueta","Contorno geral que a peça ou conjunto cria no corpo.","O casaco constrói uma silhueta reta, com pouco ajuste na cintura.","Silhueta não determina por si só o público-alvo da marca."],["caimento","Modo como um tecido ou peça se acomoda e se movimenta no corpo.","O tecido forma pregas suaves e um caimento fluido na barra.","Uma foto estática não revela todo o comportamento em movimento."],["recorte","Linha ou peça resultante de cortes no desenvolvimento de roupa.","O recorte diagonal divide visualmente a frente do casaco.","Uma estampa pode simular recorte; verifique se há costura."],["pesponto","Costura visível realizada próxima a uma borda, emenda ou detalhe.","O pesponto aparente acompanha o contorno do bolso.","Não atribua função estrutural sem conhecer a construção."],["pregas","Dobras formadas no tecido para criar efeito ou volume.","As pregas abaixo do cós acrescentam volume à calça.","Dobras ocasionais não constituem necessariamente pregas de construção."],["aviamentos","Componentes complementares, como botões, zíperes e ilhoses.","Os aviamentos metálicos aparecem sobre a jaqueta escura.","Não confunda aviamentos com a fibra principal da peça."],["volume","Espaço visual ocupado pelo formato tridimensional da roupa.","O volume das mangas contrasta com a cintura ajustada.","A aparência não permite avaliar conforto ou estrutura interna."],["modelagem","Desenho técnico e geometria das partes que constituem a roupa.","A modelagem parece ampliar o volume nas mangas.","A aparência externa não confirma o molde interno."],["arremate","Finalização de costura, borda ou acabamento de um componente.","O arremate junto à abertura lateral é visualmente discreto.","Uma imagem não avalia resistência nem durabilidade de uma costura."],["acabamento","Tratamento final dado a superfícies, bordas e costuras.","O acabamento da gola parece regular no close-up.","A avaliação completa requer inspeção de avesso e construção."],["alfaiataria","Técnica de confecção sob medida, com cortes estruturados e acabamento preciso.","A loja expõe peças de alfaiataria com lapelas marcadas.","Alfaiataria é técnica; peças industriais de estilo alfaiataria não são feitas sob medida."],["sobreposição","Uso de peças em camadas, umas sobre as outras.","A sobreposição de camisa, colete e casaco cria volume no tronco.","Descreva a ordem das camadas para o público visualizar."],["drapeado","Tecido disposto em dobras soltas e fluidas.","Um vestido de seda drapeado na lateral ocupa o centro da vitrine.","Drapeado é dobra fluida; pregas são dobras marcadas e regulares."],["oversized","Peça intencionalmente maior que o tamanho do corpo.","O casaco oversized
