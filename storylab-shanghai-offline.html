 ['Interpretar','90 s','Conclua com uma interpretação pessoal claramente identificada como tal.']
];

// Repetição espaçada: mesmo esquema da Fraseoteca (dias até a próxima revisão)
const INTERVALS=[0,1,3,7,14,30];
const MASTERED=3;       // a partir deste nível (revisão em 7+ dias) o termo conta como dominado
const QUIZ_SIZE=8;
const DAY=86400000;

// Palavras vagas detectadas mesmo sem troca específica no Atlas
const EXTRA_VAGUE=['lindo','maravilhoso','superlegal','interessante','perfeito','top','show','fantastico','espetacular'];

const view={topic:0,tab:'explore',word:'',query:'',level:0,show:false,score:3,feedback:null,quiz:null};

let api=null;

function g(){return window.STORYLAB_ATLAS_GUIDES?.[view.topic]}
function guides(){return window.STORYLAB_ATLAS_GUIDES||[]}
function key(){return view.topic+':'+view.level}
function draft(){return String(api.getStore().atlasDrafts?.[key()]||'')}
function model(){return g().model.slice(0,view.level+1).join(' ')}
function sayWords(t){return t.trim()?t.trim().split(/\s+/).length:0}
function now(){return api.now?api.now():Date.now()}
function rand(){return api.random?api.random():Math.random()}
function shuffle(list){const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function card(topic,term){return guides()[topic]?.terms.find(x=>x[0]===term)}

/* ── Domínio por termo ─────────────────────────────────────────────
   Chave "campo:termo", pois alguns termos existem em mais de um campo
   com sentidos distintos (ex.: "silhueta" em Moda e em Fotografia). */
function mastery(){
 const st=api.getStore();
 if(!st.atlasMastery||typeof st.atlasMastery!=='object'||Array.isArray(st.atlasMastery))st.atlasMastery={};
 return st.atlasMastery;
}
function mkey(topic,term){return topic+':'+term}
function record(topic,term){const r=mastery()[mkey(topic,term)];return r&&typeof r==='object'?r:null}
function status(topic,term){
 const r=record(topic,term);
 if(!r)return 'new';
 if(Number(r.next)<=now())return 'due';
 return Number(r.level)>=MASTERED?'mastered':'learning';
}
function grade(topic,term,correct){
 const before=record(topic,term)||{level:0,right:0,wrong:0};
 // Acerto sobe um nível; erro volta ao início e o termo reaparece no próximo treino
 const level=correct?Math.min(INTERVALS.length-1,(Number(before.level)||0)+1):0;
 mastery()[mkey(topic,term)]={level,right:(Number(before.right)||0)+(correct?1:0),wrong:(Number(before.wrong)||0)+(correct?0:1),last:now(),next:now()+INTERVALS[level]*DAY};
 api.save();
}
function fieldProgress(topic){
 const terms=api.D.atlas[topic].terms;
 return {mastered:terms.filter(t=>status(topic,t)==='mastered').length,due:terms.filter(t=>status(topic,t)==='due').length,total:terms.length};
}
function totals(){
 let mastered=0,due=0,total=0;
 api.D.atlas.forEach((_,i)=>{const p=fieldProgress(i);mastered+=p.mastered;due+=p.due;total+=p.total});
 return {mastered,due,total};
}

/* ── Palavras vagas → termos precisos ──────────────────────────────
   Gera flexões simples (gênero e número) para detectar "bonita",
   "grandes", "incríveis" etc. sem depender de análise semântica. */
function variants(word){
 const w=api.norm(word),out=new Set([w]);
 if(w.includes(' '))return [...out];
 if(/vel$/.test(w))out.add(w.replace(/vel$/,'veis'));
 else if(/o$/.test(w)){const b=w.slice(0,-1);['a','os','as'].forEach(s=>out.add(b+s))}
 else if(/e$/.test(w))out.add(w+'s');
 else if(/[rz]$/.test(w))out.add(w+'es');
 else if(!/s$/.test(w))out.add(w+'s');
 return [...out];
}
function vagueIndex(){
 const index=[];
 guides().forEach((field,topic)=>(field.swaps||[]).forEach(s=>{if(s.flag)index.push({word:s.vague,forms:variants(s.vague),topic,swap:s})}));
 EXTRA_VAGUE.forEach(word=>index.push({word,forms:variants(word),topic:null,swap:null}));
 return index;
}
function findVague(text){
 const t=' '+api.norm(text).replace(/[^a-z0-9\s-]/g,' ')+' ',found=new Map();
 vagueIndex().forEach(v=>{
  const matched=v.forms.filter(f=>new RegExp('\\s'+escRe(f)+'(?=\\s)').test(t));
  if(!matched.length)return;
  const hits=matched.reduce((n,f)=>n+(t.match(new RegExp('\\s'+escRe(f)+'(?=\\s)','g'))||[]).length,0);
  // Agrupa pelas formas encontradas no texto: "bonita" pode vir de "bonito" (Formas)
  // ou de "bonita" (Pessoas) — é a mesma ocorrência e deve ser contada uma vez.
  // Entre trocas equivalentes, prefere a do campo atual.
  const k=matched.sort().join('|'),prev=found.get(k);
  if(!prev||(v.topic===view.topic&&prev.topic!==view.topic))found.set(k,{...v,hits});
 });
 return [...found.values()];
}
function analyze(t){
 const words=sayWords(t), terms=g().terms.filter(x=>api.norm(t).includes(api.norm(x[0]))).map(x=>x[0]);
 const swaps=findVague(t), vague=swaps.reduce((n,s)=>n+s.hits,0);
 const tips=[];
 if(words<25)tips.push('Inclua outro detalhe verificável para dar mais substância à descrição.');
 if(terms.length===0)tips.push('Experimente um termo do campo, somente se ele corresponder ao que observou.');
 if(vague)tips.push('Substitua palavras genéricas por forma, posição, textura, luz, som ou movimento — veja as trocas sugeridas abaixo.');
 if(view.level>1&&!/compar|enquanto|diferente|ao contr.rio|mais .* que|menos .* que|por outro lado/i.test(api.norm(t)))tips.push('Nesta etapa, torne explícito o critério da comparação.');
 if(view.level===3&&!/minha impress.o|na minha|para mim|eu penso|me parece|considero/i.test(api.norm(t)))tips.push('Identifique claramente a conclusão como sua interpretação.');
 return {words,terms,vague,swaps,tips};
}

/* ── Treino de precisão ────────────────────────────────────────────
   Dois formatos de recuperação ativa, gerados dos próprios verbetes:
   definição → termo e frase com lacuna → termo. As alternativas vêm
   do MESMO campo, obrigando a distinguir vizinhos (difusa × suave). */
function gapSentence(term,example){
 const n=api.norm(term);
 if(n.includes(' '))return null;
 // Tolera flexão: "retilíneo" → "retilíneas", "liso" → "lisa"
 const stem=/[oae]$/.test(n)&&n.length>3?n.slice(0,-1):n;
 const parts=example.split(/(\s+)/);
 const hit=parts.findIndex(w=>{const nw=api.norm(w).replace(/[^a-z-]/g,'');return nw.startsWith(stem)&&nw.length-stem.length<=3});
 if(hit<0)return null;
 const trail=(parts[hit].match(/[.,;:!?”"')]+$/)||[''])[0];
 parts[hit]='_____'+trail;
 return parts.join('');
}
function buildQuestion(topic,term,pos){
 const c=card(topic,term);
 const others=shuffle(api.D.atlas[topic].terms.filter(t=>t!==term)).slice(0,3);
 const gap=gapSentence(term,c[2]);
 // Campos de conectores usam só definição: numa lacuna isolada, vários conectores caberiam
 const type=gap&&pos%2===0&&guides()[topic]?.quiz!=='definition'?'gap':'def';
 return {topic,term,type,prompt:type==='gap'?gap:c[1],options:shuffle([term,...others]),picked:null};
}
function startQuiz(scope){
 const t=now(),topics=scope==='all'?api.D.atlas.map((_,i)=>i):[view.topic],pool=[];
 topics.forEach(topic=>api.D.atlas[topic].terms.forEach(term=>{
  if(!card(topic,term))return;
  const r=record(topic,term);
  // Prioridade: revisões vencidas → termos novos → em aprendizagem → dominados
  const rank={due:0,new:1,learning:2,mastered:3}[status(topic,term)];
  pool.push({topic,term,rank,next:r?Number(r.next)||t:t,tie:rand()});
 }));
 pool.sort((a,b)=>a.rank-b.rank||a.next-b.next||a.tie-b.tie);
 view.quiz={scope,items:shuffle(pool.slice(0,QUIZ_SIZE)).map((x,i)=>buildQuestion(x.topic,x.term,i)),i:0,done:false};
}
function answer(option){
 const q=view.quiz,item=q&&q.items[q.i];
 if(!item||item.picked!==null||!item.options.includes(option))return;
 item.picked=option;
 grade(item.topic,item.term,option===item.term);
}
function nextQuestion(){
 const q=view.quiz;
 if(!q||q.items[q.i].picked===null)return;
 if(q.i<q.items.length-1)q.i++;
 else q.done=true;
}

/* ── Interface ─────────────────────────────────────────────────────── */
function button(action,label,cls='',attr=''){return '<button type="button" class="'+cls+'" data-atlas-action="'+action+'" '+attr+'>'+label+'</button>'}
const MARK={new:'',learning:'<span class="atlas14-mark learning" aria-label="Em aprendizagem">●</span>',mastered:'<span class="atlas14-mark mastered" aria-label="Dominado">✓</span>',due:'<span class="atlas14-mark due" aria-label="Revisão pendente">↻</span>'};
const LABEL={new:'Ainda não treinado',learning:'Em aprendizagem',mastered:'Dominado',due:'Revisão pendente'};
function currentCard(){
 const term=view.word&&api.D.atlas[view.topic].terms.includes(view.word)?view.word:g().terms[0][0];
 return {term,card:card(view.topic,term)};
}
function bar(value,total,label){return '<div class="atlas14-bar" role="progressbar" aria-label="'+label+'" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+value+'"><span style="width:'+(total?Math.round(value/total*100):0)+'%"></span></div>'}
function termButtons(){
 const {D,esc,norm}=api;
 if(view.query.trim()){
  const q=norm(view.query),matches=[];
  D.atlas.forEach((group,i)=>group.terms.forEach(term=>{
   if(norm([group.title,term,...(card(i,term)||[])].join(' ')).includes(q))matches.push({term,i});
  }));
  return '<div class="atlas12-list"><div class="eyebrow">'+matches.length+' RESULTADOS NO ATLAS</div><div class="atlas12-tags">'+matches.slice(0,70).map(x=>button('word',esc(x.term)+' <small>'+esc(D.atlas[x.i].title)+'</small>','atlas12-term','data-topic="'+x.i+'" data-word="'+esc(x.term)+'"')).join('')+'</div>'+(matches.length>70?'<p class="muted small">Refine sua busca para ver outros resultados.</p>':'')+'</div>';
 }
 const terms=D.atlas[view.topic].terms, selected=currentCard().term, p=fieldProgress(view.topic);
 return '<div class="atlas12-list"><div class="row" style="align-items:baseline"><div class="eyebrow">REPERTÓRIO DO CAMPO</div><span class="muted small">'+p.mastered+'/'+p.total+' dominados</span></div>'+bar(p.mastered,p.total,'Domínio do campo')+
  '<div class="atlas12-tags">'+terms.map(term=>button('word',esc(term)+MARK[status(view.topic,term)],'atlas12-term '+(selected===term?'active':''),'data-topic="'+view.topic+'" data-word="'+esc(term)+'"')).join('')+'</div>'+
  '<p class="muted small" style="margin:12px 0 0">✓ dominado · ● em aprendizagem · ↻ revisão pendente. O domínio é medido no Treino de precisão.</p></div>';
}
function swapsPanel(){
 const {esc}=api,list=g().swaps||[];
 if(!list.length)return '';
 return '<div class="panel panel-pad"><div class="eyebrow">TROQUE A PALAVRA GENÉRICA</div><p class="muted small">Palavras vagas pedem que o público confie; termos precisos mostram. Use a troca só se ela corresponder ao que você observou.</p>'+
  list.map(s=>'<div class="atlas14-swap"><div class="atlas14-swap-head"><s>'+esc(s.vague)+'</s><span aria-hidden="true">→</span>'+s.options.map(o=>button('word',esc(o),'atlas14-chip','data-topic="'+view.topic+'" data-word="'+esc(o)+'"')).join('')+'</div><p class="atlas14-weak"><span class="sr-only">Versão vaga: </span>'+esc(s.weak)+'</p><p class="atlas14-strong"><span class="sr-only">Versão precisa: </span>'+esc(s.strong)+'</p></div>').join('')+'</div>';
}
function dictionary(){
 const {esc,ico}=api,{term,card:c}=currentCard(),area=api.D.atlas[view.topic],st=status(view.topic,term),r=record(view.topic,term);
 let detail='<div class="panel panel-pad atlas12-detail"><div class="eyebrow">CONCEITO EM CONTEXTO · '+esc(area.title.toUpperCase())+'</div><h2>'+esc(term)+'</h2>';
 if(c)detail+='<p class="atlas12-definition">'+esc(c[1])+'</p><div class="atlas12-example"><div class="eyebrow">DIGA ASSIM</div><p>'+esc(c[2])+'</p></div><div class="atlas12-warning"><div class="eyebrow">PRECISÃO E CUIDADO</div><p>'+esc(c[3])+'</p></div>';
 else detail+='<p class="muted">Termo do repertório essencial. O verbete aprofundado ainda está em construção. Evite empregar uma palavra cujo significado ou aplicação não tenha confirmado.</p><div class="notice info">'+esc(area.prompt)+'</div>';
 detail+='<p class="atlas14-status '+st+'">'+MARK[st]+' '+LABEL[st]+(r?' · '+r.right+' acerto(s), '+r.wrong+' erro(s)':'')+'</p>';
 detail+='<div class="form-row">'+button('copy',ico('copy',15)+' Copiar termo','btn secondary sm')+button('train-field',ico('target',15)+' Treinar este campo','btn secondary sm')+button('practice',ico('mic',15)+' Praticar este campo','btn accent sm')+'</div></div>';

/* StoryLab Shanghai · Gravador local para práticas do Atlas.

function compatible(){

async function start(key){

}
function stop(){

function state(){

})();

function discard(){
 const s=rec.state();
 if(['recording','requesting','finishing','ready'].includes(s.kind)&&!confirm('Seu áudio será descartado ao sair deste exercício. Deseja continuar sem baixar o arquivo?'))return false;
 clear();return true;
}
function playUI(){
 const s=rec.state(),key=currentKey(),{esc,ico}=ctx;
 const busy=['requesting','finishing'].includes(s.kind);
 let html='<section class="atlas13-audio" aria-label="Prática oral gravada"><div class="eyebrow">ESTÚDIO DE VOZ · TAKE INDIVIDUAL</div><h3>Fale, escute e refine</h3><p class="muted small">Grave uma versão desta narração e ouça antes de avaliar. O áudio fica apenas nesta aba: use <strong>Baixar áudio</strong> para preservá-lo. Seu backup salva apenas o texto, a nota e o registro da prática.</p><div class="form-row atlas13-rec-controls">';
 if(s.kind==='recording')html+='<button class="btn secondary" data-atlas-audio="stop">'+ico('pause',14)+' Parar gravação</button>';
 else html+='<button class="btn accent" data-atlas-audio="start" '+(busy||!s.supported?'disabled':'')+'>'+ico('mic',14)+' '+(s.kind==='requesting'?'Solicitando permissão':s.kind==='finishing'?'Finalizando':'Gravar minha voz')+'</button>';
 html+='<span class="chip" id="atlas12-record-time">'+rec.format(s.seconds)+'</span></div>';
 if(s.kind==='recording')html+='<p class="muted small" role="status">Microfone ativo. O tempo sugerido do exercício não limita sua gravação.</p>';
 if(s.url&&s.context===key){
  const c=context(),fname='storylab-atlas-campo-'+(c.topic+1)+'-nivel-'+(c.level+1)+'.'+s.extension;
  html+='<audio class="atlas13-player" controls preload="metadata" src="'+esc(s.url)+'" aria-label="Reproduzir meu take de voz"></audio><div class="form-row"><a class="btn secondary sm" href="'+esc(s.url)+'" download="'+esc(fname)+'">'+ico('download',14)+' Baixar áudio</a><button class="btn secondary sm" data-atlas-audio="discard">Descartar take</button></div>';
 }
 if(s.error)html+='<p class="atlas13-error" role="alert">'+esc(s.error)+'</p>';
 if(!s.supported)html+='<p class="muted small">Gravação não disponível. Em geral, é preciso usar HTTPS, um navegador compatível e permitir o microfone. O exercício escrito continua funcionando.</p>';
 html+='<div class="divider"></div><div class="eyebrow">RUBRICA DE AUTOAVALIAÇÃO · 1 A 5</div><p class="muted small">1 = precisa melhorar, 5 = consistente. As notas são atribuídas por você, não por IA.</p><div class="atlas13-rubric">';
 html+=scores.map((label,i)=>'<div class="atlas13-metric"><label for="atlas13-rubric-'+i+'">'+label+'</label><select id="atlas13-rubric-'+i+'" data-atlas-rubric="'+i+'">'+[1,2,3,4,5].map(n=>'<option value="'+n+'" '+(rubric[i]===n?'selected':'')+'>'+n+' / 5</option>').join('')+'</select><p class="muted small">'+hints[i]+'</p></div>').join('');
 html+='</div></section>';
 return html;
}
atlas.render=()=>{
 const html=own();
 if(!ctx||!html.includes('id="atlas12-writing"'))return html;
 const mark='<div class="divider"></div><div class="form-row" style="align-items:end">';
 if(!html.includes(mark))return html;
 return html.replace(mark,playUI()+mark);
};
atlas.init=(api)=>{
 ctx=api;
 rec.subscribe(()=>{if(ctx)ctx.render()});
 originalInit(api);
};
document.addEventListener('click',event=>{
 const audioBtn=event.target.closest('[data-atlas-audio]');
 if(audioBtn){
  event.preventDefault();event.stopPropagation();
  const a=audioBtn.dataset.atlasAudio;
  if(a==='start'){
   if(rec.state().kind==='ready'&&!confirm('Descartar o take atual e começar outra gravação?'))return;
   void rec.start(currentKey());
  }else if(a==='stop')rec.stop();
  else if(a==='discard')rec.close();
  return;
 }
 const a=event.target.closest('[data-atlas-action]');
 if(a){
  const action=a.dataset.atlasAction,c=context();
  const changed=action==='level'&&Number(a.dataset.level)!==c.level ||
    action==='word'&&Number(a.dataset.topic)!==c.topic ||
    action==='explore' || action==='restore' || action==='voice';
  if(changed){
   if(!discard()){event.preventDefault();event.stopImmediatePropagation();return}
   rubric=[3,3,3,3];
   if(action==='restore'){
    const saved=ctx?.getStore().atlasHistory[Number(a.dataset.index)];
    if(saved&&Array.isArray(saved.rubric)&&saved.rubric.length===4)rubric=saved.rubric.map(n=>Math.min(5,Math.max(1,Number(n)||3)));
   }
  }
  if(action==='save'&&ctx){
   const st=ctx.getStore(),before=st.atlasHistory[st.atlasHistory.length-1],take=rec.state();
   const values=[...rubric],isRecorded=take.kind==='ready'&&take.context===currentKey(),duration=isRecorded?take.seconds:0;
   queueMicrotask(()=>{
    const now=st.atlasHistory[st.atlasHistory.length-1];
    if(!now||now===before)return;
    now.rubric=values;now.recorded=isRecorded;now.takeSeconds=duration;ctx.save();
   });
  }
 }
 const nav=event.target.closest('[data-action="navigate"]');
 if(nav&&nav.dataset.page&&nav.dataset.page!=='atlas'&&document.getElementById('atlas12-writing')){
  if(!discard()){event.preventDefault();event.stopImmediatePropagation()}
 }
},true);
document.addEventListener('change',event=>{
 const el=event.target;
 if(el.matches('[data-atlas-rubric]')){const idx=Number(el.dataset.atlasRubric);if(idx>=0&&idx<4)rubric[idx]=Math.min(5,Math.max(1,Number(el.value)||3))}
 if(el.matches('[data-atlas-topic]')&&Number(el.value)!==context().topic){
  if(!discard()){event.stopImmediatePropagation();ctx?.render();return}rubric=[3,3,3,3];
 }
},true);
window.addEventListener?.('pagehide',()=>clear());
window.StoryLabAtlasAudio={rubric:()=>[...rubric],clear};
})();

</script>
  <script>
/* StoryLab Shanghai · Interatividade 1.8
   Busca universal, cartões de estudo, jogo "Monte a frase", sequência e meta
   diária e atalhos de teclado. Módulo independente: recebe uma API explícita
   do app (init) e desenha suas janelas numa camada própria (#ix-root), que não
   é apagada quando o app redesenha a página. Nada é enviado para servidores. */
window.StoryLabInteract=(()=>{
'use strict';

const DAY=86400000;
const INTERVALS=[0,1,3,7,14,30];      // mesmo esquema de revisão da Fraseoteca
const GOAL_OPTIONS=[5,10,20];
const DECK_SIZE=12;
const ACTIVITY_DAYS=400;              // histórico guardado no aparelho

let api=null,root=null,lastFocus=null,celebratedOn='';
const state={overlay:null,search:{q:'',sel:0,results:[]},cards:null,tiles:null};
let index=null;

/* ── Utilidades puras (testáveis) ────────────────────────────────── */
function iso(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shiftDay(day,delta){const [y,m,d]=day.split('-').map(Number);return iso(new Date(y,m-1,d+delta))}
function shuffle(list,rand=Math.random){const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// Dias seguidos com estudo. A sequência continua viva até o fim do dia seguinte:
// quem estudou ontem e ainda não estudou hoje não perde os dias acumulados.
function streak(activity,today=iso()){
 let day=activity?.[today]>0?today:shiftDay(today,-1),n=0;
 while(activity?.[day]>0){n++;day=shiftDay(day,-1)}
 return n;
}
function lastDays(activity,n=7,today=iso()){return Array.from({length:n},(_,i)=>{const day=shiftDay(today,i-n+1);return {day,count:activity?.[day]||0}})}

// Revisão espaçada de frases: "lembrei" sobe um nível; "de novo" volta ao início
// e mantém a frase pendente para a próxima rodada.
function gradeReview(before,remembered,now=Date.now()){
 const b=before||{level:0,count:0};
 const level=remembered?Math.min(INTERVALS.length-1,(b.level||0)+1):0;
 return {level,count:(b.count||0)+1,last:now,next:now+INTERVALS[level]*DAY};
}

// Índice único de busca: páginas, disciplinas, aulas, termos do Atlas, frases e missões
const PAGES=[['home','Painel principal'],['academy','Academia'],['journey','Trilha de 12 semanas'],['phrases','Fraseoteca'],['voice','Estúdio da Voz'],['clinic','Oficina da Fala'],['studio','Estúdio Narrativo'],['atlas','Atlas Descritivo'],['field','Campo Shanghai'],['progress','Minha Evolução']];
const TYPE={page:'Página',course:'Disciplina',lesson:'Aula',term:'Atlas',phrase:'Frase',mission:'Missão'};
const WEIGHT={page:6,course:5,lesson:4,term:4,mission:3,phrase:2};
function buildIndex(D,guides,norm){
 const items=[],add=(type,label,sub,body,go)=>items.push({type,label,sub,go,nl:norm(label),text:norm([label,sub,body].join(' '))});
 PAGES.forEach(([id,label])=>add('page',label,'Seção do app','',{page:id}));
 D.courses.forEach(c=>{
  const school=D.schools.find(s=>s.id===c.school);
  add('course',c.title,school?.name||'',c.description,{course:c.id});
  c.modules.forEach((m,i)=>{const deep=D.deepLessons[c.id+':'+i];add('lesson',deep?deep.title:m.title,c.title+' · Unidade '+(i+1),[m.title,deep?.intro||''].join(' '),{lesson:[c.id,i]})});
 });
 D.atlas.forEach((field,topic)=>field.terms.forEach(term=>{const card=(guides?.[topic]?.terms||[]).find(t=>t[0]===term);add('term',term,field.title,card?card[1]:'',{term:[topic,term]})}));
 const fam=Object.fromEntries(D.families.map(f=>[f.id,f.title]));
 D.phrases.forEach(p=>add('phrase',p.pt,fam[p.family]||'',[p.use,p.note||''].join(' '),{phrase:p.id}));
 D.missions.forEach(m=>add('mission',m.title,'Missão de campo',m.brief,{mission:m.id}));
 return items;
}
function search(items,query,norm,limit=30){
 const q=norm(query).trim();
 if(!q)return [];
 const tokens=q.split(/\s+/);
 const scored=[];
 for(const it of items){
  if(!tokens.every(t=>it.text.includes(t)))continue;
  let score=WEIGHT[it.type];
  if(it.nl===q)score+=200;
  else if(it.nl.startsWith(q))score+=120;
  else if(it.nl.includes(q))score+=60;
  tokens.forEach(t=>{if(new RegExp('(^|[^a-z0-9])'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(it.nl))score+=12;else if(it.nl.includes(t))score+=6});
  scored.push([score,it]);
 }
 scored.sort((a,b)=>b[0]-a[0]||a[1].label.length-b[1].label.length);
 return scored.slice(0,limit).map(x=>x[1]);
}

// "Monte a frase": palavras embaralhadas, nunca na ordem original
function makeTiles(text,rand=Math.random){
 const tokens=text.split(/\s+/).filter(Boolean);
 let order=tokens.map((_,i)=>i);
 for(let tries=0;tries<10&&order.every((v,i)=>v===i);tries++)order=shuffle(order,rand);
 if(order.every((v,i)=>v===i)&&order.length>1)order.push(order.shift());
 return {tokens,pool:order,placed:[]};
}
// Compara pelas palavras, não pelos índices: palavras repetidas podem trocar de lugar
function checkTiles(t){return t.placed.length===t.tokens.length&&t.placed.map(i=>t.tokens[i]).join(' ')===t.tokens.join(' ')}

/* ── Atividade, sequência e meta diária ─────────────────────────── */
function st(){return api.getStore()}
function activity(){const s=st();if(!s.activity||typeof s.activity!=='object'||Array.isArray(s.activity))s.activity={};return s.activity}
function goal(){const g=Number(st().dailyGoal);return GOAL_OPTIONS.includes(g)?g:10}
function today(){return activity()[iso()]||0}
function bump(n=1){
 const a=activity(),t=iso(),before=a[t]||0;
 a[t]=before+n;
 const keys=Object.keys(a).sort();
 if(keys.length>ACTIVITY_DAYS)keys.slice(0,keys.length-ACTIVITY_DAYS).forEach(k=>delete a[k]);
 api.save();
 if(before<goal()&&before+n>=goal()&&celebratedOn!==t){celebratedOn=t;celebrate()}
 refreshChips();
}
function refreshChips(){
 const chip=document.getElementById('ix-streak');
 if(chip){const n=streak(activity());chip.textContent='🔥 '+n;chip.title=n+' dia(s) seguidos de estudo · hoje: '+today()+'/'+goal()}
}
function celebrate(){
 api.toast('Meta do dia cumprida! Sequência: '+streak(activity())+' dia(s).');
 if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;
 const burst=document.createElement('div');burst.className='ix-burst';burst.setAttribute('aria-hidden','true');
 burst.innerHTML=Array.from({length:18},(_,i)=>'<i style="--a:'+(i*20)+'deg;--d:'+(60+(i%3)*25)+'px"></i>').join('');
 document.body.appendChild(burst);setTimeout(()=>burst.remove(),1100);
}

// Ações de estudo do app que contam para a meta (contadas antes do app processá-las)
const APP_STUDY={'study-phrase':1,'save-practice':1,'clinic-save':1,'clinic-mark':1};
const ATLAS_STUDY={'save':1};
function trackStudy(e){
 const b=e.target.closest?.('[data-action],[data-atlas-action]');
 if(!b||b.disabled)return;
 const s=st(),a=b.dataset.action,aa=b.dataset.atlasAction,id=b.dataset.id;
 if(a&&APP_STUDY[a])bump();
 else if(a==='complete-lesson'&&!s.completed.includes(id))bump();
 else if(a==='finish-mission'&&!s.missions.includes(id))bump();
 else if(aa&&ATLAS_STUDY[aa])bump();
 else if(aa==='quiz-answer'){const q=window.StoryLabAtlas?.quiz?.();const item=q&&q.items[q.i];if(item&&item.picked===null)bump()}
}

/* ── Trechos de interface injetados nas páginas do app ──────────── */
function topbar(){
 const n=streak(activity());
 return '<span class="chip ix-streak" id="ix-streak" title="'+n+' dia(s) seguidos de estudo · hoje: '+today()+'/'+goal()+'">🔥 '+n+'</span>';
}
function ring(value,max){
 const r=34,c=2*Math.PI*r,p=Math.min(1,value/max);
 return '<svg class="ix-ring" viewBox="0 0 80 80" role="img" aria-label="'+value+' de '+max+' atividades hoje"><circle cx="40" cy="40" r="'+r+'" class="ix-ring-bg"/><circle cx="40" cy="40" r="'+r+'" class="ix-ring-fg" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-p)).toFixed(1)+'"/><text x="40" y="45" text-anchor="middle">'+value+'/'+max+'</text></svg>';
}
function home(){
 const {esc}=api,a=activity(),n=streak(a),days=lastDays(a),max=Math.max(goal(),...days.map(d=>d.count)),g=goal(),t=today();
 const week=new Intl.DateTimeFormat('pt-BR',{weekday:'short'});
 return '<section class="panel panel-pad ix-daily"><div class="ix-daily-ring">'+ring(t,g)+'</div><div class="ix-daily-body"><div class="eyebrow">META DO DIA · SEQUÊNCIA DE ESTUDO</div><h2>'+(t>=g?'Meta cumprida hoje.':'Faltam '+(g-t)+' atividade(s) para a meta de hoje.')+'</h2><p class="muted">🔥 '+n+' dia(s) seguidos. Contam: aulas concluídas, frases estudadas, cartões, “Monte a frase”, treino e prática do Atlas, missões e práticas de voz.</p>'+
  '<div class="ix-week" aria-label="Atividades nos últimos 7 dias">'+days.map(d=>{const [y,m,dd]=d.day.split('-').map(Number);return '<div class="ix-week-col" title="'+d.count+' atividade(s)"><span style="height:'+Math.max(4,Math.round(d.count/max*44))+'px" class="'+(d.count>=g?'full':d.count?'some':'')+'"></span><small>'+esc(week.format(new Date(y,m-1,dd)).replace('.',''))+'</small></div>'}).join('')+'</div>'+
  '<div class="form-row ix-daily-actions"><button class="btn accent sm" data-ix="cards">Cartões de frases</button><button class="btn secondary sm" data-ix="tiles">Monte a frase</button><button class="btn secondary sm" data-ix="search">Buscar · Ctrl K</button><label class="ix-goal">Meta diária <select data-ix-goal="1">'+GOAL_OPTIONS.map(o=>'<option value="'+o+'"'+(o===g?' selected':'')+'>'+o+'</option>').join('')+'</select></label></div></div></section>';
}
function phraseActions(){return '<div class="form-row ix-phrase-actions"><button class="btn accent sm" data-ix="cards">'+api.ico('spark',14)+' Estudar em cartões</button><button class="btn secondary sm" data-ix="tiles">'+api.ico('shuffle',14)+' Monte a frase</button></div>'}

/* ── Camada de janelas ──────────────────────────────────────────── */
function ensureRoot(){
 if(root&&root.isConnected)return root;
 root=document.createElement('div');root.id='ix-root';document.body.appendChild(root);
 return root;
}
function open(kind){
 if(!state.overlay)lastFocus=document.activeElement;
 state.overlay=kind;draw();
}
function close(){
 state.overlay=null;state.cards=null;state.tiles=null;
 if(root)root.innerHTML='';
 document.documentElement.classList.remove('ix-locked');
 api.render();
 refreshChips();
 lastFocus?.focus?.();
}
function frame(title,body,label){
 return '<div class="ix-backdrop" data-ix="close"></div><div class="ix-dialog ix-'+state.overlay+'" role="dialog" aria-modal="true" aria-label="'+label+'"><div class="ix-dialog-head"><strong>'+title+'</strong><button class="icon-btn" data-ix="close" aria-label="Fechar (Esc)">'+api.ico('close',16)+'</button></div>'+body+'</div>';
}
function draw(){
 const r=ensureRoot();
 document.documentElement.classList.add('ix-locked');
 if(state.overlay==='search')r.innerHTML=frame('Buscar em todo o StoryLab',searchBody(),'Busca universal');
 else if(state.overlay==='cards')r.innerHTML=frame('Cartões de estudo',cardsBody(),'Cartões de estudo');
 else if(state.overlay==='tiles')r.innerHTML=frame('Monte a frase',tilesBody(),'Jogo Monte a frase');
 else if(state.overlay==='help')r.innerHTML=frame('Atalhos de teclado',helpBody(),'Atalhos de teclado');
 const focus=r.querySelector('[data-ix-autofocus]');
 if(focus)focus.focus();
}

/* ── Busca universal ────────────────────────────────────────────── */
function openSearch(){
 if(!index)index=buildIndex(api.D,window.STORYLAB_ATLAS_GUIDES,api.norm);
 state.search={q:'',sel:0,results:[]};open('search');
}
function searchBody(){return '<div class="ix-search"><input class="search" type="search" data-ix-search="1" data-ix-autofocus placeholder="Aulas, termos do Atlas, frases, missões..." value="'+api.esc(state.search.q)+'" aria-label="Buscar" autocomplete="off"><div class="ix-results" id="ix-results" role="listbox">'+resultsHtml()+'</div><p class="muted small ix-hint">↑ ↓ para navegar · Enter para abrir · Esc para fechar</p></div>'}
function resultsHtml(){
 const {esc}=api,s=state.search;
 if(!s.q.trim())return '<p class="muted ix-empty">Comece a digitar. Experimente: <em>incidir</em>, <em>lead de cena</em>, <em>penumbra</em>, <em>entrevista</em>.</p>';
 if(!s.results.length)return '<p class="muted ix-empty">Nada encontrado para “'+esc(s.q)+'”.</p>';
 return s.results.map((it,i)=>'<button type="button" class="ix-result'+(i===s.sel?' active':'')+'" role="option" aria-selected="'+(i===s.sel)+'" data-ix="go" data-index="'+i+'"><span class="ix-type ix-type-'+it.type+'">'+TYPE[it.type]+'</span><span class="ix-result-text"><strong>'+esc(it.label)+'</strong><small>'+esc(it.sub)+'</small></span></button>').join('');
}
function updateResults(){
 const box=document.getElementById('ix-results');if(!box)return;
 box.innerHTML=resultsHtml();
 box.querySelector('.ix-result.active')?.scrollIntoView?.({block:'nearest'});
}
function go(it){
 const g=it.go,s=st();
 state.overlay=null;if(root)root.innerHTML='';document.documentElement.classList.remove('ix-locked');
 if(g.page)api.navigate(g.page);
 else if(g.course)api.navigate('course',{courseId:g.course});
 else if(g.lesson){s.lastLesson=g.lesson[0]+':'+g.lesson[1];api.save();api.navigate('lesson',{courseId:g.lesson[0],module:g.lesson[1]})}
 else if(g.term)window.StoryLabAtlas?.open?.(g.term[0],g.term[1]);
 else if(g.mission)api.navigate('mission',{missionId:g.mission});
 else if(g.phrase){
  const p=api.D.phrases.find(x=>x.id===g.phrase);
  api.navigate('phrases',{phraseFamily:p.family,phraseQuery:'',phraseView:'all',phraseLang:'pt',expandedPhrase:p.id,phraseLimit:300});
  requestAnimationFrame(()=>{const card=document.querySelector('[data-action="expand-phrase"][data-id="'+p.id+'"]')?.closest('.phrase-card');if(card){card.scrollIntoView({block:'center'});card.classList.add('ix-flash')}});
 }
}

/* ── Cartões de estudo (Fraseoteca) ─────────────────────────────── */
function buildDeck(){
 const s=st(),ui=api.ui,now=Date.now();
 let pool=api.D.phrases.filter(p=>(ui.phraseFamily==='all'||p.family===ui.phraseFamily)&&(ui.phraseView!=='favorites'||s.favorites.includes(p.id)));
 if(!pool.length)pool=api.D.phrases;
 const dueP=pool.filter(p=>s.reviews[p.id]&&s.reviews[p.id].next<=now);
 const fresh=pool.filter(p=>!s.reviews[p.id]);
 const rest=pool.filter(p=>s.reviews[p.id]&&s.reviews[p.id].next>now);
 return [...shuffle(dueP),...shuffle(fresh),...shuffle(rest)].slice(0,DECK_SIZE).map(p=>p.id);
}
function openCards(){state.cards={deck:buildDeck(),i:0,flipped:false,right:0,again:0};open('cards')}
function cardsBody(){
 const {esc,D}=api,c=state.cards;
 if(!c.deck.length)return '<p class="muted">Não há frases para estudar com o filtro atual.</p>';
 if(c.i>=c.deck.length)return '<div class="ix-done"><h3>Rodada concluída</h3><p class="muted">'+c.right+' lembrada(s) · '+c.again+' para rever. Frases marcadas “de novo” voltam na próxima rodada.</p><div class="form-row"><button class="btn accent" data-ix="cards">Nova rodada</button><button class="btn secondary" data-ix="close">Fechar</button></div></div>';
 const p=D.phrases.find(x=>x.id===c.deck[c.i]),fam=D.families.find(f=>f.id===p.family);
 const progress='<div class="ix-progress"><span style="width:'+Math.round(c.i/c.deck.length*100)+'%"></span></div><p class="muted small">Cartão '+(c.i+1)+' de '+c.deck.length+'</p>';
 const front='<div class="ix-face ix-front"><span class="chip">'+esc(fam?.title||'')+'</span><p class="ix-intent">'+esc(p.use)+'</p><p class="muted">Como você formularia esta intenção? Pense ou diga em voz alta, depois vire o cartão.</p><span class="ix-tap">Toque ou pressione Espaço para virar</span></div>';

 return progress+'<div class="ix-card'+(c.flipped?' flipped':'')+'" data-ix="flip" id="ix-card" tabindex="0"><div class="ix-card-inner">'+front+back+'</div></div>'+actions;

function gradeCard(remembered){
 const c=state.cards;if(!c||!c.flipped||c.i>=c.deck.length)return;

 s.reviews[id]=gradeReview(s.reviews[id],remembered);

// Gesto de arrastar no celular: só avalia depois de o cartão estar virado

function onPointerMove(e){if(!drag)return;const dx=e.clientX-drag.x;drag.card.style.transform='translateX('+dx+'px) rotate('+(dx/20)+'deg)';drag.dx=dx}
function onPointerUp(){if(!drag)return;const {dx=0,card}=drag;drag=null;card.style.transform='';if(Math.abs(dx)>80){swipedAt=Date.now();gradeCard(dx>0);return true}return false}

/* ── Monte a frase ──────────────────────────────────────────────── */
function tilePool(){
 const ui=api.ui,D=api.D;
 let pool=D.phrases.filter(p=>p.note);
 if(ui.page==='phrases'&&ui.phraseFamily!=='all'){const fam=D.phrases.filter(p=>p.family===ui.phraseFamily);if(fam.length)pool=fam}
 const sized=pool.filter(p=>{const n=p.pt.split(/\s+/).length;return n>=4&&n<=16&&!p.pt.includes('…')&&!p.pt.includes('...')});
 return sized.length?sized:pool;
}
function openTiles(){
 const pool=tilePool(),prev=state.tiles?.id;
 const choices=pool.filter(p=>p.id!==prev);
 const p=(choices.length?choices:pool)[Math.floor(Math.random()*(choices.length||pool.length))];
 state.tiles={id:p.id,...makeTiles(p.pt),result:null};
 open('tiles');
}
function tilesBody(){
 const {esc,D}=api,t=state.tiles,p=D.phrases.find(x=>x.id===t.id),fam=D.families.find(f=>f.id===p.family);
 const tile=(i,where)=>'<button type="button" class="ix-tile" data-ix="'+where+'" data-i="'+i+'"'+(t.result?' disabled':'')+'>'+esc(t.tokens[i])+'</button>';
 let html='<p class="muted">Toque nas palavras na ordem certa para reconstruir a frase.</p><p class="ix-hint-line"><span class="chip">'+esc(fam?.title||'')+'</span> <strong>Intenção:</strong> '+esc(p.use)+'</p>'+
  '<div class="ix-answer" aria-label="Sua frase">'+(t.placed.length?t.placed.map(i=>tile(i,'unplace')).join(''):'<span class="muted small">Sua frase aparece aqui.</span>')+'</div>'+
  '<div class="ix-pool" aria-label="Palavras disponíveis">'+t.pool.map(i=>tile(i,'place')).join('')+'</div>';
 if(t.result===null)html+='<div class="form-row"><button class="btn accent" data-ix="check"'+(t.placed.length<t.tokens.length?' disabled':'')+'>Verificar</button><button class="btn secondary" data-ix="tiles-reset">Recomeçar</button><button class="btn secondary" data-ix="tiles">Outra frase</button></div>';
 else html+='<div class="ix-result-box '+(t.result?'ok':'no')+'" role="status"><strong>'+(t.result?'Exato!':'Quase. A frase original é:')+'</strong>'+(t.result?'':'<p class="ix-phrase">'+esc(p.pt)+'</p>')+(p.note?'<p class="small"><strong>Nota de uso:</strong> '+esc(p.note)+'</p>':'')+'</div><div class="form-row"><button class="btn accent" data-ix="tiles" data-ix-autofocus>Próxima frase</button><button class="btn secondary" data-ix="close">Fechar</button></div>';
 return html;
}

function helpBody(){

 return '<table class="ix-keys">'+rows.map(([k,d])=>'<tr><td><kbd>'+api.esc(k)+'</kbd></td><td>'+api.esc(d)+'</td></tr>').join('')+'</table>';
}

/* ── Eventos ────────────────────────────────────────────────────── */
function typing(el){return el&&(/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)||el.isContentEditable)}
function onKey(e){
 const k=e.key,mod=e.ctrlKey||e.metaKey;
 if(mod&&k.toLowerCase()==='k'){e.preventDefault();state.overlay==='search'?close():openSearch();return}
 if(state.overlay){
  if(k==='Escape'){e.preventDefault();close();return}
  if(state.overlay==='search'){
   const s=state.search;
   if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();if(s.results.length){s.sel=(s.sel+(k==='ArrowDown'?1:-1)+s.results.length)%s.results.length;updateResults()}}
   else if(k==='Enter'&&s.results[s.sel]){e.preventDefault();go(s.results[s.sel])}
   return;
  }
  if(state.overlay==='cards'&&!typing(e.target)){
   const c=state.cards;
   if((k===' '||k==='Enter')&&c&&c.i<c.deck.length&&!c.flipped){e.preventDefault();c.flipped=true;draw()}
   else if(k==='1'||k==='ArrowLeft'){e.preventDefault();gradeCard(false)}
   else if(k==='2'||k==='ArrowRight'){e.preventDefault();gradeCard(true)}
  }
  return;
 }
 if(typing(e.target))return;
 if(k==='/'){e.preventDefault();openSearch()}
 else if(k==='?'){e.preventDefault();open('help')}
}
function onClick(e){
 const b=e.target.closest?.('[data-ix]');
 if(!b)return;
 const a=b.dataset.ix;
 if(a==='flip'&&state.cards){if(drag||Date.now()-swipedAt<400)return;if(!state.cards.flipped){state.cards.flipped=true;draw()}return}
 e.preventDefault();
 if(a==='close')close();
 else if(a==='search')openSearch();
 else if(a==='help')open('help');
 else if(a==='cards')openCards();
 else if(a==='tiles')openTiles();
 else if(a==='go'){const it=state.search.results[Number(b.dataset.index)];if(it)go(it)}
 else if(a==='again')gradeCard(false);
 else if(a==='right')gradeCard(true);
 else if(a==='speak'){const id=state.cards?.deck[state.cards.i];const p=api.D.phrases.find(x=>x.id===id);if(p)api.say(p.pt)}
 else if(state.tiles&&(a==='place'||a==='unplace')){
  const t=state.tiles,i=Number(b.dataset.i);
  if(a==='place'){t.pool=t.pool.filter(x=>x!==i);t.placed.push(i)}else{t.placed=t.placed.filter(x=>x!==i);t.pool.push(i)}
  draw();
 }
 else if(a==='tiles-reset'&&state.tiles){const t=state.tiles;t.pool=[...t.pool,...t.placed];t.placed=[];draw()}
 else if(a==='check'&&state.tiles){const t=state.tiles;t.result=checkTiles(t);if(t.result)bump();draw()}
}
function onInput(e){
 if(e.target.matches?.('[data-ix-search]')){const s=state.search;s.q=e.target.value;s.results=search(index,s.q,api.norm);s.sel=0;updateResults()}
}
function onChange(e){
 if(e.target.matches?.('[data-ix-goal]')){st().dailyGoal=Number(e.target.value);api.save();api.render()}
}

function init(context){
 api=context;
 document.addEventListener('click',trackStudy,true);   // fase de captura: antes do app mudar o estado
 document.addEventListener('click',onClick);
 document.addEventListener('keydown',onKey);
 document.addEventListener('input',onInput);
 document.addEventListener('change',onChange);
 document.addEventListener('pointerdown',onPointerDown);
 document.addEventListener('pointermove',onPointerMove);
 document.addEventListener('pointerup',e=>{if(onPointerUp())e.preventDefault()});
}

return {init,topbar,home,phraseActions,openSearch,bump,
 // Funções puras expostas para os testes automatizados
 _test:{iso,shiftDay,streak,lastDays,gradeReview,buildIndex,search,makeTiles,checkTiles}};
})();

const CLINIC_SCENES=[
 ['Rua arborizada','Descrever a vegetação, a relação entre fachadas e o movimento sem inventar a história do lugar.'],
 ['Vitrine de moda','Relacionar composição, materiais e caimento sem atribuir intenções à marca sem fonte.'],
 ['Cafeteria de bairro','Transformar aroma, som, luz e ações observáveis numa cena narrável.'],
 ['Metrô de Xangai','Apresentar o percurso e suas condições sem generalizar o funcionamento de toda a rede.'],
 ['Mercado e comércio','Construir uma narrativa de consumo, preço ou atendimento com fonte e recorte claros.'],
 ['Fotografia de arquitetura','Explicar forma, escala, perspectiva e iluminação de um edifício.'],
 ['Cena noturna','Construir atmosfera com movimentos, reflexos e sons do ambiente.'],
 ['Produto de tecnologia','Explicar demonstração, resultado observado e limites de um teste pessoal.']
];
function clinicSentence(x){return String(x||'').trim().replace(/[.!?;:,\s]+$/,'').slice(0,1000)}
function composeClinic(){
 const f=ui.clinicInputs;
 const obs=clinicSentence(f.observation),det=clinicSentence(f.detail),ctx=clinicSentence(f.context),src=clinicSentence(f.source),refl=clinicSentence(f.reflection);
 if(obs.length<8||det.length<8){toast('Escreva uma observação e um detalhe concretos antes de construir.');return}
 const scene=CLINIC_SCENES[ui.clinicScene][0];
 const pieces={
  documental:[`Neste registro sobre ${scene.toLowerCase()}, ${obs.charAt(0).toLowerCase()+obs.slice(1)}.`,`Um detalhe que merece atenção: ${det.charAt(0).toLowerCase()+det.slice(1)}.`],
  espontaneo:[`Estou observando ${scene.toLowerCase()} e uma coisa me chamou a atenção: ${obs.charAt(0).toLowerCase()+obs.slice(1)}.`,`Reparem também neste detalhe: ${det.charAt(0).toLowerCase()+det.slice(1)}.`],
  didatico:[`Vamos observar ${scene.toLowerCase()} por dois aspectos. Primeiro: ${obs.charAt(0).toLowerCase()+obs.slice(1)}.`,`Segundo: ${det.charAt(0).toLowerCase()+det.slice(1)}.`],
  contemplativo:[`A cena começa por um detalhe concreto: ${obs.charAt(0).toLowerCase()+obs.slice(1)}.`,`Quando olhamos com mais atenção, percebemos outro: ${det.charAt(0).toLowerCase()+det.slice(1)}.`]
 };
 const lines=[...(pieces[f.style]||pieces.documental)];
 if(ctx){
  if(f.status==='documentado'&&src.length>=4){lines.push(`Segundo a fonte informada (${src}), ${ctx.charAt(0).toLowerCase()+ctx.slice(1)}.`)}
  else {lines.push(`Há uma informação que ainda precisa ser confirmada antes da publicação: ${ctx}.`)}
 }
 if(refl){lines.push(`Minha leitura pessoal é a seguinte: ${refl.charAt(0).toLowerCase()+refl.slice(1)}.`)}
 else lines.push('O que essa observação pode nos ensinar? É uma pergunta que vale acompanhar.');
 ui.clinicGenerated=lines.join('\n\n');
 render();
 toast('Estrutura construída. Releia e verifique antes de publicar.');
}

function builderResult(){const b=ui.builder;const a=(s)=>String(s||'').trim().replace(/[.!?…]+$/,'');let pieces=[];
 if(b.style==='poetico')pieces.push(`Há histórias que começam em pequenos detalhes.${b.place?' Hoje, estou '+a(b.place)+'.':''}`);
 else if(b.style==='espontaneo')pieces.push(`Hoje estou ${b.place?a(b.place):'explorando um ambiente'} e quero mostrar o que encontrei.`);
 else if(b.style==='didatico')pieces.push(`${b.place?'Estamos '+a(b.place)+'. ':''}Vamos observar alguns elementos desta cena e entender por que eles importam.`);
 else pieces.push(`Estamos ${b.place?a(b.place):'diante de uma cena'} que merece um olhar mais atento.`);
 if(b.observation)pieces.push(`A primeira coisa que observo é ${a(b.observation)}.`);
 if(b.detail)pieces.push(`O detalhe que merece atenção é ${a(b.detail)}.`);
 if(b.context)pieces.push(`Para compreender melhor o contexto, ainda precisamos verificar ou atribuir: ${a(b.context)}.`);
 if(b.contrast)pieces.push(`Uma comparação possível, se feita com critérios equivalentes, é ${a(b.contrast)}.`);
 if(b.reflection)pieces.push(`Minha interpretação pessoal é ${a(b.reflection)}.`);
 else pieces.push('O que esta cena nos permite concluir — e o que ainda precisamos investigar?');
 return pieces.join('\n\n')}

async function startRecording(){ui.voiceError='';if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){ui.voiceError='Gravação indisponível neste navegador. Use HTTPS ou localhost e confira a permissão do microfone.';render();return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});recChunks=[];recType=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'';recorder=new MediaRecorder(stream,recType?{mimeType:recType}:undefined);recorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(recChunks,{type:recorder?.mimeType||'audio/webm'});if(ui.recordUrl)URL.revokeObjectURL(ui.recordUrl);ui.recordUrl=URL.createObjectURL(blob);stream?.getTracks().forEach(t=>t.stop());stream=null;recorder=null;ui.recording=false;clearInterval(recTick);render();toast('Gravação pronta para ouvir ou salvar.')};recorder.start();ui.recording=true;ui.recordElapsed=0;recStart=Date.now();render();recTick=setInterval(()=>{ui.recordElapsed=Math.floor((Date.now()-recStart)/1000);let t=document.getElementById('record-timer');if(t)t.textContent=formatSecs(ui.recordElapsed);if(ui.recordElapsed>=600)stopRecording()},260)}catch(e){stream?.getTracks().forEach(t=>t.stop());stream=null;ui.voiceError='Não foi possível usar o microfone. Verifique permissão e disponibilidade do dispositivo.';render()}}
function stopRecording(){if(recorder&&recorder.state!=='inactive')recorder.stop();else{ui.recording=false;clearInterval(recTick);render()}}
function downloadBlob(content,filename,mime){const blob=content instanceof Blob?content:new Blob([content],{type:mime});let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function updateMissionCheck(id,index,value){if(!ui.missionChecks[id])ui.missionChecks[id]={};ui.missionChecks[id][index]=value;const mission=D.missions.find(m=>m.id===id);const row=document.querySelector('.checklist')?.parentElement?.querySelector('.row .small');if(row&&mission)row.textContent=`${Object.values(ui.missionChecks[id]).filter(Boolean).length} / ${mission.shots.length} itens preparados`}
function exportData(){downloadBlob(JSON.stringify({app:'StoryLab Shanghai',version:1,exportedAt:new Date().toISOString(),data:store},null,2),'storylab-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json;charset=utf-8');toast('Backup exportado. Guarde-o em local seguro.')}
async function importData(file){if(!file)return;try{if(file.size>8*1024*1024)throw Error('Arquivo grande demais.');const obj=JSON.parse(await file.text());if(obj.app!=='StoryLab Shanghai'||obj.version!==1||!obj.data||typeof obj.data!=='object')throw Error('Formato desconhecido.');if(!confirm('Isso substituirá seu progresso atual. Deseja continuar?'))return;const incoming=obj.data;store={...baseState(),...incoming,completed:Array.isArray(incoming.completed)?incoming.completed.filter(v=>typeof v==='string'):[],favorites:Array.isArray(incoming.favorites)?incoming.favorites.filter(v=>typeof v==='string'):[],missions:Array.isArray(incoming.missions)?incoming.missions.filter(v=>typeof v==='string'):[],practice:Array.isArray(incoming.practice)?incoming.practice.filter(v=>v&&Array.isArray(v.scores)).slice(-500):[],clinicDrafts:Array.isArray(incoming.clinicDrafts)?incoming.clinicDrafts.filter(v=>v&&typeof v.text==='string').slice(-60):[],clinicDone:Array.isArray(incoming.clinicDone)?incoming.clinicDone.filter(v=>typeof v==='string'):[],atlasDrafts:incoming.atlasDrafts&&typeof incoming.atlasDrafts==='object'&&!Array.isArray(incoming.atlasDrafts)?Object.fromEntries(Object.entries(incoming.atlasDrafts).filter(([k,v])=>/^\d+:\d+$/.test(k)&&typeof v==='string').slice(0,D.atlas.length*4).map(([k,v])=>[k,v.slice(0,3000)])):{},atlasHistory:Array.isArray(incoming.atlasHistory)?incoming.atlasHistory.filter(v=>v&&typeof v.text==='string'&&Number.isInteger(v.topic)&&Number.isInteger(v.level)).slice(-200).map(v=>({...v,text:v.text.slice(0,3000)})):[],reviews:incoming.reviews&&typeof incoming.reviews==='object'?incoming.reviews:{},atlasMastery:cleanMastery(incoming.atlasMastery),activity:cleanActivity(incoming.activity),dailyGoal:[5,10,20].includes(incoming.dailyGoal)?incoming.dailyGoal:10,notes:incoming.notes&&typeof incoming.notes==='object'?incoming.notes:{},theme:incoming.theme==='dark'?'dark':'light'};save();ui.showImport=false;render();toast('Backup importado com sucesso.')}catch{toast('Backup inválido ou ilegível. O progresso não foi alterado.')}}
// Event delegation: keeps controls functional even when the page is re-rendered.
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;switch(action){
 case 'navigate':navigate(b.dataset.page);break;
 case 'clinic-tab':ui.clinicTab=id;ui.clinicReveal=false;render();break;
 case 'clinic-clear':ui.clinicInputs={observation:'',detail:'',context:'',source:'',reflection:'',style:ui.clinicInputs.style,status:'pendente'};ui.clinicGenerated='';render();break;
 case 'clinic-build':composeClinic();break;
 case 'clinic-save':if(!ui.clinicGenerated)break;store.clinicDrafts.push({at:new Date().toISOString(),scene:CLINIC_SCENES[ui.clinicScene][0],sceneIndex:ui.clinicScene,style:ui.clinicInputs.style,text:ui.clinicGenerated,inputs:{...ui.clinicInputs}});store.clinicDrafts=store.clinicDrafts.slice(-60);save();render();toast('Roteiro salvo no navegador.');break;
 case 'clinic-copy':if(ui.clinicGenerated)copy(ui.clinicGenerated);break;
 case 'clinic-speak':if(ui.clinicGenerated)say(ui.clinicGenerated);break;
 case 'clinic-to-tele':if(ui.clinicGenerated){ui.teleText=ui.clinicGenerated;ui.studioTab='tele';navigate('studio')}break;
 case 'clinic-restore':{const item=store.clinicDrafts[Number(id)];if(!item)break;ui.clinicInputs={...ui.clinicInputs,...item.inputs};ui.clinicScene=item.sceneIndex??0;ui.clinicGenerated=item.text;ui.clinicTab='compose';render();break}
 case 'clinic-delete':if(!Number.isInteger(Number(id))||!store.clinicDrafts[Number(id)])break;store.clinicDrafts.splice(Number(id),1);save();render();toast('Roteiro excluído deste navegador.');break;
 case 'clinic-reveal':ui.clinicReveal=!ui.clinicReveal;render();break;
 case 'clinic-next':ui.clinicDrill=(ui.clinicDrill+1)%D.speechDrills.length;ui.clinicReveal=false;render();break;
 case 'clinic-mark':{const d=D.speechDrills[ui.clinicDrill];if(!store.clinicDone.includes(d.id))store.clinicDone.push(d.id);save();ui.clinicDrill=(ui.clinicDrill+1)%D.speechDrills.length;ui.clinicReveal=false;render();break}
 case 'clinic-read-example':say(D.speechDrills[ui.clinicDrill].strong);break;
 case 'clinic-phrase-link':navigate('phrases');break;
 case 'menu':ui.menu=!ui.menu;render();break;
 case 'theme':store.theme=store.theme==='dark'?'light':'dark';save();render();break;
 case 'school':ui.school=id;render();break;
 case 'open-course':navigate('course',{courseId:id});break;
 case 'open-lesson':store.lastLesson=id+':'+b.dataset.index;save();navigate('lesson',{courseId:id,module:Number(b.dataset.index)});break;
 case 'complete-lesson':if(!D.deepLessons[id])break;if(store.completed.includes(id))store.completed=store.completed.filter(x=>x!==id);else store.completed.push(id);save();render();toast(store.completed.includes(id)?'Aula concluída.':'Aula reaberta.');break;
 case 'phrase-lang':ui.phraseLang=id;ui.phraseLimit=30;render();break;
 case 'phrase-view':ui.phraseView=id;ui.phraseLimit=30;render();break;
 case 'more-phrases':ui.phraseLimit+=30;render();break;
 case 'expand-phrase':ui.expandedPhrase=ui.expandedPhrase===id?null:id;render();break;
 case 'toggle-fav':store.favorites=store.favorites.includes(id)?store.favorites.filter(x=>x!==id):[...store.favorites,id];save();render();break;
 case 'study-phrase':reviewPhrase(id);break;
 case 'copy-phrase':{const p=D.phrases.find(p=>p.id===id);if(p)copy(p[ui.phraseLang]||p.pt);break}
 case 'speak-phrase':{const p=D.phrases.find(p=>p.id===id);if(p)say(p[ui.phraseLang]||p.pt,{pt:'pt-BR',en:'en-US',zh:'zh-CN'}[ui.phraseLang]);break}
 case 'new-challenge':{const list=D.challenges.map((_,i)=>i).filter(i=>i!==ui.challenge);ui.challenge=list[Math.floor(Math.random()*list.length)];if(ui.recording)stopRecording();if(ui.recordUrl){URL.revokeObjectURL(ui.recordUrl);ui.recordUrl=null}render();break}
 case 'record':if(ui.recording)stopRecording();else await startRecording();break;
 case 'download-record':{if(!ui.recordUrl)break;const a=document.createElement('a');a.href=ui.recordUrl;a.download='storylab-gravacao-'+Date.now()+'.'+(recType.includes('mp4')?'mp4':'webm');document.body.append(a);a.click();a.remove();break}
 case 'remove-record':if(ui.recordUrl)URL.revokeObjectURL(ui.recordUrl);ui.recordUrl=null;render();break;
 case 'save-practice':{const ch=D.challenges[ui.challenge],note=document.getElementById('takeaway')?.value||'';store.practice.push({at:new Date().toISOString(),scene:ch.scene,mode:ch.mode,scores:[...ui.voiceRubric],note:note.slice(0,800)});save();render();toast('Sessão registrada no seu histórico.');break}
 case 'studio-tab':stopTele();ui.studioTab=id;render();break;
 case 'generate-script':ui.script=builderResult();render();toast('Narração construída a partir das suas observações.');break;
 case 'builder-clear':ui.builder={place:'',observation:'',detail:'',context:'',contrast:'',reflection:'',style:'documental'};ui.script='';render();break;
 case 'copy-script':if(ui.script)copy(ui.script);else toast('Construa uma narração primeiro.');break;
 case 'speak-script':if(ui.script)say(ui.script);else toast('Construa uma narração primeiro.');break;
 case 'script-to-tele':if(!ui.script){toast('Construa uma narração primeiro.');break}ui.teleText=ui.script;ui.studioTab='tele';render();break;
 case 'tele-toggle':ui.telePlaying=!ui.telePlaying;if(ui.telePlaying){teleLast=0;teleFrame=requestAnimationFrame(runTele)}else stopTele();{let btn=document.querySelector('[data-action="tele-toggle"]');if(btn)btn.innerHTML=`${ico(ui.telePlaying?'pause':'play')} ${ui.telePlaying?'Pausar':'Iniciar'} rolagem`}break;
 case 'tele-reset':stopTele();{let el=document.getElementById('prompter');if(el)el.scrollTop=0}render();break;
 case 'atlas-pick':ui.atlasIndex=Number(b.dataset.index);render();break;
 case 'copy-term':copy(b.dataset.value);break;
 case 'mission-area':ui.missionArea=id;render();break;
 case 'journey-phrase':ui.phraseFamily=id;ui.phraseQuery='';ui.phraseLang='pt';ui.phraseView='all';ui.phraseLimit=30;navigate('phrases');break;
 case 'open-mission':navigate('mission',{missionId:id});break;
 case 'finish-mission':if(store.missions.includes(id))store.missions=store.missions.filter(x=>x!==id);else store.missions.push(id);save();render();toast(store.missions.includes(id)?'Missão marcada como realizada.':'Missão reaberta.');break;
 case 'export-data':exportData();break;
 case 'show-import':ui.showImport=!ui.showImport;render();break;
 case 'reset-data':if(confirm('Deseja apagar TODO o progresso e as anotações deste navegador? Faça um backup antes, se quiser preservar os dados.')){store=baseState();save();render();toast('Progresso local reiniciado.')}break;
 default:break;
}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.model){const key=t.dataset.model;ui[key]=key==='teleSpeed'?Number(t.value):t.value;if(key==='courseQuery'||key==='phraseQuery'||key==='missionQuery'){render(true)}else if(key==='teleMode'||key==='teleText'){stopTele();const el=document.getElementById('prompter-inner');if(el)el.textContent=teleDisplay()}else if(key==='teleSpeed'){const x=t.parentElement?.querySelector('.field-label');if(x)x.textContent='Velocidade da rolagem · '+ui.teleSpeed}}
 if(t.dataset.clinicField){ui.clinicInputs[t.dataset.clinicField]=t.value;ui.clinicGenerated=''}
 if(t.dataset.builder){ui.builder[t.dataset.builder]=t.value}
 if(t.dataset.rubric!==undefined){const i=Number(t.dataset.rubric);ui.voiceRubric[i]=Number(t.value);let label=document.getElementById('rubric-label-'+i);if(label)label.textContent=t.value+'/5'}
 if(t.dataset.missionNotes){store.notes[t.dataset.missionNotes]=t.value.slice(0,30000);save()}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.clinicSelect){if(t.dataset.clinicSelect==='scene')ui.clinicScene=Number(t.value);else ui.clinicInputs[t.dataset.clinicSelect]=t.value;ui.clinicGenerated='';render();return}
if(t.dataset.model&&(t.tagName==='SELECT')&&['phraseFamily','teleMode'].includes(t.dataset.model)){if(t.dataset.model==='phraseFamily'){ui.phraseLimit=30;render()}else{const el=document.getElementById('prompter-inner');if(el)el.textContent=teleDisplay()}}
 if(t.dataset.missionCheck!==undefined){updateMissionCheck(t.dataset.id,Number(t.dataset.missionCheck),t.checked)}
 if(t.id==='importSave'&&t.files?.[0])importData(t.files[0]);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.menu){ui.menu=false;render()}});
window.addEventListener('online',()=>{let el=document.getElementById('offline-state');if(el)el.style.display='none'});
window.addEventListener('offline',()=>{let el=document.getElementById('offline-state');if(el)el.style.display='inline-flex'});
window.addEventListener('pagehide',()=>{if(recorder&&recorder.state!=='inactive')recorder.stop();stream?.getTracks().forEach(t=>t.stop());stopTele()});
// Atualização do PWA: o service worker entrega os arquivos do cache primeiro, então uma versão
// publicada só apareceria na visita seguinte. Quando a versão nova assume o controle desta aba,
// avisamos o estudante e ele recarrega com um toque (o progresso já está salvo no localStorage).
function registerWorker(){const sw=navigator.serviceWorker;let controlled=!!sw.controller,shown=false;sw.register('./service-worker.js').then(reg=>{document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})})}).catch(()=>{});sw.addEventListener('controllerchange',()=>{const wasControlled=controlled;controlled=true;if(!wasControlled||shown)return;shown=true;showUpdateBanner()})}
function showUpdateBanner(){const el=document.createElement('div');el.className='update-banner';el.id='update-banner';el.setAttribute('role','status');el.innerHTML='<span>Nova versão do StoryLab disponível.</span><button type="button" class="btn accent sm">Atualizar</button>';el.querySelector('button').addEventListener('click',()=>location.reload());document.body.appendChild(el)}
if('serviceWorker'in navigator&&location.protocol==='https:'||('serviceWorker'in navigator&&location.hostname==='localhost'))registerWorker();
if(window.StoryLabAtlas)window.StoryLabAtlas.init({D,getStore:()=>store,save,render,navigate,header,stat,esc,norm,ico,say,copy,toast,toTele:(text)=>{ui.teleText=text;ui.studioTab='tele';navigate('studio')}});
if(window.StoryLabInteract)window.StoryLabInteract.init({D,getStore:()=>store,ui,save,render,navigate,esc,norm,ico,toast,say});
render();
})();
