/* v1.1 — Oficina da Fala */
.clinic-tips{margin:13px 0 18px;padding-left:21px;color:var(--ink2);font-size:13px;line-height:1.85}
.clinic-tips li{padding-left:4px;margin:7px 0}
.clinic-before,.clinic-after{padding:20px;border-radius:12px;margin:15px 0}
.clinic-before{background:var(--wash);border:1px solid var(--line)}
.clinic-after{background:var(--accentsoft);border:1px solid var(--line)}
.clinic-before p,.clinic-after p{font-family:Georgia,serif;font-size:20px;line-height:1.6;margin:13px 0;color:var(--ink)}
.clinic-after .small{font-family:inherit;font-size:13px;color:var(--muted);line-height:1.7}
.clinic-saved{padding:13px 0;border-bottom:1px solid var(--line)}
.clinic-saved:last-child{border:0}
.clinic-saved strong{display:block;margin-bottom:5px}
.clinic-saved p{margin:8px 0}
.clinic-saved .form-row{gap:6px}
.clinic-saved button{font-size:11px}
@media(max-width:650px){.clinic-before p,.clinic-after p{font-size:18px}}


/* v1.2 — Atlas comentado e prática progressiva */
.atlas12-toolbar{display:grid;grid-template-columns:minmax(210px,1fr) minmax(240px,1.5fr);gap:16px;margin-bottom:20px}
.atlas12-toolbar .field-label{margin-bottom:8px}.atlas12-toolbar select,.atlas12-toolbar input{width:100%;max-width:100%}
.atlas12-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;align-items:start}
.atlas12-tags{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.atlas12-term{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 13px;text-align:left;display:inline-flex;flex-direction:column;gap:3px;align-items:start;line-height:1.35}
.atlas12-term span{color:var(--accent);font-size:10px}.atlas12-term small{color:var(--muted);font-size:10px}.atlas12-term.active,.atlas12-term:focus-visible{border-color:var(--accent);background:var(--accentsoft)}
.atlas12-list{margin-top:16px}.atlas12-detail h2,.atlas12-work h2{font-family:Georgia,serif;font-size:clamp(25px,3vw,34px);line-height:1.2;margin:15px 0}
.atlas12-definition{font-size:17px;line-height:1.7;margin-bottom:21px;color:var(--ink2)}
.atlas12-example,.atlas12-warning,.atlas12-feedback{padding:16px;border:1px solid var(--line);border-radius:12px;margin:14px 0;background:var(--wash)}

ma pergunta sobre a experiência das pessoas.","style":"natural","use":"Conectar cenas e raciocínios"},{"id":"transicao-extra-03","family":"transicao","pt":"Vamos sair da visão geral e observar uma escolha de design mais de perto.","style":"natural","use":"Conectar cenas e raciocínios"},{"id":"transicao-extra-04","family":"transicao","pt":"Até aqui falamos da aparência; a seguir, vamos examinar o funcionamento.","style":"natural","use":"Conectar cenas e raciocínios"},{"id":"transicao-extra-05","family":"transicao","pt":"Antes de continuar, vale corrigir uma impressão que tive no início do percurso.","style":"natural","use":"Conectar cenas e raciocínios"},{"id":"curiosidade-extra-01","family":"curiosidade","pt":"À primeira vista, essa diferença quase não aparece, mas muda quando nos aproximamos.","style":"natural","use":"Criar perguntas sem exagerar"},{"id":"curiosidade-extra-02","family":"curiosidade","pt":"Eu esperava encontrar uma solução simples; a visita revelou mais de uma possibilidade.","style":"natural","use":"Criar perguntas sem exagerar"},{"id":"curiosidade-extra-03","family":"curiosidade","pt":"O que acontece no próximo trecho ajuda a responder a nossa pergunta inicial.","style":"natural","use":"Criar perguntas sem exagerar"},{"id":"curiosidade-extra-04","family":"curiosidade","pt":"A parte mais interessante não é o objeto em si, e sim a maneira como ele é usado.","style":"natural","use":"Criar perguntas sem exagerar"},{"id":"curiosidade-extra-05","family":"curiosidade","pt":"Para compreender este detalhe, precisamos olhar para o outro lado da rua.","style":"natural","use":"Criar perguntas sem exagerar"},{"id":"entrevista-extra-01","family":"entrevista","pt":"Você pode descrever como é um dia comum de trabalho aqui?","style":"natural","use":"Convidar pessoas a contar experiências"},{"id":"entrevista-extra-02","family":"entrevista","pt":"Qual parte do seu processo exige mais atenção e por quê?","style":"natural","use":"Convidar pessoas a contar experiências"},{"id":"entrevista-extra-03","family":"entrevista","pt":"Quando você percebeu essa mudança pela primeira vez?","style":"natural","use":"Convidar pessoas a contar experiências"},{"id":"entrevista-extra-04","family":"entrevista","pt":"Que informação alguém de fora costuma entender errado sobre este lugar?","style":"natural","use":"Convidar pessoas a contar experiências"},{"id":"entrevista-extra-05","family":"entrevista","pt":"Existe algo que você preferiria não ter registrado em vídeo?","style":"natural","use":"Convidar pessoas a contar experiências"},{"id":"escuta-extra-01","family":"escuta","pt":"Você mencionou uma mudança; consegue situar quando ela ocorreu?","style":"natural","use":"Acompanhar respostas com precisão"},{"id":"escuta-extra-02","family":"escuta","pt":"Quando você fala em facilidade, qual etapa é a mais simples para você?","style":"natural","use":"Acompanhar respostas com precisão"},{"id":"escuta-extra-03","family":"escuta","pt":"Gostaria de voltar ao exemplo que você contou alguns minutos atrás.","style":"natural","use":"Acompanhar respostas com precisão"},{"id":"escuta-extra-04","family":"escuta","pt":"Posso confirmar se compreendi corretamente o que você quis dizer?","style":"natural","use":"Acompanhar respostas com precisão"},{"id":"escuta-extra-05","family":"escuta","pt":"Isso aconteceu uma única vez ou costuma se repetir?","style":"natural","use":"Acompanhar respostas com precisão"},{"id":"intercultural-extra-01","family":"intercultural","pt":"Não posso tomar uma única experiência como retrato de toda a sociedade.","style":"natural","use":"Compreender sem generalizar"},{"id":"intercultural-extra-02","family":"intercultural","pt":"Para evitar uma comparação apressada, vou explicar o contexto em que observei isso.","style":"natural","use":"Compreender sem generalizar"},{"id":"intercultural-extra-03","family":"intercultural","pt":"Esta expressão não tem tradução perfeitamente equivalente; vou explicar a nuance.","style":"natural","use":"Compreender sem generalizar"},{"id":"intercultural-extra-04","family":"intercultural","pt":"A minha referência brasileira influencia a maneira como interpreto esta prática.","style":"natural","use":"Compreender sem generalizar"},{"id":"intercultural-extra-05","family":"intercultural","pt":"Em vez de perguntar por que fazem diferente, quero entender como esse costume surgiu.","style":"natural","use":"Compreender sem generalizar"},{"id":"moda-extra-01","family":"moda","pt":"O acabamento visível nesta costura indica uma escolha técnica que merece aproximação.","style":"natural","use":"Descrever design, comportamento e acabamentos"},{"id":"moda-extra-02","family":"moda","pt":"A silhueta privilegia volume na parte superior e uma base mais ajustada.","style":"natural","use":"Descrever design, comportamento e acabamentos"},{"id":"moda-extra-03","family":"moda","pt":"A repetição de materiais cria continuidade entre as peças expostas.","style":"natural","use":"Descrever design, comportamento e acabamentos"},{"id":"moda-extra-04","family":"moda","pt":"Antes de chamar isso de tendência, seria preciso observar mais marcas e coleções.","style":"natural","use":"Descrever design, comportamento e acabamentos"},{"id":"moda-extra-05","family":"moda","pt":"A iluminação da vitrine interfere diretamente na percepção de cor e textura.","style":"natural","use":"Descrever design, comportamento e acabamentos"},{"id":"gastronomia-extra-01","family":"gastronomia","pt":"A primeira sensação é de crocância, seguida por uma textura mais macia no interior.","style":"natural","use":"Narrar ingredientes, textura e preparo"},{"id":"gastronomia-extra-02","family":"gastronomia","pt":"O aroma parece trazer uma nota tostada, embora eu ainda não saiba o ingrediente responsável.","style":"natural","use":"Narrar ingredientes, textura e preparo"},{"id":"gastronomia-extra-03","family":"gastronomia","pt":"A apresentação valoriza o contraste de cores entre os elementos do prato.","style":"natural","use":"Narrar ingredientes, textura e preparo"},{"id":"gastronomia-extra-04","family":"gastronomia","pt":"Vou experimentar primeiro sem molho para entender o sabor predominante.","style":"natural","use":"Narrar ingredientes, textura e preparo"},{"id":"gastronomia-extra-05","family":"gastronomia","pt":"O preparo é feito em etapas que consigo acompanhar pelo balcão.","style":"natural","use":"Narrar ingredientes, textura e preparo"},{"id":"tecnologia-extra-01","family":"tecnologia","pt":"O ganho mais perceptível neste teste foi a estabilidade do movimento.","style":"natural","use":"Explicar funções, testes e limites"},{"id":"tecnologia-extra-02","family":"tecnologia","pt":"Em vez de repetir a especificação, vou mostrar o que ela altera na gravação.","style":"natural","use":"Explicar funções, testes e limites"},{"id":"tecnologia-extra-03","family":"tecnologia","pt":"Este resultado vale para as condições de luz e distância que utilizei.","style":"natural","use":"Explicar funções, testes e limites"},{"id":"tecnologia-extra-04","family":"tecnologia","pt":"As duas opções atendem a necessidades diferentes, então vou comparar pelo uso.","style":"natural","use":"Explicar funções, testes e limites"},{"id":"tecnologia-extra-05","family":"tecnologia","pt":"Este ajuste economizou alguns passos no meu fluxo, mas ainda preciso testar a consistência.","style":"natural","use":"Explicar funções, testes e limites"},{"id":"mobilidade-extra-01","family":"mobilidade","pt":"O percurso inclui uma transferência, que precisa ser considerada no tempo total.","style":"natural","use":"Comunicar trajetos e experiência urbana"},{"id":"mobilidade-extra-02","family":"mobilidade","pt":"No meu teste, a espera na plataforma foi menor que o deslocamento até a estação.","style":"natural","use":"Comunicar trajetos e experiência urbana"},{"id":"mobilidade-extra-03","family":"mobilidade","pt":"Uma entrada aparentemente próxima nem sempre conduz ao acesso mais conveniente.","style":"natural","use":"Comunicar trajetos e experiência urbana"},{"id":"mobilidade-extra-04","family":"mobilidade","pt":"Vou registrar o trajeto completo, inclusive caminhada e tempo de espera.","style":"natural","use":"Comunicar trajetos e experiência urbana"},{"id":"mobilidade-extra-05","family":"mobilidade","pt":"A facilidade de acesso pode variar conforme bagagem, mobilidade e horário.","style":"natural","use":"Comunicar trajetos e experiência urbana"},{"id":"pessoal-extra-01","family":"pessoal","pt":"Eu imaginava encontrar outra coisa, e isso tornou a visita ainda mais interessante.","style":"natural","use":"Relatar reações com responsabilidade"},{"id":"pessoal-extra-02","family":"pessoal","pt":"Não quero transformar a minha surpresa em uma conclusão sobre quem vive aqui.","style":"natural","use":"Relatar reações com responsabilidade"},{"id":"pessoal-extra-03","family":"pessoal","pt":"Uma dificuldade que tive foi compreender a orientação das placas.","style":"natural","use":"Relatar reações com responsabilidade"},{"id":"pessoal-extra-04","family":"pessoal","pt":"Depois de algumas tentativas, percebi uma forma mais simples de realizar a tarefa.","style":"natural","use":"Relatar reações com responsabilidade"},{"id":"pessoal-extra-05","family":"pessoal","pt":"Essa experiência acrescentou uma pergunta nova ao meu roteiro de descobertas.","style":"natural","use":"Relatar reações com responsabilidade"},{"id":"argumentacao-extra-01","family":"argumentacao","pt":"A minha conclusão depende de dois critérios que posso mostrar neste vídeo.","style":"natural","use":"Organizar ideias e reconhecer limites"},{"id":"argumentacao-extra-02","family":"argumentacao","pt":"Existe um argumento contrário que merece ser levado a sério.","style":"natural","use":"Organizar ideias e reconhecer limites"},{"id":"argumentacao-extra-03","family":"argumentacao","pt":"Os exemplos ajudam a explicar o ponto, mas não substituem dados representativos.","style":"natural","use":"Organizar ideias e reconhecer limites"},{"id":"argumentacao-extra-04","family":"argumentacao","pt":"Por esse motivo, prefiro formular a recomendação como uma escolha condicionada.","style":"natural","use":"Organizar ideias e reconhecer limites"},{"id":"argumentacao-extra-05","family":"argumentacao","pt":"Com as informações disponíveis, esta é a interpretação mais prudente que consigo sustentar.","style":"natural","use":"Organizar ideias e reconhecer limites"},{"id":"direcao-extra-01","family":"direcao","pt":"Vou começar por um plano geral para mostrar onde a ação acontece.","style":"natural","use":"Indicar enquadramentos e movimentos"},{"id":"direcao-extra-02","family":"direcao","pt":"Um plano detalhe agora permite observar o acabamento que mencionei.","style":"natural","use":"Indicar enquadramentos e movimentos"},{"id":"direcao-extra-03","family":"direcao","pt":"Neste movimento lateral, quero revelar a relação entre os dois espaços.","style":"natural","use":"Indicar enquadramentos e movimentos"},{"id":"direcao-extra-04","family":"direcao","pt":"Aqui a câmera permanece parada para que o movimento venha da própria cena.","style":"natural","use":"Indicar enquadramentos e movimentos"},{"id":"direcao-extra-05","family":"direcao","pt":"Vou preservar alguns segundos de som direto antes de entrar com a narração.","style":"natural","use":"Indicar enquadramentos e movimentos"},{"id":"encerramento-extra-01","family":"encerramento","pt":"A visita respondeu à pergunta inicial, mas deixou outra investigação em aberto.","style":"natural","use":"Terminar histórias com significado"},{"id":"encerramento-extra-02","family":"encerramento","pt":"O detalhe que parecia secundário no começo acabou orientando toda a história.","style":"natural","use":"Terminar histórias com significado"},{"id":"encerramento-extra-03","family":"encerramento","pt":"No fim, o que ficou foi a diferença entre a minha expectativa e o que observei.","style":"natural","use":"Terminar histórias com significado"},{"id":"encerramento-extra-04","family":"encerramento","pt":"Esta conclusão se aplica à experiência de hoje, não a todas as situações possíveis.","style":"natural","use":"Terminar histórias com significado"},{"id":"encerramento-extra-05","family":"encerramento","pt":"Vamos encerrar com a própria cena, sem acrescentar palavras desnecessárias.","style":"natural","use":"Terminar histórias com significado"}],"deepLessons":{"comunicacao-verbal:0":{"title":"Da observação à fala clara","intro":"Comunicar bem não é apenas falar sem pausas. É escolher o que é relevante, organizar relações e convidar a outra pessoa a acompanhar o raciocínio.","steps":[{"title":"Separe fato e julgamento","body":"Comece registrando o que os sentidos permitem observar; adie adjetivos avaliativos até ter elementos que os sustentem.","example":"Em vez de “é uma rua fantástica”, experimente “as copas das árvores cobrem grande parte da calçada”."},{"title":"Suba a escada narrativa","body":"Experimente observação, descrição, sensação, espaço, contexto, comparação, interpretação, elemento humano e síntese. A ordem pode variar conforme a história.","example":"Uma rua arborizada → a luz entre as folhas → pessoas caminhando → a sensação de escala humana."},{"title":"Use uma ideia por bloco","body":"Uma estrutura simples de fala é tema → detalhe → consequência → transição. A pausa separa os blocos e melhora a compreensão.","example":"“Repare na fachada. Os elementos verticais alongam a composição. De longe, o prédio parece ainda mais alto.”"}],"assignment":"Escolha um objeto próximo, grave 45 segundos de descrição objetiva e depois 45 segundos acrescentando contexto e interpretação claramente identificada.","rubric":"Distingui observação e opinião? Usei dois detalhes concretos? Minha conclusão decorreu do que mostrei?"},"linguagem-descritiva:0":{"title":"Troque adjetivos vagos por detalhes","intro":"Palavras genéricas não são proibidas; elas se tornam insuficientes quando substituem observações que ajudariam o público a imaginar a cena.","steps":[{"title":"Descreva a forma","body":"Observe escala, proporções, linhas, curvaturas, simetria e ocupação do espaço. Nomeie primeiro o que a câmera poderia confirmar.","example":"“Uma fachada estreita, com janelas altas e linhas verticais repetidas.”"},{"title":"Descreva material e luz","body":"Considere textura, acabamento, reflexos, sombras e transições. Evite identificar materiais específicos sem segurança.","example":"“A superfície lisa reflete as luzes da rua” é mais prudente que supor o material."},{"title":"Mostre relações","body":"Descrições ficam mais ricas quando explicam onde cada elemento está e como se relaciona com os demais.","example":"“A vegetação sombreia a calçada, enquanto as vitrines iluminam a faixa junto às fachadas.”"}],"assignment":"Grave uma descrição de 60 segundos sem usar “bonito”, “legal”, “incrível” ou “coisa”. Reescreva a transcrição acrescentando cinco detalhes verificáveis.","rubric":"Nomeei formas, relações e texturas? Evitei adjetivos genéricos? Um ouvinte imaginaria a cena?"},"locucao-voz:0":{"title":"Sua voz também organiza a informação","intro":"Ritmo, pausas e ênfase criam hierarquia. Uma fala articulada não exige voz artificial nem volume excessivo.","steps":[{"title":"Respiração e preparo","body":"Relaxe ombros, respire com conforto e evite apertar a garganta. Faça breves aquecimentos leves, sem esforço ou dor.","example":"Leia uma frase curta em uma expiração natural, sem competir com o ar."},{"title":"Marque unidades de sentido","body":"Insira pausas onde termina uma ideia, e não apenas onde aparece pontuação. A voz deve ajudar a organizar o pensamento.","example":"“Nesta esquina / a arquitetura muda / e o fluxo de pessoas aumenta.”"},{"title":"Destaque uma palavra-chave","body":"A ênfase pode vir de intensidade, duração ou mudança sutil de tom. Evite ressaltar todas as palavras.","example":"Compare: “a fachada é ESTREITA” e “a FACHADA é estreita”."}],"assignment":"Grave duas versões de um parágrafo: uma neutra e outra com três pausas e duas ênfases conscientes. Compare inteligibilidade e naturalidade.","rubric":"Minha voz permaneceu confortável? As pausas facilitaram a compreensão? A ênfase teve intenção?"},"comunicacao-camera:0":{"title":"Fale para uma pessoa, não para uma lente","intro":"A câmera amplia pequenos hábitos de postura, olhar e gesto. A naturalidade surge de domínio da mensagem, não de decorar cada palavra.","steps":[{"title":"Defina a mensagem central","body":"Antes de gravar, complete a frase: “Quero que a pessoa entenda que...”. Essa decisão reduz desvios.","example":"“Quero mostrar como a arborização muda a experiência de caminhar.”"},{"title":"Use pontos de apoio","body":"Memorize três ideias, não um parágrafo inteiro. Conte cada ideia com palavras próprias.","example":"Abertura: rua; desenvolvimento: sombra e movimento; fechamento: impressão pessoal."},{"title":"Coordene corpo e quadro","body":"Olhe para a lente ao se dirigir ao público; olhe para o objeto quando for mostrá-lo. Gestos devem destacar referências, não competir com elas.","example":"Ao dizer “naquele edifício”, indique a direção com o olhar e um gesto simples."}],"assignment":"Apresente um lugar em 45 segundos, uma vez com roteiro completo e outra com três palavras-chave. Compare os dois resultados.","rubric":"Mantive a ideia central? Minha postura está confortável? Os gestos têm função?"},"improvisacao:0":{"title":"Improvisar é pensar por blocos","intro":"O bom improviso é estruturado: você não conhece antecipadamente cada frase, mas sabe como avançar entre ideias e recuperar o fio.","steps":[{"title":"Pense em blocos curtos","body":"Use quatro blocos: o que é → um detalhe → por que interessa → fechamento. Dois blocos bem desenvolvidos valem mais que dez ideias soltas.","example":"“Estou diante de uma vitrine. O contraste de materiais chama atenção. Isso cria uma leitura de...”"},{"title":"Aprenda retomadas","body":"Se perder a linha, reformule com calma: “Em outras palavras”, “O ponto central é”, “Voltando ao que observamos”.","example":"Evite fingir que não houve pausa; retome naturalmente."},{"title":"Treine restrições criativas","body":"Descreva uma cena sem um adjetivo frequente ou em um tempo menor. A restrição revela repertório e lacunas.","example":"Faça versões de 15, 30 e 60 segundos sobre o mesmo assunto."}],"assignment":"Sorteie um desafio no Estúdio da Voz, grave sem roteiro e repita tentando reduzir redundâncias sem aumentar a velocidade.","rubric":"Mantive coerência? Consegui retomar? Usei exemplos? Houve conclusão?"},"storytelling:0":{"title":"Uma história é uma mudança significativa","intro":"Uma sequência de imagens só se torna narrativa quando existe uma pergunta ou transformação que orienta a atenção.","steps":[{"title":"Identifique o eixo","body":"Defina quem ou o que acompanhamos, qual é a curiosidade e por que aquilo importa.","example":"“Quero descobrir como um artesão organiza a produção em um espaço tão pequeno.”"},{"title":"Construa progressão","body":"Use começo (situação), meio (busca/observação) e fim (descoberta ou limite da investigação). Não fabrique conflitos.","example":"Pergunta → tentativa de observar o processo → resposta do entrevistado → reflexão."},{"title":"Mostre antes de concluir","body":"Use uma cena concreta como evidência sensorial. Deixe interpretações explicitamente associadas ao narrador.","example":"Em vez de dizer “a rotina é intensa”, mostre ações e pergunte sobre a rotina."}],"assignment":"Crie a estrutura de um vídeo de um minuto: pergunta central, três cenas verificáveis e conclusão que não exagere o que foi apurado.","rubric":"Há uma pergunta clara? As cenas conduzem a descoberta? O fim respeita as evidências?"},"oratoria-retorica:0":{"title":"Um argumento não é um adjetivo forte","intro":"A credibilidade vem de afirmações precisas, razões compreensíveis, evidências adequadas e reconhecimento de limites.","steps":[{"title":"Tese definida","body":"Diga qual ideia você sustenta em uma frase, delimitando contexto e alcance.","example":"“Nesta caminhada, as calçadas arborizadas pareceram mais confortáveis para mim.”"},{"title":"Razões e exemplos","body":"Apresente dois motivos observáveis ou documentados. Exemplos ilustram; dados podem sustentar generalizações quando bem coletados.","example":"“Havia sombra contínua em boa parte do trecho e fluxo de pedestres.”"},{"title":"Objeção e limite","body":"Pergunte o que poderia enfraquecer sua interpretação. Esse exercício torna o discurso mais robusto.","example":"“Isso não comprova que a região é sempre mais confortável.”"}],"assignment":"Defenda uma opinião sobre uma experiência urbana em 90 segundos, identificando evidência, interpretação e um limite.","rubric":"Minha tese é específica? Apresentei razões? Reconheci limites?"},"semiotica:0":{"title":"A imagem também tem gramática","intro":"Formas, cores, gestos e enquadramentos comunicam por convenções e contexto. Uma leitura visual precisa ser argumentada, não presumida universal.","steps":[{"title":"Denotação","body":"Descreva o que aparece antes de interpretar.","example":"“Fundo bege, duas peças de roupa e iluminação lateral.”"},{"title":"Conotação","body":"Proponha sentidos possíveis, reconhecendo que variam entre públicos.","example":"“A paleta pode sugerir sobriedade, mas essa associação é culturalmente situada.”"},{"title":"Composição","body":"Observe escala, centro de atenção, repetição, contraste e ausência.","example":"“A luz dirige o olhar para a peça à direita.”"}],"assignment":"Escolha uma vitrine ou cartaz. Escreva cinco fatos visuais e três leituras possíveis, marcando a diferença.","rubric":"Separei aparência e interpretação? Reconheci ambiguidade? Justifiquei minhas leituras?"},"psicologia-comunicacao:0":{"title":"Atenção é um recurso limitado","intro":"Explicações longas podem perder o público por excesso de ideias simultâneas. Clareza exige selecionar e ordenar informação.","steps":[{"title":"Uma ideia por passagem","body":"Escolha a informação indispensável antes de acrescentar curiosidades.","example":"Abra com o que é; só depois explique por que importa."},{"title":"Exemplos concretos","body":"Apoie conceitos novos em cenas ou objetos observáveis sem distorcer a ideia.","example":"Ao explicar “escala humana”, mostre a relação entre pessoa e fachada."},{"title":"Recuperação e síntese","body":"Reforce uma mensagem com breve recapitulação em palavras novas, não repetição mecânica.","example":"“Ou seja, o ambiente parece menor porque podemos comparar edifícios, árvores e pedestres.”"}],"assignment":"Explique uma ideia complexa em 30 e 90 segundos; peça a alguém que repita a mensagem essencial.","rubric":"A ideia principal apareceu cedo? Cortei jargões? O exemplo ajudou?"},"comunicacao-intercultural:0":{"title":"Curiosidade sem generalização","intro":"Narrar outra sociedade exige entender que observações individuais não equivalem a explicações completas sobre uma cultura.","steps":[{"title":"Pergunte antes de interpretar","body":"Use perguntas que deixem a pessoa definir sua própria experiência.","example":"“Como você descreveria essa tradição?” em vez de “Por que os chineses sempre...?”"},{"title":"Evite afirmações totais","body":"Identifique local, período, fonte e alcance de cada observação.","example":"“Nas lojas que visitei neste bairro...” é mais preciso que “na China é assim”."},{"title":"Revise traduções","body":"Expressões podem perder nuance. Confirme com interlocutores quando a tradução for relevante para a reportagem.","example":"Ao inserir legendas, preserve hesitações e incertezas pertinentes."}],"assignment":"Planeje três perguntas para uma entrevista cultural e revise cada uma à procura de pressupostos indevidos.","rubric":"Minha pergunta abre espaço? Evitei estereótipos? Atribuí o ponto de vista a quem o expressou?"},"redacao-jornalistica:0":{"title":"Escrever para ser ouvido é diferente","intro":"Textos narrados precisam de frases respiráveis, progressão evidente e referências claras, pois o ouvinte não consegue reler instantaneamente.","steps":[{"title":"Comece pelo essencial","body":"Identifique quem, o quê, onde, quando, por quê e como, sem forçar respostas ainda desconhecidas.","example":"“Neste trecho de rua, comerciantes e pedestres dividem um espaço compacto.”"},{"title":"Prefira construções diretas","body":"Frases com sujeito e verbo próximos são mais fáceis de acompanhar do que encaixes excessivos.","example":"Troque “O local, que, desde..., passou...” por duas frases."},{"title":"Leia em voz alta","body":"Revise trechos longos e referências vagas. Respiração difícil pode indicar frase excessiva.","example":"“A empresa informou que...”. Se a informação for incerta, atribua claramente."}],"assignment":"Escreva 120 palavras sobre uma observação; corte 25% sem perder fatos e grave a leitura.","rubric":"A fonte está identificada? A ordem faz sentido? Posso ler sem tropeçar?"},"tecnicas-entrevista:0":{"title":"A boa entrevista progride por escuta","intro":"Uma lista de perguntas é só o começo. A descoberta ocorre quando o repórter ouve e identifica o que precisa ser aprofundado.","steps":[{"title":"Pesquise e prepare","body":"Defina o que você realmente precisa saber e quais perguntas abertas podem revelar experiências.","example":"“Como começou seu trabalho aqui?”"},{"title":"Escute a resposta","body":"Procure exemplos, datas, mudanças e termos ambíguos. Faça uma pergunta de acompanhamento.","example":"“Você disse que o bairro mudou. Em que sentido?”"},{"title":"Confirme e respeite","body":"Peça esclarecimento sem pressão; obtenha autorização adequada e seja transparente sobre publicação.","example":"“Posso citar essa resposta no vídeo?”"}],"assignment":"Faça uma entrevista de cinco minutos sobre uma experiência cotidiana com três perguntas preparadas e ao menos duas perguntas espontâneas.","rubric":"Evitei perguntas que sugerem resposta? Houve aprofundamento? Registrei contexto e permissão?"},"pesquisa-verificacao:0":{"title":"Sua credibilidade mora no que consegue sustentar","intro":"O exercício é manter uma trilha simples: afirmação, origem, contexto, verificação e grau de certeza.","steps":[{"title":"Liste afirmações","body":"Separe cada declaração verificável do comentário pessoal.","example":"“A loja foi inaugurada em 2018” exige fonte; “gostei do projeto” é experiência."},{"title":"Busque independência","body":"Duas reproduções do mesmo comunicado não são duas confirmações independentes.","example":"Compare documento primário e registro independente, quando disponível."},{"title":"Atribua limites","body":"Se algo não pôde ser verificado, diga isso e evite apresentar suposição como fato.","example":"“Não foi possível confirmar a data de abertura até a publicação.”"}],"assignment":"Escolha cinco afirmações para um vídeo. Registre como seriam verificadas e retire ou qualifique as que não conseguir confirmar.","rubric":"Sei de onde veio cada dado? Contextualizei data e local? Distingui testemunho de comprovação?"},"fotojornalismo:0":{"title":"Fotografia documental é escolha e responsabilidade","intro":"Posição, momento, enquadramento e legenda orientam a leitura. A foto pode registrar fatos, mas também omitir contexto.","steps":[{"title":"Escolha o momento","body":"Observe uma ação completa e registre o ponto que melhor explica o que ocorre.","example":"Pessoa esperando diante da vitrine, seguida do movimento de entrada."},{"title":"Construa sequência","body":"Use plano geral para contexto, médio para ação e detalhe para singularidade.","example":"Rua → interação humana → gesto → objeto → desfecho."},{"title":"Legende com precisão","body":"Diga apenas o que se pode sustentar sobre pessoas, tempo, local e ação. Não invente intenção.","example":"“Pessoa atravessa a rua” é observação; “pessoa volta feliz do trabalho” é suposição."}],"assignment":"Produza cinco fotos de uma rotina pública sem identificar desnecessariamente pessoas. Crie uma legenda verificável para cada foto.","rubric":"Existe começo, desenvolvimento e fim? As legendas são confiáveis? Respeitei privacidade?"},"fotografia-tecnica:0":{"title":"O obturador é uma decisão narrativa","intro":"A velocidade de exposição pode congelar, sugerir movimento ou tornar uma cena abstrata. O ajuste exige compensar luz, estabilidade e intenção.","steps":[{"title":"Congele a ação","body":"Velocidades mais altas reduzem borrão de movimento, embora dependam da luz disponível.","example":"Tente congelar um ciclista em passagem segura, sem se aproximar da via."},{"title":"Mostre movimento","body":"Velocidades baixas criam rastros; use apoio estável e avalie o brilho da cena.","example":"Uma pessoa em deslocamento pode ficar borrada contra elementos imóveis."},{"title":"Panorâmica acompanhada","body":"Acompanhe suavemente um objeto em movimento para buscar assunto mais definido e fundo com rastro.","example":"Experimente várias tomadas; a taxa de acerto pode ser baixa."}],"assignment":"Faça três fotografias do mesmo cenário usando velocidades diferentes. Anote configurações e explique o efeito visual de cada resultado.","rubric":"A exposição foi intencional? O efeito reforça a história? Fotografei em segurança?"},"linguagem-cinematografica:0":{"title":"Cada plano responde a uma pergunta","intro":"O plano geral orienta, o médio mostra relações e o detalhe direciona atenção. Movimentos de câmera só ajudam quando têm função narrativa.","steps":[{"title":"Estabeleça o espaço","body":"Mostre onde estamos antes de aproximar elementos que podem confundir o público.","example":"Plano geral de uma rua antes dos detalhes de uma cafeteria."},{"title":"Mostre ações completas","body":"Registre entrada, desenvolvimento e saída da ação, quando necessário, para facilitar montagem.","example":"Mão abre a porta → barista prepara café → xícara servida."},{"title":"Movimente com propósito","body":"Aproximar revela; afastar contextualiza; acompanhar mantém ação; contornar pode revelar relações espaciais.","example":"A câmera recua para mostrar que a pequena loja fica sob um grande edifício."}],"assignment":"Filme seis planos de uma ação simples: geral, médio, detalhe, reação, som ambiente e plano de encerramento.","rubric":"O público entende o espaço? Cada plano acrescenta algo? Os movimentos têm motivo?"},"roteiro-audiovisual:0":{"title":"Roteiro é uma hipótese visual de história","intro":"Uma boa estrutura de produção orienta o que capturar, mas precisa admitir descobertas imprevistas em campo.","steps":[{"title":"Escreva em duas colunas","body":"Associe imagem/ação a voz/som. Se ambas repetem a mesma informação, busque complementaridade.","example":"Imagem: mãos preparando chá. Voz: contexto de como o processo é aprendido."},{"title":"Defina cobertura mínima","body":"Liste plano geral, ação principal, detalhes, reação, som ambiente e transições.","example":"Cinco cenas e pelo menos três registros de áudio útil."},{"title":"Reescreva após a gravação","body":"Organize a história com o que foi realmente captado e verificado, não com cenas imaginadas.","example":"Se a entrevista contradiz a hipótese, revise a abordagem."}],"assignment":"Monte um roteiro de 60 segundos com cinco linhas de imagem e áudio. Em cada linha, explique a função narrativa.","rubric":"As imagens complementam a voz? Tenho plano de som? A conclusão decorre do material?"},"jornalismo-moda:0":{"title":"A vitrine também é uma narrativa","intro":"Cores, peças, materialidade e exposição visual comunicam escolhas. Para interpretar a intenção de uma marca, diferencie leitura própria de declaração oficial.","steps":[{"title":"Observe antes de nomear a tendência","body":"Registre itens, cores, silhuetas, repetição e iluminação sem impor rótulos de mercado imediatamente.","example":"“Três looks monocromáticos, silhuetas amplas e iluminação concentrada.”"},{"title":"Analise execução","body":"Verifique modelagem, ajuste, construção aparente e acabamento visível. Evite deduzir qualidade total sem manusear a peça.","example":"“A costura aparente funciona como elemento visual.”"},{"title":"Construa hipótese editorial","body":"Associe sinais visuais a uma proposta estética, qualificando a inferência.","example":"“A apresentação sugere uma linguagem minimalista, mas não encontrei declaração da marca.”"}],"assignment":"Escolha uma vitrine: grave descrição objetiva de 45 segundos e análise interpretativa de outros 45 segundos.","rubric":"Separei fato e hipótese? Usei linguagem técnica? Apontei ao menos três elementos visuais?"},"jornalismo-urbano:0":{"title":"Leia a cidade na escala da caminhada","intro":"Uma rua combina circulação, permanência, paisagem, comércio, acessibilidade e microexperiências; observar exige método.","steps":[{"title":"Mapeie os usos","body":"Registre o que é residencial, comercial e de convivência sem inferir quem vive ou trabalha em cada local.","example":"Comércio no térreo, entradas residenciais e bancos ao longo da calçada."},{"title":"Observe o percurso","body":"Descreva transições, pontos de sombra, travessias e barreiras; a experiência depende de horário e condições.","example":"“Neste horário, a travessia concentra pedestres nos dois lados.”"},{"title":"Inclua a escala humana","body":"Relacione edifícios, árvores, pessoas e mobiliário urbano para explicar percepção.","example":"“A largura da calçada permite a passagem de dois grupos em sentidos opostos.”"}],"assignment":"Faça um percurso curto e registre cinco mudanças de ambiente, sem filmar de modo a atrapalhar pessoas.","rubric":"Mostrei espaço e uso? Qualifiquei observações por local/horário? Incluí acessibilidade?"},"comunicacao-verbal:1":{"title":"As nove camadas em uma cena","intro":"Uma boa narração alterna função, profundidade e intenção. As nove camadas são possibilidades, não uma lista que precisa aparecer em todo vídeo.","steps":[{"title":"Camada observável","body":"Comece com o que uma câmera ou um microfone pode registrar: forma, direção, intensidade e ação. Não atribua causa antes de apurá-la.","example":"Vejo árvores nos dois lados da rua; algumas pessoas atravessam a faixa de pedestres."},{"title":"Camada de contexto","body":"Localização, origem e finalidade pedem fonte. Se não sabe por que a rua é assim, formule uma pergunta em vez de preencher a lacuna com certeza aparente.","example":"A origem desse conjunto de fachadas é algo que ainda preciso pesquisar."},{"title":"Camada de significado","body":"Interpretação e síntese são o lugar da sua voz autoral. Torne explícito que se trata de uma leitura, nunca de um fato confirmado.","example":"Para mim, a escala menor das lojas torna a caminhada mais convidativa."}],"assignment":"Grave a mesma rua em 3 versões de 30 segundos: registro factual, visita guiada e reflexão pessoal. Identifique em voz alta qual camada está usando.","rubric":"Pelo menos três detalhes verificáveis, uma pergunta de apuração e uma interpretação corretamente sinalizada."},"comunicacao-verbal:2":{"title":"Estruturas que sustentam a fluência","intro":"Fluência não significa falar sem respirar: significa oferecer ao ouvinte um caminho inteligível entre ideias.","steps":[{"title":"Estrutura tema–detalhe–efeito","body":"Abra o tópico, descreva uma evidência e explique por que ela importa. O ouvinte deve perceber claramente a progressão.","example":"Esta rua favorece a caminhada. Há sombra ao longo da calçada. Isso torna o percurso mais confortável sob o sol."},{"title":"Pontes sem redundância","body":"Escolha conectores segundo a relação lógica: contraste, consequência, sequência, ressalva. Evite iniciar toda frase com “e aí”.","example":"Além disso indica acréscimo; por outro lado indica contraste; por isso indica consequência."},{"title":"Retomada elegante","body":"Se perder uma palavra, reformule a ideia. Pausas deliberadas são melhores do que acelerar e empilhar muletas verbais.","example":"Melhor dizendo: não é a rua inteira que está vazia; é este trecho, neste horário."}],"assignment":"Descreva um ambiente por 60 segundos usando três relações diferentes: adição, contraste e consequência. Ouça e marque onde a transição ficou artificial.","rubric":"Cada conector corresponde à relação pretendida; duas pausas úteis; conclusão compreensível."},"comunicacao-verbal:3":{"title":"Síntese sem simplificação enganosa","intro":"Uma narração curta precisa escolher o essencial sem apagar as ressalvas relevantes.","steps":[{"title":"Pergunta editorial","body":"Antes de reduzir o texto, escreva qual pergunta o vídeo responde. Tudo o que não ajuda a respondê-la pode ficar fora.","example":"Pergunta: como esta praça é usada no começo do dia?"},{"title":"Três níveis de duração","body":"A versão de 15 segundos entrega a ideia central; a de 45 acrescenta evidência; a de 90 inclui contexto e limites.","example":"15 s: praça movimentada; 45 s: horários e ações observadas; 90 s: comparação cautelosa com outra visita."},{"title":"Precisão sob pressão","body":"Não troque “neste horário” por “sempre” para ganhar velocidade. Cuidado especial com números, generalizações e falas atribuídas.","example":"Observei três lojas abertas às 8h; não posso afirmar que todas abrem nesse horário."}],"assignment":"Grave versões de 15, 45 e 90 segundos sobre o mesmo local. Transcreva as três e circule detalhes essenciais preservados.","rubric":"Todas respondem à mesma pergunta; as versões curtas preservam contexto mínimo e incertezas importantes."},"oratoria-retorica:1":{"title":"Arquitetura de um argumento auditivo","intro":"Argumentar para a câmera exige tese delimitada, razões reconhecíveis e espaço para o contraponto.","steps":[{"title":"Tese proporcional","body":"Faça uma afirmação que suas observações realmente possam sustentar. A frase “na minha visita” é diferente de “na cidade inteira”.","example":"Neste trajeto, o metrô foi mais previsível do que o deslocamento de carro que testei."},{"title":"Razão e evidência","body":"Não confunda opinião com prova. A razão explica seu pensamento; a evidência verificável apoia ou enfraquece a afirmação.","example":"Razão: menos variação no tempo; evidência: os tempos registrados em três viagens."},{"title":"Contraponto honesto","body":"Antecipe a limitação mais forte da sua própria conclusão. Uma ressalva relevante aumenta credibilidade.","example":"Isso não significa que o metrô seja melhor para pessoas com mobilidade reduzida em todas as rotas."}],"assignment":"Defenda uma escolha cotidiana em até 70 segundos, com uma tese, duas razões, um dado observado e uma ressalva.","rubric":"Não há generalização indevida; razões distintas; ressalva não anula o argumento, apenas delimita."},"oratoria-retorica:2":{"title":"Ethos, logos e pathos sem manipulação","intro":"A retórica organiza confiança, explicação e atenção emocional. Jornalismo exige que esses recursos não distorçam evidências.","steps":[{"title":"Ethos: transparência","body":"Mostre de onde você fala, o que sabe e o que ainda não verificou. Não finja especialização.","example":"Visitei este espaço duas vezes; não entrevistei moradores, então minha leitura é parcial."},{"title":"Logos: encadeamento","body":"Organize relações que possam ser acompanhadas pelo público. Números sem base e causalidades presumidas enfraquecem a explicação.","example":"A contagem aumentou neste período; não sabemos ainda se isso reflete uma tendência duradoura."},{"title":"Pathos: humanidade sem exploração","body":"A emoção aproxima o espectador; jamais substitui consentimento, contexto ou dignidade de quem é filmado.","example":"Uma história pessoal pode ilustrar a rotina, mas não representa automaticamente todo um bairro."}],"assignment":"Reescreva uma narração excessivamente dramática em três parágrafos: transparência, evidência e significado humano.","rubric":"Credibilidade explícita, lógica verificável e emoção sem exagero."},"oratoria-retorica:3":{"title":"Explicar e persuadir com integridade","intro":"Um bom comunicador ajuda a audiência a compreender uma escolha sem ocultar alternativas ou limites.","steps":[{"title":"Prepare o contrato com o público","body":"Diga o que será explicado, para quem e com qual recorte. Uma promessa específica orienta as próximas cenas.","example":"Vou mostrar três critérios que usei para escolher uma câmera de viagem."},{"title":"Trabalhe objeções concretas","body":"Compare critérios que realmente mudariam a decisão. Não crie adversários fictícios para derrotá-los.","example":"Para quem grava à noite, o desempenho em baixa luz pode importar mais do que o zoom."},{"title":"Termine com escolha condicionada","body":"Uma recomendação responsável depende de necessidades, condições e incertezas. Evite conclusões universais.","example":"Se a prioridade é portabilidade, eu escolheria A; para telefoto, avaliaria B."}],"assignment":"Grave um guia de decisão de 90 segundos, informando critérios, trade-offs e para quem a conclusão se aplica.","rubric":"O público consegue repetir critérios; contrapontos foram apresentados; não há promessas infundadas."},"locucao-voz:1":{"title":"Dicção e articulação inteligível","intro":"Uma dicção clara depende de articulação coordenada, não de pronunciar todas as sílabas artificialmente.","steps":[{"title":"Ataque limpo","body":"Comece a frase sem atropelar a primeira palavra. Prepare o ar e inicie após uma pausa curta.","example":"Compare “nesta esquina” dito com início precipitado versus início calmo."},{"title":"Consoantes estratégicas","body":"Preste atenção às terminações que distinguem palavras. Grave em ritmo normal, depois escute se o sentido se mantém.","example":"“três vitrines” versus “treze vitrines”: a inteligibilidade importa mais que a velocidade."},{"title":"Articulação sem rigidez","body":"Solte mandíbula e lábios. Treine primeiro devagar e depois recupere ritmo natural; tensão excessiva torna a fala menos expressiva.","example":"Repetir “contraste entre estruturas” com clareza sem encenar cada consoante."}],"assignment":"Leia cinco frases informativas em três velocidades; avalie em qual delas as palavras permanecem naturais e compreensíveis.","rubric":"Ataques audíveis, consoantes decisivas preservadas e ausência de tensão perceptível."},"locucao-voz:2":{"title":"Ritmo, entonação e silêncio","intro":"A pontuação que o ouvido percebe nasce das pausas e mudanças de entonação, não apenas da vírgula no roteiro.","steps":[{"title":"Agrupe ideias pela respiração","body":"Marque barras no texto onde uma unidade de sentido termina. Não interrompa entre sujeito e verbo sem intenção expressiva.","example":"A rua está tranquila / mas o comércio começou a abrir / e a circulação deve mudar."},{"title":"Palavra de foco","body":"Escolha um único elemento principal por frase; o excesso de ênfase produz monotonia dramática.","example":"O detalhe mais interessante é a LUZ — não necessariamente a loja inteira."},{"title":"Silêncio informativo","body":"Dê tempo para o espectador examinar a imagem. Uma pausa pode ser conteúdo: mostra, não apenas afirma.","example":"Depois de “escute o ambiente”, deixe dois segundos reais de som local."}],"assignment":"Narre um trecho de 40 segundos duas vezes, primeiro sem marcações, depois com três pausas e duas palavras de foco.","rubric":"Pausas respeitam unidades de sentido; variação de ritmo ajuda a compreender; silêncio não soa como falha."},"locucao-voz:3":{"title":"Leitura expressiva para vídeo","intro":"Ler bem diante de uma câmera é interpretar uma intenção, não recitar letras sem contato com o público.","steps":[{"title":"Escreva para a voz","body":"Prefira sintaxe que caiba numa respiração e substitua construções tipicamente burocráticas por enunciados claros.","example":"Troque “no que concerne ao deslocamento” por “quando falamos de deslocamento”."},{"title":"Marcação mínima","body":"Use barras para pausa, maiúsculas pontuais para ênfase e colchetes para ação. Não exagere nos sinais.","example":"[MOSTRAR A FACHADA] É aqui / que o material revela sua textura."},{"title":"Olho na lente","body":"Divida o roteiro em unidades que possa lembrar. Fale uma ideia olhando para a lente, depois consulte a próxima.","example":"Uma frase-chave por cartão é mais manejável do que oito linhas corridas."}],"assignment":"Prepare um texto de 120 palavras com marcações de performance e grave uma versão lendo e outra apoiada só em palavras-chave.","rubric":"Voz natural, nenhuma afirmação omitida, olhar frequente para a lente."},"comunicacao-camera:1":{"title":"Gestos, postura e linguagem corporal","intro":"A postura funciona como informação contextual. O gesto deve esclarecer onde olhar, não disputar atenção com o conteúdo.","steps":[{"title":"Organize o espaço corporal","body":"Mantenha estabilidade quando o quadro exige explicação; mova-se quando o deslocamento fizer parte da história.","example":"Em um close de produto, aproxime as mãos lentamente para indicar o acabamento."},{"title":"Gesto com propósito","body":"Associe gestos a funções: apontar a referência, dimensionar uma distância, contrastar duas opções. Evite coreografar tudo.","example":"Com a mão esquerda indico a fachada antiga; com a direita, a intervenção recente."},{"title":"Coerência entre emoção e voz","body":"Expressões faciais devem acompanhar o significado. Assuntos delicados pedem presença respeitosa, não entusiasmo automático.","example":"Para falar de uma dificuldade vivida por alguém, reduza o sorriso de apresentação."}],"assignment":"Grave uma explicação de um objeto por 45 segundos em plano fixo. Faça duas versões: gestos livres e gestos com função.","rubric":"Gestos ajudam a identificar elementos, postura não impede áudio e intenção combina com tema."},"comunicacao-camera:2":{"title":"Falar sem depender do teleprompter","intro":"O objetivo do treino é internalizar a estrutura do raciocínio, não decorar o texto completo.","steps":[{"title":"Reduza o texto em camadas","body":"Leia o texto integral; transforme em cinco frases-chave; reduza a três palavras por bloco; por fim grave livremente.","example":"Roteiro: abertura → rua → textura → pessoas → síntese."},{"title":"Use âncoras visuais","body":"Associe cada ideia a algo que apareça na imagem. Isso reduz a carga de memória e fortalece a naturalidade.","example":"Ao mostrar a esquina, fale de orientação; ao aproximar da fachada, fale de material."},{"title":"Recupere-se de tropeços","body":"Se perder a linha, pare e retome do conceito mais próximo. Na edição, corte a pausa; não é preciso fingir uma tomada perfeita.","example":"“Voltando ao ponto central: a iluminação altera o modo como percebemos a vitrine.”"}],"assignment":"Grave quatro tomadas de 30 segundos, cada vez com menos apoio: roteiro, tópicos, palavras-chave e nenhum texto.","rubric":"Ideia essencial preservada, continuidade retomada após tropeços e presença visual convincente."},"comunicacao-camera:3":{"title":"Presença em movimento","intro":"Falar e caminhar exige uma logística de segurança, áudio e atenção ambiental diferente da apresentação parada.","steps":[{"title":"Escolha o ritmo do corpo","body":"Diminua o passo quando uma explicação exigir precisão. Não caminhe de costas em áreas movimentadas.","example":"Pare antes de apresentar números ou instruções que o espectador precisa entender."},{"title":"Separe fala e cobertura","body":"Se o ambiente estiver ruidoso, registre imagens de apoio e faça locução posterior, identificando quando a fala foi gravada depois.","example":"Capte dez segundos da travessia; narre a observação em um local mais silencioso."},{"title":"Use marcos espaciais","body":"Faça a progressão da história coincidir com pontos visuais. Evite “aqui” sem o público saber a que se refere.","example":"Ao cruzar a esquina, mostre a mudança de escala e diga qual elemento mudou."}],"assignment":"Produza uma sequência de três pontos: introdução parado, caminhada de dez metros e detalhe imóvel com locução.","rubric":"Deslocamento seguro, som inteligível e referência espacial inequívoca."},"linguagem-descritiva:1":{"title":"O atlas dos detalhes observáveis","intro":"A descrição rica nasce de escolhas visuais exatas: material, forma, luz, relação e movimento.","steps":[{"title":"Da categoria ao detalhe","body":"Não pare em “prédio”, “vitrine” ou “árvore”. Descreva um traço que permitiria reconhecer a cena em outra fotografia.","example":"Fachada de tijolos escuros, com janelas estreitas e molduras metálicas."},{"title":"Vocabulário com prova visual","body":"O adjetivo deve corresponder ao que pode ser visto ou justificado. “Histórico” não se prova pela aparência envelhecida.","example":"Prefira “fachada com ornamentos” a “fachada centenária” sem fonte."},{"title":"Relação entre detalhes","body":"Uma lista de características não é uma cena. Explique como uma característica altera a percepção de outra.","example":"A vitrine iluminada ganha destaque porque a calçada ao redor está em sombra."}],"assignment":"Encontre cinco elementos em uma fotografia sua: material, forma, cor, iluminação e relação espacial. Descreva todos em até 70 segundos.","rubric":"Nenhum adjetivo vazio; detalhes correspondem à imagem; há pelo menos duas relações entre elementos."},"linguagem-descritiva:2":{"title":"Vocabulário de relações espaciais","intro":"Um narrador conduz o olhar com palavras de orientação, hierarquia e distância, mantendo o público situado.","steps":[{"title":"Eixo de referência","body":"Estabeleça quem está olhando e para onde. “À direita” pode se referir à sua direita ou ao lado direito do quadro.","example":"À direita do enquadramento há uma fileira de bicicletas."},{"title":"Escala relativa","body":"Indique proporção com referência concreta em vez de estimativas arbitrárias.","example":"A porta ocupa quase toda a altura do primeiro pavimento."},{"title":"Movimento do observador","body":"Quando muda o ponto de vista, avise: por dentro, de cima, próximo, ao fundo, cruzando a rua.","example":"Deste lado, os volumes parecem compactos; do outro, percebemos o recuo das fachadas."}],"assignment":"Faça um passeio descritivo em 50 segundos por uma imagem fixa usando primeiro plano, fundo, esquerda, direita e mudança de perspectiva.","rubric":"Referências consistentes, sem ambiguidades de orientação, escala sustentada."},"linguagem-descritiva:3":{"title":"Descrição cinematográfica sem exagero","intro":"A descrição audiovisual eficiente informa o que a imagem não comunica sozinha e dá espaço para a observação silenciosa.","steps":[{"title":"Escolha o que verbalizar","body":"Se o espectador já vê uma bicicleta vermelha, a voz pode explicar por que você decidiu acompanhá-la, não apenas repetir a cor.","example":"A câmera acompanha a bicicleta até onde a rua fica mais estreita."},{"title":"Associe escala e sensação","body":"Descreva o que provoca a sensação, não apenas o sentimento que quer impor.","example":"As sombras longas tornam o corredor visualmente mais profundo."},{"title":"Economia e silêncio","body":"Deixe momentos sem fala quando som e imagem entregarem a informação. Não preencha toda pausa com adjetivos.","example":"A porta abre; ouve-se o sino; a câmera permanece na entrada por dois segundos."}],"assignment":"Monte um vídeo de cinco planos e escreva até 65 palavras de narração, incluindo um silêncio intencional.","rubric":"Imagem e voz são complementares; descrição precisa; nenhuma emoção imposta como fato."},"storytelling:1":{"title":"Progressão, expectativa e virada","intro":"Uma boa história não é uma sequência de imagens bonitas: cada cena acrescenta conhecimento ou altera a pergunta.","steps":[{"title":"Pergunta motriz","body":"Abra uma curiosidade que a reportagem possa responder, sem prometer revelações inexistentes.","example":"Por que esta rua parece tão diferente das avenidas vizinhas?"},{"title":"Progressão de descoberta","body":"Ordene as cenas em etapas reais do processo: percepção, busca, evidência, revisão e conclusão.","example":"Primeiro observo a arquitetura; depois consulto uma fonte sobre o bairro; por fim atualizo a interpretação."},{"title":"Virada honesta","body":"A surpresa pode ser uma mudança na sua hipótese. Não invente conflito para criar drama.","example":"Eu imaginava que o lugar fosse exclusivamente comercial, mas encontrei moradias no mesmo quarteirão."}],"assignment":"Crie a escaleta de seis cenas sobre uma descoberta real. Registre a pergunta de cada cena e a nova informação acrescentada.","rubric":"Cada cena muda algo; a virada é verdadeira; a resposta final corresponde às provas."},"storytelling:2":{"title":"Cenas, tempo e montagem narrativa","intro":"A montagem cria relações entre acontecimentos, mas não deve sugerir uma cronologia falsa em material documental.","steps":[{"title":"Cena versus resumo","body":"Cena mostra ação concreta no espaço e no tempo; resumo explica mudanças mais amplas. Intercale os dois.","example":"Cena: barista entrega o copo; resumo: ao longo da manhã, o movimento aumenta."},{"title":"Pontes temporais","body":"Use referências verificáveis como depois, no dia seguinte ou em outra visita; não simule continuidade inexistente.","example":"Em outra manhã, voltei à mesma rua e encontrei uma situação diferente."},{"title":"Montagem com responsabilidade","body":"Não conecte reações e falas de pessoas de modo que pareçam responder a algo que não ouviram.","example":"Intercale B-roll da vitrine com sua própria locução, sem atribuir comentários a clientes."}],"assignment":"Escreva o roteiro de um minuto com uma cena, um resumo e uma passagem de tempo explicitamente sinalizada.","rubric":"Cronologia honesta, cenas específicas e ligações de causa não inventadas."},"storytelling:3":{"title":"Encerramentos que deixam sentido","intro":"Um encerramento potente muda a forma como o público interpreta a história, sem precisar de moral genérica.","steps":[{"title":"Retorne à pergunta inicial","body":"Encerre retomando a curiosidade que motivou o vídeo e diga o que foi de fato respondido.","example":"Comecei procurando sinais de vida de bairro; encontrei três formas distintas de ocupar a calçada."},{"title":"Síntese com imagem concreta","body":"Uma observação específica ajuda mais a memória do que uma frase grandiosa que poderia servir a qualquer lugar.","example":"Quando a última mesa é recolhida, a calçada volta a ser um corredor de passagem."},{"title":"Abra uma próxima pergunta","body":"Admita o que ainda não foi investigado. Uma pergunta legítima convida a novos episódios.","example":"Ainda quero entender como os moradores percebem essa transformação."}],"assignment":"Escreva três encerramentos para a mesma reportagem: resposta direta, reflexão pessoal e pergunta em aberto.","rubric":"Coerência com as cenas; nenhum dado novo sem fonte; último plano reforça a ideia."},"improvisacao:1":{"title":"Conectores e retomadas naturais","intro":"A improvisação melhora quando o repertório oferece relações prontas, não textos inteiros a decorar.","steps":[{"title":"Acréscimo e progressão","body":"Além de acrescentar informação, conectores permitem subir um nível de abstração. Escolha os que ajudam a audiência.","example":"Primeiro o desenho da fachada; além disso, o uso das cores; juntos, esses elementos criam unidade."},{"title":"Contraste e concessão","body":"A conjunção precisa sinalizar oposição real ou restrição importante, não apenas ornamentar a frase.","example":"O corredor é amplo, mas o fluxo de pessoas reduz o espaço disponível."},{"title":"Retomada sem desculpas excessivas","body":"Perder o fio é normal. Prefira marcadores que recuperam o tópico: “o ponto é”, “voltando à cena”.","example":"O ponto principal é que a luz muda conforme caminhamos."}],"assignment":"Fale por 75 segundos sobre uma rua usando um conector de sequência, um de contraste e uma retomada intencional.","rubric":"Conectores correspondem ao raciocínio; retomada não contradiz o que veio antes; fala segue compreensível."},"improvisacao:2":{"title":"Reformular sem perder o significado","intro":"Reformulação é habilidade profissional: permite corrigir precisão, adequar público e recuperar a comunicação.","steps":[{"title":"Troca de registro","body":"Transforme uma frase coloquial em explicação técnica e vice-versa sem acrescentar fatos.","example":"“A peça cai bem” → “o caimento acompanha o corpo sem formar dobras excessivas neste ponto”."},{"title":"Autocorreção explícita","body":"Corrija números ou generalizações na própria gravação quando necessário. Uma correção clara é melhor que esconder a mudança.","example":"Eu disse “todos”; o correto é “os três estabelecimentos que observei”."},{"title":"Paráfrase acessível","body":"Explique termos novos na primeira utilização e retome a palavra técnica depois.","example":"Profundidade de campo é a faixa da imagem que aparece em foco."}],"assignment":"Reformule seis frases de um roteiro: duas mais precisas, duas mais simples, uma com ressalva e uma em outro registro.","rubric":"O significado factual se mantém e as mudanças de registro tornam o texto mais adequado."},"improvisacao:3":{"title":"Improviso em situação de rua","intro":"Na rua, a observação muda; a fala deve responder ao presente sem perder segurança, consentimento e direção narrativa.","steps":[{"title":"Ponto de entrada","body":"Comece por um detalhe que acabou de perceber. Não é preciso fingir que sabe o desfecho.","example":"Eu pretendia mostrar esta loja, mas reparem no movimento que se formou na esquina."},{"title":"Roteiro flexível","body":"Leve três âncoras: pergunta, evidência desejada e saída possível. Se a evidência não aparecer, conte isso.","example":"Pergunta: como funciona o serviço? Se não obtiver resposta, registre apenas o funcionamento visível."},{"title":"Saída responsável","body":"Saiba encerrar quando a situação se torna desconfortável, restrita ou insegura. Não transforme recusa em conflito.","example":"Não vamos gravar dentro do estabelecimento; sigo mostrando o entorno público."}],"assignment":"Faça duas tomadas de 45 segundos num ambiente seguro: uma seguindo uma pauta e outra reagindo a um detalhe inesperado.","rubric":"Improviso observa de verdade, não atribui motivos a terceiros e preserva a segurança."},"semiotica:1":{"title":"Gestos, expressão e distância social","intro":"Gestos carregam significado contextual. A interpretação varia com cultura, situação, interlocutores e intenção.","steps":[{"title":"Não leia mente pelo corpo","body":"Um gesto isolado não comprova humor, caráter ou intenção. Descreva antes de inferir.","example":"A pessoa cruza os braços; isso não prova que esteja desconfortável."},{"title":"Espaço e enquadramento","body":"A câmera altera a percepção de proximidade. Peça consentimento quando filmar alguém identificável.","example":"Um close aproxima emocionalmente, mesmo sem que haja intimidade real."},{"title":"Coerência multimodal","body":"Sua expressão, voz e enquadramento devem cooperar. A divergência pode ser intencional, mas precisa de função clara.","example":"Tom neutro e plano estável ajudam numa explicação técnica."}],"assignment":"Analise três quadros sem interpretar estados psicológicos. Depois formule hipóteses marcadas como hipóteses.","rubric":"Observação separada de inferência, consentimento respeitado e contexto identificado."},"semiotica:2":{"title":"Códigos visuais de imagem e marca","intro":"Cores, materiais e formas acionam associações culturais; elas não têm significado universal ou automático.","steps":[{"title":"Sinal versus convenção","body":"Diferencie o que é visível de sentidos atribuídos socialmente.","example":"A cor vermelha está presente; associá-la à sorte depende de contexto cultural específico."},{"title":"Marca e narrativa visual","body":"Observe repetição de formas, materiais, escala e disposição. Só atribua intenção ao designer com evidência.","example":"O padrão geométrico se repete no letreiro e na embalagem."},{"title":"Conotações concorrentes","body":"Uma estética minimalista pode sugerir sofisticação a alguns públicos e frieza a outros. Não imponha leitura única.","example":"O espaço usa poucas cores; minha impressão é de sobriedade, mas essa leitura não é universal."}],"assignment":"Escolha uma vitrine e produza um inventário de sinais observáveis, seguido de duas interpretações possíveis.","rubric":"Sinais sustentados pela imagem, interpretação condicional e ausência de estereótipos."},"semiotica:3":{"title":"Análise semiótica de uma cena urbana","intro":"Analisar comunicação visual é ligar um detalhe material a um sistema de sentidos sem confundir associação e comprovação.","steps":[{"title":"Inventário e recorte","body":"Escolha cinco sinais: placas, cores, trajetos, organização dos objetos e linguagem escrita.","example":"Há setas no piso, um aviso bilíngue e três pontos de acesso."},{"title":"Código em contexto","body":"Pergunte quem interpreta o sinal, com quais referências e em que situação. Uma placa pode ser óbvia ao morador e confusa ao visitante.","example":"Uma instrução apenas em caracteres chineses pode exigir tradução para mim."},{"title":"Narrativa de descoberta","body":"Mostre o sinal, conte sua primeira leitura, verifique a interpretação e apresente o que aprendeu.","example":"Achei que o símbolo indicava saída; conferi e descobri que orienta para outra plataforma."}],"assignment":"Produza cinco tomadas detalhando um sistema de sinalização pública e explique suas leituras e verificações.","rubric":"Apresenta contexto, distingue suposição de confirmação e preserva a interpretação original do sinal."},"psicologia-comunicacao:1":{"title":"Emoção e memória na narrativa","intro":"Informações memoráveis combinam concretude, relação humana e estrutura, sem precisar fabricar emoção.","steps":[{"title":"Imagem mental específica","body":"Palavras concretas ajudam a audiência a reconstruir uma cena. Substitua generalidades por acontecimentos.","example":"Em vez de “um movimento intenso”, diga “três entregadores aguardam diante da porta”."},{"title":"Âncora narrativa","body":"Retomar um detalhe no final ajuda o público a perceber continuidade e mudança.","example":"A bicicleta estacionada na abertura volta no fim, quando a loja fecha."},{"title":"Emoção como perspectiva","body":"Diga quando o sentimento é seu; não trate a reação do público como obrigatória.","example":"Para mim, a cena transmite tranquilidade — mas a rua também abriga trabalho intenso."}],"assignment":"Grave uma história de um minuto com uma imagem mental, um detalhe retomado e uma reflexão pessoal claramente situada.","rubric":"Há estrutura reconhecível e emoção baseada em experiência, não em insinuação sobre terceiros."},"psicologia-comunicacao:2":{"title":"Vieses, primeira impressão e enquadramento","intro":"O cérebro completa lacunas; o jornalismo exige resistir à tentação de transformar a primeira impressão em conclusão.","steps":[{"title":"Viés de confirmação","body":"Depois de formar uma hipótese, procure ativamente informações que poderiam contrariá-la.","example":"Achei a rua vazia: visitei em outro horário para testar se a impressão persistia."},{"title":"Disponibilidade e seleção","body":"Uma cena marcante não representa a frequência do fenômeno. Indique o tamanho e o limite da observação.","example":"Vi uma fila longa hoje; isso não prova que a loja vive lotada."},{"title":"Enquadramento editorial","body":"Mostre como um close e um plano geral mudam a interpretação de uma cena; nenhum deles é necessariamente a história completa.","example":"O close revela a fila; o plano aberto mostra outros guichês sem espera."}],"assignment":"Crie dois roteiros sobre o mesmo local com enquadramentos diferentes e explique o que cada um omite.","rubric":"Inferências identificadas, hipótese testável e consciência das omissões do quadro."},"psicologia-comunicacao:3":{"title":"Clareza para públicos diferentes","intro":"Explicar o mesmo fato para públicos diferentes pede mudanças de ordem, vocabulário e analogias, não mudanças arbitrárias de evidência.","steps":[{"title":"Modelo mental inicial","body":"Pergunte o que o público provavelmente já sabe; defina apenas os termos que bloqueiam compreensão.","example":"Para quem nunca usou metrô, explique catraca, transferência e plataforma antes das dicas."},{"title":"Exemplo antes do conceito","body":"Comece com um caso concreto e nomeie o princípio depois.","example":"Mostro a mão ajustando o foco; então explico profundidade de campo."},{"title":"Analogia com limite","body":"Uma comparação ajuda até o ponto em que as diferenças importam. Explicite esse limite.","example":"O roteiro é como um mapa: orienta caminhos, mas não prevê tudo que acontecerá."}],"assignment":"Explique uma técnica de filmagem a um iniciante em 45 segundos e a um colega experiente em 90 segundos.","rubric":"Os dois entendem a mesma ideia correta; jargões são definidos; analogias não enganam."},"comunicacao-intercultural:1":{"title":"Perguntas sem exotização","intro":"Cobrir outra cultura exige curiosidade genuína e perguntas que não pressuponham que uma experiência individual represente milhões de pessoas.","steps":[{"title":"Comece pela experiência da pessoa","body":"Pergunte sobre prática concreta em vez de iniciar com uma tese sobre “como os chineses são”.","example":"Como você costuma escolher onde tomar café neste bairro?"},{"title":"Evite comparação hierárquica","body":"Comparar Brasil e China pode gerar descobertas, mas “melhor” e “atrasado” sem critério são julgamentos vazios.","example":"O processo aqui é diferente do que eu usava no Brasil: vou mostrar as etapas."},{"title":"Permita a recusa","body":"Consentimento deve ser específico e contínuo. Gravar não obriga a pessoa a responder ou autorizar publicação.","example":"Prefere responder sem aparecer? Podemos não gravar, sem problema."}],"assignment":"Escreva oito perguntas de entrevista sobre um costume local e revise pressuposições culturais em cada uma.","rubric":"Perguntas abertas, nenhum estereótipo como premissa e forma de consentimento explicitada."},"comunicacao-intercultural:2":{"title":"Tradução de nuances em entrevistas","intro":"Uma palavra pode carregar relações de formalidade e cultura que uma equivalência literal não reproduz.","steps":[{"title":"Traduza sentido e registro","body":"Verifique se a expressão original é formal, íntima, técnica ou coloquial. Não invente uma tradução mais dramática.","example":"Um “talvez” educado não deve aparecer na legenda como recusa categórica."},{"title":"Diferencie sua voz da fala alheia","body":"A locução pode resumir contexto, mas nunca apresente paráfrase como citação literal.","example":"Minha síntese: ela prefere horários mais tranquilos. A fala original será legendada separadamente."},{"title":"Verificação e revisão","body":"Em entrevistas importantes, peça confirmação de nomes, unidades e passagens ambíguas; considere revisão por falante fluente.","example":"O entrevistado falou de “dez minutos” ou “dez estações”? Confirme antes de editar."}],"assignment":"Crie legendas para cinco falas curtas com versões literal e natural e anote onde há perda de nuance.","rubric":"Fidelidade ao sentido, atribuição clara e incertezas resolvidas ou sinalizadas."},"comunicacao-intercultural:3":{"title":"Escuta respeitosa e reciprocidade","intro":"Uma conversa intercultural boa não é coleta de curiosidades: é um encontro entre perspectivas com assimetria de conhecimento.","steps":[{"title":"Escute sem completar","body":"Evite terminar frases do entrevistado ou reinterpretá-las imediatamente a partir de referências próprias.","example":"Quando você diz “comunidade”, o que essa palavra significa para você neste contexto?"},{"title":"Contextualize sem reduzir","body":"Uma pessoa pode falar apenas por si. Evite generalizar a partir de roupa, idade, origem ou local de trabalho.","example":"Esta é a experiência dela; outras pessoas poderão contar versões diferentes."},{"title":"Retorno ético","body":"Explique uso do material, peça permissão e permita correções factuais relevantes sem prometer controle editorial irrestrito.","example":"Gostaria de enviar a você a tradução do seu nome e cargo para confirmar antes de publicar."}],"assignment":"Planeje uma entrevista de 5 minutos com abertura respeitosa, escuta ativa, confirmação de detalhes e encerramento claro.","rubric":"Consentimento respeitado, perguntas não indutivas e distinção entre testemunho e generalização."}},"atlas":[{"title":"Formas e geometria","terms":["retilíneo","curvilíneo","angular","arredondado","simétrico","assimétrico","verticalizado","horizontal","modular","orgânico"],"prompt":"Descreva uma cena de Xangai usando três elementos de formas e geometria e sem recorrer a adjetivos genéricos."},{"title":"Escala e proporção","terms":["monumental","compacto","amplo","estreito","alongado","baixo","esguio","imponente","discreto","proporcional"],"prompt":"Descreva uma cena de Xangai usando três elementos de escala e proporção e sem recorrer a adjetivos genéricos."},{"title":"Luz e sombra","terms":["difusa","direcional","rasante","contrastada","suave","dourada","indireta","irregular","refletida","natural"],"prompt":"Descreva uma cena de Xangai usando três elementos de luz e sombra e sem recorrer a adjetivos genéricos."},{"title":"Cores e contraste","terms":["monocromático","complementar","neutro","saturado","dessaturado","quente","frio","terroso","vibrante","gradual"],"prompt":"Descreva uma cena de Xangai usando três elementos de cores e contraste e sem recorrer a adjetivos genéricos."},{"title":"Textura e acabamento","terms":["fosco","polido","áspero","liso","granulado","poroso","acetinado","translúcido","metálico","aveludado"],"prompt":"Descreva uma cena de Xangai usando três elementos de textura e acabamento e sem recorrer a adjetivos genéricos."},{"title":"Ambiente e atmosfera","terms":["acolhedor","movimentado","contemplativo","intimista","solene","silencioso","agitado","arejado","concentrado","descontraído"],"prompt":"Descreva uma cena de Xangai usando três elementos de ambiente e atmosfera e sem recorrer a adjetivos genéricos."},{"title":"Movimentos","terms":["gradual","fluido","brusco","contínuo","intermitente","ritmado","circular","oscilante","acelerado","cadenciado"],"prompt":"Descrev
