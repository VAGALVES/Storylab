 wide shot to establish the setting.","zh":null,"pinyin":null},{"id":"direcao-02","family":"direcao","pt":"Agora a câmera se aproxima para revelar um detalhe.","style":"filmmaking","use":"Indicar enquadramentos e movimentos","en":null,"zh":null,"pinyin":null},{"id":"direcao-03","family":"direcao","pt":"Este plano médio coloca a pessoa em relação ao espaço.","style":"filmmaking","use":"Indicar enquadramentos e movimentos","en":null,"zh":null,"pinyin":null},{"id":"direcao-04","family":"direcao","pt":"Um movimento lateral ajuda a mostrar a continuidade do cenário.","style":"filmmaking","use":"Indicar enquadramentos e movimentos","en":null,"zh":null,"pinyin":null},{"id":"direcao-05","family":"direcao","pt":"A mudança de ângulo altera a percepção da escala.","style":"filmmaking","use":"Indicar enquadramentos e movimentos","en":null,"zh":null,"pinyin":null},{"id":"direcao-06","family":"direcao","pt":"O primeiro plano orienta o olhar para...","style":"filmmaking","use":"Indicar enquadramentos e movimentos","en":null,"zh":null,"pinyin":null},{"id":"direcao-07","family":"direcao","pt":"A câmera acompanha o deslocamento de...","style":"filmmaking","use":"Indicar enquadramentos e movimentos","en":null,"zh":null,"pinyin":null},{"id":"direcao-08","family":"direcao","pt":"Vale registrar alguns segundos de som ambiente.","style":"filmmaking","use":"Indicar enquadramentos e movimentos","en":null,"zh":null,"pinyin":null},{"id":"direcao-09","family":"direcao","pt":"Um plano fixo pode revelar detalhes do movimento.","style":"filmmaking","use":"Indicar enquadramentos e movimentos","en":null,"zh":null,"pinyin":null},{"id":"direcao-10","family":"direcao","pt":"O corte funciona melhor quando a ação está completa.","style":"filmmaking","use":"Indicar enquadramentos e movimentos","en":null,"zh":null,"pinyin":null},{"id":"direcao-11","family":"direcao","pt":"A narração não precisa repetir o que a imagem já mostra.","style":"filmmaking","use":"Indicar enquadramentos e movimentos","en":null,"zh":null,"pinyin":null},{"id":"direcao-12","family":"direcao","pt":"Vamos usar o silêncio para deixar a cena respirar.","style":"filmmaking","use":"Indicar enquadramentos e movimentos","en":null,"zh":null,"pinyin":null},{"id":"direcao-13","family":"direcao","pt":"Um contra-plano ajuda a mostrar a outra perspectiva.","style":"filmmaking","use":"Indicar enquadramentos e movimentos","en":null,"zh":null,"pinyin":null},{"id":"direcao-14","family":"direcao","pt":"O plano detalhe destaca textura e acabamento.","style":"filmmaking","use":"Indicar enquadramentos e movimentos","en":null,"zh":null,"pinyin":null},{"id":"direcao-15","family":"direcao","pt":"Precisamos de uma imagem de transição entre as cenas.","style":"filmmaking","use":"Indicar enquadramentos e movimentos","en":null,"zh":null,"pinyin":null},{"id":"direcao-16","family":"direcao","pt":"Uma panorâmica lenta revela a extensão de...","style":"filmmaking","use":"Indicar enquadramentos e movimentos","en":null,"zh":null,"pinyin":null},{"id":"direcao-17","family":"direcao","pt":"O movimento deve ter uma razão narrativa.","style":"filmmaking","use":"Indicar enquadramentos e movimentos","en":null,"zh":null,"pinyin":null},{"id":"direcao-18","family":"direcao","pt":"Este enquadramento nos ajuda a compreender...","style":"filmmaking","use":"Indicar enquadramentos e movimentos","en":null,"zh":null,"pinyin":null},{"id":"encerramento-01","family":"encerramento","pt":"O mais importante desta experiência foi perceber...","style":"closing","use":"Terminar histórias com significado","en":"The most important thing about this experience was realizing...","zh":null,"pinyin":null},{"id":"encerramento-02","family":"encerramento","pt":"Essa caminhada mudou minha percepção sobre...","style":"closing","use":"Terminar histórias com significado","en":null,"zh":null,"pinyin":null},{"id":"encerramento-03","family":"encerramento","pt":"No fim, a história deste lugar também fala sobre...","style":"closing","use":"Terminar histórias com significado","en":null,"zh":null,"pinyin":null},{"id":"encerramento-04","family":"encerramento","pt":"Talvez a melhor maneira de conhecer uma cidade seja...","style":"closing","use":"Terminar histórias com significado","en":null,"zh":null,"pinyin":null},{"id":"encerramento-05","family":"encerramento","pt":"A pergunta inicial nos trouxe até...","style":"closing","use":"Terminar histórias com significado","en":null,"zh":null,"pinyin":null},{"id":"encerramento-06","family":"encerramento","pt":"O que fica desta visita não é apenas uma imagem.","style":"closing","use":"Terminar histórias com significado","en":null,"zh":null,"pinyin":null},{"id":"encerramento-07","family":"encerramento","pt":"Alguns detalhes merecem ser observados novamente.","style":"closing","use":"Terminar histórias com significado","en":null,"zh":null,"pinyin":null},{"id":"encerramento-08","family":"encerramento","pt":"Esta experiência revela como o cotidiano pode ser interessante.","style":"closing","use":"Terminar histórias com significado","en":null,"zh":null,"pinyin":null},{"id":"encerramento-09","family":"encerramento","pt":"Nossa conclusão precisa respeitar os limites do que vimos.","style":"closing","use":"Terminar histórias com significado","en":null,"zh":null,"pinyin":null},{"id":"encerramento-10","family":"encerramento","pt":"A história continua para além deste vídeo.","style":"closing","use":"Terminar histórias com significado","en":null,"zh":null,"pinyin":null},{"id":"encerramento-11","family":"encerramento","pt":"A principal descoberta foi...","style":"closing","use":"Terminar histórias com significado","en":null,"zh":null,"pinyin":null},{"id":"encerramento-12","family":"encerramento","pt":"Fica uma pergunta para uma próxima visita.","style":"closing","use":"Terminar histórias com significado","en":"That leaves a question for a future visit.","zh":null,"pinyin":null},{"id":"encerramento-13","family":"encerramento","pt":"De tudo o que observamos, um aspecto se destaca.","style":"closing","use":"Terminar histórias com significado","en":null,"zh":null,"pinyin":null},{"id":"encerramento-14","family":"encerramento","pt":"Este é um pequeno retrato de uma realidade mais ampla.","style":"closing","use":"Terminar histórias com significado","en":null,"zh":null,"pinyin":null},{"id":"encerramento-15","family":"encerramento","pt":"Se tivéssemos de resumir a experiência em uma frase...","style":"closing","use":"Terminar histórias com significado","en":null,"zh":null,"pinyin":null},{"id":"encerramento-16","family":"encerramento","pt":"Há muitas outras perspectivas que ainda não conhecemos.","style":"closing","use":"Terminar histórias com significado","en":null,"zh":null,"pinyin":null},{"id":"encerramento-17","family":"encerramento","pt":"O valor desta história está nos detalhes.","style":"closing","use":"Terminar histórias com significado","en":null,"zh":null,"pinyin":null},{"id":"encerramento-18","family":"encerramento","pt":"Encerramos com uma imagem que sintetiza...","style":"closing","use":"Terminar histórias com significado","en":null,"zh":null,"pinyin":null}],"deepLessons":{"comunicacao-verbal:0":{"title":"Da observação à fala clara","intro":"Comunicar bem não é apenas falar sem pausas. É escolher o que é relevante, organizar relações e convidar a outra pessoa a acompanhar o raciocínio.","steps":[{"title":"Separe fato e julgamento","body":"Comece registrando o que os sentidos permitem observar; adie adjetivos avaliativos até ter elementos que os sustentem.","example":"Em vez de “é uma rua fantástica”, experimente “as copas das árvores cobrem grande parte da calçada”."},{"title":"Suba a escada narrativa","body":"Experimente observação, descrição, sensação, espaço, contexto, comparação, interpretação, elemento humano e síntese. A ordem pode variar conforme a história.","example":"Uma rua arborizada → a luz entre as folhas → pessoas caminhando → a sensação de escala humana."},{"title":"Use uma ideia por bloco","body":"Uma estrutura simples de fala é tema → detalhe → consequência → transição. A pausa separa os blocos e melhora a compreensão.","example":"“Repare na fachada. Os elementos verticais alongam a composição. De longe, o prédio parece ainda mais alto.”"}],"assignment":"Escolha um objeto próximo, grave 45 segundos de descrição objetiva e depois 45 segundos acrescentando contexto e interpretação claramente identificada.","rubric":"Distingui observação e opinião? Usei dois detalhes concretos? Minha conclusão decorreu do que mostrei?"},"linguagem-descritiva:0":{"title":"Troque adjetivos vagos por detalhes","intro":"Palavras genéricas não são proibidas; elas se tornam insuficientes quando substituem observações que ajudariam o público a imaginar a cena.","steps":[{"title":"Descreva a forma","body":"Observe escala, proporções, linhas, curvaturas, simetria e ocupação do espaço. Nomeie primeiro o que a câmera poderia confirmar.","example":"“Uma fachada estreita, com janelas altas e linhas verticais repetidas.”"},{"title":"Descreva material e luz","body":"Considere textura, acabamento, reflexos, sombras e transições. Evite identificar materiais específicos sem segurança.","example":"“A superfície lisa reflete as luzes da rua” é mais prudente que supor o material."},{"title":"Mostre relações","body":"Descrições ficam mais ricas quando explicam onde cada elemento está e como se relaciona com os demais.","example":"“A vegetação sombreia a calçada, enquanto as vitrines iluminam a faixa junto às fachadas.”"}],"assignment":"Grave uma descrição de 60 segundos sem usar “bonito”, “legal”, “incrível” ou “coisa”. Reescreva a transcrição acrescentando cinco detalhes verificáveis.","rubric":"Nomeei formas, relações e texturas? Evitei adjetivos genéricos? Um ouvinte imaginaria a cena?"},"locucao-voz:0":{"title":"Sua voz também organiza a informação","intro":"Ritmo, pausas e ênfase criam hierarquia. Uma fala articulada não exige voz artificial nem volume excessivo.","steps":[{"title":"Respiração e preparo","body":"Relaxe ombros, respire com conforto e evite apertar a garganta. Faça breves aquecimentos leves, sem esforço ou dor.","example":"Leia uma frase curta em uma expiração natural, sem competir com o ar."},{"title":"Marque unidades de sentido","body":"Insira pausas onde termina uma ideia, e não apenas onde aparece pontuação. A voz deve ajudar a organizar o pensamento.","example":"“Nesta esquina / a arquitetura muda / e o fluxo de pessoas aumenta.”"},{"title":"Destaque uma palavra-chave","body":"A ênfase pode vir de intensidade, duração ou mudança sutil de tom. Evite ressaltar todas as palavras.","example":"Compare: “a fachada é ESTREITA” e “a FACHADA é estreita”."}],"assignment":"Grave duas versões de um parágrafo: uma neutra e outra com três pausas e duas ênfases conscientes. Compare inteligibilidade e naturalidade.","rubric":"Minha voz permaneceu confortável? As pausas facilitaram a compreensão? A ênfase teve intenção?"},"comunicacao-camera:0":{"title":"Fale para uma pessoa, não para uma lente","intro":"A câmera amplia pequenos hábitos de postura, olhar e gesto. A naturalidade surge de domínio da mensagem, não de decorar cada palavra.","steps":[{"title":"Defina a mensagem central","body":"Antes de gravar, complete a frase: “Quero que a pessoa entenda que...”. Essa decisão reduz desvios.","example":"“Quero mostrar como a arborização muda a experiência de caminhar.”"},{"title":"Use pontos de apoio","body":"Memorize três ideias, não um parágrafo inteiro. Conte cada ideia com palavras próprias.","example":"Abertura: rua; desenvolvimento: sombra e movimento; fechamento: impressão pessoal."},{"title":"Coordene corpo e quadro","body":"Olhe para a lente ao se dirigir ao público; olhe para o objeto quando for mostrá-lo. Gestos devem destacar referências, não competir com elas.","example":"Ao dizer “naquele edifício”, indique a direção com o olhar e um gesto simples."}],"assignment":"Apresente um lugar em 45 segundos, uma vez com roteiro completo e outra com três palavras-chave. Compare os dois resultados.","rubric":"Mantive a ideia central? Minha postura está confortável? Os gestos têm função?"},"improvisacao:0":{"title":"Improvisar é pensar por blocos","intro":"O bom improviso é estruturado: você não conhece antecipadamente cada frase, mas sabe como avançar entre ideias e recuperar o fio.","steps":[{"title":"Pense em blocos curtos","body":"Use quatro blocos: o que é → um detalhe → por que interessa → fechamento. Dois blocos bem desenvolvidos valem mais que dez ideias soltas.","example":"“Estou diante de uma vitrine. O contraste de materiais chama atenção. Isso cria uma leitura de...”"},{"title":"Aprenda retomadas","body":"Se perder a linha, reformule com calma: “Em outras palavras”, “O ponto central é”, “Voltando ao que observamos”.","example":"Evite fingir que não houve pausa; retome naturalmente."},{"title":"Treine restrições criativas","body":"Descreva uma cena sem um adjetivo frequente ou em um tempo menor. A restrição revela repertório e lacunas.","example":"Faça versões de 15, 30 e 60 segundos sobre o mesmo assunto."}],"assignment":"Sorteie um desafio no Estúdio da Voz, grave sem roteiro e repita tentando reduzir redundâncias sem aumentar a velocidade.","rubric":"Mantive coerência? Consegui retomar? Usei exemplos? Houve conclusão?"},"storytelling:0":{"title":"Uma história é uma mudança significativa","intro":"Uma sequência de imagens só se torna narrativa quando existe uma pergunta ou transformação que orienta a atenção.","steps":[{"title":"Identifique o eixo","body":"Defina quem ou o que acompanhamos, qual é a curiosidade e por que aquilo importa.","example":"“Quero descobrir como um artesão organiza a produção em um espaço tão pequeno.”"},{"title":"Construa progressão","body":"Use começo (situação), meio (busca/observação) e fim (descoberta ou limite da investigação). Não fabrique conflitos.","example":"Pergunta → tentativa de observar o processo → resposta do entrevistado → reflexão."},{"title":"Mostre antes de concluir","body":"Use uma cena concreta como evidência sensorial. Deixe interpretações explicitamente associadas ao narrador.","example":"Em vez de dizer “a rotina é intensa”, mostre ações e pergunte sobre a rotina."}],"assignment":"Crie a estrutura de um vídeo de um minuto: pergunta central, três cenas verificáveis e conclusão que não exagere o que foi apurado.","rubric":"Há uma pergunta clara? As cenas conduzem a descoberta? O fim respeita as evidências?"},"oratoria-retorica:0":{"title":"Um argumento não é um adjetivo forte","intro":"A credibilidade vem de afirmações precisas, razões compreensíveis, evidências adequadas e reconhecimento de limites.","steps":[{"title":"Tese definida","body":"Diga qual ideia você sustenta em uma frase, delimitando contexto e alcance.","example":"“Nesta caminhada, as calçadas arborizadas pareceram mais confortáveis para mim.”"},{"title":"Razões e exemplos","body":"Apresente dois motivos observáveis ou documentados. Exemplos ilustram; dados podem sustentar generalizações quando bem coletados.","example":"“Havia sombra contínua em boa parte do trecho e fluxo de pedestres.”"},{"title":"Objeção e limite","body":"Pergunte o que poderia enfraquecer sua interpretação. Esse exercício torna o discurso mais robusto.","example":"“Isso não comprova que a região é sempre mais confortável.”"}],"assignment":"Defenda uma opinião sobre uma experiência urbana em 90 segundos, identificando evidência, interpretação e um limite.","rubric":"Minha tese é específica? Apresentei razões? Reconheci limites?"},"semiotica:0":{"title":"A imagem também tem gramática","intro":"Formas, cores, gestos e enquadramentos comunicam por convenções e contexto. Uma leitura visual precisa ser argumentada, não presumida universal.","steps":[{"title":"Denotação","body":"Descreva o que aparece antes de interpretar.","example":"“Fundo bege, duas peças de roupa e iluminação lateral.”"},{"title":"Conotação","body":"Proponha sentidos possíveis, reconhecendo que variam entre públicos.","example":"“A paleta pode sugerir sobriedade, mas essa associação é culturalmente situada.”"},{"title":"Composição","body":"Observe escala, centro de atenção, repetição, contraste e ausência.","example":"“A luz dirige o olhar para a peça à direita.”"}],"assignment":"Escolha uma vitrine ou cartaz. Escreva cinco fatos visuais e três leituras possíveis, marcando a diferença.","rubric":"Separei aparência e interpretação? Reconheci ambiguidade? Justifiquei minhas leituras?"},"psicologia-comunicacao:0":{"title":"Atenção é um recurso limitado","intro":"Explicações longas podem perder o público por excesso de ideias simultâneas. Clareza exige selecionar e ordenar informação.","steps":[{"title":"Uma ideia por passagem","body":"Escolha a informação indispensável antes de acrescentar curiosidades.","example":"Abra com o que é; só depois explique por que importa."},{"title":"Exemplos concretos","body":"Apoie conceitos novos em cenas ou objetos observáveis sem distorcer a ideia.","example":"Ao explicar “escala humana”, mostre a relação entre pessoa e fachada."},{"title":"Recuperação e síntese","body":"Reforce uma mensagem com breve recapitulação em palavras novas, não repetição mecânica.","example":"“Ou seja, o ambiente parece menor porque podemos comparar edifícios, árvores e pedestres.”"}],"assignment":"Explique uma ideia complexa em 30 e 90 segundos; peça a alguém que repita a mensagem essencial.","rubric":"A ideia principal apareceu cedo? Cortei jargões? O exemplo ajudou?"},"comunicacao-intercultural:0":{"title":"Curiosidade sem generalização","intro":"Narrar outra sociedade exige entender que observações individuais não equivalem a explicações completas sobre uma cultura.","steps":[{"title":"Pergunte antes de interpretar","body":"Use perguntas que deixem a pessoa definir sua própria experiência.","example":"“Como você descreveria essa tradição?” em vez de “Por que os chineses sempre...?”"},{"title":"Evite afirmações totais","body":"Identifique local, período, fonte e alcance de cada observação.","example":"“Nas lojas que visitei neste bairro...” é mais preciso que “na China é assim”."},{"title":"Revise traduções","body":"Expressões podem perder nuance. Confirme com interlocutores quando a tradução for relevante para a reportagem.","example":"Ao inserir legendas, preserve hesitações e incertezas pertinentes."}],"assignment":"Planeje três perguntas para uma entrevista cultural e revise cada uma à procura de pressupostos indevidos.","rubric":"Minha pergunta abre espaço? Evitei estereótipos? Atribuí o ponto de vista a quem o expressou?"},"redacao-jornalistica:0":{"title":"Escrever para ser ouvido é diferente","intro":"Textos narrados precisam de frases respiráveis, progressão evidente e referências claras, pois o ouvinte não consegue reler instantaneamente.","steps":[{"title":"Comece pelo essencial","body":"Identifique quem, o quê, onde, quando, por quê e como, sem forçar respostas ainda desconhecidas.","example":"“Neste trecho de rua, comerciantes e pedestres dividem um espaço compacto.”"},{"title":"Prefira construções diretas","body":"Frases com sujeito e verbo próximos são mais fáceis de acompanhar do que encaixes excessivos.","example":"Troque “O local, que, desde..., passou...” por duas frases."},{"title":"Leia em voz alta","body":"Revise trechos longos e referências vagas. Respiração difícil pode indicar frase excessiva.","example":"“A empresa informou que...”. Se a informação for incerta, atribua claramente."}],"assignment":"Escreva 120 palavras sobre uma observação; corte 25% sem perder fatos e grave a leitura.","rubric":"A fonte está identificada? A ordem faz sentido? Posso ler sem tropeçar?"},"tecnicas-entrevista:0":{"title":"A boa entrevista progride por escuta","intro":"Uma lista de perguntas é só o começo. A descoberta ocorre quando o repórter ouve e identifica o que precisa ser aprofundado.","steps":[{"title":"Pesquise e prepare","body":"Defina o que você realmente precisa saber e quais perguntas abertas podem revelar experiências.","example":"“Como começou seu trabalho aqui?”"},{"title":"Escute a resposta","body":"Procure exemplos, datas, mudanças e termos ambíguos. Faça uma pergunta de acompanhamento.","example":"“Você disse que o bairro mudou. Em que sentido?”"},{"title":"Confirme e respeite","body":"Peça esclarecimento sem pressão; obtenha autorização adequada e seja transparente sobre publicação.","example":"“Posso citar essa resposta no vídeo?”"}],"assignment":"Faça uma entrevista de cinco minutos sobre uma experiência cotidiana com três perguntas preparadas e ao menos duas perguntas espontâneas.","rubric":"Evitei perguntas que sugerem resposta? Houve aprofundamento? Registrei contexto e permissão?"},"pesquisa-verificacao:0":{"title":"Sua credibilidade mora no que consegue sustentar","intro":"O exercício é manter uma trilha simples: afirmação, origem, contexto, verificação e grau de certeza.","steps":[{"title":"Liste afirmações","body":"Separe cada declaração verificável do comentário pessoal.","example":"“A loja foi inaugurada em 2018” exige fonte; “gostei do projeto” é experiência."},{"title":"Busque independência","body":"Duas reproduções do mesmo comunicado não são duas confirmações independentes.","example":"Compare documento primário e registro independente, quando disponível."},{"title":"Atribua limites","body":"Se algo não pôde ser verificado, diga isso e evite apresentar suposição como fato.","example":"“Não foi possível confirmar a data de abertura até a publicação.”"}],"assignment":"Escolha cinco afirmações para um vídeo. Registre como seriam verificadas e retire ou qualifique as que não conseguir confirmar.","rubric":"Sei de onde veio cada dado? Contextualizei data e local? Distingui testemunho de comprovação?"},"fotojornalismo:0":{"title":"Fotografia documental é escolha e responsabilidade","intro":"Posição, momento, enquadramento e legenda orientam a leitura. A foto pode registrar fatos, mas também omitir contexto.","steps":[{"title":"Escolha o momento","body":"Observe uma ação completa e registre o ponto que melhor explica o que ocorre.","example":"Pessoa esperando diante da vitrine, seguida do movimento de entrada."},{"title":"Construa sequência","body":"Use plano geral para contexto, médio para ação e detalhe para singularidade.","example":"Rua → interação humana → gesto → objeto → desfecho."},{"title":"Legende com precisão","body":"Diga apenas o que se pode sustentar sobre pessoas, tempo, local e ação. Não invente intenção.","example":"“Pessoa atravessa a rua” é observação; “pessoa volta feliz do trabalho” é suposição."}],"assignment":"Produza cinco fotos de uma rotina pública sem identificar desnecessariamente pessoas. Crie uma legenda verificável para cada foto.","rubric":"Existe começo, desenvolvimento e fim? As legendas são confiáveis? Respeitei privacidade?"},"fotografia-tecnica:0":{"title":"O obturador é uma decisão narrativa","intro":"A velocidade de exposição pode congelar, sugerir movimento ou tornar uma cena abstrata. O ajuste exige compensar luz, estabilidade e intenção.","steps":[{"title":"Congele a ação","body":"Velocidades mais altas reduzem borrão de movimento, embora dependam da luz disponível.","example":"Tente congelar um ciclista em passagem segura, sem se aproximar da via."},{"title":"Mostre movimento","body":"Velocidades baixas criam rastros; use apoio estável e avalie o brilho da cena.","example":"Uma pessoa em deslocamento pode ficar borrada contra elementos imóveis."},{"title":"Panorâmica acompanhada","body":"Acompanhe suavemente um objeto em movimento para buscar assunto mais definido e fundo com rastro.","example":"Experimente várias tomadas; a taxa de acerto pode ser baixa."}],"assignment":"Faça três fotografias do mesmo cenário usando velocidades diferentes. Anote configurações e explique o efeito visual de cada resultado.","rubric":"A exposição foi intencional? O efeito reforça a história? Fotografei em segurança?"},"linguagem-cinematografica:0":{"title":"Cada plano responde a uma pergunta","intro":"O plano geral orienta, o médio mostra relações e o detalhe direciona atenção. Movimentos de câmera só ajudam quando têm função narrativa.","steps":[{"title":"Estabeleça o espaço","body":"Mostre onde estamos antes de aproximar elementos que podem confundir o público.","example":"Plano geral de uma rua antes dos detalhes de uma cafeteria."},{"title":"Mostre ações completas","body":"Registre entrada, desenvolvimento e saída da ação, quando necessário, para facilitar montagem.","example":"Mão abre a porta → barista prepara café → xícara servida."},{"title":"Movimente com propósito","body":"Aproximar revela; afastar contextualiza; acompanhar mantém ação; contornar pode revelar relações espaciais.","example":"A câmera recua para mostrar que a pequena loja fica sob um grande edifício."}],"assignment":"Filme seis planos de uma ação simples: geral, médio, detalhe, reação, som ambiente e plano de encerramento.","rubric":"O público entende o espaço? Cada plano acrescenta algo? Os movimentos têm motivo?"},"roteiro-audiovisual:0":{"title":"Roteiro é uma hipótese visual de história","intro":"Uma boa estrutura de produção orienta o que capturar, mas precisa admitir descobertas imprevistas em campo.","steps":[{"title":"Escreva em duas colunas","body":"Associe imagem/ação a voz/som. Se ambas repetem a mesma informação, busque complementaridade.","example":"Imagem: mãos preparando chá. Voz: contexto de como o processo é aprendido."},{"title":"Defina cobertura mínima","body":"Liste plano geral, ação principal, detalhes, reação, som ambiente e transições.","example":"Cinco cenas e pelo menos três registros de áudio útil."},{"title":"Reescreva após a gravação","body":"Organize a história com o que foi realmente captado e verificado, não com cenas imaginadas.","example":"Se a entrevista contradiz a hipótese, revise a abordagem."}],"assignment":"Monte um roteiro de 60 segundos com cinco linhas de imagem e áudio. Em cada linha, explique a função narrativa.","rubric":"As imagens complementam a voz? Tenho plano de som? A conclusão decorre do material?"},"jornalismo-moda:0":{"title":"A vitrine também é uma narrativa","intro":"Cores, peças, materialidade e exposição visual comunicam escolhas. Para interpretar a intenção de uma marca, diferencie leitura própria de declaração oficial.","steps":[{"title":"Observe antes de nomear a tendência","body":"Registre itens, cores, silhuetas, repetição e iluminação sem impor rótulos de mercado imediatamente.","example":"“Três looks monocromáticos, silhuetas amplas e iluminação concentrada.”"},{"title":"Analise execução","body":"Verifique modelagem, ajuste, construção aparente e acabamento visível. Evite deduzir qualidade total sem manusear a peça.","example":"“A costura aparente funciona como elemento visual.”"},{"title":"Construa hipótese editorial","body":"Associe sinais visuais a uma proposta estética, qualificando a inferência.","example":"“A apresentação sugere uma linguagem minimalista, mas não encontrei declaração da marca.”"}],"assignment":"Escolha uma vitrine: grave descrição objetiva de 45 segundos e análise interpretativa de outros 45 segundos.","rubric":"Separei fato e hipótese? Usei linguagem técnica? Apontei ao menos três elementos visuais?"},"jornalismo-urbano:0":{"title":"Leia a cidade na escala da caminhada","intro":"Uma rua combina circulação, permanência, paisagem, comércio, acessibilidade e microexperiências; observar exige método.","steps":[{"title":"Mapeie os usos","body":"Registre o que é residencial, comercial e de convivência sem inferir quem vive ou trabalha em cada local.","example":"Comércio no térreo, entradas residenciais e bancos ao longo da calçada."},{"title":"Observe o percurso","body":"Descreva transições, pontos de sombra, travessias e barreiras; a experiência depende de horário e condições.","example":"“Neste horário, a travessia concentra pedestres nos dois lados.”"},{"title":"Inclua a escala humana","body":"Relacione edifícios, árvores, pessoas e mobiliário urbano para explicar percepção.","example":"“A largura da calçada permite a passagem de dois grupos em sentidos opostos.”"}],"assignment":"Faça um percurso curto e registre cinco mudanças de ambiente, sem filmar de modo a atrapalhar pessoas.","rubric":"Mostrei espaço e uso? Qualifiquei observações por local/horário? Incluí acessibilidade?"}},"atlas":[{"title":"Formas e geometria","terms":["retilíneo","curvilíneo","angular","arredondado","simétrico","assimétrico","verticalizado","horizontal","modular","orgânico"],"prompt":"Descreva uma cena de Xangai usando três elementos de formas e geometria e sem recorrer a adjetivos genéricos."},{"title":"Escala e proporção","terms":["monumental","compacto","amplo","estreito","alongado","baixo","esguio","imponente","discreto","proporcional"],"prompt":"Descreva uma cena de Xangai usando três elementos de escala e proporção e sem recorrer a adjetivos genéricos."},{"title":"Luz e sombra","terms":["difusa","direcional","rasante","contrastada","suave","dourada","indireta","irregular","refletida","natural"],"prompt":"Descreva uma cena de Xangai usando três elementos de luz e sombra e sem recorrer a adjetivos genéricos."},{"title":"Cores e contraste","terms":["monocromático","complementar","neutro","saturado","dessaturado","quente","frio","terroso","vibrante","gradual"],"prompt":"Descreva uma cena de Xangai usando três elementos de cores e contraste e sem recorrer a adjetivos genéricos."},{"title":"Textura e acabamento","terms":["fosco","polido","áspero","liso","granulado","poroso","acetinado","translúcido","metálico","aveludado"],"prompt":"Descreva uma cena de Xangai usando três elementos de textura e acabamento e sem recorrer a adjetivos genéricos."},{"title":"Ambiente e atmosfera","terms":["acolhedor","movimentado","contemplativo","intimista","solene","silencioso","agitado","arejado","concentrado","descontraído"],"prompt":"Descreva uma cena de Xangai usando três elementos de ambiente e atmosfera e sem recorrer a adjetivos genéricos."},{"title":"Movimentos","terms":["gradual","fluido","brusco","contínuo","intermitente","ritmado","circular","oscilante","acelerado","cadenciado"],"prompt":"Descreva uma cena de Xangai usando três elementos de movimentos e sem recorrer a adjetivos genéricos."},{"title":"Arquitetura","terms":["fachada","pórtico","marquise","cornija","vão","platibanda","pilotis","recuo","arcada","volumetria"],"prompt":"Descreva uma cena de Xangai usando três elementos de arquitetura e sem recorrer a adjetivos genéricos."},{"title":"Cidade","terms":["calçada","travessia","esquina","quarteirão","praça","arborização","fluxo","mobiliário urbano","permeabilidade","fachada ativa"],"prompt":"Descreva uma cena de Xangai usando três elementos de cidade e sem recorrer a adjetivos genéricos."},{"title":"Moda","terms":["silhueta","caimento","recorte","pesponto","pregas","aviamentos","volume","modelagem","arremate","acabamento"],"prompt":"Descreva uma cena de Xangai usando três elementos de moda e sem recorrer a adjetivos genéricos."},{"title":"Gastronomia","terms":["crocante","cremoso","fibroso","untuoso","ácido","adocicado","defumado","aromático","aveludado","persistente"],"prompt":"Descreva uma cena de Xangai usando três elementos de gastronomia e sem recorrer a adjetivos genéricos."},{"title":"Som","terms":["ressonância","reverberação","eco","sussurro","estalo","zumbido","ruído","cadência","intensidade","silêncio"],"prompt":"Descreva uma cena de Xangai usando três elementos de som e sem recorrer a adjetivos genéricos."},{"title":"Fotografia","terms":["contraluz","primeiro plano","profundidade de campo","perspectiva","enquadramento","reflexo","desfoque","silhueta","panorâmica","exposição"],"prompt":"Descreva uma cena de Xangai usando três elementos de fotografia e sem recorrer a adjetivos genéricos."},{"title":"Emoções e impressões","terms":["surpresa","curiosidade","encantamento","estranhamento","familiaridade","nostalgia","calma","expectativa","admiração","ambivalência"],"prompt":"Descreva uma cena de Xangai usando três elementos de emoções e impressões e sem recorrer a adjetivos genéricos."},{"title":"Relações espaciais","terms":["adjacente","ao fundo","na diagonal","em primeiro plano","paralelo","sobreposto","alinhado","intercalado","centralizado","nas extremidades"],"prompt":"Descreva uma cena de Xangai usando três elementos de relações espaciais e sem recorrer a adjetivos genéricos."},{"title":"Mudança temporal","terms":["gradualmente","repentinamente","ao amanhecer","no intervalo","enquanto isso","mais adiante","posteriormente","anteriormente","na sequência","ao final"],"prompt":"Descreva uma cena de Xangai usando três elementos de mudança temporal e sem recorrer a adjetivos genéricos."}],"missions":[{"id":"mission-01","area":"moda","title":"Leitura de vitrine","brief":"Observe uma vitrine e diferencie descrição visual de hipótese sobre identidade da marca.","shots":["Plano geral da vitrine","três detalhes de material e construção","reflexo ou iluminação","contexto da rua"],"phrases":["A estética parece enfatizar...","O detalhe verificável é...","Minha interpretação é..."],"caution":"Não bloqueie a passagem nem filme pessoas identificáveis sem necessidade."},{"id":"mission-02","area":"moda","title":"Materiais em uma loja","brief":"Descreva cinco texturas, recortes ou acabamentos com vocabulário técnico.","shots":["Plano médio das peças","detalhes permitidos","etiqueta quando autorizada","plano de contexto"],"phrases":["O acabamento apresenta...","O caimento parece...","Isso ainda precisa ser confirmado."],"caution":"Respeite regras de gravação da loja e não toque sem autorização."},{"id":"mission-03","area":"moda","title":"Comparação de vitrines","brief":"Compare duas propostas de composição aplicando os mesmos critérios.","shots":["Duas vistas gerais equivalentes","cores dominantes","foco de luz","contexto externo"],"phrases":["Ambas utilizam...","A diferença principal aparece em..."],"caution":"Não atribua intenções à marca sem evidência."},{"id":"mission-04","area":"moda","title":"Uma rua e seus estilos","brief":"Observe diversidade de looks e composição urbana sem julgar pessoas.","shots":["Plano geral de rua","detalhes não identificadores","cenário arquitetônico","movimento"],"phrases":["Minha observação está limitada a...","Há uma variedade de..."],"caution":"Priorize enquadramentos que não exponham terceiros."},{"id":"mission-05","area":"arquitetura","title":"Prédio em três escalas","brief":"Descreva um edifício em plano geral, médio e detalhe.","shots":["Visão geral","relação com pedestres","detalhe da fachada","perspectiva baixa"],"phrases":["De longe percebemos...","De perto aparece..."],"caution":"Não entre em áreas restritas."},{"id":"mission-06","area":"arquitetura","title":"Linhas de uma fachada","brief":"Explore repetição, ritmo, simetria e contraste.","shots":["Fachada frontal","ângulo lateral","detalhe geométrico","relação com entorno"],"phrases":["O ritmo das linhas...","O contraste é visível em..."],"caution":"Não apresente estilo arquitetônico como fato sem confirmação."},{"id":"mission-07","area":"arquitetura","title":"O que a luz revela","brief":"Filme o mesmo objeto em dois momentos com luz diferente.","shots":["Plano de manhã","plano de tarde","detalhe em sombra","reflexo"],"phrases":["A luz modifica...","As sombras destacam..."],"caution":"Escolha pontos de gravação seguros."},{"id":"mission-08","area":"urbe","title":"Dois lados de uma rua","brief":"Compare calçadas, arborização, usos e movimento.","shots":["Lado A","lado B","travessia","plano de contexto"],"phrases":["Do lado esquerdo...","O contraste aparece em..."],"caution":"Atravesse apenas nos locais permitidos."},{"id":"mission-09","area":"urbe","title":"Um minuto no metrô","brief":"Construa relato sobre deslocamento observando placas e fluxo.","shots":["Sinalização","acesso autorizado","plano dos pés em movimento","chegada"],"phrases":["O trajeto começa...","A sinalização indica..."],"caution":"Respeite regras de filmagem do transporte e evite rostos."},{"id":"mission-10","area":"urbe","title":"A rua que muda de ritmo","brief":"Observe como a paisagem muda durante uma caminhada curta.","shots":["Início","três transições","som ambiente","final"],"phrases":["À medida que caminhamos...","A mudança surge em..."],"caution":"Não filme enquanto atravessa vias."},{"id":"mission-11","area":"urbe","title":"O cotidiano em cinco planos","brief":"Conte uma história simples sem narração primeiro.","shots":["Geral","ação","detalhe","reação sem exposição","fechamento"],"phrases":["O que aconteceu foi...","O plano seguinte mostra..."],"caution":"Preserve privacidade em cenas cotidianas."},{"id":"mission-12","area":"gastronomia","title":"Descrever sem dizer delicioso","brief":"Crie uma narração sobre aroma, textura, aparência e preparo.","shots":["Prato completo","detalhe da textura","etapa de preparo permitida","plano de contexto"],"phrases":["O aroma lembra...","A textura é..."],"caution":"Peça autorização antes de filmar cozinhas e equipes."},{"id":"mission-13","area":"gastronomia","title":"O preparo como sequência","brief":"Registre o início, meio e fim de um preparo com consentimento.","shots":["Ingredientes","preparo","transformação","resultado"],"phrases":["Primeiro...","Em seguida...","No final..."],"caution":"Não interrompa o trabalho de quem prepara."},{"id":"mission-14","area":"gastronomia","title":"A história de um ingrediente","brief":"Pesquise origem e aplicação de ingrediente encontrado em loja.","shots":["Ingrediente","embalagem","forma de uso","contexto"],"phrases":["A procedência informada é...","Preciso confirmar..."],"caution":"Não invente origem cultural ou nutricional."},{"id":"mission-15","area":"cultura","title":"Uma exposição em três perguntas","brief":"Observe tema, material e intenção artística com pesquisa posterior.","shots":["Sala quando permitido","obra em contexto","detalhe permitido","legenda"],"phrases":["A obra apresenta...","Segundo o texto curatorial..."],"caution":"Verifique direitos autorais e regras de fotografia."},{"id":"mission-16","area":"cultura","title":"Uma tradição sem estereótipos","brief":"Crie pauta com perguntas abertas e fontes diversas.","shots":["Contexto autorizado","objeto","detalhe","entrevista consentida"],"phrases":["Como você descreveria...?","Qual é o contexto...?"],"caution":"Evite generalizações sobre cultura chinesa."},{"id":"mission-17","area":"cultura","title":"Escuta de bairro","brief":"Registre sons ambientais para criar uma paisagem sonora.","shots":["Som de passos","som de trânsito","som de espaço interno autorizado","silêncio"],"phrases":["O som predominante vem de...","A mudança sonora indica..."],"caution":"Evite gravação invasiva de conversas privadas."},{"id":"mission-18","area":"tecnologia","title":"Teste honesto de equipamento","brief":"Demonstre recurso indicando condições e limitações.","shots":["Equipamento","configuração","resultado do teste","comparação"],"phrases":["O fabricante informa...","No meu teste ocorreu..."],"caution":"Não faça afirmações técnicas sem verificar as especificações."},{"id":"mission-19","area":"tecnologia","title":"Vídeo explicativo de um produto","brief":"Transforme instruções em uma demonstração acessível.","shots":["Visão geral","controles","uso real","resultado"],"phrases":["O primeiro passo é...","Este botão permite..."],"caution":"Peça permissão quando necessário."},{"id":"mission-20","area":"entrevista","title":"História de um pequeno negócio","brief":"Planeje entrevista sobre origem, rotina e transformação.","shots":["Fachada autorizada","entrevistado consentido","processo","detalhe"],"phrases":["Como começou...?","O que mudou...?","Pode dar um exemplo?"],"caution":"Confirme permissão para gravar e publicar."},{"id":"mission-21","area":"entrevista","title":"Cinco perguntas, duas novas","brief":"Treine escuta: prepare cinco perguntas e crie duas de acompanhamento.","shots":["Ambiente de entrevista","gesto autorizado","detalhe do assunto","encerramento"],"phrases":["Quando você diz isso...","O que aconteceu depois?" function builderResult(){const b=ui.builder;const a=(s)=>String(s||'').trim().replace(/[.!?…]+$/,'');let pieces=[];
 if(b.style==='poetico')pieces.push(`Há histórias que começam em pequenos detalhes.${b.place?' Hoje, estou '+a(b.place)+'.':''}`);
 else if(b.style==='espontaneo')pieces.push(`Hoje estou ${b.place?a(b.place):'explorando um ambiente'} e quero mostrar o que encontrei.`);
 else if(b.style==='didatico')pieces.push(`${b.place?'Estamos '+a(b.place)+'. ':''}Vamos observar alguns elementos desta cena e entender por que eles importam.`);
 else pieces.push(`Estamos ${b.place?a(b.place):'diante de uma cena'} que merece um olhar mais atento.`);
 if(b.observation)pieces.push(`A primeira coisa que observo é ${a(b.observation)}.`);
 if(b.detail)pieces.push(`O detalhe que merece atenção é ${a(b.detail)}.`);
 if(b.context)pieces.push(`Para compreender melhor o contexto, ainda precisamos verificar ou atribuir: ${a(b.context)}.`);
 if(b.contrast)pieces.push(`Uma comparação possível, se feita com critérios equivalentes, é ${a(b.contrast)}.`);
 if(b.reflection)pieces.push(`Minha interpretação pessoal é ${a(b.reflection)}.`);
 else pieces.push('O que esta cena nos permite concluir — e o que ainda precisamos investigar?');
 return pieces.join('\n\n')}

rgin:15px 0 8px">APLICAÇÃO</div><p class="small" style="margin-bottom:12px">${esc(w.drill)}</p><div class="form-row"><button class="btn secondary sm" data-action="journey-phrase" data-id="${w.family}">${ico('quote',13)} Frases</button><button class="btn secondary sm" data-action="open-mission" data-id="${m.id}">${store.missions.includes(m.id)?ico('check',13):ico('map',13)} Missão</button><button class="btn secondary sm" data-action="navigate" data-page="voice">${ico('mic',13)} Falar</button></div></div>`}).join('')}</div><div class="notice info" style="margin-top:24px">Este é um percurso inicial de competências, não equivalente à carga horária de uma graduação. As 43 disciplinas continuam disponíveis na academia para estudo paralelo e aprofundamento.</div>`}

function render(preserveFocus=false){let focus=null,sel=null;const e=document.activeElement;if(preserveFocus&&e&&e.dataset.model){focus=e.dataset.model;if(typeof e.selectionStart==='number')sel=[e.selectionStart,e.selectionEnd]}document.documentElement.dataset.theme=store.theme;document.getElementById('app').innerHTML=shell(renderPage());if(focus){const node=document.querySelector(`[data-model="${focus}"]`);if(node){node.focus();if(sel&&node.setSelectionRange)try{node.setSelectionRange(...sel)}catch{}}}const off=document.getElementById('offline-state');if(off)off.style.display=navigator.onLine?'none':'inline-flex'}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copiado para a área de transferência.')}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();try{document.execCommand('copy');toast('Texto copiado.')}catch{toast('Não foi possível copiar neste navegador.')}t.remove()}}
function say(text,lang='pt-BR'){if(!('speechSynthesis'in window)){toast('Este navegador não oferece síntese de voz.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.92;u.pitch=1;speechSynthesis.speak(u)}
function reviewPhrase(id){const before=store.reviews[id]||{level:0,count:0};const level=Math.min(5,before.level+1);const intervals=[0,1,3,7,14,30];store.reviews[id]={level,count:before.count+1,last:Date.now(),next:Date.now()+intervals[level]*86400000};save();toast(`Frase estudada · próxima revisão em ${intervals[level]} dia(s).`);render()}
let recorder=null,stream=null,recChunks=[],recTick=null,recStart=0,recType='audio/webm';
async function startRecording(){ui.voiceError='';if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){ui.voiceError='Gravação indisponível neste navegador. Use HTTPS ou localhost e confira a permissão do microfone.';render();return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});recChunks=[];recType=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'';recorder=new MediaRecorder(stream,recType?{mimeType:recType}:undefined);recorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(recChunks,{type:recorder?.mimeType||'audio/webm'});if(ui.recordUrl)URL.revokeObjectURL(ui.recordUrl);ui.recordUrl=URL.createObjectURL(blob);stream?.getTracks().forEach(t=>t.stop());stream=null;recorder=null;ui.recording=false;clearInterval(recTick);render();toast('Gravação pronta para ouvir ou salvar.')};recorder.start();ui.recording=true;ui.recordElapsed=0;recStart=Date.now();render();recTick=setInterval(()=>{ui.recordElapsed=Math.floor((Date.now()-recStart)/1000);let t=document.getElementById('record-timer');if(t)t.textContent=formatSecs(ui.recordElapsed);if(ui.recordElapsed>=600)stopRecording()},260)}catch(e){stream?.getTracks().forEach(t=>t.stop());stream=null;ui.voiceError='Não foi possível usar o microfone. Verifique permissão e disponibilidade do dispositivo.';render()}}
function stopRecording(){if(recorder&&recorder.state!=='inactive')recorder.stop();else{ui.recording=false;clearInterval(recTick);render()}}
function downloadBlob(content,filename,mime){const blob=content instanceof Blob?content:new Blob([content],{type:mime});let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}

async function importData(file){if(!file)return;try{if(file.size>8*1024*1024)throw Error('Arquivo grande demais.');const obj=JSON.parse(await file.text());if(obj.app!=='StoryLab Shanghai'||obj.version!==1||!obj.data||typeof obj.data!=='object')throw Error('Formato desconhecido.');if(!confirm('Isso substituirá seu progresso atual. Deseja continuar?'))return;const incoming=obj.data;store={...baseState(),...incoming,completed:Array.isArray(incoming.completed)?incoming.completed.filter(v=>typeof v==='string'):[],favorites:Array.isArray(incoming.favorites)?incoming.favorites.filter(v=>typeof v==='string'):[],missions:Array.isArray(incoming.missions)?incoming.missions.filter(v=>typeof v==='string'):[],practice:Array.isArray(incoming.practice)?incoming.practice.filter(v=>v&&Array.isArray(v.scores)).slice(-500):[],reviews:incoming.reviews&&typeof incoming.reviews==='object'?incoming.reviews:{},notes:incoming.notes&&typeof incoming.notes==='object'?incoming.notes:{},theme:incoming.theme==='dark'?'dark':'light'};save();ui.showImport=false;render();toast('Backup importado com sucesso.')}catch{toast('Backup inválido ou ilegível. O progresso não foi alterado.')}}

 case 'speak-script':if(ui.script)say(ui.script);else toast('Construa uma narração primeiro.');break;
 case 'script-to-tele':if(!ui.script){toast('Construa uma narração primeiro.');break}ui.teleText=ui.script;ui.studioTab='tele';render();break;
 case 'tele-toggle':ui.telePlaying=!ui.telePlaying;if(ui.telePlaying){teleLast=0;teleFrame=requestAnimationFrame(runTele)}else stopTele();{let btn=document.querySelector('[data-action="tele-toggle"]');if(btn)btn.innerHTML=`${ico(ui.telePlaying?'pause':'play')} ${ui.telePlaying?'Pausar':'Iniciar'} rolagem`}break;
 case 'tele-reset':stopTele();{let el=document.getElementById('prompter');if(el)el.scrollTop=0}render();break;
 case 'atlas-pick':ui.atlasIndex=Number(b.dataset.index);render();break;
 case 'copy-term':copy(b.dataset.value);break;
 case 'mission-area':ui.missionArea=id;render();break;
 case 'journey-phrase':ui.phraseFamily=id;ui.phraseQuery='';ui.phraseLang='pt';ui.phraseView='all';ui.phraseLimit=30;navigate('phrases');break;
 case 'open-mission':navigate('mission',{missionId:id});break;
 case 'finish-mission':if(store.missions.includes(id))store.missions=store.missions.filter(x=>x!==id);else store.missions.push(id);save();render();toast(store.missions.includes(id)?'Missão marcada como realizada.':'Missão reaberta.');break;
 case 'export-data':exportData();break;
 case 'show-import':ui.showImport=!ui.showImport;render();break;
 case 'reset-data':if(confirm('Deseja apagar TODO o progresso e as anotações deste navegador? Faça um backup antes, se quiser preservar os dados.')){store=baseState();save();render();toast('Progresso local reiniciado.')}break;
 default:break;
}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.model){const key=t.dataset.model;ui[key]=key==='teleSpeed'?Number(t.value):t.value;if(key==='courseQuery'||key==='phraseQuery'||key==='missionQuery'){render(true)}else if(key==='teleMode'||key==='teleText'){stopTele();const el=document.getElementById('prompter-inner');if(el)el.textContent=teleDisplay()}else if(key==='teleSpeed'){const x=t.parentElement?.querySelector('.field-label');if(x)x.textContent='Velocidade da rolagem · '+ui.teleSpeed}}
 if(t.dataset.builder){ui.builder[t.dataset.builder]=t.value}
 if(t.dataset.rubric!==undefined){const i=Number(t.dataset.rubric);ui.voiceRubric[i]=Number(t.value);let label=document.getElementById('rubric-label-'+i);if(label)label.textContent=t.value+'/5'}
 if(t.dataset.missionNotes){store.notes[t.dataset.missionNotes]=t.value.slice(0,30000);save()}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.model&&(t.tagName==='SELECT')&&['phraseFamily','teleMode'].includes(t.dataset.model)){if(t.dataset.model==='phraseFamily'){ui.phraseLimit=30;render()}else{const el=document.getElementById('prompter-inner');if(el)el.textContent=teleDisplay()}}
 if(t.dataset.missionCheck!==undefined){updateMissionCheck(t.dataset.id,Number(t.dataset.missionCheck),t.checked)}
 if(t.id==='importSave'&&t.files?.[0])importData(t.files[0]);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.menu){ui.menu=false;render()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();navigate('phrases');setTimeout(()=>document.querySelector('[data-model="phraseQuery"]')?.focus(),50)}});
window.addEventListener('online',()=>{let el=document.getElementById('offline-state');if(el)el.style.display='none'});
window.addEventListener('offline',()=>{let el=document.getElementById('offline-state');if(el)el.style.display='inline-flex'});
window.addEventListener('pagehide',()=>{if(recorder&&recorder.state!=='inactive')recorder.stop();stream?.getTracks().forEach(t=>t.stop());stopTele()});
if('serviceWorker'in navigator&&location.protocol==='https:'||('serviceWorker'in navigator&&location.hostname==='localhost'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
render();
})();

</script>
</body>
</html>
