fotografia documental, a composição organiza a informação dentro do quadro. Cada elemento incluído ou excluído altera o que o público entende sobre a cena.","steps":[{"title":"Elemento principal e contexto","body":"Defina o que a foto precisa mostrar e inclua contexto suficiente para que ela seja compreendida sem exagero de elementos.","example":"Um vendedor de bolinhos em primeiro plano, com a fila de clientes desfocada ao fundo, mostra atividade e procura."},{"title":"Camadas e profundidade","body":"Primeiro plano, plano médio e fundo podem contar partes diferentes da história numa única imagem.","example":"Bicicletas no primeiro plano, pedestres no meio e arranha-céus ao fundo: mobilidade e escala urbana."},{"title":"O que fica fora do quadro","body":"Enquadrar é excluir. Pergunte se o corte esconde algo que mudaria a interpretação.","example":"Fotografar só a parte vazia de um restaurante lotado sugere fracasso que não existe."}],"assignment":"Fotografe a mesma cena de três formas: só o elemento principal, com contexto e com camadas. Escreva uma frase sobre o que cada versão comunica.","rubric":"As três versões comunicam coisas diferentes? Alguma exclusão distorce a cena? Qual versão é mais fiel ao que observei?"},"fotojornalismo:2":{"title":"Cinco imagens, uma história","intro":"Uma sequência fotográfica conta uma história com começo, desenvolvimento e fechamento. Cada imagem deve acrescentar informação nova, não repetir a anterior.","steps":[{"title":"Imagem de abertura","body":"Estabelece o lugar e o tema. Geralmente um plano mais aberto que situa o público.","example":"Plano geral do mercado ao amanhecer, com as primeiras bancas acendendo as luzes."},{"title":"Imagens de desenvolvimento","body":"Mostram personagens, ações, detalhes e relações. Alterne distâncias: plano médio, detalhe, interação.","example":"Mãos escolhendo legumes; vendedor pesando; cliente negociando."},{"title":"Imagem de fechamento","body":"Conclui ou deixa uma reflexão. Pode mostrar consequência, mudança ou um momento simbólico verdadeiro.","example":"Bancas sendo fechadas no fim da manhã, chão molhado e caixas empilhadas."}],"assignment":"Produza uma sequência de cinco fotos sobre uma atividade cotidiana. Ordene-as, justifique o papel de cada uma e verifique se alguma é redundante.","rubric":"A sequência tem abertura, desenvolvimento e fechamento? Cada foto acrescenta algo novo? A ordem cria progressão?"},"fotojornalismo:3":{"title":"A legenda completa a fotografia","intro":"Uma foto mostra, mas não explica. A legenda informa quem, onde, quando e o que está acontecendo — e declara qualquer intervenção que possa afetar a leitura da imagem.","steps":[{"title":"Elementos da legenda","body":"Identifique pessoas (com consentimento), local, data e ação. Acrescente contexto que a imagem não mostra.","example":"“Li Mei, 62, prepara xiaolongbao em sua banca na rua Yunnan, Xangai, em 12 de outubro de 2026. A banca funciona há 30 anos.”"},{"title":"Não descreva o óbvio","body":"Evite repetir o que já está visível. Use a legenda para informar o que o olhar não alcança.","example":"Em vez de “uma mulher cozinha”, informe quem é, há quanto tempo e por que importa."},{"title":"Transparência sobre edição e encenação","body":"Declare se a cena foi recriada, se houve pedido de pose ou edição além de ajustes básicos de luz e cor.","example":"“A pedido do fotógrafo, a vendedora repetiu o gesto de abrir a tampa do vapor.”"}],"assignment":"Escreva legendas completas para as cinco fotos da sequência anterior, incluindo declaração de qualquer intervenção ou pose.","rubric":"As legendas trazem quem, onde, quando e o quê? Acrescentam informação além do visível? Declarei intervenções?"},"fotografia-tecnica:0":{"title":"O obturador é uma decisão narrativa","intro":"A velocidade de exposição pode congelar, sugerir movimento ou tornar uma cena abstrata. O ajuste exige compensar luz, estabilidade e intenção.","steps":[{"title":"Congele a ação","body":"Velocidades mais altas reduzem borrão de movimento, embora dependam da luz disponível.","example":"Tente congelar um ciclista em passagem segura, sem se aproximar da via."},{"title":"Mostre movimento","body":"Velocidades baixas criam rastros; use apoio estável e avalie o brilho da cena.","example":"Uma pessoa em deslocamento pode ficar borrada contra elementos imóveis."},{"title":"Panorâmica acompanhada","body":"Acompanhe suavemente um objeto em movimento para buscar assunto mais definido e fundo com rastro.","example":"Experimente várias tomadas; a taxa de acerto pode ser baixa."}],"assignment":"Faça três fotografias do mesmo cenário usando velocidades diferentes. Anote configurações e explique o efeito visual de cada resultado.","rubric":"A exposição foi intencional? O efeito reforça a história? Fotografei em segurança?"},"fotografia-tecnica:1":{"title":"Tempo de exposição é tempo de narrativa","intro":"A velocidade do obturador define quanto tempo a luz entra no sensor. Ela decide se o movimento aparece congelado ou como rastro — e essa escolha muda o sentido da imagem.","steps":[{"title":"Velocidades rápidas congelam","body":"Velocidades como 1/500 s ou mais rápidas congelam movimentos de pessoas e veículos. Exigem mais luz ou ISO mais alto.","example":"Ciclista atravessando a faixa congelado em 1/1000 s: nitidez e precisão."},{"title":"Velocidades lentas registram movimento","body":"Velocidades como 1/15 s ou mais lentas criam rastros. Exigem apoio firme ou tripé para manter o cenário nítido.","example":"Rastros de luz dos carros na Yan'an Elevated Road com 2 s de exposição."},{"title":"Panning","body":"Acompanhar o objeto em movimento com a câmera, em velocidade média (1/30 a 1/60 s), deixa o objeto nítido e o fundo borrado, transmitindo velocidade.","example":"Scooter elétrica nítida com o fundo de lojas em riscos horizontais."}],"assignment":"Fotografe o mesmo movimento em três velocidades (rápida, lenta e panning). Anote a configuração de cada foto e descreva a sensação que cada uma transmite.","rubric":"As três técnicas foram executadas? Anotei as configurações? A sensação descrita corresponde ao efeito visual?"},"fotografia-tecnica:2":{"title":"A luz decide o clima da imagem","intro":"Qualidade, direção e cor da luz definem como formas, texturas e pessoas aparecem. Ler a luz disponível é mais importante do que ter equipamento caro.","steps":[{"title":"Luz dura e luz suave","body":"Luz dura (sol direto) cria sombras marcadas e alto contraste. Luz suave (céu nublado, sombra aberta) cria transições delicadas.","example":"Retrato ao meio-dia sob sol forte: sombras nos olhos. Na sombra de um prédio: rosto uniforme."},{"title":"Direção da luz","body":"Luz frontal achata; lateral revela textura; contraluz cria silhueta ou halo. Mova-se para mudar a direção.","example":"Luz lateral do fim da tarde revela a textura dos tijolos de um shikumen."},{"title":"Temperatura de cor","body":"Luz do dia é mais neutra; lâmpadas incandescentes são amareladas; LEDs e neons variam. O balanço de branco corrige ou preserva essas cores.","example":"Preservar o tom quente das lanternas vermelhas numa rua à noite, em vez de neutralizar tudo."}],"assignment":"Fotografe a mesma pessoa ou objeto com luz dura, suave, lateral e contraluz. Registre a hora e a direção da luz e escolha a que melhor serve a uma história específica.","rubric":"Identifiquei corretamente cada tipo de luz? Registrei hora e direção? A escolha final tem justificativa narrativa?"},"fotografia-tecnica:3":{"title":"Comparar para aprender a decidir","intro":"A prática comparativa consiste em fotografar a mesma cena com configurações diferentes e analisar os resultados. É a forma mais rápida de transformar teoria técnica em decisão consciente.","steps":[{"title":"Varie um parâmetro por vez","body":"Para entender o efeito de cada ajuste, mude apenas um: abertura, velocidade ou ISO. Mantenha o resto constante.","example":"Mesma cena em f/2.8, f/5.6 e f/11, com velocidade ajustada para manter a exposição."},{"title":"Registre e organize","body":"Anote configurações, horário e intenção. Organize as fotos lado a lado para comparar com calma.","example":"Planilha simples: arquivo, abertura, velocidade, ISO, observação."},{"title":"Analise o resultado","body":"Compare nitidez, profundidade de campo, ruído, movimento e sensação geral. Pergunte qual versão serve melhor à história.","example":"Em f/11, a rua inteira fica nítida; em f/2.8, só o vendedor — qual informação é mais importante?"}],"assignment":"Realize um exercício comparativo com 9 fotos (3 aberturas × 3 velocidades) da mesma cena. Monte uma grade comparativa e escreva conclusões práticas.","rubric":"Variei um parâmetro por vez? A grade está organizada? As conclusões ajudam em decisões futuras?"},"linguagem-cinematografica:0":{"title":"Cada plano responde a uma pergunta","intro":"O plano geral orienta, o médio mostra relações e o detalhe direciona atenção. Movimentos de câmera só ajudam quando têm função narrativa.","steps":[{"title":"Estabeleça o espaço","body":"Mostre onde estamos antes de aproximar elementos que podem confundir o público.","example":"Plano geral de uma rua antes dos detalhes de uma cafeteria."},{"title":"Mostre ações completas","body":"Registre entrada, desenvolvimento e saída da ação, quando necessário, para facilitar montagem.","example":"Mão abre a porta → barista prepara café → xícara servida."},{"title":"Movimente com propósito","body":"Aproximar revela; afastar contextualiza; acompanhar mantém ação; contornar pode revelar relações espaciais.","example":"A câmera recua para mostrar que a pequena loja fica sob um grande edifício."}],"assignment":"Filme seis planos de uma ação simples: geral, médio, detalhe, reação, som ambiente e plano de encerramento.","rubric":"O público entende o espaço? Cada plano acrescenta algo? Os movimentos têm motivo?"},"linguagem-cinematografica:1":{"title":"O ângulo muda a relação com o personagem","intro":"A altura e a inclinação da câmera alteram como percebemos pessoas e lugares. Ângulos não são neutros: comunicam poder, proximidade ou distância.","steps":[{"title":"Ângulo na altura dos olhos","body":"Cria relação de igualdade e naturalidade. É o padrão para entrevistas e relatos documentais.","example":"Entrevistar um vendedor sentado com a câmera na altura dos olhos dele, não dos seus."},{"title":"Plongée e contra-plongée","body":"Câmera de cima para baixo (plongée) pode diminuir; de baixo para cima (contra-plongée) pode engrandecer. Use com intenção, não por acaso.","example":"Contra-plongée da Shanghai Tower reforça escala; plongée sobre uma pessoa pode sugerir vulnerabilidade."},{"title":"Perspectiva e ponto de vista","body":"A posição da câmera pode representar o olhar de um personagem ou de um observador externo.","example":"Câmera na altura de uma criança no parque mostra a cidade a partir do olhar dela."}],"assignment":"Grave uma mesma ação (por exemplo, alguém comprando algo) com três ângulos diferentes. Descreva o que cada ângulo comunica sobre a pessoa.","rubric":"Os três ângulos são distintos? Identifiquei o efeito de cada um? Evitei ângulos que diminuem a pessoa sem intenção?"},"linguagem-cinematografica:2":{"title":"Mover a câmera precisa de motivo","intro":"Movimentos de câmera — pan, tilt, travelling, câmera na mão — conduzem o olhar e criam ritmo. Sem motivação, distraem e cansam o público.","steps":[{"title":"Pan e tilt","body":"Pan é o giro horizontal; tilt, o vertical. Servem para revelar espaço ou acompanhar uma ação.","example":"Tilt de baixo para cima revelando a altura de um prédio; pan acompanhando um bonde."},{"title":"Travelling e acompanhamento","body":"Deslocar a câmera junto com o personagem cria imersão e continuidade espacial.","example":"Caminhar atrás de um entregador por uma viela, mantendo distância constante."},{"title":"Motivação e estabilidade","body":"Todo movimento deve ter início, meio e fim claros, e uma razão narrativa. Movimentos lentos e estáveis funcionam melhor que movimentos rápidos e tremidos.","example":"Iniciar o pan só quando o personagem começa a andar, e terminar quando ele para."}],"assignment":"Grave três planos com movimentos diferentes (pan, tilt e acompanhamento), cada um com motivação clara. Escreva a motivação antes de gravar.","rubric":"Cada movimento tem motivação escrita? Têm início e fim claros? Estão estáveis o suficiente para serem usados?"},"linguagem-cinematografica:3":{"title":"Continuidade faz o corte desaparecer","intro":"A continuidade visual permite que planos diferentes pareçam parte de uma mesma ação. Regras como o eixo de 180 graus e o raccord de movimento evitam confusão espacial.","steps":[{"title":"Regra dos 180 graus","body":"Imagine uma linha entre dois personagens ou na direção do movimento. Mantenha a câmera do mesmo lado para preservar as posições na tela.","example":"Numa conversa entre cliente e vendedor, a câmera fica sempre do mesmo lado do balcão."},{"title":"Direção do movimento","body":"Se um personagem sai pela direita do quadro, deve entrar pela esquerda no plano seguinte, para manter o sentido.","example":"Pedestre atravessando a rua da esquerda para a direita em todos os planos da sequência."},{"title":"Corte na ação","body":"Cortar durante um movimento (abrir uma porta, sentar) esconde a transição e cria fluidez.","example":"Plano aberto: mão alcança a maçaneta. Corte. Plano fechado: porta se abrindo."}],"assignment":"Grave uma sequência de seis planos de uma ação simples (por exemplo, pedir e receber um café), respeitando os 180 graus, a direção de movimento e um corte na ação.","rubric":"Os seis planos formam uma ação contínua? A regra dos 180 graus foi respeitada? Há pelo menos um corte na ação?"},"fotografia-direcao:0":{"title":"Desenhar com luz","intro":"Direção de fotografia começa por entender a luz: de onde vem, qual sua qualidade e como molda o que aparece. Mesmo sem equipamento de iluminação, é possível escolher posição e horário.","steps":[{"title":"Luz principal","body":"É a fonte dominante que define a forma do rosto ou objeto. Pode ser uma janela, o sol ou uma lâmpada.","example":"Posicionar o entrevistado a 45 graus de uma janela para modelar o rosto."},{"title":"Preenchimento e contraste","body":"O lado oposto à luz principal pode ficar escuro (alto contraste) ou receber luz rebatida (baixo contraste). A escolha define o clima.","example":"Um papel branco segurado do lado oposto suaviza sombras sem equipamento."},{"title":"Luz de recorte","body":"Uma luz por trás separa o personagem do fundo e dá profundidade.","example":"Posicionar o entrevistado com uma vitrine iluminada atrás, sem estourar a imagem."}],"assignment":"Grave um entrevistado em três configurações de luz: luz frontal, luz a 45 graus com rebatedor improvisado e com luz de recorte. Compare o resultado.","rubric":"Identifiquei a luz principal em cada caso? O rebatedor improvisado funcionou? Qual configuração melhor serve à entrevista?"},"fotografia-direcao:1":{"title":"Profundidade é organizar planos dentro do plano","intro":"Uma imagem com camadas — primeiro plano, plano médio e fundo — parece mais rica e tridimensional. A profundidade orienta o olhar e acrescenta contexto.","steps":[{"title":"Crie camadas","body":"Posicione elementos em distâncias diferentes da câmera. Cada camada pode trazer uma informação.","example":"Lanternas em primeiro plano, personagem no meio e rua movimentada ao fundo."},{"title":"Profundidade de campo","body":"Abertura, distância e lente controlam quanto da imagem fica nítido. Foco seletivo destaca; foco amplo contextualiza.","example":"Abertura grande para isolar o rosto do entrevistado; pequena para mostrar a relação com a rua."},{"title":"Linhas e perspectiva","body":"Linhas convergentes (ruas, trilhos, corredores) criam sensação de profundidade e conduzem o olhar.","example":"Enquadrar uma viela de lilong com as paredes convergindo para o personagem."}],"assignment":"Grave três planos de um mesmo personagem: um plano chapado (sem camadas), um com camadas e um com linhas convergentes. Descreva a diferença de percepção.","rubric":"As camadas acrescentam informação? Usei a profundidade de campo com intenção? As linhas conduzem o olhar ao ponto certo?"},"fotografia-direcao:2":{"title":"Cores e texturas também narram","intro":"A paleta de cores e as texturas de uma cena criam atmosfera e coerência visual. Uma direção de fotografia consciente escolhe locações, horários e ajustes para reforçar a história.","steps":[{"title":"Paleta dominante","body":"Identifique as cores predominantes da cena e decida se quer reforçá-las ou contrastá-las.","example":"Tons quentes de madeira e lanternas numa casa de chá; tons frios de vidro e aço num distrito financeiro."},{"title":"Contraste de cor","body":"Cores complementares (azul e laranja, vermelho e verde) destacam elementos. Use para direcionar atenção.","example":"Um casaco vermelho num fundo de folhagem verde chama o olhar."},{"title":"Textura","body":"Luz lateral revela texturas; luz frontal as esconde. Texturas trazem informação sobre materiais e tempo.","example":"Parede descascada de um shikumen revelada pela luz rasante da tarde."}],"assignment":"Escolha duas locações com paletas opostas e grave 30 segundos em cada uma. Descreva a paleta, um contraste de cor e uma textura relevante de cada.","rubric":"Identifiquei a paleta dominante? Usei contraste de cor com intenção? A textura acrescenta informação à história?"},"fotografia-direcao:3":{"title":"Planejar a imagem antes de filmar","intro":"O desenho visual de cena reúne luz, profundidade, cor e movimento num plano coerente. Planejar evita depender da sorte e garante que cada imagem sirva à narrativa.","steps":[{"title":"Defina a intenção visual","body":"Que sensação a cena deve transmitir? Intimidade, agitação, solidão, abundância? A intenção guia as escolhas técnicas.","example":"Intenção: mostrar a calma de um parque às 6h, contrastando com a cidade acelerada."},{"title":"Faça uma lista de planos","body":"Liste os planos com tamanho, ângulo, movimento, luz e objetivo narrativo de cada um.","example":"Plano 1: geral, fixo, luz suave da manhã — estabelecer o parque. Plano 2: médio, acompanhamento — praticantes de tai chi."},{"title":"Considere condições reais","body":"Horário do sol, clima, movimento de pessoas e autorizações. Tenha um plano alternativo.","example":"Se chover, gravar no pavilhão coberto e usar o som da chuva como elemento."}],"assignment":"Crie um desenho visual para uma sequência de 60 segundos: intenção, lista de 6 planos com especificações e plano B. Grave e compare com o planejado.","rubric":"A intenção visual está clara? A lista de planos é específica? O resultado gravado corresponde ao planejado?"},"roteiro-audiovisual:0":{"title":"Roteiro é uma hipótese visual de história","intro":"Uma boa estrutura de produção orienta o que capturar, mas precisa admitir descobertas imprevistas em campo.","steps":[{"title":"Escreva em duas colunas","body":"Associe imagem/ação a voz/som. Se ambas repetem a mesma informação, busque complementaridade.","example":"Imagem: mãos preparando chá. Voz: contexto de como o processo é aprendido."},{"title":"Defina cobertura mínima","body":"Liste plano geral, ação principal, detalhes, reação, som ambiente e transições.","example":"Cinco cenas e pelo menos três registros de áudio útil."},{"title":"Reescreva após a gravação","body":"Organize a história com o que foi realmente captado e verificado, não com cenas imaginadas.","example":"Se a entrevista contradiz a hipótese, revise a abordagem."}],"assignment":"Monte um roteiro de 60 segundos com cinco linhas de imagem e áudio. Em cada linha, explique a função narrativa.","rubric":"As imagens complementam a voz? Tenho plano de som? A conclusão decorre do material?"},"roteiro-audiovisual:1":{"title":"Imagem de um lado, som do outro","intro":"O roteiro em duas colunas organiza o que se vê (esquerda) e o que se ouve (direita) em sincronia. É o formato mais usado em reportagem e documentário.","steps":[{"title":"Coluna de vídeo","body":"Descreva os planos: tamanho, ação, personagens e textos na tela. Seja específico o suficiente para outra pessoa gravar.","example":"PG — Rua Yunnan, 7h, vapor saindo das cestas de bambu."},{"title":"Coluna de áudio","body":"Narração, falas de entrevistados, som ambiente e música. Indique a duração aproximada.","example":"SOM AMBIENTE (3 s): chiado de óleo. NARRAÇÃO: “Antes das sete, a rua já cheira a massa cozida no vapor.”"},{"title":"Sincronia e complementaridade","body":"Narração e imagem devem se complementar, não repetir. Se a imagem mostra o vapor, a narração pode informar há quanto tempo a banca existe.","example":"Evite narrar “vemos um homem cozinhando” sobre a imagem de um homem cozinhando."}],"assignment":"Escreva um roteiro em duas colunas para um vídeo de 60 segundos com cinco cenas, incluindo som ambiente e pelo menos uma fala de entrevistado.","rubric":"As duas colunas estão sincronizadas? A narração complementa a imagem? Outra pessoa conseguiria gravar a partir do roteiro?"},"roteiro-audiovisual:2":{"title":"Gravar o suficiente para editar bem","intro":"Cobertura é o conjunto de planos que você precisa para montar uma cena com flexibilidade. Sem cobertura, a edição fica presa a poucas opções e a erros sem conserto.","steps":[{"title":"Plano geral, médio e detalhe","body":"Para cada cena importante, grave pelo menos três tamanhos de plano. Isso permite cortes e variação de ritmo.","example":"Cena do vendedor: plano geral da banca, médio do vendedor, detalhe das mãos."},{"title":"Inserts e planos de corte","body":"Detalhes e reações servem para cobrir cortes em entrevistas e dar respiro à narrativa.","example":"Close do preço na placa, rosto de cliente provando, vapor subindo."},{"title":"Duração e som","body":"Grave cada plano por pelo menos 10 segundos estáveis. Grave também 30 segundos de som ambiente de cada locação.","example":"Contar mentalmente até dez antes de mover a câmera."}],"assignment":"Para o roteiro da aula anterior, crie uma lista de cobertura com todos os planos necessários (geral, médio, detalhe, inserts e som ambiente) e grave pelo menos uma cena completa.","rubric":"Cada cena tem três tamanhos de plano? Há inserts suficientes? Os planos têm duração utilizável?"},"roteiro-audiovisual:3":{"title":"O roteiro final se escreve depois de gravar","intro":"A realidade raramente segue o roteiro. Reescrever após a gravação, a partir do material efetivamente captado, é parte essencial do processo documental.","steps":[{"title":"Revise o material bruto","body":"Assista a tudo e anote os melhores momentos, falas fortes e imagens inesperadas. Use minutagem.","example":"02:13 — vendedora ri ao contar como começou; 05:40 — cliente idosa elogia o preço."},{"title":"Ajuste a história ao que existe","body":"Talvez o melhor material conte uma história diferente da planejada. Seja fiel ao que foi registrado, não ao plano original.","example":"Planejou falar de preços, mas o melhor material é sobre a relação entre vendedora e clientes antigos."},{"title":"Reescreva narração e estrutura","body":"Ajuste a narração para complementar as imagens reais. Corte o que não tem material de suporte.","example":"Remover a frase sobre o horário de pico se não houver imagem do pico."}],"assignment":"Revise o material gravado, faça uma decupagem com minutagem e reescreva o roteiro em duas colunas a partir do que foi efetivamente captado.","rubric":"A decupagem tem minutagem? O novo roteiro usa apenas material existente? A história final é fiel ao que foi registrado?"},"captacao-sonora:0":{"title":"Áudio ruim derruba imagem boa","intro":"O público tolera imagem imperfeita, mas abandona vídeos com áudio ruim. Captar som direto com clareza começa por identificar e reduzir ruídos.","steps":[{"title":"Som direto","body":"É o som gravado no momento da filmagem: vozes, ambiente e ações. Ele dá credibilidade e presença ao vídeo.","example":"O som real da conversa entre vendedor e cliente, em vez de narração por cima."},{"title":"Identifique o ruído","body":"Antes de gravar, pare e escute por 10 segundos: ar-condicionado, trânsito, música, vento, eco.","example":"Uma loja com música alta: pedir para baixar o volume ou gravar do lado de fora."},{"title":"Monitore sempre","body":"Use fones de ouvido para escutar o que está sendo gravado. O que você ouve ao vivo é diferente do que o microfone capta.","example":"Descobrir pelos fones que o vento está saturando o microfone e trocar de posição."}],"assignment":"Grave a mesma fala em três locais com ruído diferente. Ouça com fones, descreva os ruídos e indique qual local é aceitável e por quê.","rubric":"Identifiquei os ruídos antes de gravar? Monitorei com fones? Minha escolha de local prioriza a inteligibilidade?"},"captacao-sonora:1":{"title":"A distância do microfone é a decisão mais importante","intro":"Quanto mais perto o microfone está da fonte, mais clara a voz e menor o ruído de fundo. Escolher o tipo de microfone e a posição faz mais diferença que o preço do equipamento.","steps":[{"title":"Tipos de microfone","body":"Lapela: próximo da boca, discreto, ideal para entrevistas. Shotgun (direcional): capta à frente, útil em câmera. Embutido: capta tudo ao redor.","example":"Microfone de lapela no entrevistado em vez do microfone embutido do celular."},{"title":"Posição e distância","body":"Lapela a cerca de um palmo da boca, longe de roupas que farfalham. Direcional apontado para a boca, o mais próximo possível fora do quadro.","example":"Prender o lapela na gola da camisa, não dentro de um casaco de nylon."},{"title":"Vento e manuseio","body":"Use protetor de vento (espuma ou pelúcia) ao ar livre. Evite tocar no microfone durante a gravação.","example":"No Bund, com vento do rio, o protetor de pelúcia é indispensável."}],"assignment":"Grave a mesma fala com microfone embutido a 2 metros, embutido a 30 cm e (se possível) lapela. Compare clareza e ruído.","rubric":"Percebi a diferença de distância? Escolhi a posição sem ruído de roupa? Protegi do vento quando necessário?"},"captacao-sonora:2":{"title":"O som também cria o lugar","intro":"Som ambiente não é ruído: é a assinatura sonora de um lugar. Bem captado, ele situa o público, cria atmosfera e cobre transições na edição.","steps":[{"title":"Paisagem sonora","body":"Cada lugar tem sons característicos: sinos de bicicleta, anúncios de metrô, panelas, conversas. Identificá-los ajuda a narrar.","example":"O anúncio bilíngue das estações do metrô de Xangai é uma assinatura sonora da cidade."},{"title":"Grave ambientes limpos","body":"Grave 30 a 60 segundos de som ambiente de cada locação, sem falas suas por perto. Isso será útil na edição.","example":"Gravar um minuto do mercado sem narração para usar por baixo de várias cenas."},{"title":"Som como narrativa","body":"Um som pode antecipar uma cena, criar transição ou contraste. Silêncio também é um recurso.","example":"Ouvir o som do mercado antes de ver a imagem cria expectativa."}],"assignment":"Grave três ambientes sonoros distintos de 60 segundos cada. Descreva os sons característicos de cada um e proponha como usá-los numa edição.","rubric":"Os três ambientes são distinguíveis apenas pelo som? Gravei sem interferência da minha voz? Propus usos narrativos concretos?"},"captacao-sonora:3":{"title":"Entrevista com som limpo","intro":"Captar uma entrevista exige combinar posicionamento do microfone, escolha do local, controle do ambiente e monitoramento constante. É onde todas as técnicas de som se encontram.","steps":[{"title":"Prepare o ambiente","body":"Escolha local com menos ruído, evite paredes de vidro (eco) e peça para desligar aparelhos barulhentos quando possível.","example":"Entrevistar o lojista no fundo da loja, longe da porta para a rua."},{"title":"Teste antes de começar","body":"Peça ao entrevistado para falar algo simples (nome, o que comeu no café da manhã) e ajuste níveis enquanto ouve nos fones.","example":"Ajustar o ganho para que a voz fique forte sem distorcer."},{"title":"Cuide da sua voz e dos silêncios","body":"Evite sobrepor sua voz às respostas (“uhum”, “sei”). Use gestos de concordância silenciosos para facilitar a edição.","example":"Acenar com a cabeça em vez de dizer “aham” durante a resposta."}],"assignment":"Grave uma entrevista de 3 minutos com teste de áudio, monitoramento e sem sobreposição da sua voz. Avalie a inteligibilidade em uma escuta sem fones.","rubric":"Fiz teste de áudio antes? Evitei sobrepor minha voz? A fala é inteligível mesmo em caixas de som comuns?"},"edicao-pos:0":{"title":"Editar começa por organizar","intro":"Antes de cortar, é preciso conhecer e organizar o material: nomear arquivos, selecionar os melhores takes e marcar momentos importantes. Organização economiza horas de edição.","steps":[{"title":"Estrutura de pastas e nomes","body":"Separe vídeo, áudio, imagens e música. Nomeie arquivos com data, local e conteúdo.","example":"/2026-10-14_mercado/video/entrevista_vendedora_take2.mp4"},{"title":"Decupagem","body":"Assista a todo o material e anote minutagem dos melhores momentos, falas fortes e problemas técnicos.","example":"Take 2, 01:35–02:10: melhor resposta sobre a história da banca."},{"title":"Seleção de takes","body":"Escolha o melhor take de cada plano considerando foco, estabilidade, som e conteúdo. Descarte com critério.","example":"Take 3 tem melhor fala, mas foco ruim; take 2 tem fala boa e imagem limpa — escolher o 2."}],"assignment":"Organize o material de uma gravação: estrutura de pastas, renomeação de arquivos e decupagem com minutagem de pelo menos 10 momentos.","rubric":"Os arquivos estão nomeados de forma consistente? A decupagem tem minutagem? Justifiquei a escolha dos takes?"},"edicao-pos:1":{"title":"O ritmo é a respiração do vídeo","intro":"Montagem é a ordem e a duração dos planos. O ritmo — rápido, lento, alternado — afeta a compreensão e a emoção. Cortes devem servir à história, não à moda.","steps":[{"title":"Duração dos planos","body":"Planos longos dão tempo para observar; planos curtos aceleram. Ajuste conforme a quantidade de informação na imagem.","example":"Um plano geral cheio de detalhes precisa de mais tempo que um close simples."},{"title":"Variação de tamanhos","body":"Alternar planos gerais, médios e detalhes mantém o interesse e orienta o público no espaço.","example":"Geral do mercado → médio da banca → detalhe das mãos → reação do cliente."},{"title":"Corte com motivo","body":"Corte quando a informação do plano foi entregue, numa ação ou num som. Cortes sem motivo cansam.","example":"Cortar quando o vendedor entrega o pacote, não no meio de um gesto sem conclusão."}],"assignment":"Edite a mesma sequência de 30 segundos em dois ritmos (lento e rápido). Descreva como cada versão muda a percepção da cena.","rubric":"As duas versões usam o mesmo material? Os cortes têm motivo? Identifiquei qual ritmo serve melhor à história?"},"edicao-pos:2":{"title":"Uma boa edição sobrevive sem música","intro":"Voz, som ambiente, trilha e silêncio formam a camada sonora do vídeo. Música não deve esconder falhas de estrutura: se a história não funciona sem ela, o problema está na montagem.","steps":[{"title":"Voz em primeiro lugar","body":"Narração e falas devem estar claras e em volume consistente. Todo o resto fica abaixo da voz.","example":"Reduzir o som ambiente quando o entrevistado começa a falar."},{"title":"Música com função","body":"Use música para marcar transições, criar atmosfera ou ritmo — não por hábito. Respeite licenças.","example":"Música apenas na abertura e no encerramento, deixando o som real no miolo."},{"title":"O silêncio comunica","body":"Pausas sem narração deixam o público absorver uma imagem forte. Silêncio absoluto, porém, soa como erro — mantenha um mínimo de ambiente.","example":"Após uma fala emocionante, três segundos só com som ambiente."}],"assignment":"Edite uma sequência de 60 segundos sem música, usando apenas voz e som ambiente. Depois adicione música em um único trecho e justifique a escolha.","rubric":"A versão sem música funciona sozinha? A voz está sempre clara? A música adicionada tem função específica e licença adequada?"},"edicao-pos:3":{"title":"Os últimos 10% fazem a diferença","intro":"Acabamento inclui correção de cor, mixagem de áudio, legendas, créditos e exportação adequada. É o que separa um vídeo amador de um trabalho cuidadoso e acessível.","steps":[{"title":"Cor e consistência","body":"Corrija exposição e balanço de branco para que planos da mesma cena pareçam contínuos. Evite filtros que alterem a realidade documental.","example":"Igualar a temperatura de cor de dois planos gravados em horários diferentes."},{"title":"Legendas e acessibilidade","body":"Legendas ajudam quem assiste sem som, pessoas surdas e públicos de outros idiomas. Revise ortografia e sincronia.","example":"Legendar a fala em mandarim com tradução revisada e identificar a fonte."},{"title":"Créditos e exportação","body":"Inclua créditos de músicas, imagens de terceiros e colaboradores. Exporte no formato e resolução adequados à plataforma.","example":"Vertical 1080×1920 para vídeo curto; horizontal 1920×1080 para YouTube."}],"assignment":"Finalize um vídeo curto com correção de cor, mixagem, legendas revisadas e créditos. Exporte em dois formatos para plataformas diferentes.","rubric":"A cor está consistente entre planos? As legendas estão revisadas e sincronizadas? Os créditos estão completos?"},"documentario:0":{"title":"Todo documentário nasce de uma pergunta","intro":"A premissa é a pergunta ou ideia central que o documentário explora. A pesquisa prévia testa se essa premissa é viável, relevante e honesta antes de gastar tempo gravando.","steps":[{"title":"Formule a pergunta central","body":"Uma boa premissa é aberta, específica e permite descobertas. Evite premissas que já trazem a resposta.","example":"Fraca: “Mostrar que os lilongs são lindos”. Forte: “O que acontece com a vida comunitária quando um lilong é reformado?”"},{"title":"Pesquise antes de filmar","body":"Leia, converse, visite. Descubra o que já foi feito sobre o tema, quem são as pessoas-chave e o que é possível gravar.","example":"Visitar o bairro três vezes antes de levar a câmera, conversando com moradores."},{"title":"Teste a viabilidade","body":"Há personagens dispostos? Há acesso aos lugares? Há tempo para acompanhar mudanças? Ajuste a premissa à realidade.","example":"Se a reforma só começa daqui a um ano, focar nos moradores que esperam a mudança."}],"assignment":"Escreva a premissa de um minidocumentário (uma pergunta central), um resumo de pesquisa de 200 palavras e uma análise de viabilidade com acesso, personagens e tempo.","rubric":"A pergunta central é aberta e específica? A pesquisa foi feita antes de gravar? A viabilidade foi avaliada com honestidade?"},"documentario:1":{"title":"Histórias reais precisam de pessoas reais","intro":"Personagens dão rosto à pergunta do documentário. O conflito — uma tensão, um desafio, uma mudança — move a narrativa. Ambos devem ser encontrados, não inventados.","steps":[{"title":"Escolha de personagens","body":"Bons personagens têm relação direta com a pergunta, disposição para participar e algo em jogo. Diversidade de perspectivas enriquece.","example":"Uma moradora antiga que resiste à mudança e um jovem que vê oportunidade."},{"title":"Conflito real","body":"Conflito não é briga: é tensão entre desejos e obstáculos. Pode ser interno, social ou com o tempo.","example":"A moradora quer ficar, mas o custo de vida aumenta a cada ano."},{"title":"Ética da relação","body":"Personagens confiam em você. Explique o projeto, combine limites, não prometa o que não pode cumprir e evite expor vulnerabilidades sem consentimento.","example":"Combinar que conversas sobre a saúde da moradora não serão gravadas."}],"assignment":"Identifique dois ou três personagens possíveis para o seu documentário. Descreva a relação de cada um com a pergunta, o conflito e os combinados éticos necessários.","rubric":"Os personagens se relacionam diretamente com a pergunta? O conflito é real e não fabricado? Previ combinados éticos?"},"documentario:2":{"title":"Observar sem interferir","intro":"A cobertura observacional registra a vida acontecendo, com o mínimo de interferência. Ela exige paciência, presença discreta e disposição para esperar momentos verdadeiros.","steps":[{"title":"Paciência e tempo","body":"Momentos reveladores raramente acontecem nos primeiros minutos. Fique tempo suficiente para que as pessoas se acostumem à câmera.","example":"Passar uma manhã inteira na banca antes de esperar algo significativo."},{"title":"Discrição técnica","body":"Equipamento pequeno, sem luzes extras e posições estáveis reduzem a interferência. Evite dirigir as ações.","example":"Câmera num canto da loja com lente média, em vez de circular com o equipamento."},{"title":"Cobertura que permite montar","body":"Mesmo observando, grave diferentes tamanhos de plano, reações e detalhes, e som ambiente constante.","example":"Durante uma conversa espontânea, alternar entre plano médio e detalhes das mãos."}],"assignment":"Faça uma sessão de observação de pelo menos uma hora com um personagem, gravando sem dirigir ações. Registre os três momentos mais significativos e por que aconteceram.","rubric":"Fiquei tempo suficiente? Evitei dirigir as ações? Os momentos registrados são espontâneos?"},"documentario:3":{"title":"Estruturar o real sem traí-lo","intro":"Montar um documentário é organizar momentos reais numa estrutura que responda à pergunta central. Toda montagem é uma interpretação; a ética exige que ela não distorça os fatos.","steps":[{"title":"Estrutura em atos","body":"Apresentação (pergunta e personagens), desenvolvimento (conflitos e descobertas) e desfecho (resposta, mudança ou reflexão).","example":"Ato 1: o lilong e a moradora. Ato 2: a notícia da reforma. Ato 3: o que mudou meses depois."},{"title":"Ordem e verdade","body":"Reorganizar cenas é comum, mas não pode criar relações de causa que não existiram.","example":"Não montar a reação triste da moradora logo após a notícia, se a tristeza veio de outro assunto."},{"title":"Feche com significado","body":"O final deve retornar à pergunta central. Pode não haver resposta definitiva, mas deve haver reflexão sustentada pelo material.","example":"“Talvez a comunidade não dependa das casas, mas das pessoas que continuam se encontrando no pátio.”"}],"assignment":"Crie a estrutura de um minidocumentário de cinco minutos em três atos, com lista de cenas, duração estimada e a frase de fechamento. Indique onde poderia haver risco de distorção.","rubric":"A estrutura responde à pergunta central? Identifiquei riscos de distorção? O fechamento é sustentado pelo material?"},"jornalismo-digital:0":{"title":"Ler na tela é ler em saltos","intro":"No digital, o público escaneia, pula, clica e volta. Hipertexto, títulos e intertítulos organizam a leitura não linear e permitem aprofundar sem sobrecarregar.","steps":[{"title":"Leitura em varredura","body":"Leitores digitais escaneiam títulos, intertítulos, negritos e imagens antes de decidir ler. A estrutura precisa funcionar nessa varredura.","example":"Intertítulos informativos: “Quanto custa”, “Como chegar”, “O que dizem os moradores”."},{"title":"Links como contexto","body":"Links permitem oferecer fontes, documentos e aprofundamentos sem interromper o texto principal. Devem ser relevantes e descritivos.","example":"Linkar o documento oficial no trecho “segundo o plano urbano de 2025”, não em “clique aqui”."},{"title":"Camadas de profundidade","body":"Ofereça um resumo para quem tem pressa e aprofundamento para quem quer mais. Cada camada deve ser útil por si.","example":"Resumo em três tópicos no topo, reportagem completa abaixo, documentos em links."}],"assignment":"Reestruture um texto seu para leitura digital: título informativo, resumo em três tópicos, intertítulos e pelo menos três links para fontes.","rubric":"A estrutura funciona numa leitura em varredura? Os links são descritivos e relevantes? O resumo se sustenta sozinho?"},"jornalismo-digital:1":{"title":"Cada formato faz um trabalho diferente","intro":"No jornalismo digital, texto, foto, vídeo, áudio e gráficos podem ser combinados. Multiformato não é repetir o mesmo conteúdo em todos: é dar a cada formato a parte da história que ele conta melhor.","steps":[{"title":"O que cada formato faz melhor","body":"Texto: contexto e detalhe. Foto: momento e expressão. Vídeo: ação e ambiente. Áudio: voz e intimidade. Gráfico: comparação e tendência.","example":"Reportagem sobre um mercado: texto com história, fotos dos vendedores, vídeo do movimento, gráfico de preços."},{"title":"Evite redundância","body":"Se o vídeo mostra a fila, o texto não precisa descrevê-la longamente. Use o espaço para informação que o vídeo não dá.","example":"Vídeo mostra a fila; texto informa quanto tempo as pessoas esperam e por quê."},{"title":"Coerência entre formatos","body":"Números, nomes e datas devem ser idênticos em todos os formatos. Inconsistências minam a confiança.","example":"Se o texto diz 300 bancas, a legenda do vídeo não pode dizer 350."}],"assignment":"Planeje uma reportagem multiformato definindo qual parte da história cada formato contará (pelo menos quatro formatos). Verifique se há redundância.","rubric":"Cada formato tem função própria? Eliminei redundâncias? As informações são consistentes entre formatos?"},"jornalismo-digital:2":{"title":"Publicar rápido sem publicar errado","intro":"O ritmo digital pressiona por velocidade. Uma rotina de verificação no momento da publicação evita erros que se espalham rapidamente e são difíceis de corrigir.","steps":[{"title":"Checklist de publicação","body":"Antes de publicar: nomes, números, datas, links funcionando, créditos, legendas e título fiel ao conteúdo.","example":"Clicar em todos os links e conferir que levam à fonte correta."},{"title":"Títulos fiéis","body":"O título deve corresponder ao que o conteúdo demonstra. Títulos exagerados geram cliques e desconfiança.","example":"Evitar “O mercado mais barato do mundo” quando você comparou cinco mercados de uma cidade."},{"title":"Correções transparentes","body":"Erros acontecem. Corrija de forma visível, informando o que mudou e quando, sem apagar silenciosamente.","example":"“Correção, 15/10: o preço correto é 25 yuan, não 52, como publicado anteriormente.”"}],"assignment":"Crie um checklist de publicação digital com 12 itens e um modelo de nota de correção. Aplique o checklist a um conteúdo antes de publicá-lo.","rubric":"O checklist cobre fatos, links, créditos e título? A nota de correção é transparente? Apliquei de fato antes de publicar?"},"jornalismo-digital:3":{"title":"Uma história, todos os recursos em harmonia","intro":"A história integrada combina título, contexto, fontes e mídias numa experiência coerente. É a síntese das aulas anteriores: estrutura digital, multiformato e verificação.","steps":[{"title":"Arquitetura da página","body":"Defina a ordem: título, resumo, mídia principal, texto com intertítulos, mídias de apoio, fontes e créditos.","example":"Vídeo de 90 segundos no topo, seguido de texto com fotos intercaladas e gráfico no meio."},{"title":"Contexto e fontes visíveis","body":"Data, local, autor, método e fontes devem estar claros. Transparência faz parte da experiência.","example":"Box ao final: “Como fizemos esta reportagem”."},{"title":"Teste com um leitor","body":"Peça a alguém que leia e diga o que entendeu. Ajuste o que gerou confusão.","example":"Se o leitor não percebeu que os preços são de um único dia, destaque essa informação."}],"assignment":"Publique (ou monte como protótipo) uma história integrada com título, resumo, três mídias coordenadas, fontes e box de método. Teste com um leitor e registre ajustes.","rubric":"A página tem arquitetura clara? Fontes e método estão visíveis? Fiz ajustes a partir do teste com leitor?"},"producao-youtube:0":{"title":"Um episódio é uma promessa ao público","intro":"Uma proposta de episódio define tema, pergunta, público e o que a pessoa vai levar ao final. Promessa clara atrai o público certo e orienta toda a produção.","steps":[{"title":"Tema e pergunta","body":"Transforme o tema em pergunta que o episódio responde. Isso dá direção e sensação de progresso.","example":"Tema: comida de rua. Pergunta: “O que dá para comer bem em Xangai com 30 yuan?”"},{"title":"Público e nível","body":"Quem vai assistir? Turistas, curiosos, estudantes? Isso define o nível de explicação e as referências.","example":"Público brasileiro que nunca foi à China: explicar o que é um jianbing."},{"title":"Entrega ao final","body":"Defina o que o espectador terá ao final: informação útil, experiência, reflexão. A promessa deve ser cumprida.","example":"“Ao final, você terá uma lista de cinco comidas, preços e onde encontrá-las.”"}],"assignment":"Escreva a proposta de três episódios com tema, pergunta, público e entrega. Escolha um e justifique.","rubric":"As perguntas são específicas? O público está definido? A entrega é concreta e realizável?"},"producao-youtube:1":{"title":"Os primeiros 30 segundos decidem tudo","intro":"A abertura apresenta a promessa, o tom e o motivo para continuar assistindo. Ritmo é a cadência de informações e mudanças ao longo do vídeo. Ambos devem ser honestos, sem iscas falsas.","steps":[{"title":"Gancho honesto","body":"Comece com uma imagem, pergunta ou fato que represente o melhor do episódio — algo que realmente aparece depois.","example":"Abrir com o momento em que você prova o jianbing e reage, seguido da pergunta do episódio."},{"title":"Promessa explícita","body":"Nos primeiros segundos, diga o que o episódio vai entregar. O público decide se fica.","example":"“Hoje vou testar cinco comidas de rua por menos de 30 yuan e dizer qual vale mais a pena.”"},{"title":"Ritmo variado","body":"Alterne tipos de conteúdo: fala para câmera, cenas, entrevistas, gráficos. Mudanças a cada 20–40 segundos ajudam a manter atenção.","example":"Fala para câmera → cena na barraca → preço na tela → reação → próximo local."}],"assignment":"Grave três versões de abertura (30 segundos) para o mesmo episódio. Escolha a melhor e explique por que é honesta e eficaz.","rubric":"O gancho aparece realmente no episódio? A promessa está clara nos primeiros segundos? A abertura evita exageros?"},"producao-youtube:2":{"title":"Capítulos ajudam o público e a história","intro":"Dividir o episódio em capítulos organiza a progressão, facilita a navegação e torna o conteúdo mais útil. Cada capítulo deve ter uma função clara.","steps":[{"title":"Estrutura em blocos","body":"Divida o episódio em blocos com começo e fim. Cada bloco responde a uma parte da pergunta central.","example":"1. Introdução; 2. Jianbing; 3. Shengjianbao; 4. Cong you bing; 5. Comparação final."},{"title":"Títulos de capítulo úteis","body":"Use títulos que informem o conteúdo, não apenas numerações. Eles funcionam como sumário.","example":"“03:45 — Shengjianbao: o pão frito com caldo”."},{"title":"Progressão e clímax","body":"Organize os capítulos para que o interesse cresça. A comparação ou conclusão deve vir no momento de maior expectativa.","example":"Deixar a avaliação final e a recomendação para o último capítulo."}],"assignment":"Crie o roteiro de um episódio de cinco minutos com pelo menos cinco capítulos, minutagem estimada e títulos informativos.","rubric":"Cada capítulo tem função clara? Os títulos informam o conteúdo? A progressão leva a um ponto alto?"},"producao-youtube:3":{"title":"Publicar é também planejar a leitura dos dados","intro":"Título, miniatura, descrição e capítulos influenciam quem encontra e assiste ao vídeo. Depois de publicar, as métricas mostram o que funcionou — se forem lidas com critério.","steps":[{"title":"Metadados honestos","body":"Título e miniatura devem representar o conteúdo. A descrição deve incluir resumo, capítulos, fontes e créditos.","example":"Descrição com lista de locais, preços e data de gravação."},{"title":"Métricas principais","body":"Taxa de cliques (CTR) mostra se título e miniatura atraem; retenção mostra se o conteúdo mantém. Uma sem a outra engana.","example":"CTR alto com retenção baixa pode indicar promessa que o vídeo não cumpre."},{"title":"Aprenda com o gráfico de retenção","body":"Quedas bruscas indicam momentos de desinteresse; picos mostram trechos revistos. Use isso para melhorar os próximos episódios.","example":"Queda no minuto 2: talvez a explicação sobre o bairro tenha ficado longa."}],"assignment":"Prepare título, descrição completa (resumo, capítulos, fontes, créditos) e conceito de miniatura para seu episódio. Liste três métricas que você acompanhará e o que cada uma indicaria.","rubric":"Os metadados representam o conteúdo? A descrição inclui fontes e créditos? Sei interpretar cada métrica escolhida?"},"producao-redes:0":{"title":"Os primeiros segundos sem enganar","intro":"Em vídeos curtos, a decisão de continuar assistindo acontece em poucos segundos. O desafio é capturar atenção com algo verdadeiro e relevante, não com sensacionalismo.","steps":[{"title":"Comece pelo mais interessante","body":"Não use introduções longas. Abra com a imagem, pergunta ou fato mais forte do conteúdo.","example":"Abrir com o vapor saindo de 20 cestas de bambu e a pergunta: “Quantos bolinhos essa banca vende por dia?”"},{"title":"Texto na tela","body":"Muitas pessoas assistem sem som. Um texto curto nos primeiros segundos situa o tema.","example":"“Mercado de 1930 que ainda funciona em Xangai”."},{"title":"Evite iscas falsas","body":"Promessas que o vídeo não cumpre geram frustração e desconfiança. O gancho deve ser resolvido no próprio vídeo.","example":"Não escrever “você não vai acreditar” se a informação é comum."}],"assignment":"Crie três aberturas de 3 segundos para o mesmo vídeo curto, uma delas com texto na tela. Teste com pessoas e escolha a mais eficaz e honesta.","rubric":"As aberturas mostram algo que o vídeo entrega? O texto na tela é claro sem som? Evitei promessas exageradas?"},"producao-redes:1":{"title":"Um minuto com começo, meio e fim","intro":"Vídeos curtos também precisam de estrutura: gancho, desenvolvimento rápido e fechamento. A brevidade exige escolha rigorosa do essencial.","steps":[{"title":"Gancho, contexto e desenvolvimento","body":"Gancho (0–3 s), contexto mínimo (3–10 s), desenvolvimento com duas ou três informações (10–50 s).","example":"Gancho: vapor. Contexto: “Esta banca funciona há 40 anos”. Desenvolvimento: preço, quantidade vendida, fala do dono."},{"title":"Uma ideia central","body":"Um vídeo curto não comporta várias histórias. Escolha uma ideia e corte o resto.","example":"Focar no tempo de funcionamento da banca, deixando a história do bairro para outro vídeo."},{"title":"Fechamento","body":"Termine com conclusão, informação útil ou pergunta. Evite finais abruptos.","example":"“Endereço na legenda — e chegue antes das 8h.”"}],"assignment":"Roteirize e grave um vídeo de 60 segundos com gancho, contexto, desenvolvimento e fechamento cronometrados.","rubric":"A estrutura está cronometrada? Há apenas uma ideia central? O fechamento é útil ou reflexivo?"},"producao-redes:2":{"title":"Pensar na tela vertical","intro":"O formato vertical muda composição, tamanho de texto e posição dos elementos. Legibilidade em telas pequenas é uma questão de acessibilidade e eficácia.","steps":[{"title":"Composição vertical","body":"Centralize o elemento principal e use a altura da tela. Planos fechados e médios funcionam melhor que gerais.","example":"Enquadrar o vendedor do peito para cima, com as cestas de bambu abaixo."},{"title":"Zonas seguras","body":"Interfaces das plataformas cobrem partes da tela (botões, legendas, nome). Mantenha textos importantes na área central.","example":"Evitar texto nos 20% inferiores, onde ficam a descrição e os botões."},{"title":"Texto legível","body":"Fontes grandes, alto contraste e pouco texto por vez. Legendas sincronizadas ajudam quem assiste sem som.","example":"Máximo de cinco a sete palavras por bloco de texto na tela."}],"assignment":"Adapte um vídeo horizontal para vertical: recompondo planos, posicionando textos em zonas seguras e legendando. Teste em um celular.","rubric":"Os elementos principais estão centralizados? Os textos estão fora das zonas cobertas? A leitura é confortável no celular?"},"producao-redes:3":{"title":"Encurtar sem apagar o contexto","intro":"Adaptar uma reportagem longa para vídeo curto exige cortar sem distorcer. Contexto essencial — data, local, fonte, limites — não pode ser sacrificado pela brevidade.","steps":[{"title":"Identifique o núcleo","body":"Qual é a informação mais importante e verificada da reportagem? Ela será o centro do vídeo curto.","example":"Reportagem de dois minutos sobre preços: núcleo é a diferença entre dois bairros."},{"title":"Preserve o contexto mínimo","body":"Data, local e fonte podem aparecer em texto na tela ou na legenda. Ressalvas importantes não devem desaparecer.","example":"“Preços coletados em 14/10/2026, cinco cafés por bairro.”"},{"title":"Indique o conteúdo completo","body":"Direcione para a reportagem completa quando houver mais contexto disponível.","example":"“Reportagem completa no canal — link na bio.”"}],"assignment":"Adapte uma reportagem de dois minutos para um vídeo de um minuto. Liste o que foi cortado e verifique se alguma ressalva essencial se perdeu.","rubric":"O núcleo da reportagem foi preservado? O contexto mínimo está presente? Algum corte altera o sentido?"},"design-editorial:0":{"title":"O olho lê na ordem que você desenha","intro":"Hierarquia visual define a ordem em que o público lê uma página, uma capa ou uma tela. Tamanho, peso, cor e posição dizem o que é mais importante.","steps":[{"title":"Níveis de hierarquia","body":"Título, subtítulo, intertítulo, texto e legenda devem ser claramente distintos. Três ou quatro níveis bastam.","example":"Título em 32 pt negrito, subtítulo em 18 pt regular, texto em 12 pt."},{"title":"Escolha tipográfica","body":"Fontes com boa legibilidade e no máximo duas famílias. Serifadas e sem serifa podem se combinar para criar contraste.","example":"Título em fonte serifada editorial, texto em sem serifa legível."},{"title":"Espaço em branco","body":"Espaço vazio organiza, separa e dá respiro. Páginas lotadas dificultam a leitura.","example":"Margens generosas ao redor do título destacam sem precisar aumentar o tamanho."}],"assignment":"Redesenhe uma página ou slide de conteúdo seu com três níveis de hierarquia claros, duas famílias tipográficas no máximo e uso intencional de espaço em branco.","rubric":"A ordem de leitura está clara? Usei no máximo duas fontes? O espaço em branco ajuda a organizar?"},"design-editorial:1":{"title":"A imagem principal carrega a página","intro":"Em design editorial, a imagem principal define o tom e atrai o olhar. Contraste entre imagem e texto garante legibilidade e equilíbrio.","steps":[{"title":"Escolha da imagem principal","body":"Prefira imagens com um ponto focal claro, que representem a história e funcionem em tamanho reduzido.","example":"Close do rosto de uma vendedora em vez de um plano geral confuso do mercado."},{"title":"Contraste com texto","body":"Texto sobre imagem precisa de contraste suficiente: área escura ou clara, sombra, faixa de cor.","example":"Título branco sobre área escura do céu, nunca sobre detalhes coloridos."},{"title":"Equilíbrio visual","body":"Distribua elementos para que a página não pareça pesada de um lado. Imagem e texto devem dialogar.","example":"Imagem à esquerda com olhar direcionado para o título à direita."}],"assignment":"Monte duas versões de capa com a mesma imagem: uma com bom contraste e outra com problemas. Explique os problemas e como foram resolvidos.","rubric":"A imagem tem ponto focal claro? O texto é legível na versão boa? Identifiquei os problemas de contraste da versão ruim?"},"design-editorial:2":{"title":"Consistência cria identidade","intro":"Um sistema editorial define regras visuais que se repetem: cores, fontes, grids, estilos de legenda e de gráfico. Consistência transmite profissionalismo e facilita a produção.","steps":[{"title":"Grid","body":"Uma grade invisível organiza a posição de textos e imagens. Ela garante alinhamento e consistência entre páginas.","example":"Grid de 12 colunas para web; títulos sempre alinhados à primeira coluna."},{"title":"Paleta e tipografia fixas","body":"Defina cores principais, secundárias e de destaque, além de estilos de texto para cada nível.","example":"Cor principal para títulos de série; cor de destaque só para dados."},{"title":"Componentes reutilizáveis","body":"Crie modelos para legendas, citações, boxes e gráficos. Isso acelera a produção e mantém coerência.","example":"Modelo de box “Como fizemos” usado em todas as reportagens."}],"assignment":"Crie um mini-guia de sistema editorial para seu canal ou projeto: grid, paleta, tipografia e três componentes reutilizáveis. Aplique-o a duas peças diferentes.","rubric":"O guia define regras claras? As duas peças parecem da mesma série? Os componentes são realmente reutilizáveis?"},"design-editorial:3":{"title":"Miniatura que informa, não que engana","intro":"A miniatura é a capa do vídeo. Ela deve comunicar o tema com clareza em tamanho pequeno, sem exageros que traiam o conteúdo.","steps":[{"title":"Legível em tamanho pequeno","body":"Poucos elementos, rosto ou objeto em destaque e texto curto (até quatro palavras). Teste em tamanho de celular.","example":"Close de um jianbing com o texto “30 yuan”."},{"title":"Coerência com o título","body":"Miniatura e título devem se complementar, não repetir. Juntos, devem comunicar a promessa do vídeo.","example":"Título: “5 comidas de rua em Xangai”; miniatura: um prato com o preço."},{"title":"Honestidade","body":"Evite expressões exageradas, setas para nada ou imagens que não estão no vídeo. A miniatura é uma promessa.","example":"Usar um frame real do vídeo, não uma imagem de banco."}],"assignment":"Crie três miniaturas para o mesmo vídeo e teste-as em tamanho de celular com outras pessoas. Escolha a mais clara e honesta.","rubric":"As miniaturas são legíveis em tamanho pequeno? Complementam o título? Usam imagens reais do vídeo?"},"audiencia-estrategia:0":{"title":"Conhecer quem assiste muda o que você produz","intro":"Estratégia editorial começa por entender o público: quem é, o que sabe, do que precisa e como consome conteúdo. Isso orienta temas, formatos e linguagem.","steps":[{"title":"Perfis de público","body":"Descreva grupos com necessidades diferentes, sem estereótipos. Baseie-se em dados e conversas reais.","example":"Viajantes planejando ir a Xangai; estudantes de jornalismo; brasileiros morando na China."},{"title":"Necessidades informativas","body":"Cada perfil busca algo diferente: serviço, contexto, inspiração, aprendizado.","example":"Viajantes buscam serviço (preços, rotas); estudantes buscam técnica e análise."},{"title":"Escuta contínua","body":"Comentários, mensagens e perguntas frequentes mostram o que o público quer entender. Registre e analise.","example":"Muitas perguntas sobre pagamento digital indicam pauta de serviço necessária."}],"assignment":"Descreva três perfis de público para seu projeto, com necessidades informativas e evidências (comentários, conversas, dados). Proponha uma pauta para cada um.","rubric":"Os perfis se baseiam em evidências? Evitei estereótipos? As pautas atendem necessidades reais?"},"audiencia-estrategia:1":{"title":"Ser encontrado sem se perder","intro":"Distribuição é levar o conteúdo ao público certo, nas plataformas certas, no momento adequado. Descoberta depende de busca, recomendação e compartilhamento.","steps":[{"title":"Plataformas e formatos","body":"Cada plataforma favorece formatos e comportamentos diferentes. Adapte, não apenas replique.","example":"Vídeo longo no YouTube; trecho vertical nas redes; texto com fotos no blog."},{"title":"Busca e palavras-chave","body":"Use termos que o público realmente pesquisa em títulos e descrições, sem exagero.","example":"“Como usar o metrô de Xangai” em vez de “Aventuras subterrâneas”."},{"title":"Comunidade e compartilhamento","body":"Responder comentários, colaborar com outros criadores e participar de comunidades amplia o alcance de forma sustentável.","example":"Responder perguntas frequentes num vídeo de acompanhamento."}],"assignment":"Monte um plano de distribuição para um conteúdo: plataformas, adaptações, palavras-chave e ações de comunidade, com calendário de uma semana.","rubric":"Adaptei o conteúdo a cada plataforma? As palavras-chave são realistas? O plano inclui interação com a comunidade?"},"audiencia-estrategia:2":{"title":"Métricas respondem perguntas — se você fizer as certas","intro":"Métricas são indicadores, não verdades absolutas. Ler dados com espírito crítico evita decisões baseadas em números de vaidade ou em interpretações apressadas.","steps":[{"title":"Métricas de vaidade versus úteis","body":"Visualizações e seguidores impressionam, mas retenção, comentários relevantes e retorno do público dizem mais sobre qualidade.","example":"Um vídeo com menos visualizações e alta retenção pode ser mais valioso."},{"title":"Contexto e comparação","body":"Compare com seus próprios conteúdos semelhantes, no mesmo período. Fatores externos (feriados, algoritmo) influenciam.","example":"Um vídeo publicado durante a Semana Dourada pode ter desempenho atípico."},{"title":"Correlação não é causa","body":"Um título com número pode ter ido bem por outros motivos. Teste mudanças isoladamente antes de concluir.","example":"Testar dois títulos para o mesmo tipo de conteúdo antes de decidir que números funcionam."}],"assignment":"Analise as métricas de três conteúdos seus (ou dados simulados). Escreva três conclusões, indicando o grau de certeza de cada uma e o que testaria para confirmar.","rubric":"Diferenciei métricas de vaidade de métricas úteis? Considerei o contexto? Evitei confundir correlação com causa?"},"audiencia-estrategia:3":{"title":"Uma série constrói relação com o público","intro":"Séries criam expectativa, hábito e profundidade. Planejar uma série envolve tema, formato fixo, frequência e indicadores de sucesso definidos antes de começar.","steps":[{"title":"Conceito da série","body":"Tema amplo o suficiente para vários episódios e específico o suficiente para ter identidade.","example":"“Uma rua por semana”: cada episódio explora uma rua de Xangai com o mesmo formato."},{"title":"Formato fixo","body":"Estrutura, duração e elementos recorrentes ajudam o público a reconhecer e a produção a se organizar.","example":"Sempre: abertura na esquina, três personagens, um dado, uma recomendação."},{"title":"Indicadores de sucesso","body":"Defina antes como medir: retenção média, comentários com perguntas, público recorrente. Avalie após alguns episódios.","example":"Meta: retenção acima de 50% e pelo menos 10 comentários com perguntas por episódio."}],"assignment":"Planeje uma série de seis episódios: conceito, formato fixo, lista de temas, frequência e três indicadores de sucesso com metas.","rubric":"O conceito sustenta seis episódios? O formato é reconhecível? Os indicadores são úteis e mensuráveis?"},"jornalismo-cultural:0":{"title":"Toda obra nasce num tempo e num lugar","intro":"Jornalismo cultural não é só agenda de eventos. É explicar obras, artistas e manifestações dentro de seus contextos históricos, sociais e estéticos, para que o público compreenda além do gosto pessoal.","steps":[{"title":"Contexto histórico","body":"Quando e em que circunstâncias a obra foi criada? Que acontecimentos influenciaram o artista?","example":"Uma exposição de cartazes dos anos 1930 de Xangai ganha sentido quando se explica o papel da cidade como centro gráfico e comercial."},{"title":"Contexto social","body":"Quem produz, quem consome e quem fica de fora? A cultura reflete e questiona relações sociais.","example":"Um festival de música independente num antigo armazém industrial fala também da transformação urbana."},{"title":"Contexto estético","body":"Que linguagens, técnicas e tradições a obra usa ou rompe? Comparar ajuda o público a perceber escolhas.","example":"Explicar como uma artista contemporânea retoma a caligrafia tradicional em instalações de luz."}],"assignment":"Escolha uma manifestação cultural em Xangai (exposição, show, espaço) e escreva 200 palavras de contexto histórico, social e estético, com fontes indicadas.","rubric":"Os três contextos estão presentes? As informações estão atribuídas a fontes? Evitei reduzir a obra ao meu gosto pessoal?"},"jornalismo-cultural:1":{"title":"Descrever antes de avaliar","intro":"Uma boa crítica descreve com precisão antes de julgar. O público precisa entender o que é a obra para avaliar se concorda com a opinião do crítico.","steps":[{"title":"Descrição precisa","body":"Formas, cores, materiais, sons, duração, espaço e percurso. A descrição permite que o público visualize.","example":"“Doze telas de três metros, em tons de cinza, dispostas num corredor escuro que obriga o visitante a caminhar devagar.”"},{"title":"Critérios explícitos","body":"Diga com que critérios está avaliando: coerência, inovação, execução, impacto. Critérios claros tornam a opinião debatível.","example":"“Avalio a exposição pela relação entre as obras e o espaço — e aqui ela funciona.”"},{"title":"Opinião assumida","body":"A crítica é opinião fundamentada. Marque-a como tal e sustente com argumentos ligados à descrição.","example":"“Na minha leitura, a repetição cansa na terceira sala, porque nada novo é proposto.”"}],"assignment":"Escreva uma crítica de 300 palavras de uma obra, exposição ou espetáculo: 60% descrição, 40% avaliação com critérios explícitos.","rubric":"A descrição permite visualizar a obra? Os critérios estão explícitos? A opinião é sustentada por elementos descritos?"},"jornalismo-cultural:2":{"title":"Repertório se constrói com fontes","intro":"O jornalista cultural precisa de repertório: conhecer artistas, movimentos, referências e debates. Esse repertório vem de fontes confiáveis, não de impressões soltas.","steps":[{"title":"Fontes primárias","body":"Os próprios artistas, curadores, textos de exposição, catálogos e entrevistas. Elas explicam intenções e processos.","example":"Ler o texto curatorial e entrevistar o curador sobre a escolha das obras."},{"title":"Fontes especializadas","body":"Pesquisadores, críticos, livros e revistas especializadas oferecem contexto e debate.","example":"Consultar um artigo acadêmico sobre a história do cinema de Xangai."},{"title":"Construção contínua","body":"Mantenha um caderno de repertório com obras vistas, leituras e referências. Ele alimenta futuras reportagens.","example":"Anotar após cada exposição: artista, obra marcante, referência citada, pergunta que ficou."}],"assignment":"Monte um dossiê de repertório sobre um tema cultural de Xangai com cinco fontes (pelo menos duas primárias), resumo de cada uma e três perguntas para pesquisar.","rubric":"Incluí fontes primárias? As fontes especializadas são confiáveis? As perguntas ajudam a aprofundar o repertório?"},"jornalismo-cultural:3":{"title":"Narrar um evento como experiência e informação","intro":"A crônica de evento combina observação pessoal, descrição de ambiente e informação verificada. O público deve sentir o evento e também entender o que aconteceu.","steps":[{"title":"Cena de abertura","body":"Comece com um momento específico que capture a atmosfera do evento.","example":"“Às 20h, quando as luzes do armazém se apagaram, o público de quinhentas pessoas ficou em silêncio.”"},{"title":"Informação verificada","body":"Inclua dados confirmados: quem, quando, onde, público estimado com fonte, programação.","example":"“Segundo a organização, foram vendidos 480 ingressos.”"},{"title":"Voz pessoal marcada","body":"A crônica admite impressões, desde que sejam claramente pessoais e não apresentadas como fatos.","example":"“Para mim, o melhor momento veio no fim, quando a banda tocou sem amplificação.”"}],"assignment":"Escreva ou grave uma crônica de um evento cultural (até 400 palavras ou 2 minutos) com cena de abertura, informações verificadas e impressões pessoais marcadas.","rubric":"A abertura transmite atmosfera? As informações verificadas têm fonte? Minhas impressões estão claramente marcadas?"},"jornalismo-moda:0":{"title":"A vitrine também é uma narrativa","intro":"Cores, peças, materialidade e exposição visual comunicam escolhas. Para interpretar a intenção de uma marca, diferencie leitura própria de declaração oficial.","steps":[{"title":"Observe antes de nomear a tendência","body":"Registre itens, cores, silhuetas, repetição e iluminação sem impor rótulos de mercado imediatamente.","example":"“Três looks monocromáticos, silhuetas amplas e iluminação concentrada.”"},{"title":"Analise execução","body":"Verifique modelagem, ajuste, construção aparente e acabamento visível. Evite deduzir qualidade total sem manusear a peça.","example":"“A costura aparente funciona como elemento visual.”"},{"title":"Construa hipótese editorial","body":"Associe sinais visuais a uma proposta estética, qualificando a inferência.","example":"“A apresentação sugere uma linguagem minimalista, mas não encontrei declaração da marca.”"}],"assignment":"Escolha uma vitrine: grave descrição objetiva de 45 segundos e análise interpretativa de outros 45 segundos.","rubric":"Separei fato e hipótese? Usei linguagem técnica? Apontei ao menos três elementos visuais?"},"jornalismo-moda:1":{"title":"Falar de tecidos com precisão","intro":"Jornalismo de moda exige vocabulário técnico sobre materiais, construção e acabamento. Precisão evita descrições vagas e permite comparar qualidade e preço com critério.","steps":[{"title":"Fibras e tecidos","body":"Diferencie fibras naturais (algodão, linho, seda, lã) e sintéticas (poliéster, nylon), e tecidos planos e malhas.","example":"“Camisa de linho lavado, com textura levemente irregular”, em vez de “camisa leve e bonita”."},{"title":"Construção e modelagem","body":"Observe costuras, forro, caimento, recortes e proporções. Eles revelam cuidado e intenção.","example":"“Ombro estruturado com entretela e mangas de comprimento três quartos.”"},{"title":"Acabamento","body":"Botões, zíperes, barras, etiquetas e alinhamento de estampas indicam o nível de acabamento.","example":"“Estampa alinhada na costura lateral — detalhe que exige mais tecido e tempo.”"}],"assignment":"Analise três peças em lojas de faixas de preço diferentes. Descreva fibra, construção e acabamento de cada uma usando vocabulário técnico, sem juízo de valor genérico.","rubric":"Usei vocabulário técnico correto? Comparei critérios equivalentes? Evitei adjetivos vagos como “lindo” ou “barato”?"},"jornalismo-moda:2":{"title":"Moda também é economia e comportamento","intro":"Varejo de moda revela comportamentos de consumo, estratégias de marca e transformações urbanas. Observar lojas, vitrines e clientes ajuda a contar histórias além da estética.","steps":[{"title":"Estratégias de varejo","body":"Localização, layout, iluminação, música e atendimento são escolhas que comunicam posicionamento.","example":"Uma marca local em Anfu Lu com loja pequena e curadoria intimista versus uma rede global com loja de três andares em Nanjing Lu."},{"title":"Comportamento de consumo","body":"Quem compra, em que horário, como pesquisa, como paga? Observe sem invadir e confirme com entrevistas.","example":"Observar que muitos clientes fotografam etiquetas e comparam preços no celular."},{"title":"Cuidado com generalizações","body":"Uma loja não representa uma cidade. Contextualize observações e evite afirmar tendências sem dados.","example":"“Nesta rua, observamos...” em vez de “os jovens chineses preferem...”."}],"assignment":"Observe duas lojas de moda com posicionamentos diferentes durante 30 minutos cada. Registre estratégias de varejo e comportamentos, e formule duas hipóteses a verificar.","rubric":"As observações são específicas e datadas? Diferenciei observação de hipótese? Evitei generalizar para toda a população?"},"jornalismo-moda:3":{"title":"Reportar a moda das ruas","intro":"A reportagem de moda urbana mostra como pessoas reais se vestem e o que isso expressa. Exige olhar estético, vocabulário técnico, consentimento e contexto.","steps":[{"title":"Observação e seleção","body":"Escolha personagens pela relação com o tema, não apenas pela aparência impactante. Diversidade de idades e estilos enriquece.","example":"Tema: como o calor de setembro muda o vestir em Xangai — incluir trabalhadores, estudantes e idosos."},{"title":"Consentimento e respeito","body":"Peça autorização antes de fotografar em destaque. Explique o uso e respeite recusas.","example":"“Posso fotografar sua roupa para uma reportagem sobre moda de rua? Seu rosto pode aparecer?”"},{"title":"Descrição e contexto","body":"Descreva peças com precisão e acrescente contexto: escolhas da pessoa, clima, ocasião, origem das peças.","example":"“Camisa de algodão da marca local X, comprada num brechó em Jing'an; ela diz preferir peças usadas por questões ambientais.”"}],"assignment":"Produza uma reportagem de moda urbana com cinco personagens fotografados com consentimento, descrição técnica das roupas e uma fala de cada pessoa.","rubric":"Obtive consentimento de todos? As descrições usam vocabulário técnico? A reportagem tem contexto além da aparência?"},"jornalismo-urbano:0":{"title":"Leia a cidade na escala da caminhada","intro":"Uma rua combina circulação, permanência, paisagem, comércio, acessibilidade e microexperiências; observar exige método.","steps":[{"title":"Mapeie os usos","body":"Registre o que é residencial, comercial e de convivência sem inferir quem vive ou trabalha em cada local.","example":"Comércio no térreo, entradas residenciais e bancos ao longo da calçada."},{"title":"Observe o percurso","body":"Descreva transições, pontos de sombra, travessias e barreiras; a experiência depende de horário e condições.","example":"“Neste horário, a travessia concentra pedestres nos dois lados.”"},{"title":"Inclua a escala humana","body":"Relacione edifícios, árvores, pessoas e mobiliário urbano para explicar percepção.","example":"“A largura da calçada permite a passagem de dois grupos em sentidos opostos.”"}],"assignment":"Faça um percurso curto e registre cinco mudanças de ambiente, sem filmar de modo a atrapalhar pessoas.","rubric":"Mostrei espaço e uso? Qualifiquei observações por local/horário? Incluí acessibilidade?"},"jornalismo-urbano:1":{"title":"Como as pessoas se movem pela cidade","intro":"Mobilidade e acesso revelam desigualdades, escolhas de política urbana e rotinas cotidianas. Reportar sobre isso exige observação, dados e experiência de diferentes usuários.","steps":[{"title":"Modos de deslocamento","body":"Metrô, ônibus, bicicleta, scooter, caminhada, carro. Cada modo tem custos, tempos e públicos diferentes.","example":"Comparar o tempo de um trajeto de metrô e de bicicleta compartilhada na mesma hora."},{"title":"Acessibilidade","body":"Rampas, elevadores, sinalização tátil, informação bilíngue. Avalie a cidade do ponto de vista de quem tem mobilidade reduzida.","example":"Verificar se a estação tem elevador funcionando em todas as saídas."},{"title":"Experiência do usuário","body":"Entreviste pessoas que fazem trajetos diários. Elas revelam problemas e soluções que dados não mostram.","example":"Uma trabalhadora que atravessa a cidade e explica por que prefere o ônibus ao metrô."}],"assignment":"Faça um mesmo trajeto por dois modos diferentes, registrando tempo, custo e acessibilidade. Entreviste um usuário frequente e escreva um relato de 300 palavras.","rubric":"Registrei tempo e custo com precisão? Avaliei acessibilidade? Incluí a experiência de um usuário real?"},"jornalismo-urbano:2":{"title":"Ler a forma da cidade","intro":"Morfologia urbana é o estudo da forma da cidade: quarteirões, ruas, alturas, espaços abertos. Entendê-la ajuda a explicar por que lugares são agradáveis, hostis ou transformados.","steps":[{"title":"Escala e altura","body":"Relação entre a largura da rua e a altura dos edifícios afeta luz, sombra e sensação de acolhimento.","example":"Ruas estreitas com prédios baixos na Concessão Francesa versus avenidas largas com torres em Lujiazui."},{"title":"Tecido urbano","body":"Tamanho dos quarteirões, densidade de cruzamentos e usos mistos influenciam a caminhabilidade.","example":"Quarteirões pequenos com lojas no térreo favorecem a caminhada."},{"title":"Paisagem e camadas históricas","body":"Edifícios de épocas diferentes convivem e contam a história da cidade. Identifique essas camadas.","example":"Um shikumen dos anos 1920 ao lado de uma torre de escritórios dos anos 2010."}],"assignment":"Compare duas áreas de Xangai em morfologia: escala, tecido urbano e camadas históricas. Fotografe e descreva cada aspecto, com fontes para dados históricos.","rubric":"Descrevi escala, tecido e camadas? As fotos documentam os aspectos descritos? Os dados históricos têm fonte?"},"jornalismo-urbano:3":{"title":"Um percurso como forma de reportagem","intro":"O percurso narrado conduz o público por um caminho real, combinando observação em movimento, descrição espacial, contexto e encontros. É uma forma poderosa de mostrar a experiência de uma rua.","steps":[{"title":"Planeje o trajeto","body":"Escolha início, fim e pontos de parada com significado. O percurso deve ter progressão.","example":"Do metrô até o fim da rua Wukang, com paradas no prédio Normandie, numa livraria e numa casa antiga."},{"title":"Narre em movimento","body":"Use referências espaciais (à direita, mais adiante, ao virar a esquina) e mudanças sensoriais ao longo do caminho.","example":"“Ao deixar a avenida, o barulho diminui e as copas dos plátanos se fecham sobre a rua.”"},{"title":"Inclua encontros e contexto","body":"Pessoas encontradas e informações verificadas enriquecem o percurso. Marque o que é observação e o que é dado.","example":"Uma conversa com um morador e a data de construção de um edifício, com fonte."}],"assignment":"Grave um percurso narrado de três minutos por uma rua, com pelo menos três paradas, uma conversa e duas informações verificadas.","rubric":"O percurso tem progressão clara? Usei referências espaciais? Separei observação de informação verificada?"},"jornalismo-viagens:0":{"title":"Experiência pessoal a serviço do público","intro":"Jornalismo de viagens combina relato pessoal e informação útil. A experiência do autor deve ajudar o público a decidir e a se preparar, não apenas exibir o que foi vivido.","steps":[{"title":"Quem é o público","body":"Viajantes de primeira vez, mochileiros, famílias, viajantes a trabalho. Cada grupo precisa de informações diferentes.","example":"Para famílias com crianças: acessibilidade, banheiros, tempo de fila."},{"title":"Experiência como referência","body":"Sua experiência é uma amostra. Diga quando, como e em que condições a viveu, para que o público avalie.","example":"“Visitei num sábado de outubro, às 10h, com tempo nublado.”"},{"title":"Preferência versus fato","body":"Gostar ou não de um lugar é preferência. Preço, horário e acesso são fatos. Separe os dois.","example":"“Achei o passeio cansativo (opinião); são 2,5 km de caminhada sem sombra (fato).”"}],"assignment":"Escolha um lugar visitado e escreva para dois públicos diferentes, separando claramente experiência pessoal e informação factual em cada versão.","rubric":"Defini dois públicos distintos? Informei as condições da minha experiência? Separei preferência de fato?"},"jornalismo-viagens:1":{"title":"Pesquisar antes de ir, verificar ao chegar","intro":"Pesquisa prévia evita erros e permite aproveitar melhor a apuração de campo. Mas informações de viagem mudam rápido: tudo deve ser confirmado no local ou em fonte oficial atualizada.","steps":[{"title":"Fontes de pesquisa","body":"Sites oficiais, órgãos de turismo, guias atualizados, relatos recentes. Cruze informações e veri
