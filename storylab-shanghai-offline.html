undidade quando reúnem pontos de vista diferentes: moradores, especialistas, visitantes e dados. A pluralidade evita que uma única voz represente um país inteiro.","steps":[{"title":"Mapeie as perspectivas","body":"Quem é afetado pelo tema? Quem o estuda? Quem decide? Quem observa de fora? Cada grupo vê aspectos diferentes.","example":"Tema: transformação de um bairro antigo. Perspectivas: antigos moradores, novos comerciantes, urbanista, turista."},{"title":"Equilibre sem igualar","body":"Pluralidade não é dar o mesmo peso a tudo. Evidências e dados verificados têm mais força do que opiniões isoladas.","example":"A opinião de um turista não equivale a um estudo sobre deslocamento populacional."},{"title":"Monte a narrativa","body":"Organize as perspectivas em uma progressão: situação, vozes, contraste, dados e síntese que respeite as diferenças.","example":"Abertura com cena; depoimentos contrastantes; dado de contexto; conclusão que reconhece a complexidade."}],"assignment":"Planeje uma reportagem de três minutos sobre um tema de Xangai com pelo menos quatro perspectivas. Escreva a estrutura cena a cena e a frase de conclusão.","rubric":"Incluí quatro perspectivas distintas? Dei pesos coerentes às evidências? A conclusão evita generalizar para o país inteiro?"},"tecnicas-reportagem:0":{"title":"Toda reportagem começa com uma suspeita bem formulada","intro":"Uma hipótese de pauta é uma afirmação provisória que orienta a apuração. Ela não é a conclusão: é a pergunta transformada em algo que pode ser confirmado ou refutado.","steps":[{"title":"Da curiosidade à hipótese","body":"Observe algo que chama atenção e transforme em afirmação testável. Uma boa hipótese é específica, limitada e verificável.","example":"Curiosidade: “Por que há tantas lojas de chá novas?” Hipótese: “Lojas de chá abriram nesta rua no último ano porque o aluguel caiu após a saída de lojas de roupa.”"},{"title":"Esteja disposto a errar","body":"A hipótese pode estar errada — e descobrir isso também é resultado. Apurar só para confirmar o que você já pensa é viés, não reportagem.","example":"Se os comerciantes disserem que o aluguel subiu, a pauta muda de rumo, e isso é uma boa notícia jornalística."},{"title":"Delimite o escopo","body":"Defina lugar, período e grupo. Hipóteses amplas demais (“a cidade inteira”) são impossíveis de apurar com os recursos de um repórter individual.","example":"“Nesta rua, nos últimos 12 meses” em vez de “em Xangai, recentemente”."}],"assignment":"Escreva três hipóteses de pauta a partir de observações reais. Para cada uma, indique o que a confirmaria, o que a refutaria e qual é o escopo.","rubric":"As hipóteses são específicas e testáveis? Indiquei o que as refutaria? O escopo é viável para mim?"},"tecnicas-reportagem:1":{"title":"Planejar a apuração antes de sair de casa","intro":"Um plano de apuração lista as perguntas, as fontes, os documentos e as observações necessárias para testar a hipótese. Ele economiza tempo e evita voltar para casa sem a informação essencial.","steps":[{"title":"Liste as perguntas-chave","body":"Desdobre a hipótese em perguntas menores. Cada pergunta deve ter pelo menos uma fonte possível.","example":"Quantas lojas abriram? Quando? Quanto custa o aluguel hoje e antes? O que dizem os donos?"},{"title":"Mapeie fontes e documentos","body":"Fontes humanas (comerciantes, moradores, especialistas), documentais (registros, anúncios, dados públicos) e observação direta.","example":"Contar as lojas pessoalmente, consultar anúncios de aluguel e entrevistar três comerciantes."},{"title":"Ordene e estime o tempo","body":"Defina a sequência: geralmente observação e documentos antes de entrevistas, para chegar com perguntas melhores.","example":"Manhã: contagem e fotos. Tarde: entrevistas. Noite: conferência de dados."}],"assignment":"Crie um plano de apuração em tabela com colunas: pergunta, fonte, tipo (humana/documental/observação), status e prazo. Inclua pelo menos oito linhas.","rubric":"Cada pergunta tem fonte? Há diversidade de tipos de fonte? A ordem faz sentido para chegar mais preparado às entrevistas?"},"tecnicas-reportagem:2":{"title":"Evidência organizada é evidência utilizável","intro":"Durante a apuração você acumula fotos, áudios, anotações e documentos. Sem organização, informação importante se perde ou é usada fora de contexto.","steps":[{"title":"Registre na hora","body":"Anote data, hora, local e fonte de cada informação no momento em que a obtém. A memória falha rapidamente.","example":"Arquivo de áudio nomeado: “2026-10-14_mercado_vendedora-chá_consentimento-ok.m4a”."},{"title":"Classifique por força","body":"Diferencie confirmado (duas fontes independentes ou documento), provável (uma fonte confiável) e não confirmado (boato, fonte única fraca).","example":"Aluguel subiu 15%: confirmado por contrato e corretor. Loja vai fechar: não confirmado."},{"title":"Conecte evidências às perguntas","body":"Associe cada evidência à pergunta do plano que ela responde. Perguntas sem evidência mostram onde a apuração está fraca.","example":"Pergunta 3 (aluguel): duas evidências. Pergunta 5 (motivo da mudança): nenhuma — voltar a campo."}],"assignment":"Organize as evidências de uma apuração (real ou simulada) numa planilha com: evidência, data, fonte, força (confirmada/provável/não confirmada) e pergunta associada.","rubric":"Cada evidência tem data e fonte? Classifiquei a força de forma honesta? Identifiquei as perguntas ainda sem resposta?"},"tecnicas-reportagem:3":{"title":"Do plano à reportagem pronta","intro":"Produzir uma reportagem de campo é integrar observação, entrevistas, imagens e dados numa narrativa coerente. A estrutura deve servir à pergunta central, não ao material mais bonito.","steps":[{"title":"Volte à pergunta central","body":"Antes de montar, releia a pergunta e a hipótese. O que a apuração respondeu? O que permanece aberto?","example":"“A hipótese do aluguel foi parcialmente confirmada: caiu para lojas grandes, mas não para as pequenas.”"},{"title":"Escolha a estrutura","body":"Abertura com cena forte, contexto, desenvolvimento com fontes, contraste, dados e conclusão. Cada bloco responde a uma parte da pergunta.","example":"Cena da loja de chá → contexto da rua → falas dos comerciantes → dado de aluguel → conclusão com limites."},{"title":"Sinalize os limites","body":"Uma boa reportagem diz o que não conseguiu confirmar. Isso aumenta a confiança e indica caminhos futuros.","example":"“Não conseguimos falar com a administradora do imóvel até a publicação.”"}],"assignment":"Produza uma reportagem de campo de dois a três minutos (vídeo, áudio ou texto de 400 palavras) a partir da sua pauta, com cena de abertura, três fontes e uma conclusão com limites.","rubric":"A reportagem responde à pergunta central? As fontes estão identificadas? A conclusão reconhece os limites da apuração?"},"redacao-jornalistica:0":{"title":"Escrever para ser ouvido é diferente","intro":"Textos narrados precisam de frases respiráveis, progressão evidente e referências claras, pois o ouvinte não consegue reler instantaneamente.","steps":[{"title":"Comece pelo essencial","body":"Identifique quem, o quê, onde, quando, por quê e como, sem forçar respostas ainda desconhecidas.","example":"“Neste trecho de rua, comerciantes e pedestres dividem um espaço compacto.”"},{"title":"Prefira construções diretas","body":"Frases com sujeito e verbo próximos são mais fáceis de acompanhar do que encaixes excessivos.","example":"Troque “O local, que, desde..., passou...” por duas frases."},{"title":"Leia em voz alta","body":"Revise trechos longos e referências vagas. Respiração difícil pode indicar frase excessiva.","example":"“A empresa informou que...”. Se a informação for incerta, atribua claramente."}],"assignment":"Escreva 120 palavras sobre uma observação; corte 25% sem perder fatos e grave a leitura.","rubric":"A fonte está identificada? A ordem faz sentido? Posso ler sem tropeçar?"},"redacao-jornalistica:1":{"title":"A pirâmide invertida e quando abandoná-la","intro":"A pirâmide invertida coloca as informações mais importantes primeiro. É eficiente para notícias, mas não é a única estrutura. Conhecer alternativas permite escolher a forma certa para cada história.","steps":[{"title":"Pirâmide invertida","body":"Lead com o essencial, seguido de detalhes em ordem decrescente de importância. O leitor pode parar a qualquer momento e ainda terá o principal.","example":"“A linha 14 do metrô abre amanhã ligando X a Y. A viagem completa leva 50 minutos. A tarifa segue a tabela atual...”"},{"title":"Estrutura cronológica e de cena","body":"Para histórias com personagem e transformação, contar em ordem temporal ou a partir de uma cena cria envolvimento.","example":"“Às 5h, antes de o mercado abrir, Wang já arruma os peixes sobre o gelo...”"},{"title":"Estrutura em diamante e ampulheta","body":"Diamante: começa com um caso específico, amplia para o contexto geral e volta ao caso. Ampulheta: lead objetivo seguido de narrativa cronológica.","example":"Começar com uma família que se mudou, explicar o fenômeno de mudança no bairro e voltar à família no final."}],"assignment":"Escreva a mesma informação em três estruturas: pirâmide invertida (100 palavras), cena cronológica (100 palavras) e diamante (150 palavras). Indique qual combina melhor com o fato e por quê.","rubric":"As três estruturas estão corretas? A informação essencial está presente em todas? Justifiquei a escolha?"},"redacao-jornalistica:2":{"title":"O ouvinte não pode voltar a página","intro":"Texto narrado é ouvido uma única vez, no ritmo de quem fala. Precisa de frases curtas, repetição estratégica, números arredondados e referências claras.","steps":[{"title":"Uma ideia por frase","body":"Frases longas, com muitas orações intercaladas, se perdem no ouvido. Divida em frases que cabem numa respiração.","example":"Em vez de “O mercado, que foi reformado em 2019 e reúne 200 bancas, recebe...”, use “O mercado foi reformado em 2019. Hoje tem 200 bancas.”"},{"title":"Números ouvíveis","body":"Arredonde quando a precisão total não é necessária e dê referência de escala. Evite muitos números seguidos.","example":"“Quase 3 mil pessoas por hora — mais do que um estádio pequeno” em vez de “2.874 pessoas por hora”."},{"title":"Repita o essencial","body":"Na fala, repetir o tema principal ao final ajuda o ouvinte que se distraiu. Na escrita, isso seria redundância; no áudio, é orientação.","example":"Abertura e fechamento mencionam a mesma ideia central com palavras diferentes."}],"assignment":"Pegue um texto escrito seu de 150 palavras e reescreva para ser narrado em 60 segundos. Grave as duas versões e compare a clareza.","rubric":"As frases cabem numa respiração? Os números são compreensíveis de ouvido? A ideia central aparece no começo e no fim?"},"redacao-jornalistica:3":{"title":"Cortar é escrever melhor","intro":"A edição remove o que não ajuda o público a entender. Cortar excesso — palavras vazias, repetições, adjetivos genéricos — torna o texto mais claro e a fala mais firme.","steps":[{"title":"Elimine o vazio","body":"Expressões como “é importante destacar que”, “de certa forma”, “basicamente” raramente acrescentam informação.","example":"“É importante destacar que o mercado é muito movimentado” → “O mercado recebe 3 mil pessoas por hora.”"},{"title":"Troque adjetivos por fatos","body":"Adjetivos genéricos (incrível, lindo, enorme) pedem confiança cega. Fatos e detalhes concretos mostram em vez de afirmar.","example":"“Uma fila enorme” → “Uma fila que dobrava o quarteirão às 9h.”"},{"title":"Corte com critério","body":"Cortar não é mutilar: preserve fontes, contexto e ressalvas. Pergunte se o corte muda o sentido ou remove uma limitação importante.","example":"Não cortar “segundo o gerente” de uma afirmação sobre faturamento."}],"assignment":"Escolha um texto ou transcrição sua e corte 30% sem perder informação essencial. Registre os tipos de corte que fez e verifique se alguma ressalva se perdeu.","rubric":"Cortei 30% de fato? Troquei adjetivos por fatos? Preservei fontes e ressalvas?"},"tecnicas-entrevista:0":{"title":"A boa entrevista progride por escuta","intro":"Uma lista de perguntas é só o começo. A descoberta ocorre quando o repórter ouve e identifica o que precisa ser aprofundado.","steps":[{"title":"Pesquise e prepare","body":"Defina o que você realmente precisa saber e quais perguntas abertas podem revelar experiências.","example":"“Como começou seu trabalho aqui?”"},{"title":"Escute a resposta","body":"Procure exemplos, datas, mudanças e termos ambíguos. Faça uma pergunta de acompanhamento.","example":"“Você disse que o bairro mudou. Em que sentido?”"},{"title":"Confirme e respeite","body":"Peça esclarecimento sem pressão; obtenha autorização adequada e seja transparente sobre publicação.","example":"“Posso citar essa resposta no vídeo?”"}],"assignment":"Faça uma entrevista de cinco minutos sobre uma experiência cotidiana com três perguntas preparadas e ao menos duas perguntas espontâneas.","rubric":"Evitei perguntas que sugerem resposta? Houve aprofundamento? Registrei contexto e permissão?"},"tecnicas-entrevista:1":{"title":"O tipo de pergunta define o tipo de resposta","intro":"Perguntas abertas convidam o entrevistado a narrar; perguntas fechadas confirmam dados. Saber quando usar cada uma é a base de uma entrevista produtiva.","steps":[{"title":"Perguntas abertas","body":"Começam com como, por que, o que, conte. Geram relatos, explicações e exemplos — matéria-prima de boas histórias.","example":"“Como era esta rua quando o senhor abriu a loja?”"},{"title":"Perguntas fechadas","body":"Pedem sim, não ou um dado específico. São úteis para confirmar fatos, datas e números.","example":"“A loja abriu em 2008?” “Quantos funcionários trabalham aqui?”"},{"title":"Evite perguntas indutoras e duplas","body":"Perguntas indutoras sugerem a resposta; perguntas duplas confundem. Ambas prejudicam a qualidade da informação.","example":"Indutora: “O aluguel absurdo está expulsando vocês, não é?” Melhor: “Como o aluguel afetou a loja?”"}],"assignment":"Escreva 10 perguntas para uma entrevista real: 6 abertas e 4 fechadas. Revise e reescreva qualquer pergunta indutora ou dupla.","rubric":"Há equilíbrio entre abertas e fechadas? Alguma pergunta sugere a resposta? Cada pergunta trata de um único assunto?"},"tecnicas-entrevista:2":{"title":"A melhor pergunta nasce da resposta anterior","intro":"Escutar de verdade permite perceber detalhes, contradições e pistas que nenhum roteiro antecipa. Os follow-ups — perguntas de seguimento — transformam respostas genéricas em conteúdo concreto.","steps":[{"title":"Escuta ativa","body":"Concentre-se no que a pessoa diz, não na próxima pergunta do roteiro. Observe palavras-chave, hesitações e emoções.","example":"Se o entrevistado diz “foi difícil”, essa é a porta para a próxima pergunta."},{"title":"Peça exemplos e detalhes","body":"Respostas abstratas ganham força com casos concretos. Pergunte quando, onde, como, quem.","example":"“O senhor disse que foi difícil. Pode lembrar de um dia específico?”"},{"title":"Use o silêncio","body":"Depois de uma resposta, espere alguns segundos. Muitas pessoas completam o pensamento com informações valiosas.","example":"Uma pausa de três segundos após “mudou muito” pode render a melhor fala da entrevista."}],"assignment":"Faça uma entrevista de 5 minutos com alguém próximo sobre uma mudança na vida da pessoa. Use no máximo três perguntas preparadas; o restante deve ser follow-up. Transcreva e marque os follow-ups.","rubric":"A maior parte das perguntas foi de seguimento? Pedi exemplos concretos? Usei o silêncio pelo menos uma vez?"},"tecnicas-entrevista:3":{"title":"Entrevistar na rua, com ruído e pressa","intro":"Entrevistas em ambiente real enfrentam barulho, interrupções, pouco tempo e pessoas desconfiadas. Preparação, abordagem respeitosa e técnica de captação fazem a diferença.","steps":[{"title":"Abordagem e consentimento","body":"Apresente-se rapidamente, explique o propósito e peça permissão para gravar. Respeite recusas sem insistência.","example":"“Olá, sou estudante de jornalismo e faço um vídeo sobre o mercado. Posso fazer duas perguntas rápidas e gravar?”"},{"title":"Ambiente e captação","body":"Escolha posição com menos ruído e luz adequada. Aproxime o microfone e faça um teste rápido de áudio.","example":"Afastar-se três metros da caixa de som da loja melhora muito a inteligibilidade."},{"title":"Perguntas curtas e foco","body":"Na rua, a atenção é curta. Priorize as duas ou três perguntas mais importantes e faça follow-ups breves.","example":"“O que mudou aqui no último ano?” → “Pode dar um exemplo?” → “Obrigado!”"}],"assignment":"Realize três entrevistas curtas (até 2 minutos) em ambiente real, com consentimento gravado. Avalie áudio, abordagem e qualidade das respostas de cada uma.","rubric":"Obtive consentimento em todas? O áudio está inteligível? Consegui ao menos uma resposta com exemplo concreto?"},"pesquisa-verificacao:0":{"title":"Sua credibilidade mora no que consegue sustentar","intro":"O exercício é manter uma trilha simples: afirmação, origem, contexto, verificação e grau de certeza.","steps":[{"title":"Liste afirmações","body":"Separe cada declaração verificável do comentário pessoal.","example":"“A loja foi inaugurada em 2018” exige fonte; “gostei do projeto” é experiência."},{"title":"Busque independência","body":"Duas reproduções do mesmo comunicado não são duas confirmações independentes.","example":"Compare documento primário e registro independente, quando disponível."},{"title":"Atribua limites","body":"Se algo não pôde ser verificado, diga isso e evite apresentar suposição como fato.","example":"“Não foi possível confirmar a data de abertura até a publicação.”"}],"assignment":"Escolha cinco afirmações para um vídeo. Registre como seriam verificadas e retire ou qualifique as que não conseguir confirmar.","rubric":"Sei de onde veio cada dado? Contextualizei data e local? Distingui testemunho de comprovação?"},"pesquisa-verificacao:1":{"title":"Uma fonte só não basta","intro":"Verificação cruzada é confirmar a mesma informação em fontes independentes. Quanto mais importante ou surpreendente a afirmação, mais confirmações ela exige.","steps":[{"title":"Independência das fontes","body":"Duas fontes que repetem a mesma origem não são independentes. Verifique de onde cada uma obteve a informação.","example":"Três sites que citam o mesmo comunicado contam como uma única fonte."},{"title":"Combine tipos de evidência","body":"A confirmação mais forte combina documento, testemunho e observação direta.","example":"Horário de funcionamento: placa na porta (observação), site oficial (documento) e funcionário (testemunho)."},{"title":"Registre divergências","body":"Quando fontes discordam, não escolha a mais conveniente. Informe a divergência ou continue apurando.","example":"“A administração fala em 300 bancas; contamos cerca de 250 abertas na terça.”"}],"assignment":"Escolha três afirmações sobre Xangai encontradas em vídeos ou posts. Tente confirmar cada uma em duas fontes independentes e registre o resultado: confirmada, divergente ou não confirmada.","rubric":"As fontes eram de fato independentes? Combinei tipos diferentes de evidência? Registrei divergências sem escondê-las?"},"pesquisa-verificacao:2":{"title":"Imagens verdadeiras podem contar mentiras","intro":"Uma foto ou um dado real, apresentado fora do contexto original, pode enganar tanto quanto uma falsificação. Verificar data, local e origem é obrigatório antes de usar material de terceiros.","steps":[{"title":"Busca reversa de imagens","body":"Ferramentas de busca reversa mostram onde e quando uma imagem apareceu antes. Imagens antigas são frequentemente recirculadas como se fossem novas.","example":"Uma foto de enchente “de hoje” que aparece num site de cinco anos atrás."},{"title":"Confira local e data","body":"Observe placas, clima, vegetação, sombras, veículos e arquitetura. Compare com mapas e imagens de referência.","example":"Placas em caracteres tradicionais podem indicar que a foto não é da China continental."},{"title":"Dados sem denominador","body":"Números isolados enganam. Pergunte: em relação a quê? em que período? qual a fonte original?","example":"“Mil acidentes” significa algo diferente numa cidade de 25 milhões ou numa de 100 mil habitantes."}],"assignment":"Encontre uma imagem viral e um dado viral sobre a China. Verifique a origem de cada um, registrando ferramentas usadas, data e local originais e o contexto que faltava.","rubric":"Usei busca reversa ou fonte original? Verifiquei data e local? Identifiquei o contexto que faltava no dado?"},"pesquisa-verificacao:3":{"title":"Um dossiê que outra pessoa consiga conferir","intro":"Registrar fontes de forma organizada permite revisar, corrigir e defender o trabalho. Um bom registro deve permitir que outra pessoa refaça o caminho da apuração.","steps":[{"title":"Afirmação e fonte lado a lado","body":"Para cada afirmação importante, registre a fonte exata: nome, cargo, documento, link, data de acesso.","example":"“O mercado tem 300 bancas” — Fonte: site da administração, acessado em 14/10/2026, link X."},{"title":"Preserve evidências","body":"Links mudam e páginas somem. Salve capturas de tela ou arquivos, com data, de fontes importantes.","example":"Captura de tela do anúncio de aluguel com data e URL visíveis."},{"title":"Registre o grau de confiança","body":"Indique se a afirmação está confirmada, se depende de uma fonte única ou se é estimativa própria.","example":"“Estimativa própria: cerca de 250 bancas abertas, contadas às 10h.”"}],"assignment":"Monte um dossiê com cinco afirmações sobre um tema de Xangai, cada uma com fonte completa, data de acesso, evidência preservada e grau de confiança.","rubric":"Outra pessoa conseguiria refazer minha apuração? As evidências estão preservadas? O grau de confiança é honesto?"},"jornalismo-dados:0":{"title":"Números começam com boas perguntas","intro":"Jornalismo de dados não começa na planilha: começa com uma pergunta que números podem ajudar a responder. Perguntas vagas geram gráficos bonitos e conclusões fracas.","steps":[{"title":"Perguntas mensuráveis","body":"Transforme curiosidades em perguntas que podem ser respondidas com contagem, medição ou comparação.","example":"Vago: “O metrô é caro?” Mensurável: “Quanto custa ir de casa ao trabalho de metrô, comparado ao salário mínimo local?”"},{"title":"Unidade e comparação","body":"Defina o que será medido (preço, tempo, quantidade) e com o que será comparado (outra cidade, outro ano, outro grupo).","example":"Comparar o preço de um café em três bairros, no mesmo dia, mesmo tamanho."},{"title":"Fonte dos dados","body":"Antes de coletar, pergunte se o dado existe (oficial, acadêmico) ou se precisará ser produzido por você (contagem própria).","example":"Dados oficiais de passageiros do metrô versus contagem própria numa estação."}],"assignment":"Transforme três curiosidades sobre Xangai em perguntas mensuráveis. Para cada uma, indique unidade, comparação e possível fonte de dados.","rubric":"As perguntas são de fato mensuráveis? A comparação é justa? Indiquei se o dado existe ou precisa ser produzido?"},"jornalismo-dados:1":{"title":"Dados sujos produzem conclusões sujas","intro":"Antes de analisar, é preciso limpar: corrigir erros, padronizar formatos e escolher o denominador correto. Esse trabalho invisível é o que torna uma comparação confiável.","steps":[{"title":"Padronize unidades e formatos","body":"Preços em moedas diferentes, tamanhos diferentes ou datas em formatos variados precisam ser padronizados antes de comparar.","example":"Converter todos os preços para yuan por 100 g, na mesma data de câmbio."},{"title":"Trate ausências e erros","body":"Valores faltantes ou absurdos devem ser investigados, não ignorados ou inventados. Registre o que foi corrigido.","example":"Um preço de 1.000 yuan por um café provavelmente é erro de digitação — confirme antes de excluir."},{"title":"Escolha o denominador","body":"Números absolutos enganam quando as bases são diferentes. Taxas, proporções e valores per capita permitem comparações justas.","example":"Comparar acidentes por 100 mil habitantes, não o número total entre cidades de tamanhos diferentes."}],"assignment":"Colete preços de um mesmo produto em cinco lugares. Monte uma tabela, padronize as unidades, registre problemas encontrados e calcule uma comparação com denominador adequado.","rubric":"As unidades foram padronizadas? Registrei as correções? O denominador torna a comparação justa?"},"jornalismo-dados:2":{"title":"Gráficos também podem mentir","intro":"Uma visualização honesta mostra os dados com proporção correta e contexto suficiente. Eixos cortados, escalas enganosas e cores exageradas distorcem a percepção, mesmo com dados corretos.","steps":[{"title":"Escolha o gráfico pela pergunta","body":"Comparação entre categorias: barras. Evolução no tempo: linha. Parte de um todo: barras empilhadas (prefira a pizza só com poucas categorias).","example":"Preço do café em cinco bairros: gráfico de barras ordenado do maior para o menor."},{"title":"Cuidado com os eixos","body":"Em gráficos de barras, o eixo deve começar no zero. Cortar o eixo exagera diferenças pequenas.","example":"Uma diferença de 2 yuan entre 30 e 32 parece enorme se o eixo começar em 29."},{"title":"Contexto visível","body":"Título que diga o achado, fonte, data e unidade sempre visíveis. O público deve entender o gráfico sem o narrador.","example":"“Café custa até 40% mais no Bund do que em Hongkou — preços de 14/10/2026, copo médio, coleta própria.”"}],"assignment":"Crie um gráfico honesto com os dados coletados na aula anterior. Depois crie uma versão propositalmente enganosa e explique as distorções.","rubric":"O gráfico honesto começa no zero e tem fonte e data? Identifiquei claramente as distorções da versão enganosa? O título comunica o achado?"},"jornalismo-dados:3":{"title":"Contar números para pessoas","intro":"Narrar dados é traduzir números em significado. O público precisa entender o tamanho, a comparação e a importância — sem ser soterrado por estatísticas.","steps":[{"title":"Um número por vez","body":"Escolha os dois ou três números mais importantes. Cada um deve ter espaço para ser compreendido.","example":"“Um café no Bund custa 38 yuan. Em Hongkou, 27. A diferença paga uma passagem de metrô de ida e volta.”"},{"title":"Dê escala humana","body":"Compare números com referências do cotidiano. Isso torna valores abstratos tangíveis.","example":"“O equivalente a uma hora de trabalho com salário mínimo.”"},{"title":"Diga o que o número não mostra","body":"Toda comparação tem limites: amostra pequena, período curto, coleta própria. Explicitar isso protege a credibilidade.","example":"“Coletamos preços em cinco cafés, num único dia — não é uma média da cidade.”"}],"assignment":"Grave um vídeo ou áudio de 60 segundos apresentando sua comparação de preços: dois números principais, uma referência de escala e um limite explícito.","rubric":"Usei no máximo três números? Ofereci escala humana? Declarei os limites da coleta?"},"jornalismo-investigativo:0":{"title":"Investigar exige motivo público","intro":"Jornalismo investigativo revela informações relevantes que alguém prefere esconder ou que exigem apuração aprofundada. Começa com uma hipótese clara e uma justificativa de interesse público.","steps":[{"title":"Interesse público, não curiosidade","body":"Interesse público envolve direitos, segurança, dinheiro público, saúde, serviços ou abuso de poder. Curiosidade sobre a vida privada não basta.","example":"Investigar se um serviço público cobra taxas indevidas: interesse público. Expor a vida pessoal de um vendedor: não."},{"title":"Hipótese investigativa","body":"Formule a suspeita de forma específica e verificável, com quem, o quê e onde.","example":"“Estabelecimentos na rua X cobram de turistas preços diferentes dos afixados.”"},{"title":"Avalie riscos e capacidade","body":"Investigações podem ter riscos legais, físicos e éticos. Avalie se você tem os meios e se o risco é proporcional ao interesse público.","example":"Uma investigação sobre preços para turistas é viável; temas com risco à segurança exigem estrutura profissional."}],"assignment":"Proponha uma pequena investigação viável: hipótese, justificativa de interesse público, riscos e por que ela está dentro da sua capacidade.","rubric":"A justificativa é de interesse público real? A hipótese é específica? Avaliei riscos com honestidade?"},"jornalismo-investigativo:1":{"title":"Seguir a trilha dos documentos","intro":"Na investigação, documentos são a espinha dorsal: registros, recibos, contratos, fotos datadas. Uma trilha de evidências bem documentada transforma suspeita em demonstração.","steps":[{"title":"Identifique documentos possíveis","body":"Que registros existiriam se a hipótese fosse verdadeira? Recibos, cardápios, anúncios, registros públicos, mensagens.","example":"Se há cobrança diferenciada, devem existir recibos com valores distintos para o mesmo produto."},{"title":"Construa a cadeia de evidências","body":"Cada evidência deve ter origem, data e forma de obtenção registradas. A cadeia mostra como você chegou a cada conclusão.","example":"Recibo 1 (cliente local, 14/10, 20 yuan) e recibo 2 (turista, mesmo dia, 35 yuan), obtidos com autorização dos clientes."},{"title":"Respeite limites legais e éticos","body":"Não obtenha documentos por invasão, engano grave ou violação de privacidade. Métodos ilegítimos comprometem a investigação e as pessoas envolvidas.","example":"Pedir aos clientes que compartilhem voluntariamente seus recibos, em vez de fotografar recibos alheios."}],"assignment":"Para sua investigação, liste cinco documentos que confirmariam ou refutariam a hipótese, como obtê-los legitimamente e como registrar cada um.","rubric":"Os documentos realmente testam a hipótese? Os métodos de obtenção são legítimos? A cadeia de registro está clara?"},"jornalismo-investigativo:2":{"title":"Todo acusado tem direito de resposta","intro":"Antes de publicar uma acusação ou revelação, é obrigatório ouvir o outro lado e testar as próprias conclusões. O contraditório protege a justiça e a própria investigação contra erros.","steps":[{"title":"Ouça os envolvidos","body":"Apresente às pessoas ou instituições citadas as informações que serão publicadas e dê prazo razoável para resposta.","example":"Enviar ao estabelecimento os recibos e perguntar como explica a diferença de preço, com prazo de 48 horas."},{"title":"Teste explicações alternativas","body":"Existe outra razão para os fatos encontrados? Promoções, horários, tamanhos diferentes? Investigue antes de concluir.","example":"Verificar se o preço diferente se deve a uma promoção para moradores com cartão de fidelidade."},{"title":"Publique a resposta com justiça","body":"A resposta do outro lado deve aparecer de forma fiel e com destaque proporcional, não escondida no final.","example":"“O gerente afirmou que a diferença se deve a um desconto para clientes cadastrados; não havia aviso visível na loja.”"}],"assignment":"Escreva a mensagem de pedido de posicionamento para a parte investigada e liste três explicações alternativas que você precisa descartar antes de publicar.","rubric":"A mensagem apresenta os fatos com clareza e prazo justo? Considerei explicações alternativas plausíveis? Previ como publicar a resposta?"},"jornalismo-investigativo:3":{"title":"Dizer o que foi provado — e só isso","intro":"A síntese investigativa apresenta os achados com precisão, separando o que foi demonstrado, o que é indício e o que permanece sem resposta. Exagerar destrói a credibilidade de um bom trabalho.","steps":[{"title":"Hierarquize os achados","body":"Comece pelo que foi confirmado com mais força. Indícios e hipóteses vêm depois, claramente marcados.","example":"“Confirmamos cobrança diferente em 4 de 10 lojas. Em outras 2, há indícios, mas sem recibo.”"},{"title":"Linguagem proporcional","body":"Use verbos que correspondam à força da evidência: demonstrou, indica, sugere, não foi possível confirmar.","example":"Evite “as lojas enganam turistas” se só quatro foram verificadas."},{"title":"Explique o método","body":"Conte ao público como a investigação foi feita: período, amostra, documentos e limites. Isso permite avaliação independente.","example":"“Visitamos 10 lojas entre 10 e 14 de outubro, com dois compradores — um local e um estrangeiro.”"}],"assignment":"Escreva a síntese de uma investigação (real ou simulada) em 250 palavras: achados hierarquizados, linguagem proporcional, método e limites.","rubric":"Separei confirmação de indício? Os verbos correspondem à força da evidência? O método está explicado?"},"comunicacao-verbal:0":{"title":"Da observação à fala clara","intro":"Comunicar bem não é apenas falar sem pausas. É escolher o que é relevante, organizar relações e convidar a outra pessoa a acompanhar o raciocínio.","steps":[{"title":"Separe fato e julgamento","body":"Comece registrando o que os sentidos permitem observar; adie adjetivos avaliativos até ter elementos que os sustentem.","example":"Em vez de “é uma rua fantástica”, experimente “as copas das árvores cobrem grande parte da calçada”."},{"title":"Suba a escada narrativa","body":"Experimente observação, descrição, sensação, espaço, contexto, comparação, interpretação, elemento humano e síntese. A ordem pode variar conforme a história.","example":"Uma rua arborizada → a luz entre as folhas → pessoas caminhando → a sensação de escala humana."},{"title":"Use uma ideia por bloco","body":"Uma estrutura simples de fala é tema → detalhe → consequência → transição. A pausa separa os blocos e melhora a compreensão.","example":"“Repare na fachada. Os elementos verticais alongam a composição. De longe, o prédio parece ainda mais alto.”"}],"assignment":"Escolha um objeto próximo, grave 45 segundos de descrição objetiva e depois 45 segundos acrescentando contexto e interpretação claramente identificada.","rubric":"Distingui observação e opinião? Usei dois detalhes concretos? Minha conclusão decorreu do que mostrei?"},"comunicacao-verbal:1":{"title":"As nove camadas em uma cena","intro":"Uma boa narração alterna função, profundidade e intenção. As nove camadas são possibilidades, não uma lista que precisa aparecer em todo vídeo.","steps":[{"title":"Camada observável","body":"Comece com o que uma câmera ou um microfone pode registrar: forma, direção, intensidade e ação. Não atribua causa antes de apurá-la.","example":"Vejo árvores nos dois lados da rua; algumas pessoas atravessam a faixa de pedestres."},{"title":"Camada de contexto","body":"Localização, origem e finalidade pedem fonte. Se não sabe por que a rua é assim, formule uma pergunta em vez de preencher a lacuna com certeza aparente.","example":"A origem desse conjunto de fachadas é algo que ainda preciso pesquisar."},{"title":"Camada de significado","body":"Interpretação e síntese são o lugar da sua voz autoral. Torne explícito que se trata de uma leitura, nunca de um fato confirmado.","example":"Para mim, a escala menor das lojas torna a caminhada mais convidativa."}],"assignment":"Grave a mesma rua em 3 versões de 30 segundos: registro factual, visita guiada e reflexão pessoal. Identifique em voz alta qual camada está usando.","rubric":"Pelo menos três detalhes verificáveis, uma pergunta de apuração e uma interpretação corretamente sinalizada."},"comunicacao-verbal:2":{"title":"Estruturas que sustentam a fluência","intro":"Fluência não significa falar sem respirar: significa oferecer ao ouvinte um caminho inteligível entre ideias.","steps":[{"title":"Estrutura tema–detalhe–efeito","body":"Abra o tópico, descreva uma evidência e explique por que ela importa. O ouvinte deve perceber claramente a progressão.","example":"Esta rua favorece a caminhada. Há sombra ao longo da calçada. Isso torna o percurso mais confortável sob o sol."},{"title":"Pontes sem redundância","body":"Escolha conectores segundo a relação lógica: contraste, consequência, sequência, ressalva. Evite iniciar toda frase com “e aí”.","example":"Além disso indica acréscimo; por outro lado indica contraste; por isso indica consequência."},{"title":"Retomada elegante","body":"Se perder uma palavra, reformule a ideia. Pausas deliberadas são melhores do que acelerar e empilhar muletas verbais.","example":"Melhor dizendo: não é a rua inteira que está vazia; é este trecho, neste horário."}],"assignment":"Descreva um ambiente por 60 segundos usando três relações diferentes: adição, contraste e consequência. Ouça e marque onde a transição ficou artificial.","rubric":"Cada conector corresponde à relação pretendida; duas pausas úteis; conclusão compreensível."},"comunicacao-verbal:3":{"title":"Síntese sem simplificação enganosa","intro":"Uma narração curta precisa escolher o essencial sem apagar as ressalvas relevantes.","steps":[{"title":"Pergunta editorial","body":"Antes de reduzir o texto, escreva qual pergunta o vídeo responde. Tudo o que não ajuda a respondê-la pode ficar fora.","example":"Pergunta: como esta praça é usada no começo do dia?"},{"title":"Três níveis de duração","body":"A versão de 15 segundos entrega a ideia central; a de 45 acrescenta evidência; a de 90 inclui contexto e limites.","example":"15 s: praça movimentada; 45 s: horários e ações observadas; 90 s: comparação cautelosa com outra visita."},{"title":"Precisão sob pressão","body":"Não troque “neste horário” por “sempre” para ganhar velocidade. Cuidado especial com números, generalizações e falas atribuídas.","example":"Observei três lojas abertas às 8h; não posso afirmar que todas abrem nesse horário."}],"assignment":"Grave versões de 15, 45 e 90 segundos sobre o mesmo local. Transcreva as três e circule detalhes essenciais preservados.","rubric":"Todas respondem à mesma pergunta; as versões curtas preservam contexto mínimo e incertezas importantes."},"oratoria-retorica:0":{"title":"Um argumento não é um adjetivo forte","intro":"A credibilidade vem de afirmações precisas, razões compreensíveis, evidências adequadas e reconhecimento de limites.","steps":[{"title":"Tese definida","body":"Diga qual ideia você sustenta em uma frase, delimitando contexto e alcance.","example":"“Nesta caminhada, as calçadas arborizadas pareceram mais confortáveis para mim.”"},{"title":"Razões e exemplos","body":"Apresente dois motivos observáveis ou documentados. Exemplos ilustram; dados podem sustentar generalizações quando bem coletados.","example":"“Havia sombra contínua em boa parte do trecho e fluxo de pedestres.”"},{"title":"Objeção e limite","body":"Pergunte o que poderia enfraquecer sua interpretação. Esse exercício torna o discurso mais robusto.","example":"“Isso não comprova que a região é sempre mais confortável.”"}],"assignment":"Defenda uma opinião sobre uma experiência urbana em 90 segundos, identificando evidência, interpretação e um limite.","rubric":"Minha tese é específica? Apresentei razões? Reconheci limites?"},"oratoria-retorica:1":{"title":"Arquitetura de um argumento auditivo","intro":"Argumentar para a câmera exige tese delimitada, razões reconhecíveis e espaço para o contraponto.","steps":[{"title":"Tese proporcional","body":"Faça uma afirmação que suas observações realmente possam sustentar. A frase “na minha visita” é diferente de “na cidade inteira”.","example":"Neste trajeto, o metrô foi mais previsível do que o deslocamento de carro que testei."},{"title":"Razão e evidência","body":"Não confunda opinião com prova. A razão explica seu pensamento; a evidência verificável apoia ou enfraquece a afirmação.","example":"Razão: menos variação no tempo; evidência: os tempos registrados em três viagens."},{"title":"Contraponto honesto","body":"Antecipe a limitação mais forte da sua própria conclusão. Uma ressalva relevante aumenta credibilidade.","example":"Isso não significa que o metrô seja melhor para pessoas com mobilidade reduzida em todas as rotas."}],"assignment":"Defenda uma escolha cotidiana em até 70 segundos, com uma tese, duas razões, um dado observado e uma ressalva.","rubric":"Não há generalização indevida; razões distintas; ressalva não anula o argumento, apenas delimita."},"oratoria-retorica:2":{"title":"Ethos, logos e pathos sem manipulação","intro":"A retórica organiza confiança, explicação e atenção emocional. Jornalismo exige que esses recursos não distorçam evidências.","steps":[{"title":"Ethos: transparência","body":"Mostre de onde você fala, o que sabe e o que ainda não verificou. Não finja especialização.","example":"Visitei este espaço duas vezes; não entrevistei moradores, então minha leitura é parcial."},{"title":"Logos: encadeamento","body":"Organize relações que possam ser acompanhadas pelo público. Números sem base e causalidades presumidas enfraquecem a explicação.","example":"A contagem aumentou neste período; não sabemos ainda se isso reflete uma tendência duradoura."},{"title":"Pathos: humanidade sem exploração","body":"A emoção aproxima o espectador; jamais substitui consentimento, contexto ou dignidade de quem é filmado.","example":"Uma história pessoal pode ilustrar a rotina, mas não representa automaticamente todo um bairro."}],"assignment":"Reescreva uma narração excessivamente dramática em três parágrafos: transparência, evidência e significado humano.","rubric":"Credibilidade explícita, lógica verificável e emoção sem exagero."},"oratoria-retorica:3":{"title":"Explicar e persuadir com integridade","intro":"Um bom comunicador ajuda a audiência a compreender uma escolha sem ocultar alternativas ou limites.","steps":[{"title":"Prepare o contrato com o público","body":"Diga o que será explicado, para quem e com qual recorte. Uma promessa específica orienta as próximas cenas.","example":"Vou mostrar três critérios que usei para escolher uma câmera de viagem."},{"title":"Trabalhe objeções concretas","body":"Compare critérios que realmente mudariam a decisão. Não crie adversários fictícios para derrotá-los.","example":"Para quem grava à noite, o desempenho em baixa luz pode importar mais do que o zoom."},{"title":"Termine com escolha condicionada","body":"Uma recomendação responsável depende de necessidades, condições e incertezas. Evite conclusões universais.","example":"Se a prioridade é portabilidade, eu escolheria A; para telefoto, avaliaria B."}],"assignment":"Grave um guia de decisão de 90 segundos, informando critérios, trade-offs e para quem a conclusão se aplica.","rubric":"O público consegue repetir critérios; contrapontos foram apresentados; não há promessas infundadas."},"locucao-voz:0":{"title":"Sua voz também organiza a informação","intro":"Ritmo, pausas e ênfase criam hierarquia. Uma fala articulada não exige voz artificial nem volume excessivo.","steps":[{"title":"Respiração e preparo","body":"Relaxe ombros, respire com conforto e evite apertar a garganta. Faça breves aquecimentos leves, sem esforço ou dor.","example":"Leia uma frase curta em uma expiração natural, sem competir com o ar."},{"title":"Marque unidades de sentido","body":"Insira pausas onde termina uma ideia, e não apenas onde aparece pontuação. A voz deve ajudar a organizar o pensamento.","example":"“Nesta esquina / a arquitetura muda / e o fluxo de pessoas aumenta.”"},{"title":"Destaque uma palavra-chave","body":"A ênfase pode vir de intensidade, duração ou mudança sutil de tom. Evite ressaltar todas as palavras.","example":"Compare: “a fachada é ESTREITA” e “a FACHADA é estreita”."}],"assignment":"Grave duas versões de um parágrafo: uma neutra e outra com três pausas e duas ênfases conscientes. Compare inteligibilidade e naturalidade.","rubric":"Minha voz permaneceu confortável? As pausas facilitaram a compreensão? A ênfase teve intenção?"},"locucao-voz:1":{"title":"Dicção e articulação inteligível","intro":"Uma dicção clara depende de articulação coordenada, não de pronunciar todas as sílabas artificialmente.","steps":[{"title":"Ataque limpo","body":"Comece a frase sem atropelar a primeira palavra. Prepare o ar e inicie após uma pausa curta.","example":"Compare “nesta esquina” dito com início precipitado versus início calmo."},{"title":"Consoantes estratégicas","body":"Preste atenção às terminações que distinguem palavras. Grave em ritmo normal, depois escute se o sentido se mantém.","example":"“três vitrines” versus “treze vitrines”: a inteligibilidade importa mais que a velocidade."},{"title":"Articulação sem rigidez","body":"Solte mandíbula e lábios. Treine primeiro devagar e depois recupere ritmo natural; tensão excessiva torna a fala menos expressiva.","example":"Repetir “contraste entre estruturas” com clareza sem encenar cada consoante."}],"assignment":"Leia cinco frases informativas em três velocidades; avalie em qual delas as palavras permanecem naturais e compreensíveis.","rubric":"Ataques audíveis, consoantes decisivas preservadas e ausência de tensão perceptível."},"locucao-voz:2":{"title":"Ritmo, entonação e silêncio","intro":"A pontuação que o ouvido percebe nasce das pausas e mudanças de entonação, não apenas da vírgula no roteiro.","steps":[{"title":"Agrupe ideias pela respiração","body":"Marque barras no texto onde uma unidade de sentido termina. Não interrompa entre sujeito e verbo sem intenção expressiva.","example":"A rua está tranquila / mas o comércio começou a abrir / e a circulação deve mudar."},{"title":"Palavra de foco","body":"Escolha um único elemento principal por frase; o excesso de ênfase produz monotonia dramática.","example":"O detalhe mais interessante é a LUZ — não necessariamente a loja inteira."},{"title":"Silêncio informativo","body":"Dê tempo para o espectador examinar a imagem. Uma pausa pode ser conteúdo: mostra, não apenas afirma.","example":"Depois de “escute o ambiente”, deixe dois segundos reais de som local."}],"assignment":"Narre um trecho de 40 segundos duas vezes, primeiro sem marcações, depois com três pausas e duas palavras de foco.","rubric":"Pausas respeitam unidades de sentido; variação de ritmo ajuda a compreender; silêncio não soa como falha."},"locucao-voz:3":{"title":"Leitura expressiva para vídeo","intro":"Ler bem diante de uma câmera é interpretar uma intenção, não recitar letras sem contato com o público.","steps":[{"title":"Escreva para a voz","body":"Prefira sintaxe que caiba numa respiração e substitua construções tipicamente burocráticas por enunciados claros.","example":"Troque “no que concerne ao deslocamento” por “quando falamos de deslocamento”."},{"title":"Marcação mínima","body":"Use barras para pausa, maiúsculas pontuais para ênfase e colchetes para ação. Não exagere nos sinais.","example":"[MOSTRAR A FACHADA] É aqui / que o material revela sua textura."},{"title":"Olho na lente","body":"Divida o roteiro em unidades que possa lembrar. Fale uma ideia olhando para a lente, depois consulte a próxima.","example":"Uma frase-chave por cartão é mais manejável do que oito linhas corridas."}],"assignment":"Prepare um texto de 120 palavras com marcações de performance e grave uma versão lendo e outra apoiada só em palavras-chave.","rubric":"Voz natural, nenhuma afirmação omitida, olhar frequente para a lente."},"comunicacao-camera:0":{"title":"Fale para uma pessoa, não para uma lente","intro":"A câmera amplia pequenos hábitos de postura, olhar e gesto. A naturalidade surge de domínio da mensagem, não de decorar cada palavra.","steps":[{"title":"Defina a mensagem central","body":"Antes de gravar, complete a frase: “Quero que a pessoa entenda que...”. Essa decisão reduz desvios.","example":"“Quero mostrar como a arborização muda a experiência de caminhar.”"},{"title":"Use pontos de apoio","body":"Memorize três ideias, não um parágrafo inteiro. Conte cada ideia com palavras próprias.","example":"Abertura: rua; desenvolvimento: sombra e movimento; fechamento: impressão pessoal."},{"title":"Coordene corpo e quadro","body":"Olhe para a lente ao se dirigir ao público; olhe para o objeto quando for mostrá-lo. Gestos devem destacar referências, não competir com elas.","example":"Ao dizer “naquele edifício”, indique a direção com o olhar e um gesto simples."}],"assignment":"Apresente um lugar em 45 segundos, uma vez com roteiro completo e outra com três palavras-chave. Compare os dois resultados.","rubric":"Mantive a ideia central? Minha postura está confortável? Os gestos têm função?"},"comunicacao-camera:1":{"title":"Gestos, postura e linguagem corporal","intro":"A postura funciona como informação contextual. O gesto deve esclarecer onde olhar, não disputar atenção com o conteúdo.","steps":[{"title":"Organize o espaço corporal","body":"Mantenha estabilidade quando o quadro exige explicação; mova-se quando o deslocamento fizer parte da história.","example":"Em um close de produto, aproxime as mãos lentamente para indicar o acabamento."},{"title":"Gesto com propósito","body":"Associe gestos a funções: apontar a referência, dimensionar uma distância, contrastar duas opções. Evite coreografar tudo.","example":"Com a mão esquerda indico a fachada antiga; com a direita, a intervenção recente."},{"title":"Coerência entre emoção e voz","body":"Expressões faciais devem acompanhar o significado. Assuntos delicados pedem presença respeitosa, não entusiasmo automático.","example":"Para falar de uma dificuldade vivida por alguém, reduza o sorriso de apresentação."}],"assignment":"Grave uma explicação de um objeto por 45 segundos em plano fixo. Faça duas versões: gestos livres e gestos com função.","rubric":"Gestos ajudam a identificar elementos, postura não impede áudio e intenção combina com tema."},"comunicacao-camera:2":{"title":"Falar sem depender do teleprompter","intro":"O objetivo do treino é internalizar a estrutura do raciocínio, não decorar o texto completo.","steps":[{"title":"Reduza o texto em camadas","body":"Leia o texto integral; transforme em cinco frases-chave; reduza a três palavras por bloco; por fim grave livremente.","example":"Roteiro: abertura → rua → textura → pessoas → síntese."},{"title":"Use âncoras visuais","body":"Associe cada ideia a algo que apareça na imagem. Isso reduz a carga de memória e fortalece a naturalidade.","example":"Ao mostrar a esquina, fale de orientação; ao aproximar da fachada, fale de material."},{"title":"Recupere-se de tropeços","body":"Se perder a linha, pare e retome do conceito mais próximo. Na edição, corte a pausa; não é preciso fingir uma tomada perfeita.","example":"“Voltando ao ponto central: a iluminação altera o modo como percebemos a vitrine.”"}],"assignment":"Grave quatro tomadas de 30 segundos, cada vez com menos apoio: roteiro, tópicos, palavras-chave e nenhum texto.","rubric":"Ideia essencial preservada, continuidade retomada após tropeços e presença visual convincente."},"comunicacao-camera:3":{"title":"Presença em movimento","intro":"Falar e caminhar exige uma logística de segurança, áudio e atenção ambiental diferente da apresentação parada.","steps":[{"title":"Escolha o ritmo do corpo","body":"Diminua o passo quando uma explicação exigir precisão. Não caminhe de costas em áreas movimentadas.","example":"Pare antes de apresentar números ou instruções que o espectador precisa entender."},{"title":"Separe fala e cobertura","body":"Se o ambiente estiver ruidoso, registre imagens de apoio e faça locução posterior, identificando quando a fala foi gravada depois.","example":"Capte dez segundos da travessia; narre a observação em um local mais silencioso."},{"title":"Use marcos espaciais","body":"Faça a progressão da história coincidir com pontos visuais. Evite “aqui” sem o público saber a que se refere.","example":"Ao cruzar a esquina, mostre a mudança de escala e diga qual elemento mudou."}],"assignment":"Produza uma sequência de três pontos: introdução parado, caminhada de dez metros e detalhe imóvel com locução.","rubric":"Deslocamento seguro, som inteligível e referência espacial inequívoca."},"linguagem-descritiva:0":{"title":"Troque adjetivos vagos por detalhes","intro":"Palavras genéricas não são proibidas; elas se tornam insuficientes quando substituem observações que ajudariam o público a imaginar a cena.","steps":[{"title":"Descreva a forma","body":"Observe escala, proporções, linhas, curvaturas, simetria e ocupação do espaço. Nomeie primeiro o que a câmera poderia confirmar.","example":"“Uma fachada estreita, com janelas altas e linhas verticais repetidas.”"},{"title":"Descreva material e luz","body":"Considere textura, acabamento, reflexos, sombras e transições. Evite identificar materiais específicos sem segurança.","example":"“A superfície lisa reflete as luzes da rua” é mais prudente que supor o material."},{"title":"Mostre relações","body":"Descrições ficam mais ricas quando explicam onde cada elemento está e como se relaciona com os demais.","example":"“A vegetação sombreia a calçada, enquanto as vitrines iluminam a faixa junto às fachadas.”"}],"assignment":"Grave uma descrição de 60 segundos sem usar “bonito”, “legal”, “incrível” ou “coisa”. Reescreva a transcrição acrescentando cinco detalhes verificáveis.","rubric":"Nomeei formas, relações e texturas? Evitei adjetivos genéricos? Um ouvinte imaginaria a cena?"},"linguagem-descritiva:1":{"title":"O atlas dos detalhes observáveis","intro":"A descrição rica nasce de escolhas visuais exatas: material, forma, luz, relação e movimento.","steps":[{"title":"Da categoria ao detalhe","body":"Não pare em “prédio”, “vitrine” ou “árvore”. Descreva um traço que permitiria reconhecer a cena em outra fotografia.","example":"Fachada de tijolos escuros, com janelas estreitas e molduras metálicas."},{"title":"Vocabulário com prova visual","body":"O adjetivo deve corresponder ao que pode ser visto ou justificado. “Histórico” não se prova pela aparência envelhecida.","example":"Prefira “fachada com ornamentos” a “fachada centenária” sem fonte."},{"title":"Relação entre detalhes","body":"Uma lista de características não é uma cena. Explique como uma característica altera a percepção de outra.","example":"A vitrine iluminada ganha destaque porque a calçada ao redor está em sombra."}],"assignment":"Encontre cinco elementos em uma fotografia sua: material, forma, cor, iluminação e relação espacial. Descreva todos em até 70 segundos.","rubric":"Nenhum adjetivo vazio; detalhes correspondem à imagem; há pelo menos duas relações entre elementos."},"linguagem-descritiva:2":{"title":"Vocabulário de relações espaciais","intro":"Um narrador conduz o olhar com palavras de orientação, hierarquia e distância, mantendo o público situado.","steps":[{"title":"Eixo de referência","body":"Estabeleça quem está olhando e para onde. “À direita” pode se referir à sua direita ou ao lado direito do quadro.","example":"À direita do enquadramento há uma fileira de bicicletas."},{"title":"Escala relativa","body":"Indique proporção com referência concreta em vez de estimativas arbitrárias.","example":"A porta ocupa quase toda a altura do primeiro pavimento."},{"title":"Movimento do observador","body":"Quando muda o ponto de vista, avise: por dentro, de cima, próximo, ao fundo, cruzando a rua.","example":"Deste lado, os volumes parecem compactos; do outro, percebemos o recuo das fachadas."}],"assignment":"Faça um passeio descritivo em 50 segundos por uma imagem fixa usando primeiro plano, fundo, esquerda, direita e mudança de perspectiva.","rubric":"Referências consistentes, sem ambiguidades de orientação, escala sustentada."},"linguagem-descritiva:3":{"title":"Descrição cinematográfica sem exagero","intro":"A descrição audiovisual eficiente informa o que a imagem não comunica sozinha e dá espaço para a observação silenciosa.","steps":[{"title":"Escolha o que verbalizar","body":"Se o espectador já vê uma bicicleta vermelha, a voz pode explicar por que você decidiu acompanhá-la, não apenas repetir a cor.","example":"A câmera acompanha a bicicleta até onde a rua fica mais estreita."},{"title":"Associe escala e sensação","body":"Descreva o que provoca a sensação, não apenas o sentimento que quer impor.","example":"As sombras longas tornam o corredor visualmente mais profundo."},{"title":"Economia e silêncio","body":"Deixe momentos sem fala quando som e imagem entregarem a informação. Não preencha toda pausa com adjetivos.","example":"A porta abre; ouve-se o sino; a câmera permanece na entrada por dois segundos."}],"assignment":"Monte um vídeo de cinco planos e escreva até 65 palavras de narração, incluindo um silêncio intencional.","rubric":"Imagem e voz são complementares; descrição precisa; nenhuma emoção imposta como fato."},"storytelling:0":{"title":"Uma história é uma mudança significativa","intro":"Uma sequência de imagens só se torna narrativa quando existe uma pergunta ou transformação que orienta a atenção.","steps":[{"title":"Identifique o eixo","body":"Defina quem ou o que acompanhamos, qual é a curiosidade e por que aquilo importa.","example":"“Quero descobrir como um artesão organiza a produção em um espaço tão pequeno.”"},{"title":"Construa progressão","body":"Use começo (situação), meio (busca/observação) e fim (descoberta ou limite da investigação). Não fabrique conflitos.","example":"Pergunta → tentativa de observar o processo → resposta do entrevistado → reflexão."},{"title":"Mostre antes de concluir","body":"Use uma cena concreta como evidência sensorial. Deixe interpretações explicitamente associadas ao narrador.","example":"Em vez de dizer “a rotina é intensa”, mostre ações e pergunte sobre a rotina."}],"assignment":"Crie a estrutura de um vídeo de um minuto: pergunta central, três cenas verificáveis e conclusão que não exagere o que foi apurado.","rubric":"Há uma pergunta clara? As cenas conduzem a descoberta? O fim respeita as evidências?"},"storytelling:1":{"title":"Progressão, expectativa e virada","intro":"Uma boa história não é uma sequência de imagens bonitas: cada cena acrescenta conhecimento ou altera a pergunta.","steps":[{"title":"Pergunta motriz","body":"Abra uma curiosidade que a reportagem possa responder, sem prometer revelações inexistentes.","example":"Por que esta rua parece tão diferente das avenidas vizinhas?"},{"title":"Progressão de descoberta","body":"Ordene as cenas em etapas reais do processo: percepção, busca, evidência, revisão e conclusão.","example":"Primeiro observo a arquitetura; depois consulto uma fonte sobre o bairro; por fim atualizo a interpretação."},{"title":"Virada honesta","body":"A surpresa pode ser uma mudança na sua hipótese. Não invente conflito para criar drama.","example":"Eu imaginava que o lugar fosse exclusivamente comercial, mas encontrei moradias no mesmo quarteirão."}],"assignment":"Crie a escaleta de seis cenas sobre uma descoberta real. Registre a pergunta de cada cena e a nova informação acrescentada.","rubric":"Cada cena muda algo; a virada é verdadeira; a resposta final corresponde às provas."},"storytelling:2":{"title":"Cenas, tempo e montagem narrativa","intro":"A montagem cria relações entre acontecimentos, mas não deve sugerir uma cronologia falsa em material documental.","steps":[{"title":"Cena versus resumo","body":"Cena mostra ação concreta no espaço e no tempo; resumo explica mudanças mais amplas. Intercale os dois.","example":"Cena: barista entrega o copo; resumo: ao longo da manhã, o movimento aumenta."},{"title":"Pontes temporais","body":"Use referências verificáveis como depois, no dia seguinte ou em outra visita; não simule continuidade inexistente.","example":"Em outra manhã, voltei à mesma rua e encontrei uma situação diferente."},{"title":"Montagem com responsabilidade","body":"Não conecte reações e falas de pessoas de modo que pareçam responder a algo que não ouviram.","example":"Intercale B-roll da vitrine com sua própria locução, sem atribuir comentários a clientes."}],"assignment":"Escreva o roteiro de um minuto com uma cena, um resumo e uma passagem de tempo explicitamente sinalizada.","rubric":"Cronologia honesta, cenas específicas e ligações de causa não inventadas."},"storytelling:3":{"title":"Encerramentos que deixam sentido","intro":"Um encerramento potente muda a forma como o público interpreta a história, sem precisar de moral genérica.","steps":[{"title":"Retorne à pergunta inicial","body":"Encerre retomando a curiosidade que motivou o vídeo e diga o que foi de fato respondido.","example":"Comecei procurando sinais de vida de bairro; encontrei três formas distintas de ocupar a calçada."},{"title":"Síntese com imagem concreta","body":"Uma observação específica ajuda mais a memória do que uma frase grandiosa que poderia servir a qualquer lugar.","example":"Quando a última mesa é recolhida, a calçada volta a ser um corredor de passagem."},{"title":"Abra uma próxima pergunta","body":"Admita o que ainda não foi investigado. Uma pergunta legítima convida a novos episódios.","example":"Ainda quero entender como os moradores percebem essa transformação."}],"assignment":"Escreva três encerramentos para a mesma reportagem: resposta direta, reflexão pessoal e pergunta em aberto.","rubric":"Coerência com as cenas; nenhum dado novo sem fonte; último plano reforça a ideia."},"improvisacao:0":{"title":"Improvisar é pensar por blocos","intro":"O bom improviso é estruturado: você não conhece antecipadamente cada frase, mas sabe como avançar entre ideias e recuperar o fio.","steps":[{"title":"Pense em blocos curtos","body":"Use quatro blocos: o que é → um detalhe → por que interessa → fechamento. Dois blocos bem desenvolvidos valem mais que dez ideias soltas.","example":"“Estou diante de uma vitrine. O contraste de materiais chama atenção. Isso cria uma leitura de...”"},{"title":"Aprenda retomadas","body":"Se perder a linha, reformule com calma: “Em outras palavras”, “O ponto central é”, “Voltando ao que observamos”.","example":"Evite fingir que não houve pausa; retome naturalmente."},{"title":"Treine restrições criativas","body":"Descreva uma cena sem um adjetivo frequente ou em um tempo menor. A restrição revela repertório e lacunas.","example":"Faça versões de 15, 30 e 60 segundos sobre o mesmo assunto."}],"assignment":"Sorteie um desafio no Estúdio da Voz, grave sem roteiro e repita tentando reduzir redundâncias sem aumentar a velocidade.","rubric":"Mantive coerência? Consegui retomar? Usei exemplos? Houve conclusão?"},"improvisacao:1":{"title":"Conectores e retomadas naturais","intro":"A improvisação melhora quando o repertório oferece relações prontas, não textos inteiros a decorar.","steps":[{"title":"Acréscimo e progressão","body":"Além de acrescentar informação, conectores permitem subir um nível de abstração. Escolha os que ajudam a audiência.","example":"Primeiro o desenho da fachada; além disso, o uso das cores; juntos, esses elementos criam unidade."},{"title":"Contraste e concessão","body":"A conjunção precisa sinalizar oposição real ou restrição importante, não apenas ornamentar a frase.","example":"O corredor é amplo, mas o fluxo de pessoas reduz o espaço disponível."},{"title":"Retomada sem desculpas excessivas","body":"Perder o fio é normal. Prefira marcadores que recuperam o tópico: “o ponto é”, “voltando à cena”.","example":"O ponto principal é que a luz muda conforme caminhamos."}],"assignment":"Fale por 75 segundos sobre uma rua usando um conector de sequência, um de contraste e uma retomada intencional.","rubric":"Conectores correspondem ao raciocínio; retomada não contradiz o que veio antes; fala segue compreensível."},"improvisacao:2":{"title":"Reformular sem perder o significado","intro":"Reformulação é habilidade profissional: permite corrigir precisão, adequar público e recuperar a comunicação.","steps":[{"title":"Troca de registro","body":"Transforme uma frase coloquial em explicação técnica e vice-versa sem acrescentar fatos.","example":"“A peça cai bem” → “o caimento acompanha o corpo sem formar dobras excessivas neste ponto”."},{"title":"Autocorreção explícita","body":"Corrija números ou generalizações na própria gravação quando necessário. Uma correção clara é melhor que esconder a mudança.","example":"Eu disse “todos”; o correto é “os três estabelecimentos que observei”."},{"title":"Paráfrase acessível","body":"Explique termos novos na primeira utilização e retome a palavra técnica depois.","example":"Profundidade de campo é a faixa da imagem que aparece em foco."}],"assignment":"Reformule seis frases de um roteiro: duas mais precisas, duas mais simples, uma com ressalva e uma em outro registro.","rubric":"O significado factual se mantém e as mudanças de registro tornam o texto mais adequado."},"improvisacao:3":{"title":"Improviso em situação de rua","intro":"Na rua, a observação muda; a fala deve responder ao presente sem perder segurança, consentimento e direção narrativa.","steps":[{"title":"Ponto de entrada","body":"Comece por um detalhe que acabou de perceber. Não é preciso fingir que sabe o desfecho.","example":"Eu pretendia mostrar esta loja, mas reparem no movimento que se formou na esquina."},{"title":"Roteiro flexível","body":"Leve três âncoras: pergunta, evidência desejada e saída possível. Se a evidência não aparecer, conte isso.","example":"Pergunta: como funciona o serviço? Se não obtiver resposta, registre apenas o funcionamento visível."},{"title":"Saída responsável","body":"Saiba encerrar quando a situação se torna desconfortável, restrita ou insegura. Não transforme recusa em conflito.","example":"Não vamos gravar dentro do estabelecimento; sigo mostrando o entorno público."}],"assignment":"Faça duas tomadas de 45 segundos num ambiente seguro: uma seguindo uma pauta e outra reagindo a um detalhe inesperado.","rubric":"Improviso observa de verdade, não atribui motivos a terceiros e preserva a segurança."},"semiotica:0":{"title":"A imagem também tem gramática","intro":"Formas, cores, gestos e enquadramentos comunicam por convenções e contexto. Uma leitura visual precisa ser argumentada, não presumida universal.","steps":[{"title":"Denotação","body":"Descreva o que aparece antes de interpretar.","example":"“Fundo bege, duas peças de roupa e iluminação lateral.”"},{"title":"Conotação","body":"Proponha sentidos possíveis, reconhecendo que variam entre públicos.","example":"“A paleta pode sugerir sobriedade, mas essa associação é culturalmente situada.”"},{"title":"Composição","body":"Observe escala, centro de atenção, repetição, contraste e ausência.","example":"“A luz dirige o olhar para a peça à direita.”"}],"assignment":"Escolha uma vitrine ou cartaz. Escreva cinco fatos visuais e três leituras possíveis, marcando a diferença.","rubric":"Separei aparência e interpretação? Reconheci ambiguidade? Justifiquei minhas leituras?"},"semiotica:1":{"title":"Gestos, expressão e distância social","intro":"Gestos carregam significado contextual. A interpretação varia com cultura, situação, interlocutores e intenção.","steps":[{"title":"Não leia mente pelo corpo","body":"Um gesto isolado não comprova humor, caráter ou intenção. Descreva antes de inferir.","example":"A pessoa cruza os braços; isso não prova que esteja desconfortável."},{"title":"Espaço e enquadramento","body":"A câmera altera a percepção de proximidade. Peça consentimento quando filmar alguém identificável.","example":"Um close aproxima emocionalmente, mesmo sem que haja intimidade real."},{"title":"Coerência multimodal","body":"Sua expressão, voz e enquadramento devem cooperar. A divergência pode ser intencional, mas precisa de função clara.","example":"Tom neutro e plano estável ajudam numa explicação técnica."}],"assignment":"Analise três quadros sem interpretar estados psicológicos. Depois formule hipóteses marcadas como hipóteses.","rubric":"Observação separada de inferência, consentimento respeitado e contexto identificado."},"semiotica:2":{"title":"Códigos visuais de imagem e marca","intro":"Cores, materiais e formas acionam associações culturais; elas não têm significado universal ou automático.","steps":[{"title":"Sinal versus convenção","body":"Diferencie o que é visível de sentidos atribuídos socialmente.","example":"A cor vermelha está presente; associá-la à sorte depende de contexto cultural específico."},{"title":"Marca e narrativa visual","body":"Observe repetição de formas, materiais, escala e disposição. Só atribua intenção ao designer com evidência.","example":"O padrão geométrico se repete no letreiro e na embalagem."},{"title":"Conotações concorrentes","body":"Uma estética minimalista pode sugerir sofisticação a alguns públicos e frieza a outros. Não imponha leitura única.","example":"O espaço usa poucas cores; minha impressão é de sobriedade, mas essa leitura não é universal."}],"assignment":"Escolha uma vitrine e produza um inventário de sinais observáveis, seguido de duas interpretações possíveis.","rubric":"Sinais sustentados pela imagem, interpretação condicional e ausência de estereótipos."},"semiotica:3":{"title":"Análise semiótica de uma cena urbana","intro":"Analisar comunicação visual é ligar um detalhe material a um sistema de sentidos sem confundir associação e comprovação.","steps":[{"title":"Inventário e recorte","body":"Escolha cinco sinais: placas, cores, trajetos, organização dos objetos e linguagem escrita.","example":"Há setas no piso, um aviso bilíngue e três pontos de acesso."},{"title":"Código em contexto","body":"Pergunte quem interpreta o sinal, com quais referências e em que situação. Uma placa pode ser óbvia ao morador e confusa ao visitante.","example":"Uma instrução apenas em caracteres chineses pode exigir tradução para mim."},{"title":"Narrativa de descoberta","body":"Mostre o sinal, conte sua primeira leitura, verifique a interpretação e apresente o que aprendeu.","example":"Achei que o símbolo indicava saída; conferi e descobri que orienta para outra plataforma."}],"assignment":"Produza cinco tomadas detalhando um sistema de sinalização pública e explique suas leituras e verificações.","rubric":"Apresenta contexto, distingue suposição de confirmação e preserva a interpretação original do sinal."},"psicologia-comunicacao:0":{"title":"Atenção é um recurso limitado","intro":"Explicações longas podem perder o público por excesso de ideias simultâneas. Clareza exige selecionar e ordenar informação.","steps":[{"title":"Uma ideia por passagem","body":"Escolha a informação indispensável antes de acrescentar curiosidades.","example":"Abra com o que é; só depois explique por que importa."},{"title":"Exemplos concretos","body":"Apoie conceitos novos em cenas ou objetos observáveis sem distorcer a ideia.","example":"Ao explicar “escala humana”, mostre a relação entre pessoa e fachada."},{"title":"Recuperação e síntese","body":"Reforce uma mensagem com breve recapitulação em palavras novas, não repetição mecânica.","example":"“Ou seja, o ambiente parece menor porque podemos comparar edifícios, árvores e pedestres.”"}],"assignment":"Explique uma ideia complexa em 30 e 90 segundos; peça a alguém que repita a mensagem essencial.","rubric":"A ideia principal apareceu cedo? Cortei jargões? O exemplo ajudou?"},"psicologia-comunicacao:1":{"title":"Emoção e memória na narrativa","intro":"Informações memoráveis combinam concretude, relação humana e estrutura, sem precisar fabricar emoção.","steps":[{"title":"Imagem mental específica","body":"Palavras concretas ajudam a audiência a reconstruir uma cena. Substitua generalidades por acontecimentos.","example":"Em vez de “um movimento intenso”, diga “três entregadores aguardam diante da porta”."},{"title":"Âncora narrativa","body":"Retomar um detalhe no final ajuda o público a perceber continuidade e mudança.","example":"A bicicleta estacionada na abertura volta no fim, quando a loja fecha."},{"title":"Emoção como perspectiva","body":"Diga quando o sentimento é seu; não trate a reação do público como obrigatória.","example":"Para mim, a cena transmite tranquilidade — mas a rua também abriga trabalho intenso."}],"assignment":"Grave uma história de um minuto com uma imagem mental, um detalhe retomado e uma reflexão pessoal claramente situada.","rubric":"Há estrutura reconhecível e emoção baseada em experiência, não em insinuação sobre terceiros."},"psicologia-comunicacao:2":{"title":"Vieses, primeira impressão e enquadramento","intro":"O cérebro completa lacunas; o jornalismo exige resistir à tentação de transformar a primeira impressão em conclusão.","steps":[{"title":"Viés de confirmação","body":"Depois de formar uma hipótese, procure ativamente informações que poderiam contrariá-la.","example":"Achei a rua vazia: visitei em outro horário para testar se a impressão persistia."},{"title":"Disponibilidade e seleção","body":"Uma cena marcante não representa a frequência do fenômeno. Indique o tamanho e o limite da observação.","example":"Vi uma fila longa hoje; isso não prova que a loja vive lotada."},{"title":"Enquadramento editorial","body":"Mostre como um close e um plano geral mudam a interpretação de uma cena; nenhum deles é necessariamente a história completa.","example":"O close revela a fila; o plano aberto mostra outros guichês sem espera."}],"assignment":"Crie dois roteiros sobre o mesmo local com enquadramentos diferentes e explique o que cada um omite.","rubric":"Inferências identificadas, hipótese testável e consciência das omissões do quadro."},"psicologia-comunicacao:3":{"title":"Clareza para públicos diferentes","intro":"Explicar o mesmo fato para públicos diferentes pede mudanças de ordem, vocabulário e analogias, não mudanças arbitrárias de evidência.","steps":[{"title":"Modelo mental inicial","body":"Pergunte o que o público provavelmente já sabe; defina apenas os termos que bloqueiam compreensão.","example":"Para quem nunca usou metrô, explique catraca, transferência e plataforma antes das dicas."},{"title":"Exemplo antes do conceito","body":"Comece com um caso concreto e nomeie o princípio depois.","example":"Mostro a mão ajustando o foco; então explico profundidade de campo."},{"title":"Analogia com limite","body":"Uma comparação ajuda até o ponto em que as diferenças importam. Explicite esse limite.","example":"O roteiro é como um mapa: orienta caminhos, mas não prevê tudo que acontecerá."}],"assignment":"Explique uma técnica de filmagem a um iniciante em 45 segundos e a um colega experiente em 90 segundos.","rubric":"Os dois entendem a mesma ideia correta; jargões são definidos; analogias não enganam."},"comunicacao-intercultural:0":{"title":"Curiosidade sem generalização","intro":"Narrar outra sociedade exige entender que observações individuais não equivalem a explicações completas sobre uma cultura.","steps":[{"title":"Pergunte antes de interpretar","body":"Use perguntas que deixem a pessoa definir sua própria experiência.","example":"“Como você descreveria essa tradição?” em vez de “Por que os chineses sempre...?”"},{"title":"Evite afirmações totais","body":"Identifique local, período, fonte e alcance de cada observação.","example":"“Nas lojas que visitei neste bairro...” é mais preciso que “na China é assim”."},{"title":"Revise traduções","body":"Expressões podem perder nuance. Confirme com interlocutores quando a tradução for relevante para a reportagem.","example":"Ao inserir legendas, preserve hesitações e incertezas pertinentes."}],"assignment":"Planeje três perguntas para uma entrevista cultural e revise cada uma à procura de pressupostos indevidos.","rubric":"Minha pergunta abre espaço? Evitei estereótipos? Atribuí o ponto de vista a quem o expressou?"},"comunicacao-intercultural:1":{"title":"Perguntas sem exotização","intro":"Cobrir outra cultura exige curiosidade genuína e perguntas que não pressuponham que uma experiência individual represente milhões de pessoas.","steps":[{"title":"Comece pela experiência da pessoa","body":"Pergunte sobre prática concreta em vez de iniciar com uma tese sobre “como os chineses são”.","example":"Como você costuma escolher onde tomar café neste bairro?"},{"title":"Evite comparação hierárquica","body":"Comparar Brasil e China pode gerar descobertas, mas “melhor” e “atrasado” sem critério são julgamentos vazios.","example":"O processo aqui é diferente do que eu usava no Brasil: vou mostrar as etapas."},{"title":"Permita a recusa","body":"Consentimento deve ser específico e contínuo. Gravar não obriga a pessoa a responder ou autorizar publicação.","example":"Prefere responder sem aparecer? Podemos não gravar, sem problema."}],"assignment":"Escreva oito perguntas de entrevista sobre um costume local e revise pressuposições culturais em cada uma.","rubric":"Perguntas abertas, nenhum estereótipo como premissa e forma de consentimento explicitada."},"comunicacao-intercultural:2":{"title":"Tradução de nuances em entrevistas","intro":"Uma palavra pode carregar relações de formalidade e cultura que uma equivalência literal não reproduz.","steps":[{"title":"Traduza sentido e registro","body":"Verifique se a expressão original é formal, íntima, técnica ou coloquial. Não invente uma tradução mais dramática.","example":"Um “talvez” educado não deve aparecer na legenda como recusa categórica."},{"title":"Diferencie sua voz da fala alheia","body":"A locução pode resumir contexto, mas nunca apresente paráfrase como citação literal.","example":"Minha síntese: ela prefere horários mais tranquilos. A fala original será legendada separadamente."},{"title":"Verificação e revisão","body":"Em entrevistas importantes, peça confirmação de nomes, unidades e passagens ambíguas; considere revisão por falante fluente.","example":"O entrevistado falou de “dez minutos” ou “dez estações”? Confirme antes de editar."}],"assignment":"Crie legendas para cinco falas curtas com versões literal e natural e anote onde há perda de nuance.","rubric":"Fidelidade ao sentido, atribuição clara e incertezas resolvidas ou sinalizadas."},"comunicacao-intercultural:3":{"title":"Escuta respeitosa e reciprocidade","intro":"Uma conversa intercultural boa não é coleta de curiosidades: é um encontro entre perspectivas com assimetria de conhecimento.","steps":[{"title":"Escute sem completar","body":"Evite terminar frases do entrevistado ou reinterpretá-las imediatamente a partir de referências próprias.","example":"Quando você diz “comunidade”, o que essa palavra significa para você neste contexto?"},{"title":"Contextualize sem reduzir","body":"Uma pessoa pode falar apenas por si. Evite generalizar a partir de roupa, idade, origem ou local de trabalho.","example":"Esta é a experiência dela; outras pessoas poderão contar versões diferentes."},{"title":"Retorno ético","body":"Explique uso do material, peça permissão e permita correções factuais relevantes sem prometer controle editorial irrestrito.","example":"Gostaria de enviar a você a tradução do seu nome e cargo para confirmar antes de publicar."}],"assignment":"Planeje uma entrevista de 5 minutos com abertura respeitosa, escuta ativa, confirmação de detalhes e encerramento claro.","rubric":"Consentimento respeitado, perguntas não indutivas e distinção entre testemunho e generalização."},"fotojornalismo:0":{"title":"Fotografia documental é escolha e responsabilidade","intro":"Posição, momento, enquadramento e legenda orientam a leitura. A foto pode registrar fatos, mas também omitir contexto.","steps":[{"title":"Escolha o momento","body":"Observe uma ação completa e registre o ponto que melhor explica o que ocorre.","example":"Pessoa esperando diante da vitrine, seguida do movimento de entrada."},{"title":"Construa sequência","body":"Use plano geral para contexto, médio para ação e detalhe para singularidade.","example":"Rua → interação humana → gesto → objeto → desfecho."},{"title":"Legende com precisão","body":"Diga apenas o que se pode sustentar sobre pessoas, tempo, local e ação. Não invente intenção.","example":"“Pessoa atravessa a rua” é observação; “pessoa volta feliz do trabalho” é suposição."}],"assignment":"Produza cinco fotos de uma rotina pública sem identificar desnecessariamente pessoas. Crie uma legenda verificável para cada foto.","rubric":"Existe começo, desenvolvimento e fim? As legendas são confiáveis? Respeitei privacidade?"},"fotojornalismo:1":{"title":"Compor para informar, não só para impressionar","intro":"Na
