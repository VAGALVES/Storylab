/* v1.1 — Oficina da Fala */
.clinic-tips{margin:13px 0 18px;padding-left:21px;color:var(--ink2);font-size:13px;line-height:1.85}
.clinic-tips li{padding-left:4px;margin:7px 0}
.clinic-before,.clinic-after{padding:20px;border-radius:12px;margin:15px 0}
.clinic-before{background:var(--wash);border:1px solid var(--line)}
.clinic-after{background:var(--accentsoft);border:1px solid var(--line)}
.clinic-before p,.clinic-after p{font-family:Georgia,serif;font-size:20px;line-height:1.6;margin:13px 0;color:var(--ink)}
.clinic-after .small{font-family:inherit;font-size:13px;color:var(--muted);line-height:1.7}
.clinic-saved{padding:13px 0;border-bottom:1px solid var(--line)}
.clinic-saved:last-child{border:0}
.clinic-saved strong{display:block;margin-bottom:5px}
.clinic-saved p{margin:8px 0}
.clinic-saved .form-row{gap:6px}
.clinic-saved button{font-size:11px}
@media(max-width:650px){.clinic-before p,.clinic-after p{font-size:18px}}


/* v1.2 — Atlas comentado e prática progressiva */
.atlas12-toolbar{display:grid;grid-template-columns:minmax(210px,1fr) minmax(240px,1.5fr);gap:16px;margin-bottom:20px}
.atlas12-toolbar .field-label{margin-bottom:8px}.atlas12-toolbar select,.atlas12-toolbar input{width:100%;max-width:100%}
.atlas12-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;align-items:start}
.atlas12-tags{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.atlas12-term{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 13px;text-align:left;display:inline-flex;flex-direction:column;gap:3px;align-items:start;line-height:1.35}
.atlas12-term span{color:var(--accent);font-size:10px}.atlas12-term small{color:var(--muted);font-size:10px}.atlas12-term.active,.atlas12-term:focus-visible{border-color:var(--accent);background:var(--accentsoft)}

gn, comportamento e acabamentos"},{"id":"moda-extra-04","family":"moda","pt":"Antes de chamar isso de tendência, seria preciso observar mais marcas e coleções.","style":"natural","use":"Descrever design, comportamento e acabamentos"},{"id":"moda-extra-05","family":"moda","pt":"A iluminação da vitrine interfere diretamente na percepção de cor e textura.","style":"natural","use":"Descrever design, comportamento e acabamentos"},{"id":"gastronomia-extra-01","family":"gastronomia","pt":"A primeira sensação é de crocância, seguida por uma textura mais macia no interior.","style":"natural","use":"Narrar ingredientes, textura e preparo"},{"id":"gastronomia-extra-02","family":"gastronomia","pt":"O aroma parece trazer uma nota tostada, embora eu ainda não saiba o ingrediente responsável.","style":"natural","use":"Narrar ingredientes, textura e preparo"},{"id":"gastronomia-extra-03","family":"gastronomia","pt":"A apresentação valoriza o contraste de cores entre os elementos do prato.","style":"natural","use":"Narrar ingredientes, textura e preparo"},{"id":"gastronomia-extra-04","family":"gastronomia","pt":"Vou experimentar primeiro sem molho para entender o sabor predominante.","style":"natural","use":"Narrar ingredientes, textura e preparo"},{"id":"gastronomia-extra-05","family":"gastronomia","pt":"O preparo é feito em etapas que consigo acompanhar pelo balcão.","style":"natural","use":"Narrar ingredientes, textura e preparo"},{"id":"tecnologia-extra-01","family":"tecnologia","pt":"O ganho mais perceptível neste teste foi a estabilidade do movimento.","style":"natural","use":"Explicar funções, testes e limites"},{"id":"tecnologia-extra-02","family":"tecnologia","pt":"Em vez de repetir a especificação, vou mostrar o que ela altera na gravação.","style":"natural","use":"Explicar funções, testes e limites"},{"id":"tecnologia-extra-03","family":"tecnologia","pt":"Este resultado vale para as condições de luz e distância que utilizei.","style":"natural","use":"Explicar funções, testes e limites"},{"id":"tecnologia-extra-04","family":"tecnologia","pt":"As duas opções atendem a necessidades diferentes, então vou comparar pelo uso.","style":"natural","use":"Explicar funções, testes e limites"},{"id":"tecnologia-extra-05","family":"tecnologia","pt":"Este ajuste economizou alguns passos no meu fluxo, mas ainda preciso testar a consistência.","style":"natural","use":"Explicar funções, testes e limites"},{"id":"mobilidade-extra-01","family":"mobilidade","pt":"O percurso inclui uma transferência, que precisa ser considerada no tempo total.","style":"natural","use":"Comunicar trajetos e experiência urbana"},{"id":"mobilidade-extra-02","family":"mobilidade","pt":"No meu teste, a espera na plataforma foi menor que o deslocamento até a estação.","style":"natural","use":"Comunicar trajetos e experiência urbana"},{"id":"mobilidade-extra-03","family":"mobilidade","pt":"Uma entrada aparentemente próxima nem sempre conduz ao acesso mais conveniente.","style":"natural","use":"Comunicar trajetos e experiência urbana"},{"id":"mobilidade-extra-04","family":"mobilidade","pt":"Vou registrar o trajeto completo, inclusive caminhada e tempo de espera.","style":"natural","use":"Comunicar trajetos e experiência urbana"},{"id":"mobilidade-extra-05","family":"mobilidade","pt":"A facilidade de acesso pode variar conforme bagagem, mobilidade e horário.","style":"natural","use":"Comunicar trajetos e experiência urbana"},{"id":"pessoal-extra-01","family":"pessoal","pt":"Eu imaginava encontrar outra coisa, e isso tornou a visita ainda mais interessante.","style":"natural","use":"Relatar reações com responsabilidade"},{"id":"pessoal-extra-02","family":"pessoal","pt":"Não quero transformar a minha surpresa em uma conclusão sobre quem vive aqui.","style":"natural","use":"Relatar reações com responsabilidade"},{"id":"pessoal-extra-03","family":"pessoal","pt":"Uma dificuldade que tive foi compreender a orientação das placas.","style":"natural","use":"Relatar reações com responsabilidade"},{"id":"pessoal-extra-04","family":"pessoal","pt":"Depois de algumas tentativas, percebi uma forma mais simples de realizar a tarefa.","style":"natural","use":"Relatar reações com responsabilidade"},{"id":"pessoal-extra-05","family":"pessoal","pt":"Essa experiência acrescentou uma pergunta nova ao meu roteiro de descobertas.","style":"natural","use":"Relatar reações com responsabilidade"},{"id":"argumentacao-extra-01","family":"argumentacao","pt":"A minha conclusão depende de dois critérios que posso mostrar neste vídeo.","style":"natural","use":"Organizar ideias e reconhecer limites"},{"id":"argumentacao-extra-02","family":"argumentacao","pt":"Existe um argumento contrário que merece ser levado a sério.","style":"natural","use":"Organizar ideias e reconhecer limites"},{"id":"argumentacao-extra-03","family":"argumentacao","pt":"Os exemplos ajudam a explicar o ponto, mas não substituem dados representativos.","style":"natural","use":"Organizar ideias e reconhecer limites"},{"id":"argumentacao-extra-04","family":"argumentacao","pt":"Por esse motivo, prefiro formular a recomendação como uma escolha condicionada.","style":"natural","use":"Organizar ideias e reconhecer limites"},{"id":"argumentacao-extra-05","family":"argumentacao","pt":"Com as informações disponíveis, esta é a interpretação mais prudente que consigo sustentar.","style":"natural","use":"Organizar ideias e reconhecer limites"},{"id":"direcao-extra-01","family":"direcao","pt":"Vou começar por um plano geral para mostrar onde a ação acontece.","style":"natural","use":"Indicar enquadramentos e movimentos"},{"id":"direcao-extra-02","family":"direcao","pt":"Um plano detalhe agora permite observar o acabamento que mencionei.","style":"natural","use":"Indicar enquadramentos e movimentos"},{"id":"direcao-extra-03","family":"direcao","pt":"Neste movimento lateral, quero revelar a relação entre os dois espaços.","style":"natural","use":"Indicar enquadramentos e movimentos"},{"id":"direcao-extra-04","family":"direcao","pt":"Aqui a câmera permanece parada para que o movimento venha da própria cena.","style":"natural","use":"Indicar enquadramentos e movimentos"},{"id":"direcao-extra-05","family":"direcao","pt":"Vou preservar alguns segundos de som direto antes de entrar com a narração.","style":"natural","use":"Indicar enquadramentos e movimentos"},{"id":"encerramento-extra-01","family":"encerramento","pt":"A visita respondeu à pergunta inicial, mas deixou outra investigação em aberto.","style":"natural","use":"Terminar histórias com significado"},{"id":"encerramento-extra-02","family":"encerramento","pt":"O detalhe que parecia secundário no começo acabou orientando toda a história.","style":"natural","use":"Terminar histórias com significado"},{"id":"encerramento-extra-03","family":"encerramento","pt":"No fim, o que ficou foi a diferença entre a minha expectativa e o que observei.","style":"natural","use":"Terminar histórias com significado"},{"id":"encerramento-extra-04","family":"encerramento","pt":"Esta conclusão se aplica à experiência de hoje, não a todas as situações possíveis.","style":"natural","use":"Terminar histórias com significado"},{"id":"encerramento-extra-05","family":"encerramento","pt":"Vamos encerrar com a própria cena, sem acrescentar palavras desnecessárias.","style":"natural","use":"Terminar histórias com significado"},{"id":"encadeamento-01","family":"encadeamento","pt":"Embora a rua esteja cheia, quase ninguém para diante das vitrines.","style":"analytical","use":"Concessão","note":"“Embora” admite um fato que não impede o outro e pede subjuntivo (“esteja”, não “está”). Não é sinônimo de “porque” nem de “mas”: a frase toda gira em torno da surpresa."},{"id":"encadeamento-02","family":"encadeamento","pt":"A fila cresce, mas o atendimento continua no mesmo ritmo.","style":"analytical","use":"Oposição","note":"“Mas” é o adversativo mais neutro e o mais natural na fala. O que vem depois dele pesa mais na conclusão do público — coloque ali a informação principal."},{"id":"encadeamento-03","family":"encadeamento","pt":"O preço subiu; ainda assim, o movimento se manteve.","style":"analytical","use":"Concessão posterior","note":"“Ainda assim” reconhece o fato anterior e afirma o contrário com ênfase. É mais forte que “mas” e funciona bem na fala, depois de uma pausa."},{"id":"encadeamento-04","family":"encadeamento","pt":"No entanto, os comerciantes ouvidos relatam o contrário.","style":"analytical","use":"Oposição formal","note":"“No entanto”, “contudo” e “entretanto” são adversativos de registro mais formal; podem abrir a frase ou vir entre vírgulas. Cuidado: “entretanto” não significa “portanto”."},{"id":"encadeamento-05","family":"encadeamento","pt":"Portanto, a mudança não se explica apenas pelo aluguel.","style":"analytical","use":"Conclusão","note":"“Portanto” só se sustenta se as premissas foram apresentadas antes. Concluir sem base é o erro mais comum — e o mais fácil de o público perceber."},{"id":"encadeamento-06","family":"encadeamento","pt":"Como a estação fecha às 23h, o movimento cai logo depois das 22h30.","style":"analytical","use":"Causa anteposta","note":"No início da frase, “como” é causal (= já que). No meio, costuma indicar comparação ou modo (“fala como um guia”). A posição muda o sentido."},{"id":"encadeamento-07","family":"encadeamento","pt":"O movimento diminui à medida que a noite avança.","style":"analytical","use":"Proporção","note":"“À medida que” indica progressão simultânea (quanto mais uma coisa, mais a outra). Não confunda com “na medida em que” (causa). “À medida em que” é forma não padrão."},{"id":"encadeamento-08","family":"encadeamento","pt":"A obra importa na medida em que altera o trajeto de quem vem do metrô.","style":"analytical","use":"Causa ou grau","note":"“Na medida em que” equivale a “porque”, “visto que” ou “no grau em que”. Trocar por “à medida que” muda o raciocínio de causa para proporção."},{"id":"encadeamento-09","family":"encadeamento","pt":"Enquanto o lado norte foi reformado, o lado sul mantém as fachadas originais.","style":"analytical","use":"Contraste simultâneo","note":"“Enquanto” pode ser temporal (“enquanto chovia”) ou contrastivo (= ao passo que), como aqui. Evite “enquanto” no sentido de “na condição de” (“enquanto jornalista”): prefira “como”."},{"id":"encadeamento-10","family":"encadeamento","pt":"Já o segundo mercado funciona apenas aos fins de semana.","style":"analytical","use":"Contraste de comparação","note":"No início da frase, “já” introduz o segundo termo de uma comparação. Também é advérbio de tempo (“já fechou”). Use o contrastivo só depois de apresentar o primeiro termo."},{"id":"encadeamento-11","family":"encadeamento","pt":"Desde que a linha foi inaugurada, o bairro mudou de ritmo.","style":"analytical","use":"Tempo (desde)","note":"Com indicativo (“foi inaugurada”), “desde que” marca o ponto de partida no tempo. Com subjuntivo, vira condição — veja a próxima frase."},{"id":"encadeamento-12","family":"encadeamento","pt":"A gravação é permitida, desde que não haja uso de tripé.","style":"analytical","use":"Condição","note":"Com subjuntivo (“haja”), “desde que” significa “contanto que”. O mesmo conector, dois sentidos: o modo verbal decide qual."},{"id":"encadeamento-13","family":"encadeamento","pt":"Uma vez que o horário mudou, a comparação com o ano passado perde força.","style":"analytical","use":"Causa","note":"“Uma vez que” + indicativo é causal (= já que). Com particípio, indica tempo ou condição: “uma vez concluída a obra”. Evite “posto que” como adversativo: ele também é causal."},{"id":"encadeamento-14","family":"encadeamento","pt":"Aliás, o mesmo padrão aparece na rua paralela.","style":"analytical","use":"Acréscimo relevante","note":"“Aliás” acrescenta algo que reforça o que foi dito, ou corrige (= “ou melhor”). Usado sem função, vira muleta da fala."},{"id":"encadeamento-15","family":"encadeamento","pt":"O mercado abre cedo — mais precisamente, às 5h30.","style":"analytical","use":"Especificação","note":"“Mais precisamente”, “ou melhor” e “isto é” refinam a informação anterior. Use quando o segundo dado for mais exato, não para repetir."},{"id":"encadeamento-16","family":"encadeamento","pt":"Ou seja: o preço é o mesmo, mas a porção ficou menor.","style":"analytical","use":"Reformulação","note":"“Ou seja” e “isto é” anunciam uma explicação. O que vem depois precisa esclarecer — se apenas repete, corte."},{"id":"encadeamento-17","family":"encadeamento","pt":"Além disso, a calçada foi alargada no mesmo período.","style":"analytical","use":"Adição","note":"“Além disso” soma um argumento do mesmo peso. “Ademais” é formal e soa artificial na fala; “também” costuma bastar."},{"id":"encadeamento-18","family":"encadeamento","pt":"A reforma mudou a rua e, sobretudo, a forma de atravessá-la.","style":"analytical","use":"Destaque","note":"Como advérbio, “sobretudo” significa “principalmente” e aponta o elemento mais importante. Como substantivo, é um casaco: o contexto resolve."},{"id":"encadeamento-19","family":"encadeamento","pt":"Até os moradores mais antigos estranharam a mudança.","style":"analytical","use":"Argumento mais forte","note":"“Até” e “até mesmo” introduzem o caso mais improvável de uma escala, o que reforça o argumento. Na fala, “inclusive” com esse papel tende a virar muleta."},{"id":"encadeamento-20","family":"encadeamento","pt":"Se a tendência se confirmar, a rua deve perder metade das lojas de roupa.","style":"analytical","use":"Condição e projeção","note":"Mantenha a correlação verbal: “se” + futuro do subjuntivo (“se confirmar”) pede futuro ou “deve”. E diga de quem é a projeção."},{"id":"encadeamento-21","family":"encadeamento","pt":"A sinalização foi trocada para que os turistas encontrem a saída correta.","style":"analytical","use":"Finalidade","note":"“Para que” pede subjuntivo. Atribuir intenção a alguém exige fonte: a finalidade foi informada por quem trocou a placa?"},{"id":"encadeamento-22","family":"encadeamento","pt":"Não apenas o preço mudou, mas também o público.","style":"analytical","use":"Adição correlata","note":"Em “não apenas… mas também”, os dois termos devem ter a mesma forma gramatical (preço/público). O paralelismo facilita a escuta."},{"id":"encadeamento-23","family":"encadeamento","pt":"De um lado, há quem defenda a reforma; de outro, quem lamente a perda das bancas.","style":"analytical","use":"Apresentação de posições","note":"A correlação organiza duas posições, mas não as torna equivalentes. Se uma delas tem mais evidência, diga — equilíbrio não é dar o mesmo peso a tudo."},{"id":"atribuicao-01","family":"atribuicao","pt":"O gerente afirmou que o mercado abre todos os dias às 6h.","style":"documentary","use":"Declaração neutra","note":"“Afirmar” e “dizer” são neutros e seguros. Repetir “disse” é melhor do que variar com verbos que acrescentam juízo sem querer."},{"id":"atribuicao-02","family":"atribuicao","pt":"Segundo a administração, a reforma termina em dezembro.","style":"documentary","use":"Atribuição sem verbo","note":"“Segundo” e “de acordo com” deixam claro que a informação é da fonte, não sua. Use sempre que o dado não foi verificado pela reportagem."},{"id":"atribuicao-03","family":"atribuicao","pt":"A empresa informou, em nota, que o serviço foi suspenso.","style":"documentary","use":"Comunicação oficial","note":"Diga por qual canal a fonte se manifestou: nota, entrevista, rede social, documento. O canal ajuda o público a avaliar a informação."},{"id":"atribuicao-04","family":"atribuicao","pt":"A vendedora explicou que os preços variam conforme a estação.","style":"documentary","use":"Explicação da fonte","note":"Use “explicar” quando a fonte de fato apresenta razões. Para uma afirmação simples, “disse” é mais preciso."},{"id":"atribuicao-05","family":"atribuicao","pt":"O morador admitiu que nunca usou a nova ciclovia.","style":"documentary","use":"Reconhecimento","note":"“Admitir” e “reconhecer” pressupõem algo desfavorável ou contrário ao interesse de quem fala. Para declarações neutras, soam como acusação."},{"id":"atribuicao-06","family":"atribuicao","pt":"A prefeitura negou que haja plano de demolição.","style":"documentary","use":"Negação","note":"Ao usar “negar”, deixe claro quem fez a afirmação negada. Note o subjuntivo depois de “negar que” (“haja”)."},{"id":"atribuicao-07","family":"atribuicao","pt":"A associação alega que as obras reduziram o movimento em 40%.","style":"documentary","use":"Afirmação não comprovada","note":"“Alegar” sinaliza que a afirmação ainda não foi comprovada — e pode soar como descrédito. Use com consciência, de forma igual para todos os lados."},{"id":"atribuicao-08","family":"atribuicao","pt":"O pesquisador ressaltou que os dados são preliminares.","style":"documentary","use":"Ênfase da fonte","note":"“Ressaltar” e “destacar” indicam que a ênfase é da fonte. Não os use para dar ênfase a algo que só você considera importante."},{"id":"atribuicao-09","family":"atribuicao","pt":"A diretora ponderou que a mudança ainda está em fase de testes.","style":"documentary","use":"Relativização","note":"“Ponderar” indica que a fonte pesa prós e contras ou relativiza. É útil para registrar cautela sem enfraquecer a declaração."},{"id":"atribuicao-10","family":"atribuicao","pt":"Procurada, a empresa não se manifestou até a publicação desta reportagem.","style":"documentary","use":"Contraditório","note":"Fórmula-padrão de quem buscou o outro lado. Seja exato: “não respondeu”, “não quis comentar” e “não foi localizada” são situações diferentes."},{"id":"atribuicao-11","family":"atribuicao","pt":"O comerciante criticou a falta de sinalização na entrada.","style":"documentary","use":"Crítica atribuída","note":"A crítica é da fonte, não da reportagem. Se houver resposta do criticado, ela deve aparecer com destaque proporcional."},{"id":"atribuicao-12","family":"atribuicao","pt":"O secretário rebateu as críticas e citou o aumento de passageiros.","style":"documentary","use":"Resposta","note":"“Rebater” pressupõe uma crítica anterior, que precisa ter sido apresentada ao público antes da resposta."},{"id":"atribuicao-13","family":"atribuicao","pt":"A artista acrescentou que a exposição muda a cada três meses.","style":"documentary","use":"Complemento","note":"“Acrescentar” liga uma informação nova à declaração anterior da mesma fonte. Não serve para introduzir uma fonte nova."},{"id":"atribuicao-14","family":"atribuicao","pt":"A operadora garante que o serviço será retomado na segunda-feira.","style":"documentary","use":"Promessa","note":"“Garantir” e “prometer” registram compromissos futuros — trate como promessa, não como fato. Se não se cumprir, volte ao assunto."},{"id":"atribuicao-15","family":"atribuicao","pt":"O diretor anunciou o novo cronograma durante a entrevista coletiva.","style":"documentary","use":"Anúncio público","note":"Prefira “anunciar” ou “apresentar” para comunicados públicos. “Revelar” pressupõe segredo; “confessar” pressupõe culpa; “disparar” é sensacionalista."},{"id":"atribuicao-16","family":"atribuicao","pt":"Nas palavras da moradora: “A rua ficou bonita, mas virou passagem.”","style":"documentary","use":"Citação direta","note":"Use citação direta quando a forma da fala importa. Reproduza com fidelidade; cortes não podem mudar o sentido, e ajustes devem ser mínimos."},{"id":"atribuicao-17","family":"atribuicao","pt":"Em entrevista à reportagem, o cozinheiro contou que aprendeu a receita com a avó.","style":"documentary","use":"Relato pessoal","note":"“Contar” e “relatar” combinam com experiências e histórias. Para números e dados, prefira “informar” e indique a origem do dado."},{"id":"atribuicao-18","family":"atribuicao","pt":"Um funcionário, que pediu para não ser identificado, confirmou a mudança de horário.","style":"documentary","use":"Fonte anônima","note":"O anonimato é exceção: explique o motivo ao público e busque confirmação com outra fonte. Nunca use anonimato para opiniões ou ataques."},{"id":"atribuicao-19","family":"atribuicao","pt":"A versão da empresa difere da relatada pelos clientes.","style":"documentary","use":"Versões conflitantes","note":"Apresente as versões sem arbitrar quando não houver prova. Se houver documento que favoreça uma delas, diga qual e por quê."},{"id":"atribuicao-20","family":"atribuicao","pt":"O documento, obtido pela reportagem, mostra que o contrato foi renovado em março.","style":"documentary","use":"Atribuição documental","note":"“Obtido pela reportagem” indica acesso próprio. Informe se o documento é público e o que ele mostra — sem extrapolar o que ele não diz."},{"id":"atribuicao-21","family":"atribuicao","pt":"Em tom de brincadeira, o vendedor disse que o segredo é a paciência.","style":"documentary","use":"Tom da fala","note":"Registre o tom quando ele muda o sentido. Sem o contexto, uma ironia transcrita pode virar afirmação literal."},{"id":"leads-01","family":"leads","pt":"Uma nova linha de ônibus noturno passa a ligar, a partir desta segunda-feira, a estação central aos bairros do sul, segundo a operadora.","style":"documentary","use":"Lead clássico","note":"Responde, na primeira frase, ao essencial: o quê, quando, onde e segundo quem. O “como” e o “por quê” podem vir na frase seguinte."},{"id":"leads-02","family":"leads","pt":"Às cinco da manhã, antes de a primeira loja abrir, a fila do mercado já dobra a esquina.","style":"documentary","use":"Lead de cena","note":"Abre com uma cena observada para criar presença. A regra: no máximo dois parágrafos depois, o texto precisa dizer qual é a notícia."},{"id":"leads-03","family":"leads","pt":"A fila é o sinal mais visível de uma mudança maior: em dois anos, o bairro perdeu metade dos mercados de rua, segundo a associação local.","style":"documentary","use":"Parágrafo-síntese","note":"Depois de um lead de cena, este parágrafo diz por que a história importa. Sem ele, a cena vira curiosidade sem notícia."},{"id":"leads-04","family":"leads","pt":"A rua mais fotografada do bairro é também a que mais perdeu moradores na última década, segundo dados distritais.","style":"documentary","use":"Lead de contraste","note":"O contraste prende a atenção, mas os dois lados precisam estar verificados. Contraste baseado em impressão é efeito, não informação."},{"id":"leads-05","family":"leads","pt":"Três em cada dez lojas da rua trocaram de ramo desde o ano passado, segundo levantamento feito pela reportagem.","style":"documentary","use":"Lead de dado","note":"Um número por lead, com fonte e método. Proporções (“três em cada dez”) são mais fáceis de entender que percentuais na leitura em voz alta."},{"id":"leads-06","family":"leads","pt":"“Aqui ninguém mais compra de manhã”, resume a vendedora mais antiga do mercado, há 30 anos na mesma banca.","style":"documentary","use":"Lead de citação","note":"Manuais desaconselham abrir com citação — exceto quando a fala sintetiza a história melhor que qualquer frase sua. Identifique a fonte logo em seguida."},{"id":"leads-07","family":"leads","pt":"Para onde foram os vendedores depois da reforma? A pergunta, repetida pelos moradores, tem mais de uma resposta.","style":"documentary","use":"Lead de pergunta","note":"Só abra com pergunta se o texto realmente responder a ela. Perguntas retóricas vazias (“Você sabia que…?”) enfraquecem a abertura."},{"id":"leads-08","family":"leads","pt":"Nova linha de ônibus liga estação central aos bairros do sul","style":"documentary","use":"Título de notícia","note":"Convenção de muitos manuais brasileiros: verbo no presente, sem artigo inicial e sem ponto final. O título informa; não enfeita."},{"id":"leads-09","family":"leads","pt":"Mercado tradicional resiste à reforma do bairro","style":"documentary","use":"Título interpretativo","note":"Verbos como “resiste” já são interpretação. Só use se o texto sustentar a leitura com fatos — senão, prefira um verbo descritivo."},{"id":"leads-10","family":"leads","pt":"Vendedores relatam queda no movimento; prefeitura diz que obras terminam em dezembro","style":"documentary","use":"Linha fina","note":"A linha fina (subtítulo) complementa o título. Quando há versões em disputa, é um bom lugar para apresentar as duas."},{"id":"leads-11","family":"leads","pt":"Comi em cinco bancas de rua com 30 yuan — e uma delas superou as outras","style":"documentary","use":"Título de vídeo","note":"Promessa concreta e cumprível. Evite iscas como “você não vai acreditar”: o título é um compromisso com o público."},{"id":"leads-12","family":"leads","pt":"O que mudou depois das obras","style":"documentary","use":"Intertítulo","note":"Intertítulos organizam a leitura e devem informar o conteúdo do bloco. Evite intertítulos decorativos ou de uma palavra só."},{"id":"leads-13","family":"leads","pt":"Atualização, 18h: a estação foi reaberta às 17h40, segundo a operadora.","style":"documentary","use":"Atualização","note":"Marque a hora da atualização e o que mudou. Não reescreva o texto em silêncio: o público tem o direito de saber o que foi atualizado."},{"id":"leads-14","family":"leads","pt":"Correção: diferentemente do que foi publicado, a obra termina em dezembro, não em novembro.","style":"documentary","use":"Correção","note":"A correção deve ser visível, dizer o que estava errado e qual é a informação certa. Apagar o erro sem aviso compromete a credibilidade."},{"id":"leads-15","family":"leads","pt":"Esta reportagem faz parte da série “Uma rua por semana”, que percorre o centro de Xangai.","style":"documentary","use":"Contexto de série","note":"Situa o conteúdo num projeto maior e ajuda o público a encontrar os outros episódios."},{"id":"telejornalismo-01","family":"telejornalismo","pt":"Um bairro inteiro mudou de ritmo depois da chegada do metrô. Nossa reportagem foi até lá ver o que ficou e o que se perdeu.","style":"filmmaking","use":"Cabeça","note":"A cabeça é o texto que o apresentador lê para introduzir a reportagem: curta, com a notícia na primeira frase e a chamada para a matéria na segunda."},{"id":"telejornalismo-02","family":"telejornalismo","pt":"Às seis da manhã, o primeiro trem chega lotado. Em poucos minutos, a calçada vira corredor.","style":"filmmaking","use":"Off","note":"O off é a narração do repórter sobre as imagens. Escreva para a imagem: acrescente o que ela não mostra, sem descrever o óbvio."},{"id":"telejornalismo-03","family":"telejornalismo","pt":"Estou no ponto exato onde a rua antiga encontra a avenida nova. De um lado, casas de dois andares; do outro, torres de trinta.","style":"filmmaking","use":"Passagem","note":"Na passagem, o repórter aparece no meio da matéria. Ela precisa justificar a presença dele no lugar — mostrar algo que só se entende estando ali."},{"id":"telejornalismo-04","family":"telejornalismo","pt":"Quem acompanha essa mudança de perto é dona Li, que vende chá nesta esquina há trinta anos.","style":"filmmaking","use":"Apresentação de sonora","note":"Antes da sonora (trecho de entrevista), apresente quem vai falar e por que essa pessoa importa. A fala deve trazer o que só ela pode dizer."},{"id":"telejornalismo-05","family":"telejornalismo","pt":"A preocupação de dona Li se repete entre os vizinhos.","style":"filmmaking","use":"Costura entre sonoras","note":"Frases de costura ligam uma sonora a outra. “Se repete” exige ter ouvido várias pessoas — não generalize a partir de uma única fala."},{"id":"telejornalismo-06","family":"telejornalismo","pt":"Segundo a operadora, são 40 mil passageiros por dia — o dobro do previsto.","style":"filmmaking","use":"Off de dado","note":"No off, um número por frase e sempre com fonte. Comparações (“o dobro”) ajudam o público a entender a escala de ouvido."},{"id":"telejornalismo-07","family":"telejornalismo","pt":"A prefeitura informou que as obras terminam em dezembro.","style":"filmmaking","use":"Nota pé","note":"A nota pé é lida pelo apresentador depois da reportagem: em geral, a posição oficial, o outro lado ou uma atualização."},{"id":"telejornalismo-08","family":"telejornalismo","pt":"Neste momento, a estação continua fechada. A última informação da operadora, de vinte minutos atrás, é que não há previsão de reabertura.","style":"filmmaking","use":"Entrada ao vivo","note":"Ao vivo, diga a hora da informação e de quem ela vem. O que ainda não se sabe deve ser dito como tal — nada de especular para preencher o tempo."},{"id":"telejornalismo-09","family":"telejornalismo","pt":"Este é o último mercado de rua do bairro. Segundo a administração, ele pode fechar em três meses.","style":"filmmaking","use":"Passagem de abertura","note":"Quando o repórter abre a matéria na cena, a afirmação mais forte precisa vir atribuída. A imagem do lugar não substitui a fonte."},{"id":"telejornalismo-10","family":"telejornalismo","pt":"Metrô muda a rotina de um bairro inteiro. E a comida de rua que resiste à reforma.","style":"filmmaking","use":"Escalada","note":"A escalada é a sequência de manchetes no início do programa: frases curtas, verbo no presente, uma ideia por frase."},{"id":"telejornalismo-11","family":"telejornalismo","pt":"Enquanto a cidade dorme, os caminhões de entrega ocupam a faixa da direita.","style":"filmmaking","use":"Off de ambientação","note":"Off curto para imagens de apoio. Funciona quando a imagem confirma exatamente o que o texto diz."},{"id":"telejornalismo-12","family":"telejornalismo","pt":"A rua continua de pé. A pergunta agora é quem vai conseguir continuar morando nela.","style":"filmmaking","use":"Encerramento","note":"O encerramento retoma a pergunta central da reportagem. Evite conclusões que o material não sustenta e frases de efeito sem conteúdo."},{"id":"telejornalismo-13","family":"telejornalismo","pt":"Em Xangai, para o StoryLab, eu sou…","style":"filmmaking","use":"Assinatura","note":"A assinatura fecha a passagem final com lugar, veículo e nome. Mantenha sempre a mesma ordem para criar identidade."},{"id":"precisao-01","family":"precisao","pt":"Cerca de 200 pessoas aguardavam às 9h, segundo contagem da reportagem.","style":"analytical","use":"Estimativa","note":"“Cerca de” e “aproximadamente” sinalizam estimativa. Diga quem estimou e como — contagem própria, organizadores ou autoridade."},{"id":"precisao-02","family":"precisao","pt":"Pelo menos três lojas fecharam desde janeiro.","style":"analytical","use":"Piso confirmado","note":"“Pelo menos” indica o mínimo confirmado: pode haver mais. É mais honesto do que arredondar para cima."},{"id":"precisao-03","family":"precisao","pt":"A maioria dos comerciantes ouvidos — sete de dez — relatou queda no movimento.","style":"analytical","use":"Proporção com universo","note":"“Maioria” precisa vir com o número e o universo (“dos ouvidos”). Sem isso, parece representar o bairro inteiro."},{"id":"precisao-04","family":"precisao","pt":"Quase metade das bancas — 23 de 50 — fecha antes das 14h.","style":"analytical","use":"Aproximação exata","note":"“Quase” indica que o valor não chega ao marco citado. Quando você tem o número, mostre-o."},{"id":"precisao-05","family":"precisao","pt":"Estima-se que o trajeto leve 40 minutos, segundo o aplicativo da operadora.","style":"analytical","use":"Estimativa atribuída","note":"“Estima-se” esconde quem fez a estimativa. Complete sempre com a fonte — ou reescreva: “A operadora estima…”."},{"id":"precisao-06","family":"precisao","pt":"Os dados são preliminares e podem ser revisados.","style":"analytical","use":"Provisoriedade","note":"Avisar que um dado é preliminar protege o público e a reportagem. Se ele mudar, atualize."},{"id":"precisao-07","family":"precisao","pt":"Até o momento, não há confirmação oficial sobre a causa da interrupção.","style":"analytical","use":"Lacuna de informação","note":"Diga o que ainda não se sabe com a mesma clareza do que se sabe. “Até o momento” marca que a situação pode mudar."},{"id":"precisao-08","family":"precisao","pt":"Com os dados disponíveis, não é possível afirmar que a reforma causou a queda nas vendas.","style":"analytical","use":"Correlação e causa","note":"Duas coisas que acontecem juntas não são, necessariamente, causa e efeito. Separe a coincidência da explicação comprovada."},{"id":"precisao-09","family":"precisao","pt":"Segundo a polícia, o homem detido é suspeito de furtar bicicletas na região.","style":"analytical","use":"Presunção de inocência","note":"Atribua a suspeita à autoridade e não trate suspeito como culpado. “Suposto” atenua, mas não substitui a atribuição."},{"id":"precisao-10","family":"precisao","pt":"O preço é 20% maior que o do ano passado, sem descontar a inflação.","style":"analytical","use":"Valor nominal","note":"Informe se a comparação considera a inflação. Um aumento nominal pode ser, na prática, estabilidade ou até queda real."},{"id":"precisao-11","family":"precisao","pt":"Os números absolutos cresceram, mas a proporção se manteve estável.","style":"analytical","use":"Absoluto e relativo","note":"Números absolutos e proporções contam histórias diferentes. Diga qual dos dois sustenta a sua conclusão."},{"id":"precisao-12","family":"precisao","pt":"A informação não pôde ser verificada de forma independente.","style":"analytical","use":"Transparência de verificação","note":"Quando divulgar algo sem confirmação própria, diga isso explicitamente — e por que, mesmo assim, a informação é relevante."},{"id":"precisao-13","family":"precisao","pt":"A reportagem visitou o local em três dias diferentes para confirmar o padrão.","style":"analytical","use":"Método","note":"Explicar o método mostra ao público o tamanho da evidência. Três visitas sustentam um padrão local, não uma regra da cidade."},{"id":"precisao-14","family":"precisao","pt":"Em tese, a nova linha reduziria o tempo de viagem; na prática, os usuários relatam atrasos.","style":"analytical","use":"Expectativa e realidade","note":"“Em tese” e “na prática” contrapõem o previsto ao observado. Os dois lados precisam de fonte."},{"id":"precisao-15","family":"precisao","pt":"Aparentemente, a banca está fechada há semanas: há poeira acumulada e correspondência na porta.","style":"analytical","use":"Inferência com indícios","note":"“Aparentemente” sinaliza inferência. Mostre os indícios que levaram a ela — e confirme com alguém antes de afirmar."},{"id":"precisao-16","family":"precisao","pt":"Ainda não se sabe quantos moradores serão afetados.","style":"analytical","use":"Incerteza assumida","note":"Assumir a incerteza é melhor do que preenchê-la com estimativas sem base. Indique quando a informação deve sair, se souber."},{"id":"precisao-17","family":"precisao","pt":"O dado se refere a 2024; não há números mais recentes publicados.","style":"analytical","use":"Data do dado","note":"Todo número tem data. Informe o período e se existe atualização — números velhos apresentados como atuais distorcem a realidade."},{"id":"estilo-01","family":"estilo","pt":"A decisão será tomada em reunião na próxima semana.","style":"analytical","use":"Sem “a nível de”","note":"Evite “a nível de” (“a decisão será tomada a nível de reunião”). “Em nível de” só faz sentido quando há níveis reais: “em nível federal”."},{"id":"estilo-02","family":"estilo","pt":"Há dez anos, a rua era residencial.","style":"analytical","use":"Sem redundância temporal","note":"Use “há dez anos” ou “dez anos atrás” — nunca os dois juntos (“há dez anos atrás”)."},{"id":"estilo-03","family":"estilo","pt":"O bairro em que cresci mudou muito.","style":"analytical","use":"“Onde” só para lugar","note":"“Onde” indica lugar físico (“a rua onde moro”). Para tempo, situação ou ideia, use “em que”, “no qual” ou “quando”: “a reunião em que se decidiu”."},{"id":"estilo-04","family":"estilo","pt":"Como repórter, procurei ouvir os dois lados.","style":"analytical","use":"“Como”, não “enquanto”","note":"No sentido de “na condição de”, prefira “como”. “Enquanto” é temporal ou contrastivo, e o uso “enquanto repórter” é criticado por manuais."},{"id":"estilo-05","family":"estilo","pt":"O preço subiu.","style":"analytical","use":"Verbo direto","note":"Prefira o verbo ao substantivo: “subiu” em vez de “sofreu um aumento”. Preços não sofrem; frases diretas são mais claras e mais curtas."},{"id":"estilo-06","family":"estilo","pt":"A obra começou em março e terminou em outubro.","style":"analytical","use":"Sem nominalização","note":"“A obra teve início em março e foi finalizada em outubro” diz o mesmo com mais palavras. Verbos concretos dão ritmo à fala."},{"id":"estilo-07","family":"estilo","pt":"A loja fechou porque o aluguel dobrou, segundo o dono.","style":"analytical","use":"Causa sem rodeios","note":"“Devido ao fato de que” e “em virtude de” alongam a frase sem acrescentar sentido. “Porque” resolve."},{"id":"estilo-08","family":"estilo","pt":"Três problemas se repetem nas falas dos moradores: barulho, preço e falta de sombra.","style":"analytical","use":"Enumeração concreta","note":"“Uma série de questões” é vago. Se você sabe quais são, enumere."},{"id":"estilo-09","family":"estilo","pt":"O trânsito ficou parado por duas horas na avenida principal.","style":"analytical","use":"Descrição no lugar do clichê","note":"Evite “caos no trânsito” sem dado. Descreva o que aconteceu: onde, por quanto tempo, com que efeito."},{"id":"estilo-10","family":"estilo","pt":"A feira reúne 40 expositores.","style":"analytical","use":"Sem “conta com”","note":"“A feira conta com a presença de 40 expositores” é prolixo. Diga diretamente o que acontece."},{"id":"estilo-11","family":"estilo","pt":"O projeto foi aprovado por 7 votos a 2.","style":"analytical","use":"Número no lugar do adjetivo","note":"“Por ampla maioria” é avaliação. O placar informa — e deixa o público julgar se a maioria foi ampla."},{"id":"estilo-12","family":"estilo","pt":"O resultado surpreendeu os organizadores.","style":"analytical","use":"Sem redundância","note":"Evite pleonasmos comuns: “surpresa inesperada”, “elo de ligação”, “acabamento final”, “fato real”, “encarar de frente”."},{"id":"estilo-13","family":"estilo","pt":"A ponte foi reaberta ontem, depois de duas semanas de reparos.","style":"analytical","use":"Tempo concreto","note":"Quando você sabe a data, diga. “Recentemente” e “há algum tempo” deixam o público sem referência."},{"id":"estilo-14","family":"estilo","pt":"Com base nos dados da operadora, o trajeto ficou dez minutos mais curto.","style":"analytical","use":"Sentido preciso de “a partir de”","note":"“A partir de” é temporal (“a partir de segunda”). No sentido de fundamento, “com base em” evita ambiguidade."},{"id":"estilo-15","family":"estilo","pt":"Os moradores pediram mais iluminação na praça.","style":"analytical","use":"Sem muletas da fala","note":"Na fala, “inclusive”, “na verdade” e “tipo” viram enchimento. Releia a transcrição e corte o que não muda o sentido."},{"id":"estilo-16","family":"estilo","pt":"A estação recebe cerca de 40 mil pessoas por dia.","style":"analytical","use":"Frase curta para dado","note":"Uma informação por frase quando há número. Frases longas com vários dados obrigam o público a reler — e, no vídeo, ele não pode."}],"deepLessons":{"teorias-comunicacao:0":{"title":"Toda mensagem depende de quem fala, de quem ouve e de onde","intro":"Comunicar não é transportar uma ideia intacta de uma cabeça para outra. O sentido se forma no encontro entre emissor, mensagem, canal, receptor e contexto — e muda quando qualquer um deles muda.","steps":[{"title":"Separe os elementos do processo","body":"Emissor é quem produz; mensagem é o que é dito ou mostrado; canal é o meio; receptor é quem interpreta; contexto é o tempo, o lugar e a situação. Nomear cada parte revela onde um mal-entendido pode surgir.","example":"Um cartaz em mandarim numa estação de metrô: emissor (operadora), mensagem (aviso de obra), canal (papel impresso), receptor (passageiro estrangeiro), contexto (horário de pico)."},{"title":"Reconheça o ruído","body":"Ruído é tudo o que interfere na interpretação: barulho físico, vocabulário técnico, diferença de idioma, pressa ou expectativas prévias. Nem todo ruído pode ser eliminado, mas pode ser antecipado.","example":"Narrar um vlog ao lado de uma avenida: o ruído é sonoro. Usar jargão de fotografia com leigos: o ruído é semântico."},{"title":"Considere o contexto como parte da mensagem","body":"A mesma frase significa coisas diferentes conforme quem diz, onde e quando. O jornalista precisa explicitar o contexto que o público não vê.","example":"“A fila está enorme” pode indicar sucesso de uma loja, falha de atendimento ou um feriado — o contexto decide."}],"assignment":"Escolha uma mensagem pública em Xangai (cartaz, aviso, vitrine). Identifique os cinco elementos e dois possíveis ruídos para um visitante estrangeiro. Explique em voz alta, em até 60 segundos.","rubric":"Nomeei os cinco elementos com exemplos concretos? Diferenciei ruído físico de ruído de sentido? Expliquei por que o contexto altera a leitura?"},"teorias-comunicacao:1":{"title":"Ninguém vê o mundo inteiro: agenda e enquadramento","intro":"A imprensa não diz apenas o que pensar; influencia sobre o que se pensa (agenda) e de que ângulo (enquadramento). Conhecer esses mecanismos ajuda a produzir conteúdo mais consciente e a ler a mídia com espírito crítico.","steps":[{"title":"Agenda: o que entra na conversa","body":"Ao escolher quais assuntos cobrir e com que frequência, a mídia sinaliza o que é importante. Temas ausentes tendem a parecer irrelevantes, mesmo quando não são.","example":"Se só vídeos sobre arranha-céus circulam, o público pode ignorar a vida nos bairros de lilong."},{"title":"Enquadramento: de que ângulo","body":"Enquadrar é selecionar aspectos de um fato e torná-los mais salientes. O mesmo acontecimento pode ser apresentado como problema econômico, questão humana ou curiosidade cultural.","example":"Um mercado reformado: “modernização do comércio” (economia) ou “o que mudou para os antigos vendedores” (humano)."},{"title":"Percepção: o público também filtra","body":"Pessoas interpretam a partir de experiências e crenças prévias. Um bom enquadramento oferece contexto suficiente para que o público tire conclusões próprias, não apenas confirme o que já pensava.","example":"Ao mostrar uma rua lotada, informe o dia e o horário para evitar a conclusão genérica de que “é sempre assim”."}],"assignment":"Escreva três títulos diferentes para o mesmo fato observado (por exemplo, a reforma de uma praça), cada um com um enquadramento distinto. Indique o que cada título destaca e o que deixa de fora.","rubric":"Os três enquadramentos são realmente distintos? Identifiquei o que cada um omite? Algum dos títulos afirma mais do que eu verifiquei?"},"teorias-comunicacao:2":{"title":"A mensagem segue viagem depois de publicada","intro":"Públicos não são uma massa uniforme. Conteúdos circulam, são recortados, comentados e reinterpretados por comunidades diferentes. Planejar pensando nessa circulação reduz distorções.","steps":[{"title":"Públicos no plural","body":"Um mesmo vídeo pode alcançar turistas, residentes, estudantes de jornalismo e pessoas que nunca estiveram na China. Cada grupo tem conhecimentos e interesses diferentes.","example":"Explicar o que é um lilong ajuda o público brasileiro; para residentes locais, a explicação pode soar óbvia — ajuste a profundidade sem perder precisão."},{"title":"Circulação e recorte","body":"Trechos são compartilhados fora da ordem original. Frases que dependem do contexto anterior podem ser mal interpretadas quando isoladas.","example":"Evite que uma frase irônica fique sozinha: “Claro, tudo aqui é barato” pode virar afirmação literal num corte de 10 segundos."},{"title":"Líderes de opinião e comentários","body":"Pessoas influentes e comunidades online reinterpretam e amplificam mensagens. Antecipar perguntas e objeções frequentes torna o conteúdo mais robusto.","example":"Se o vídeo mostra preços, inclua data e câmbio: são as primeiras perguntas nos comentários."}],"assignment":"Pegue um roteiro curto seu e identifique duas frases que poderiam ser mal interpretadas se recortadas. Reescreva-as para que façam sentido mesmo isoladas.","rubric":"Considerei pelo menos dois públicos distintos? As frases reescritas se sustentam fora do contexto? Antecipei uma dúvida provável do público?"},"teorias-comunicacao:3":{"title":"Ler a cidade como um texto","intro":"Fachadas, placas, propagandas e vitrines são mensagens urbanas. Analisá-las combina tudo o que você aprendeu: elementos da comunicação, enquadramento, público e circulação.","steps":[{"title":"Descreva antes de interpretar","body":"Comece pelo que é observável: suporte, tamanho, cores, textos, idioma, localização e quem passa por ali. Só depois levante hipóteses sobre a intenção.","example":"“Painel de LED de cerca de dez metros, texto bilíngue, ao lado de uma saída de metrô usada por milhares de pessoas por hora.”"},{"title":"Identifique a quem a mensagem se dirige","body":"Idioma, referências e local indicam o público pretendido. Um anúncio só em inglês e um só em mandarim falam com pessoas diferentes.","example":"Uma marca de luxo em Nanjing Xi Lu com textos em inglês sugere público internacional ou aspiracional — trate como hipótese."},{"title":"Proponha leituras e limites","body":"Ofereça duas ou mais interpretações plausíveis e diga o que seria preciso para confirmá-las (entrevista, dado, documento).","example":"“Pode indicar foco em turistas, mas só a empresa ou dados de público confirmariam essa estratégia.”"}],"assignment":"Grave 90 segundos analisando uma mensagem urbana: descrição, público provável, duas interpretações e o que falta verificar.","rubric":"Descrevi antes de interpretar? Apresentei as interpretações como hipóteses? Indiquei uma forma concreta de verificação?"},"historia-jornalismo:0":{"title":"Antes do jornal, já havia notícia","intro":"A necessidade de saber o que acontece é antiga. Avisos oficiais, cartas comerciais e folhas avulsas antecederam os jornais e já enfrentavam problemas atuais: pressa, rumor, controle e credibilidade.","steps":[{"title":"Notícia como informação útil","body":"Comerciantes, governos e viajantes trocavam notícias sobre preços, rotas, guerras e decisões. A informação tinha valor prático antes de ser produto de consumo.","example":"Cartas mercantis europeias relatavam chegadas de navios e preços — uma espécie de boletim econômico."},{"title":"Registros oficiais e controle","body":"Muitas sociedades tinham boletins governamentais que circulavam entre funcionários. Na China, os chamados “dibao” (boletins da corte) registravam decretos e nomeações por séculos.","example":"Compare: um boletim oficial informa a decisão; uma reportagem pergunta quem é afetado e por quê."},{"title":"Rumor versus verificação","body":"Folhas avulsas e panfletos misturavam fatos, boatos e opinião. A ideia de verificar antes de publicar se consolidou lentamente como valor profissional.","example":"Um panfleto que anuncia um desastre sem fonte é o ancestral de uma postagem viral não verificada."}],"assignment":"Escolha uma notícia de hoje e imagine como ela teria circulado há 300 anos: por quem, em que suporte, com que atraso e com que riscos de distorção. Narre em 60 segundos.","rubric":"Diferenciei informação oficial de apuração independente? Indiquei os riscos de rumor? Evitei afirmar datas ou fatos históricos que não verifiquei?"},"historia-jornalismo:1":{"title":"Cada meio mudou a forma de contar","intro":"A imprensa industrial, o rádio e a televisão não apenas aceleraram a notícia: criaram linguagens próprias. Entender essas linguagens ajuda a escolher recursos conscientes em formatos digitais.","steps":[{"title":"Imprensa: texto, coluna e manchete","body":"Jornais diários de grande tiragem popularizaram manchetes, colunas e a organização por editorias. O leitor podia voltar ao texto, comparar e arquivar.","example":"A pirâmide invertida ganhou força porque permitia cortar o final do texto sem perder o essencial."},{"title":"Rádio: a voz e a simultaneidade","body":"O rádio trouxe a notícia ao vivo e a escrita para o ouvido: frases curtas, repetição de informações-chave e criação de imagens mentais pela descrição.","example":"Um locutor descrevendo uma multidão precisa fazer o ouvinte ver: tamanho, som, movimento."},{"title":"Televisão: a imagem como prova e como risco","body":"A TV combinou imagem, som e apresentador. A imagem ganhou força de evidência, mas também passou a ser escolhida pelo impacto visual.","example":"Uma cena dramática pode dominar uma cobertura mesmo quando não representa a situação geral."}],"assignment":"Conte o mesmo fato observado em três versões curtas: nota de jornal (40 palavras), boletim de rádio (20 segundos) e passagem de TV (20 segundos com indicação de imagens).","rubric":"Cada versão usa recursos próprios do meio? O fato central se manteve igual nas três? A versão de TV evita depender só do impacto visual?"},"historia-jornalismo:2":{"title":"Da página ao feed","intro":"A internet mudou quem publica, quando e como o público encontra a notícia. Velocidade, participação e algoritmos trouxeram oportunidades e novos riscos para a precisão.","steps":[{"title":"Publicação contínua","body":"A notícia deixou de ter hora para sair. Atualizações sucessivas exigem marcar o que mudou e quando, para não confundir o público.","example":"“Atualizado às 18h: a estação reabriu” é mais transparente do que reescrever o texto sem aviso."},{"title":"Todos podem publicar","body":"Testemunhas postam antes de jornalistas chegarem. O papel profissional passa a incluir verificar, contextualizar e creditar material de terceiros.","example":"Um vídeo de chuva forte postado por um morador precisa de checagem de data, local e autorização de uso."},{"title":"Distribuição por algoritmo","body":"Plataformas priorizam conteúdo segundo engajamento. Isso premia emoção e rapidez, e pode punir explicações cuidadosas. Saber disso evita trocar precisão por alcance.","example":"Um título exagerado pode render mais cliques e menos confiança a longo prazo."}],"assignment":"Escolha um formato digital que você consome (vlog, newsletter, vídeo curto) e compare-o com um formato histórico em quatro critérios: velocidade, verificação, participação do público e permanência.","rubric":"A comparação usa critérios claros? Reconheci vantagens e riscos dos dois lados? Evitei romantizar o passado ou o presente?"},"historia-jornalismo:3":{"title":"Uma reportagem também tem biografia","intro":"Toda reportagem passa por etapas: ideia, apuração, redação, edição, publicação e repercussão. Traçar essa linha do tempo mostra onde erros nascem e onde podem ser corrigidos.","steps":[{"title":"Mapeie as etapas","body":"Liste cada momento de uma reportagem: quando surgiu a pauta, quais fontes foram ouvidas, quando foi escrita, revisada e publicada.","example":"Dia 1: observação na rua; dia 2: entrevistas; dia 3: checagem de preços; dia 4: edição e publicação."},{"title":"Identifique pontos de decisão","body":"Em cada etapa há escolhas: qual ângulo, quem entrevistar, o que cortar. Registrar essas decisões ajuda a explicar o trabalho e a aprender com ele.","example":"“Decidi não usar o nome do vendedor porque ele não autorizou.”"},{"title":"Considere o depois","body":"Após publicar, surgem comentários, correções e desdobramentos. Uma reportagem responsável prevê como corrigir e atualizar.","example":"Se um preço mudou, adicione nota de atualização em vez de apagar a informação anterior."}],"assignment":"Monte a linha do tempo de um conteúdo seu (ou planeje um) com pelo menos seis etapas e uma decisão editorial justificada em cada uma.","rubric":"A linha do tempo é cronológica e completa? Cada decisão tem justificativa? Previ como corrigir após a publicação?"},"fundamentos-jornalismo:0":{"title":"O jornalismo é um método, não apenas um texto","intro":"Antes de escrever, o jornalista apura: observa, pergunta, confere e organiza. O texto final é a parte visível de um trabalho de verificação que o público não vê.","steps":[{"title":"Informação bruta","body":"Algo que você vê, ouve ou recebe ainda não é notícia confirmada. É matéria-prima que precisa ser examinada.","example":"“Ouvi dizer que a loja vai fechar” é um ponto de partida, não uma informação publicável."},{"title":"Apuração","body":"Apurar é buscar confirmação em fontes independentes, documentos e observação direta. Quanto mais grave a afirmação, maior a exigência de confirmação.","example":"Confirmar o fechamento com o gerente, um aviso oficial e a observação do estoque reduzido."},{"title":"Publicação responsável","body":"Publicar exige dizer o que se sabe, como se sabe e o que ainda não se sabe. Transparência sobre limites aumenta a confiança.","example":"“A loja confirmou o fechamento em março; o motivo não foi informado.”"}],"assignment":"Escolha um boato ou comentário que você ouviu recentemente. Descreva como o apuraria: três fontes possíveis, o que cada uma confirmaria e o que você publicaria se só uma confirmasse.","rubric":"Diferenciei informação bruta de informação apurada? As fontes são independentes entre si? Minha versão final explicita os limites?"},"fundamentos-jornalismo:1":{"title":"Cada história pede um formato","intro":"Notícia, reportagem, entrevista, crônica, perfil e documentário respondem a perguntas diferentes. Escolher bem o gênero é a primeira decisão narrativa.","steps":[{"title":"Notícia e reportagem","body":"A notícia informa um fato recente de forma direta. A reportagem aprofunda: explica causas, contextos e consequências, com mais fontes e cenas.","example":"Notícia: “Nova linha de metrô abre amanhã”. Reportagem: “Como a nova linha muda a rotina de quem mora na periferia”."},{"title":"Entrevista e perfil","body":"A entrevista organiza o conteúdo em torno de perguntas e respostas. O perfil retrata uma pessoa por meio de cenas, falas e contexto.","example":"Entrevista com um alfaiate sobre o ofício; perfil mostrando seu dia, suas mãos e seus clientes."},{"title":"Crônica e documentário","body":"A crônica admite olhar pessoal sobre o cotidiano, desde que marque claramente o que é impressão. O documentário investiga uma questão com imagens e personagens ao longo do tempo.","example":"Crônica: “Uma manhã no Bund com neblina”. Documentário: “O que restou dos antigos lilongs”."}],"assignment":"Observe um acontecimento e proponha-o em três gêneros diferentes, com título e uma frase de abertura para cada. Indique qual gênero escolheria e por quê.","rubric":"Os três tratamentos são realmente diferentes? Justifiquei a escolha final? Na crônica, separei impressão de fato?"},"fundamentos-jornalismo:2":{"title":"Como saber se um conteúdo é bom","intro":"Qualidade jornalística não é estilo bonito. É precisão, clareza, relevância, contexto, equilíbrio e transparência. Esses critérios permitem avaliar o próprio trabalho antes do público.","steps":[{"title":"Precisão e clareza","body":"Números, nomes, datas e lugares corretos. Frases que o público entende na primeira leitura ou audição.","example":"Trocar “muita gente” por “cerca de 200 pessoas na fila às 10h, segundo contagem própria”."},{"title":"Relevância e contexto","body":"Por que o público deveria se importar? O que ele precisa saber para entender o fato? Contexto evita conclusões apressadas.","example":"Informar que o preço subiu 20% e também em relação a quê e em que período."},{"title":"Equilíbrio e transparência","body":"Ouvir partes relevantes, não apenas as convenientes. Dizer como a informação foi obtida e quais são os limites.","example":"“Procuramos a administração do mercado, que não respondeu até a publicação.”"}],"assignment":"Avalie um conteúdo seu (ou de outra pessoa) com os seis critérios, dando nota de 1 a 5 a cada um e uma sugestão concreta de melhoria para a menor nota.","rubric":"Avaliei todos os seis critérios? As notas têm justificativa? A sugestão de melhoria é concreta e aplicável?"},"fundamentos-jornalismo:3":{"title":"De um fato observado a uma pauta","intro":"Uma pauta transforma curiosidade em plano de trabalho: define a pergunta central, o ângulo, as fontes, as cenas e o formato. Sem pauta, a gravação vira acúmulo de imagens soltas.","steps":[{"title":"Encontre a pergunta","body":"Um fato isolado vira pauta quando gera uma pergunta que vale a pena responder. A pergunta deve ser específica e respondível.","example":"Fato: muitas bicicletas compartilhadas abandonadas. Pergunta: “Quem recolhe essas bicicletas e com que frequência?”"},{"title":"Defina ângulo e público","body":"O ângulo é o caminho escolhido para responder. O público define o nível de explicação necessário.","example":"Ângulo humano: um dia com a equipe que reorganiza as bicicletas. Público: brasileiros curiosos sobre mobilidade em Xangai."},{"title":"Liste fontes, cenas e riscos","body":"Quem pode responder? Que imagens provam ou ilustram? O que pode dar errado (autorização, clima, idioma)?","example":"Fontes: operador da empresa, usuário, morador. Cenas: caminhão recolhendo, calçada antes e depois. Risco: gravação em área privada."}],"assignment":"Transforme um fato que você observou nesta semana em uma pauta de uma página: pergunta, ângulo, público, três fontes, cinco cenas e dois riscos.","rubric":"A pergunta é específica e respondível? As fontes podem realmente responder? As cenas servem à pergunta e não apenas à estética?"},"teoria-noticia:0":{"title":"Nem tudo o que acontece é notícia","intro":"Notícia é um acontecimento selecionado e relatado porque tem relevância para um público. Entender os critérios dessa seleção torna suas escolhas conscientes, e não automáticas.","steps":[{"title":"Acontecimento versus notícia","body":"Milhares de coisas acontecem a cada minuto. Vira notícia aquilo que alguém seleciona, verifica e relata com um propósito informativo.","example":"Um ônibus passa no horário: acontecimento comum. Uma linha inteira suspensa por uma semana: notícia para quem depende dela."},{"title":"Relevância para quem","body":"A noticiabilidade depende do público. O que é notícia para moradores de um bairro pode ser irrelevante para leitores de outro país — e vice-versa.","example":"Uma nova regra de lixo reciclável importa muito aos moradores; para um público estrangeiro, pode ser interessante como comparação."},{"title":"Novidade, impacto e interesse","body":"Três perguntas básicas: é novo? afeta pessoas? desperta curiosidade legítima? Quanto mais respostas positivas, mais forte a pauta.","example":"A abertura de um museu é nova, afeta a vida cultural e desperta curiosidade."}],"assignment":"Liste dez acontecimentos que você observou hoje. Classifique-os como notícia ou não para dois públicos diferentes e justifique três escolhas.","rubric":"Usei critérios explícitos? Considerei que a resposta muda com o público? Evitei classificar algo como notícia apenas por ser visualmente chamativo?"},"teoria-noticia:1":{"title":"Os critérios que pesam na balança editorial","intro":"Valores-notícia são critérios que jornalistas usam, muitas vezes sem perceber, para decidir o que publicar: proximidade, impacto, novidade, conflito, raridade, interesse humano, entre outros. Conhecê-los permite usá-los com responsabilidade.","steps":[{"title":"Proximidade e impacto","body":"Proximidade pode ser geográfica, cultural ou emocional. Impacto mede quantas pessoas são afetadas e com que intensidade.","example":"Para um público brasileiro, uma marca brasileira abrindo loja em Xangai tem proximidade cultural."},{"title":"Conflito, raridade e interesse humano","body":"Conflito e raridade atraem atenção; o interesse humano aproxima o público de experiências concretas. Usados em excesso, distorcem a percepção da realidade.","example":"Mostrar apenas discussões no trânsito cria a falsa impressão de que a cidade é sempre hostil."},{"title":"Equilibre os valores","body":"Um bom critério editorial combina valores sem deixar que o mais chamativo domine. Pergunte: o que o público precisa saber, e não só o que vai chamar atenção?","example":"Uma reportagem sobre chuva forte informa impacto e serviço (rotas, horários), não só imagens dramáticas."}],"assignment":"Escolha três pautas possíveis e identifique os valores-notícia de cada uma. Escolha uma para publicar e explique por que ela atende ao público, além de atrair atenção.","rubric":"Nomeei os valores-notícia corretamente? Reconheci quando um valor pode distorcer? Minha escolha final prioriza o interesse público?"},"teoria-noticia:2":{"title":"Selecionar é inevitável; esconder critérios, não","intro":"Todo conteúdo é resultado de seleção: o que entra, o que fica de fora e em que ordem. Ser transparente sobre essas escolhas é parte da ética e da qualidade jornalística.","steps":[{"title":"O corte faz sentido","body":"Edição é seleção. Cada corte altera o que o público entende. Pergunte se o material retirado mudaria a conclusão.","example":"Cortar a parte em que o entrevistado diz “mas isso é só minha experiência” muda o peso da fala."},{"title":"Ordem e destaque","body":"O que aparece primeiro e com mais tempo parece mais importante. A estrutura comunica tanto quanto as palavras.","example":"Começar um vídeo com o único cliente insatisfeito sugere que a insatisfação é a regra."},{"title":"Explicite o recorte","body":"Diga ao público o que foi observado, quando e com que limites. Recorte assumido é honesto; recorte escondido engana.","example":"“Visitamos o mercado numa terça de manhã; nos fins de semana a dinâmica pode ser outra.”"}],"assignment":"Grave ou escreva um relato curto e depois produza duas edições diferentes do mesmo material, cada uma levando a uma impressão distinta. Explique o que mudou e qual é mais fiel.","rubric":"As duas versões usam o mesmo material bruto? Identifiquei exatamente qual escolha muda a impressão? Expliquei o recorte ao público na versão final?"},"teoria-noticia:3":{"title":"Simule uma reunião de pauta","intro":"Na redação, as decisões editoriais são tomadas em conjunto: defende-se uma pauta, discutem-se riscos e prioridades. Simular esse processo desenvolve argumentação e critério.","steps":[{"title":"Apresente a pauta em 30 segundos","body":"Diga o fato, a pergunta central, por que importa agora e para quem. Se não cabe em 30 segundos, a pauta ainda não está clara.","example":"“Restaurantes do bairro estão adotando cardápios só por QR code. Pergunta: como isso afeta clientes idosos? Importa porque a mudança é rápida e pouco discutida.”"},{"title":"Antecipe objeções","body":"Quais perguntas um editor faria? Tem fonte? É novidade? Há risco legal ou ético? Ter respostas prontas fortalece a pauta.","example":"Objeção: “Isso não é só uma impressão sua?” Resposta: “Contei 12 de 15 restaurantes na rua.”"},{"title":"Decida e registre","body":"Compare pautas por relevância, viabilidade e risco. Registre a decisão e os motivos para revisar depois.","example":"“Escolhemos a pauta dos cardápios: alta relevância, fontes acessíveis e baixo risco.”"}],"assignment":"Prepare três pautas, apresente cada uma em 30 segundos (gravando) e escreva uma decisão editorial escolhendo uma delas com base em relevância, viabilidade e risco.","rubric":"Cada apresentação coube em 30 segundos? Antecipei pelo menos uma objeção por pauta? A decisão usa critérios explícitos?"},"etica-jornalistica:0":{"title":"O que vi, o que penso e o que deduzo","intro":"Misturar fatos, opiniões e inferências é o erro ético mais comum em conteúdo pessoal. Separá-los claramente protege o público e as pessoas retratadas.","steps":[{"title":"Fato observado","body":"Algo que pode ser verificado por outra pessoa no mesmo lugar e momento: número, ação, objeto, frase dita.","example":"“O vendedor fechou a loja às 17h.”"},{"title":"Inferência","body":"Uma conclusão que você tira a partir de fatos, mas que pode estar errada. Deve ser sinalizada como hipótese.","example":"“Talvez ele feche cedo por causa do movimento baixo” — sem confirmação, é inferência."},{"title":"Opinião","body":"Um julgamento pessoal sobre valor ou gosto. É legítima quando assumida como tal, nunca disfarçada de fato.","example":"“Para mim, é a rua mais bonita do bairro.”"}],"assignment":"Narre uma cena de rua em 60 segundos. Depois transcreva e marque cada frase como F (fato), I (inferência) ou O (opinião). Reescreva as inferências com marcadores de dúvida.","rubric":"Classifiquei todas as frases? Alguma inferência estava disfarçada de fato? Usei marcadores como “parece”, “talvez” ou “segundo”?"},"etica-jornalistica:1":{"title":"Filmar alguém é uma responsabilidade","intro":"Pessoas retratadas não escolheram aparecer no seu conteúdo. Consentimento e avaliação de danos possíveis são obrigações éticas, independentemente do que a lei permite.","steps":[{"title":"Peça consentimento de forma clara","body":"Explique quem você é, o que está gravando, onde será publicado e para quê. Consentimento dado sob pressão ou sem entendimento não é consentimento real.","example":"“Estou fazendo um vídeo sobre mercados para um canal no Brasil. Posso mostrar seu rosto e sua barraca?”"},{"title":"Avalie possíveis danos","body":"Aparecer pode expor alguém a constrangimento, problemas no trabalho ou riscos maiores. Pessoas vulneráveis exigem cuidado redobrado.","example":"Evite mostrar o rosto de alguém em situação de rua ou de crianças sem autorização dos responsáveis."},{"title":"Respeite a recusa e a retirada","body":"Quem recusa não deve ser filmado em destaque. Quem pede para sair depois deve ser atendido sempre que possível.","example":"Se um entrevistado pede para não aparecer, use apenas o áudio com autorização ou desfoque a imagem."}],"assignment":"Escreva um roteiro de abordagem para pedir consentimento em português e uma versão simplificada em inglês. Liste três situações em que você não filmaria mesmo com permissão legal.","rubric":"O roteiro explica quem sou, o quê, onde e para quê? As três situações consideram vulnerabilidade e dano? Eu realmente aceitaria uma recusa?"},"etica-jornalistica:2":{"title":"Quem paga, quem ganha e quem você protege","intro":"Conflitos de interesse surgem quando vantagens pessoais podem influenciar o conteúdo: brindes, patrocínios, amizades ou interesses comerciais. Declarar e gerenciar esses conflitos preserva a credibilidade.","steps":[{"title":"Reconheça o conflito","body":"Qualquer relação que possa afetar seu julgamento é um potencial conflito, mesmo que você acredite estar imparcial.","example":"Um restaurante oferece a refeição gratuita em troca de um vídeo."},{"title":"Declare ao público","body":"Transparência permite que o público avalie o conteúdo com todas as informações. A declaração deve ser clara e visível, não escondida.","example":"“Este jantar foi oferecido pelo restaurante; a avaliação é minha e não foi revisada por eles.”"},{"title":"Recuse quando necessário","body":"Alguns conflitos não se resolvem com declaração: se a vantagem impede uma avaliação honesta, recuse ou não publique.","example":"Não aceitar exigência de aprovação prévia do vídeo pela marca."}],"assignment":"Liste três situações possíveis de conflito de interesse no seu tipo de conteúdo. Para cada uma, escreva a declaração ao público ou justifique por que recusaria.","rubric":"Identifiquei conflitos realistas? As declarações são claras e visíveis? Reconheci algum caso em que recusar é a única opção?"},"etica-jornalistica:3":{"title":"Uma lista curta antes de publicar","intro":"Um checklist editorial transforma princípios éticos em verificação prática. Ele não substitui o julgamento, mas evita esquecimentos sob pressa.","steps":[{"title":"Verifique os fatos","body":"Nomes, números, datas, locais e citações estão corretos? Cada afirmação importante tem fonte?","example":"Confirmar a grafia do nome do entrevistado e o preço informado."},{"title":"Verifique as pessoas","body":"Todos que aparecem em destaque consentiram? Alguém pode ser prejudicado? Há crianças ou pessoas vulneráveis?","example":"Desfocar o rosto de uma criança que aparece por acaso em primeiro plano."},{"title":"Verifique a transparência","body":"Opiniões estão marcadas? Patrocínios declarados? Limites da apuração explicitados? Há como corrigir depois?","example":"Inserir na descrição: data da gravação, patrocínio e canal de correção."}],"assignment":"Monte seu checklist editorial pessoal com 10 itens e aplique-o a um conteúdo já publicado ou planejado. Registre o que encontraria de problema.","rubric":"O checklist cobre fatos, pessoas e transparência? Apliquei-o de verdade a um conteúdo? Encontrei pelo menos um ponto a corrigir?"},"legislacao-direitos:0":{"title":"Imagem e privacidade mudam de país para país","intro":"O direito de imagem e a privacidade são protegidos de formas diferentes em cada jurisdição. Este conteúdo é orientativo: não substitui consulta jurídica nem a verificação das regras locais vigentes.","steps":[{"title":"Imagem como direito pessoal","body":"Em muitos países, inclusive no Brasil e na China, a imagem de uma pessoa é protegida, e seu uso — especialmente comercial — pode exigir autorização.","example":"Usar o rosto de um transeunte em destaque numa propaganda é diferente de vê-lo ao fundo de uma paisagem."},{"title":"Destaque versus multidão","body":"Pessoas que aparecem de forma incidental numa multidão costumam ter tratamento diferente de pessoas em destaque. A fronteira, porém, varia e deve ser verificada.","example":"Plano geral de uma avenida lotada versus close de uma pessoa específica."},{"title":"Privacidade e contexto","body":"Mesmo em espaço público, algumas situações são sensíveis: saúde, religião, sofrimento. A ética recomenda cautela além do mínimo legal.","example":"Evitar filmar alguém chorando numa estação, ainda que seja local público."}],"assignment":"Pesquise, em fontes oficiais ou jurídicas confiáveis, as regras básicas de direito de imagem no Brasil e na China. Registre o que encontrou, as fontes e o que ainda não ficou claro.","rubric":"Usei fontes oficiais ou especializadas? Diferenciei pessoa em destaque de multidão? Registrei as dúvidas sem inventar respostas?"},"legislacao-direitos:1":{"title":"Nem todo lugar aberto ao público é espaço público","intro":"Shoppings, lojas, museus, estações e templos podem ter regras próprias de gravação. Pedir autorização é parte do planejamento, não um detalhe.","steps":[{"title":"Distinga público e privado","body":"Uma rua é espaço público; um shopping é propriedade privada aberta ao público. O proprietário pode proibir ou restringir gravações.","example":"Seguranças podem pedir para interromper uma gravação dentro de uma loja."},{"title":"Procure regras visíveis e oficiais","body":"Placas, sites oficiais e balcões de informação indicam se é permitido fotografar, usar tripé ou drone.","example":"Muitos museus permitem fotos sem flash, mas proíbem tripé e uso comercial."},{"title":"Peça e registre autorizações","body":"Para gravações em destaque ou uso comercial, peça autorização por escrito ou gravada. Guarde o registro.","example":"Mensagem de e-mail do restaurante autorizando a gravação na cozinha."}],"assignment":"Escolha três locais em Xangai onde gostaria de gravar. Para cada um, descubra as regras de gravação em fontes oficiais e escreva uma mensagem de pedido de autorização.","rubric":"Verifiquei regras em fontes oficiais? As mensagens explicam o propósito e o uso? Tenho um plano caso a autorização seja negada?"},"legislacao-direitos:2":{"title":"Música, imagem e texto têm dono","intro":"Usar conteúdo de terceiros — músicas, fotos, vídeos, textos — exige permissão, licença ou enquadramento em exceções legais. Ignorar direitos autorais pode derrubar seu conteúdo e gerar responsabilidade.","steps":[{"title":"Autoria é a regra","body":"Quem cria uma obra detém direitos sobre ela. Estar disponível na internet não significa estar liberado para uso.","example":"Uma foto encontrada numa busca não pode ser usada no seu vídeo sem licença."},{"title":"Licenças e bancos livres","body":"Licenças como Creative Commons indicam o que é permitido (uso comercial, modificação, atribuição). Leia as condições de cada uma.","example":"Uma música CC BY exige crédito ao autor; CC BY-NC proíbe uso comercial."},{"title":"Credite e documente","body":"Sempre que usar material de terceiros, credite corretamente e guarde a prova da licença ou autorização.","example":"Na descrição: “Música: Título — Autor, licença CC BY 4.0, link”."}],"assignment":"Faça um inventário de todos os elementos de terceiros de um vídeo seu ou planejado (música, imagens, logos, trechos). Para cada um, indique a licença ou a autorização necessária.","rubric":"Listei todos os elementos de terceiros? Sei qual licença cada um exige? Os créditos estão completos?"},"legislacao-direitos:3":{"title":"Antes de gravar, um roteiro de verificação","intro":"Um roteiro de verificação legal reúne as perguntas que devem ser respondidas antes de uma gravação. Ele organiza riscos e reduz surpresas, sem substituir orientação jurídica quando necessária.","steps":[{"title":"Local e autorização","body":"O local é público ou privado? Há regras de gravação? Preciso de autorização escrita? Há restrição a equipamentos?","example":"Gravação num templo: verificar regras, horários e se há áreas proibidas."},{"title":"Pessoas e consentimento","body":"Quem aparecerá em destaque? Tenho consentimento? Há menores ou pessoas vulneráveis?","example":"Entrevista com um comerciante: consentimento gravado no início."},{"title":"Conteúdo e uso","body":"Uso materiais de terceiros? O conteúdo será monetizado? Há temas sensíveis que exigem cautela adicional na jurisdição local?","example":"Vídeo patrocinado: declarar a parceria e verificar regras de publicidade."}],"assignment":"Crie seu roteiro de verificação legal com pelo menos 12 perguntas e aplique-o a uma gravação planejada, indicando quais respostas exigem consulta especializada.","rubric":"O roteiro cobre local, pessoas e conteúdo? Apliquei-o a um caso real? Reconheci os limites do meu conhecimento jurídico?"},"jornalismo-internacional:0":{"title":"Contar outro país exige mais contexto","intro":"Ao cobrir um país estrangeiro, o público geralmente sabe pouco sobre a história, a política e o cotidiano locais. O jornalista precisa oferecer contexto sem simplificar demais.","steps":[{"title":"Diversifique as fontes","body":"Combine fontes locais, especialistas, documentos oficiais e observação direta. Uma única fonte — ainda mais estrangeira — oferece visão parcial.","example":"Sobre habitação em Xangai: moradores, urbanistas locais, dados oficiais e pesquisa acadêmica."},{"title":"Contexto histórico e social","body":"Um fato atual pode ter raízes em décadas de transformação. Uma frase de contexto evita leituras superficiais.","example":"Ao mostrar o Bund, mencionar brevemente sua história de concessões estrangeiras."},{"title":"Evite a autoridade do visitante","body":"Algumas semanas num lugar não fazem de ninguém especialista. Marque o que é impressão de visitante e o que foi apurado.","example":"“Como visitante, percebi... Segundo a pesquisadora X, isso se explica por...”"}],"assignment":"Escolha um tema da vida em Xangai e liste quatro tipos de fonte para tratá-lo. Escreva um parágrafo de contexto de até 80 palavras com fontes indicadas.","rubric":"As fontes são diversas e independentes? O contexto é preciso e verificável? Marquei minha posição de visitante?"},"jornalismo-internacional:1":{"title":"Traduzir também é interpretar","intro":"Toda tradução envolve escolhas. Nuances, ironias e referências culturais podem se perder ou mudar. O jornalista internacional precisa tratar a tradução como etapa de apuração.","steps":[{"title":"Tradução literal e de sentido","body":"Traduzir palavra por palavra pode deformar o sentido; traduzir só o sentido pode apagar nuances. Busque equilíbrio e indique quando há ambiguidade.","example":"Expressões idiomáticas em mandarim podem exigir explicação, não só tradução."},{"title":"Intérpretes e mediadores","body":"Intérpretes ajudam, mas também filtram. Peça tradução completa, não resumo, e confirme trechos importantes com outra pessoa quando possível.","example":"Pedir ao intérprete: “Pode traduzir exatamente o que ela disse, mesmo que pareça repetitivo?”"},{"title":"Transparência com o público","body":"Informe quando uma fala foi traduzida e por quem. Em legendas, prefira fidelidade a frases embelezadas.","example":"Legenda: “Entrevista em mandarim, tradução de [nome].”"}],"assignment":"Escolha uma frase ou expressão local que você ouviu. Proponha uma tradução literal, uma de sentido e uma explicação contextual. Indique qual usaria numa legenda e por quê.","rubric":"As três versões são diferentes? Expliquei a perda ou ganho de nuance? A escolha final é fiel à fala original?"},"jornalismo-internacional:2":{"title":"Ver pessoas, não estereótipos","intro":"Estereótipos simplificam grupos inteiros em poucas características. Em coberturas internacionais, eles se reforçam quando o jornalista busca apenas o exótico ou confirma o que o público já espera.","steps":[{"title":"Reconheça o estereótipo","body":"Generalizações como “todos os chineses...” ou “na China é sempre...” apagam diversidade regional, geracional e social.","example":"Trocar “os chineses comem...” por “neste restaurante de Xangai, o prato mais pedido é...”."},{"title":"Evite o exotismo","body":"Mostrar só o que parece estranho ao público reforça distância. Mostre também o cotidiano comum e as semelhanças.","example":"Ao lado de um mercado tradicional, mostrar também a rotina de trabalho num escritório."},{"title":"Considere assimetrias","body":"Quem fala, quem é falado e quem decide o enquadramento? Dê voz a pessoas locais sobre suas próprias experiências.","example":"Incluir a fala de um morador explicando o significado de uma festa, em vez de apenas descrevê-la como “curiosa”."}],"assignment":"Revise um roteiro ou vídeo seu e identifique três frases que generalizam ou exotizam. Reescreva-as com especificidade de lugar, tempo e pessoa.","rubric":"Encontrei generalizações reais? As versões reescritas são específicas? Dei espaço à voz local?"},"jornalismo-internacional:3":{"title":"Uma história, várias perspectivas","intro":"Reportagens internacionais ganham prof
