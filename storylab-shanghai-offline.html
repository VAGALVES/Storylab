cai abaixo dos ombros.","Anglicismo consolidado na moda; em português, “amplo” ou “folgado” também servem."],["atemporal","Que não segue tendências de uma época e tende a não sair de moda.","A marca aposta em peças atemporais, de cores neutras.","É um argumento de marketing; atribua-o à marca se a ideia for dela."]],"model":["Na vitrine proposta, um casaco de silhueta reta aparece sobre uma calça ampla.","Um pesponto visível acompanha a borda do bolso e destaca o acabamento.","Enquanto o casaco mantém linhas mais estruturadas, o tecido da calça forma dobras suaves.","Na minha avaliação, o interesse visual está na relação entre rigidez e fluidez; para julgar a modelagem, precisaria examinar a peça."],"swaps":[{"vague":"elegante","options":["silhueta","caimento","modelagem"],"weak":"O terno é elegante.","strong":"O terno tem silhueta ajustada e caimento reto, sem rugas nas costas.","flag":true},{"vague":"bem-feito","options":["acabamento","pesponto","arremate"],"weak":"A peça é bem-feita.","strong":"O pesponto é regular e o arremate interno esconde as costuras.","flag":true},{"vague":"diferente","options":["recorte","volume","pregas"],"weak":"O vestido é diferente.","strong":"O vestido tem recortes assimétricos e pregas que criam volume no quadril.","flag":true}]},{"scene":"Uma refeição recém-servida","focus":"Separe sensações pessoais, técnicas observáveis e ingredientes que ainda precisam ser confirmados.","terms":[["crocante","Que se rompe com resistência e produz estalos ao mastigar.","A cobertura ficou crocante ao primeiro corte e ao provar.","Fotografia isolada não comprova crocância."],["cremoso","De consistência macia e coesa, fácil de espalhar.","O molho cremoso envolve a massa e não escorre rapidamente.","Textura não prova a presença de creme de leite."],["fibroso","Com estruturas alongadas que se percebem ao cortar ou mastigar.","A fruta aberta revela uma polpa fibrosa.","Fibroso não equivale a medida nutricional de fibras."],["untuoso","De textura gordurosa e deslizante percebida ao paladar.","O molho tem sensação untuosa e recobre a colher.","Untuoso descreve percepção; não determine um ingrediente sem confirmação."],["ácido","Que apresenta sensação gustativa de acidez.","O sabor ácido aparece no final de cada garfada.","Acidez percebida não mede o pH."],["adocicado","Com presença suave ou secundária de sabor doce.","O molho tem um fundo adocicado depois da acidez.","Não atribua açúcar adicionado sem confirmar os ingredientes."],["defumado","Com aroma ou sabor associado à fumaça.","Percebi notas defumadas no aroma do prato.","Notas defumadas não comprovam que houve defumação real."],["aromático","Com cheiro perceptível e característico.","O chá aromático perfuma o espaço antes da degustação.","Aroma não confirma todos os ingredientes do preparo."],["aveludado","De textura lisa e macia percebida na boca.","A sopa apresenta textura aveludada e uniforme.","Não deduza ingredientes gordurosos apenas pela sensação."],["persistente","De sabor ou aroma que permanece após a degustação.","O toque cítrico continua persistente após o último gole.","A persistência é percepção individual, não uma medição universal."],["umami","Gosto básico associado a caldos, carnes, cogumelos e molhos fermentados; sabor de profundidade.","O caldo tem umami intenso, vindo do molho de soja e dos cogumelos.","Umami é gosto básico, não tempero; diga de onde ele vem no prato."],["picante","Que provoca sensação de ardor, como a da pimenta.","O macarrão é picante, com óleo de pimenta e pimenta de Sichuan.","A pimenta de Sichuan dá dormência (“ma”), diferente do ardor (“la”)."],["adstringente","Que deixa sensação de secura e aspereza na boca, como chá forte ou caqui verde.","O chá verde concentrado é levemente adstringente.","Adstringência é sensação de textura, não amargor."],["caramelizado","Com açúcar dourado pelo calor, que ganha cor e sabor tostado.","A carne de porco caramelizada brilha sob o molho escuro.","Diga se o caramelo vem do açúcar adicionado ou dos próprios ingredientes."],["tostado","Dourado pelo calor seco, com sabor levemente queimado.","As sementes de gergelim tostadas perfumam o prato.","Tostado é dourado; queimado já indica excesso."]],"model":["Na cena da atividade, um prato chega à mesa com molho espesso e cobertura dourada.","Ao provar, a cobertura parece crocante e o molho oferece sensação untuosa.","Comparando as duas texturas, uma se rompe ao mastigar enquanto a outra permanece mais envolvente.","Para mim, esse contraste é o aspecto mais marcante do prato, mas seus ingredientes devem ser confirmados no cardápio ou com a cozinha."],"swaps":[{"vague":"gostoso","options":["aromático","untuoso","persistente"],"weak":"O caldo é gostoso.","strong":"O caldo é aromático e untuoso, com sabor de gengibre persistente.","flag":true},{"vague":"delicioso","options":["crocante","cremoso","defumado"],"weak":"O bolinho é delicioso.","strong":"O bolinho é crocante por fora e cremoso por dentro.","flag":true},{"vague":"forte","options":["ácido","defumado","persistente"],"weak":"O molho tem um gosto forte.","strong":"O molho é ácido, com vinagre escuro, e deixa um retrogosto defumado.","flag":false}]},{"scene":"O interior de uma estação com anúncios sonoros","focus":"Descrever som exige distinguir fonte, ritmo e fenômenos acústicos sem inventar medidas.","terms":[["ressonância","Reforço de vibrações sonoras em determinadas frequências ou materiais.","Uma ressonância grave acompanha o ruído no corredor subterrâneo.","Não confunda ressonância com repetição audível típica de eco."],["reverberação","Persistência breve de sons refletidos por várias superfícies.","A voz do aviso permanece audível por instantes na forma de reverberação.","Reverberação não é sempre eco separado."],["eco","Repetição audível de um som por reflexão com atraso perceptível.","Um chamado se repete como eco no corredor vazio.","Não chame todo som prolongado de eco."],["sussurro","Fala muito baixa, com emissão de ar predominante.","Um sussurro se destaca durante a pausa da música.","Evite captar ou publicar conversas privadas sem permissão."],["estalo","Som breve e seco provocado por contato ou ruptura.","Um estalo acompanha o fechamento da caixa de madeira.","O som sozinho não confirma o material que o produziu."],["zumbido","Som contínuo, geralmente grave ou vibratório.","Um zumbido discreto acompanha o funcionamento do equipamento.","Evite inferir qual máquina o produziu se não a identificou."],["ruído","Som secundário ou indesejado em relação ao sinal principal.","O ruído do sistema de ventilação cobre parte da entrevista.","Ruído também pode transmitir contexto e não ser falha técnica."],["cadência","Organização rítmica de uma sequência sonora.","A cadência dos avisos alterna fala e pequenos intervalos.","Cadência não é sinônimo de volume."],["intensidade","Grau de força do som ou de sua percepção auditiva.","A intensidade percebida do tráfego cresce perto da avenida.","Não informe decibéis sem medição instrumental."],["silêncio","Ausência ou redução significativa de som num contexto.","Após o aviso, alguns segundos de silêncio ocupam a gravação.","Silêncio na edição pode resultar de corte e não do ambiente."],["timbre","Qualidade que diferencia sons de mesma altura e intensidade, como a voz de cada pessoa.","O timbre grave do vendedor se destaca entre os anúncios da rua.","Timbre não é volume nem altura; é a “cor” do som."],["grave","Som de frequência baixa, como o de um tambor ou de um motor de ônibus.","O ruído grave dos ônibus faz vibrar o vidro do café.","Grave é altura do som, não volume: um som grave pode ser baixo."],["agudo","Som de frequência alta, como um apito ou o freio de uma bicicleta.","O apito agudo do guarda corta o barulho da avenida.","Agudo não significa alto; descreva também a intensidade."],["estridente","Som agudo, intenso e incômodo.","O alarme estridente dispara toda vez que a porta abre.","É uma avaliação; descreva o som antes de qualificá-lo."],["paisagem sonora","Conjunto dos sons que caracterizam um lugar.","A paisagem sonora do mercado mistura pregões, rádio e água corrente.","Conceito útil para vídeo: grave o ambiente sem narração para registrá-lo."]],"model":["A estação simulada apresenta avisos ao público e um ruído contínuo ao fundo.","Em alguns pontos do corredor, o anúncio parece permanecer por instantes devido à reverberação.","Enquanto a voz surge em intervalos, o zumbido do ambiente se mantém mais constante durante a gravação.","Na minha escuta, esse contraste de duração ajuda a transmitir a escala do espaço sem precisar nomear equipamentos desconhecidos."],"swaps":[{"vague":"barulhento","options":["ruído","reverberação","intensidade"],"weak":"A estação é barulhenta.","strong":"A estação tem ruído constante, e a reverberação do teto alto aumenta a intensidade dos anúncios.","flag":true},{"vague":"silencioso","options":["silêncio","sussurro","zumbido"],"weak":"O museu é silencioso.","strong":"No museu, o silêncio só é interrompido pelo zumbido do ar-condicionado.","flag":false},{"vague":"som","options":["estalo","cadência","eco"],"weak":"Dava para ouvir um som.","strong":"Ouvia-se o estalo regular das rodas do carrinho, numa cadência de dois tempos.","flag":false}]},{"scene":"Uma fotografia de rua feita no fim da tarde","focus":"Explique fotografia com termos técnicos que correspondam à imagem; informe configurações apenas quando conhecidas.","terms":[["contraluz","Situação em que a fonte de luz está atrás do assunto em relação à câmera.","A pessoa foi fotografada em contraluz, com o sol fora do enquadramento.","Contraluz não implica obrigatoriamente silhueta."],["primeiro plano","Parte da cena situada visualmente mais perto da câmera.","A bicicleta em primeiro plano ajuda a dar escala ao edifício.","Um objeto em primeiro plano não precisa estar em foco."],["profundidade de campo","Extensão da cena que parece aceitavelmente nítida.","A profundidade de campo reduzida destaca o rosto contra o fundo desfocado.","Não confunda profundidade de campo com distância focal isoladamente."],["perspectiva","Relação visual de tamanhos e posições que sugere profundidade.","As linhas convergentes do corredor reforçam a perspectiva.","Perspectiva não informa automaticamente o tipo de lente."],["enquadramento","Seleção dos elementos incluídos e excluídos dos limites da imagem.","O enquadramento inclui a bicicleta à esquerda como referência de escala.","Não atribua intenção do fotógrafo sem entrevistá-lo."],["reflexo","Imagem ou luz devolvida por uma superfície refletora.","O reflexo das luzes surge sobre o piso molhado.","Não identifique a fonte se ela estiver fora do enquadramento."],["desfoque","Ausência ou redução de nitidez em parte da imagem.","O desfoque do fundo destaca a expressão do entrevistado.","Pode resultar de foco, movimento ou edição: não presuma a causa."],["silhueta","Contorno de figura percebido pelo contraste com o fundo.","A silhueta do pedestre se destaca contra a vitrine iluminada.","Silhueta não implica perda definitiva dos detalhes originais."],["panorâmica","Visão ampla ou movimento de câmera que percorre a cena.","Uma panorâmica lenta apresenta o entorno da praça.","Diferencie foto panorâmica de movimento de câmera."],["exposição","Quantidade de luz registrada numa captura fotográfica.","A exposição preserva detalhes nas vitrines mais claras.","Sem metadados, não invente ajustes de ISO, abertura e obturador."],["regra dos terços","Divisão do quadro em nove partes iguais para posicionar elementos nas linhas ou intersecções.","Pela regra dos terços, o horizonte ficou na linha inferior do quadro.","É um recurso de composição, não uma obrigação; centralizar também pode funcionar."],["linhas de condução","Linhas da cena que conduzem o olhar até o ponto de interesse.","Os trilhos funcionam como linhas de condução até o bonde ao fundo.","Diga para onde as linhas levam o olhar."],["plano detalhe","Enquadramento muito fechado que mostra apenas uma parte pequena de algo.","Um plano detalhe mostra as mãos da artesã dobrando o papel.","Combine com planos abertos para não perder o contexto."],["granulação","Textura de pontos visível na imagem, comum em pouca luz ou filme.","A foto noturna tem granulação forte nas áreas escuras.","Granulação pode ser defeito ou escolha estética; diga qual é o caso."],["composição","Organização dos elementos dentro do quadro.","A composição coloca o vendedor à esquerda e a fila à direita, em diagonal.","Descreva a composição pelo que ela faz o público ver primeiro."]],"model":["A fotografia do exercício mostra um pedestre diante de uma rua iluminada pelo sol baixo.","O enquadramento coloca a figura em primeiro plano e deixa fachadas desfocadas ao fundo.","Comparada a uma imagem com todos os planos nítidos, essa escolha dirige mais atenção à pessoa.","Na minha leitura, a relação entre figura e ambiente dá unidade à cena; a intenção do fotógrafo precisaria ser confirmada."],"swaps":[{"vague":"foto boa","options":["enquadramento","exposição","profundidade de campo"],"weak":"Tirei uma foto boa.","strong":"O enquadramento isola o vendedor, e a pouca profundidade de campo desfoca a fila.","flag":false},{"vague":"escura","options":["contraluz","silhueta","exposição"],"weak":"A foto ficou escura.","strong":"Em contraluz, o ciclista virou silhueta porque a exposição foi feita para o céu.","flag":false},{"vague":"embaçada","options":["desfoque","primeiro plano","perspectiva"],"weak":"A foto ficou embaçada.","strong":"O desfoque no primeiro plano direciona o olhar para a perspectiva da rua.","flag":false}]},{"scene":"Uma chegada a um bairro desconhecido","focus":"Aprenda a nomear o que sentiu sem projetar emoções sobre moradores e outras pessoas.","terms":[["surpresa","Reação ao encontro de algo não previsto.","Fiquei surpreso ao encontrar uma galeria dentro da estação.","Descreva sua surpresa, não a de todos os visitantes."],["curiosidade","Interesse em investigar algo ainda não compreendido.","A fachada despertou minha curiosidade sobre a história do lugar.","Curiosidade formula perguntas, não comprova respostas."],["encantamento","Admiração afetiva intensa diante de uma experiência.","Senti encantamento ao ver a luz atravessando as árvores.","Trata-se de reação pessoal e não de qualidade universal."],["estranhamento","Sensação de distância ou surpresa diante do que não é familiar.","Senti estranhamento ao encontrar uma organização de lojas diferente da habitual.","Estranhamento descreve sua reação, não um defeito do lugar."],["familiaridade","Percepção subjetiva de reconhecimento ou proximidade.","A disposição das mesas me trouxe uma sensação de familiaridade.","Não presuma experiência idêntica para outros visitantes."],["nostalgia","Emoção de lembrança afetiva do passado.","A música despertou nostalgia de encontros de família.","Nostalgia depende de memória pessoal; não é característica objetiva da música."],["calma","Estado de tranquilidade vivenciado numa situação.","Senti calma durante a caminhada pelo jardim.","Pouco movimento não prova que outras pessoas sintam o mesmo."],["expectativa","Antecipação mental sobre algo que ainda vai acontecer.","Cheguei ao mercado com expectativa de descobrir novos sabores.","Distinga o que esperava encontrar do que realmente encontrou."],["admiração","Apreço ou respeito diante de algo considerado notável.","Senti admiração pelo cuidado visível nos detalhes da peça.","O sentimento não confirma autoria ou qualidade técnica."],["ambivalência","Presença simultânea de sentimentos ou avaliações diferentes.","Senti ambivalência entre entusiasmo pela novidade e cautela diante do desconhecido.","Evite usar ambivalência como mero sinônimo de dúvida factual."],["desconforto","Sensação de incômodo físico ou emocional diante de uma situação.","Senti desconforto ao filmar perto das pessoas que esperavam atendimento.","Atribua o desconforto a você; não o projete em quem aparece na cena."],["empatia","Capacidade de se colocar no lugar do outro e compreender sua experiência.","A conversa com a vendedora despertou empatia pela rotina dela.","Empatia não autoriza falar pela pessoa; deixe que ela conte a própria experiência."],["inquietação","Estado de agitação interior, de dúvida ou de preocupação.","A demolição das casas antigas me deixou uma inquietação sobre quem morava ali.","Transforme a inquietação em pergunta de apuração, não em conclusão."],["deslumbramento","Admiração intensa, que pode ofuscar o olhar crítico.","O deslumbramento com as luzes do rio não pode apagar o resto da cidade.","Reconheça o deslumbramento para não deixá-lo guiar a reportagem."],["alívio","Sensação de tranquilidade depois de uma tensão ou preocupação.","Senti alívio quando o metrô voltou a funcionar depois da chuva.","Diga o que causou a tensão; alívio sem contexto não informa."]],"model":["Cheguei ao bairro da situação proposta e encontrei lojas com disposições que não reconheci de imediato.","Minha primeira reação foi de estranhamento, mas a música de uma cafeteria trouxe familiaridade.","Em vez de classificar o lugar como estranho, consigo comparar essa reação às experiências que já vivi em outros bairros.","Essa mistura de surpresa e reconhecimento descreve minha percepção pessoal, não uma característica universal do bairro."],"swaps":[{"vague":"incrível","options":["admiração","encantamento","surpresa"],"weak":"Foi incrível chegar lá.","strong":"Senti surpresa ao ver o bairro antigo atrás das torres, e depois admiração pelos detalhes.","flag":true},{"vague":"esquisito","options":["estranhamento","ambivalência","curiosidade"],"weak":"Foi esquisito no começo.","strong":"No início senti estranhamento; com o tempo, a curiosidade venceu.","flag":true},{"vague":"bom","options":["calma","familiaridade","nostalgia"],"weak":"Foi bom estar ali.","strong":"A rua me deu uma sensação de familiaridade e calma, quase nostalgia.","flag":false}]},{"scene":"Uma praça com fonte, bancos e canteiros","focus":"Organize o olhar do público usando posições relativas claras e mantendo a orientação da câmera.","terms":[["adjacente","Que fica ao lado, com proximidade direta.","O banco adjacente ao canteiro está parcialmente na sombra.","Não use adjacente para elementos distantes no enquadramento."],["ao fundo","Na parte visualmente mais distante da composição.","Ao fundo, uma escadaria conduz à praça elevada.","A profundidade na imagem depende da perspectiva mostrada."],["na diagonal","Em orientação oblíqua aos eixos de referência da composição.","Um caminho corta a praça na diagonal, da esquerda para a direita.","Indique qual enquadramento está sendo usado como referência."],["em primeiro plano","Em posição próxima ao observador na composição visual.","Em primeiro plano, uma flor introduz a paisagem do jardim.","Proximidade não significa necessariamente protagonismo narrativo."],["paralelo","Em direção semelhante sem encontro no espaço descrito.","Duas fileiras paralelas de árvores acompanham a avenida.","A perspectiva fotográfica pode fazer linhas paralelas convergirem."],["sobreposto","Que aparece ou se posiciona parcialmente sobre outro elemento.","A silhueta da árvore fica sobreposta à fachada na imagem.","Sobreposição visual não implica contato físico."],["alinhado","Disposto segundo uma linha ou eixo visual.","Os postes aparecem alinhados na borda da calçada.","Alinhamento aparente não atesta precisão geométrica."],["intercalado","Distribuído em alternância entre outros elementos.","Os bancos aparecem intercalados com pequenos canteiros.","Confirme se existe de fato uma sequência alternada."],["centralizado","Situado próximo ao centro do referencial escolhido.","O relógio centralizado organiza a composição da parede.","Centro fotográfico pode ser diferente do centro físico do objeto."],["nas extremidades","Localizado nas partes mais afastadas de um objeto ou quadro.","Duas luminárias nas extremidades deixam o centro livre.","Especifique se fala das extremidades do objeto ou da imagem."],["contíguo","Imediatamente ao lado, encostado, sem espaço entre os dois.","A loja de chá é contígua à entrada do templo.","Contíguo exige contato; “próximo” não basta."],["defronte","Em frente, do lado oposto.","Defronte ao mercado, há uma praça com bancos de pedra.","“Defronte a” e “defronte de” são corretos; na fala, “em frente a” é mais natural."],["perpendicular","Que forma ângulo reto com outra linha ou direção.","A rua dos cafés é perpendicular à avenida principal.","Use quando o ângulo for de fato próximo de 90 graus."],["recuado","Afastado para trás em relação ao alinhamento dos demais.","O templo fica recuado, atrás de um pátio, longe da calçada.","Diga em relação a quê o elemento está recuado."],["à margem","Na borda, na lateral de algo; também, em sentido figurado, excluído.","As bancas ficam à margem da avenida, junto ao canal.","Cuidado com o duplo sentido: “à margem da sociedade” é julgamento forte."]],"model":["Na cena simulada, uma fonte ocupa o centro do enquadramento e há bancos nos dois lados.","Um canteiro fica adjacente ao primeiro banco; ao fundo, vemos uma pequena escadaria.","Enquanto a fonte atrai o olhar imediatamente, os bancos intercalados com canteiros conduzem a atenção pelas laterais.","Minha impressão é que essa organização ajuda o visitante a perceber diferentes zonas da praça, embora a experiência varie com o trajeto."],"swaps":[{"vague":"perto","options":["adjacente","em primeiro plano","sobreposto"],"weak":"A banca fica perto da fonte.","strong":"A banca é adjacente à fonte, do lado leste da praça.","flag":false},{"vague":"atrás","options":["ao fundo","sobreposto","nas extremidades"],"weak":"Tem prédios atrás.","strong":"Ao fundo, as torres aparecem sobrepostas aos telhados baixos.","flag":false},{"vague":"espalhado","options":["intercalado","alinhado","na diagonal"],"weak":"Os bancos ficam espalhados.","strong":"Os bancos estão intercalados com canteiros e alinhados na diagonal.","flag":false}]},{"scene":"Um mercado abrindo para o movimento da manhã","focus":"A cronologia deve respeitar a sequência observada; não confunda tempo do vídeo com horário real.","terms":[["gradualmente","De modo progressivo, em pequenas mudanças sucessivas.","O movimento de pessoas aumentou gradualmente ao longo da filmagem.","Uma mudança entre dois cortes não prova progressão contínua."],["repentinamente","De forma inesperada ou abrupta em relação à sequência observada.","Uma rajada repentinamente deslocou as folhas da calçada.","Não use repentinamente para o que já foi apresentado como previsível."],["ao amanhecer","No período inicial de claridade do dia.","Ao amanhecer, a luz revela gradualmente os letreiros da rua.","Confirme o período com informação confiável do registro."],["no intervalo","Durante uma pausa entre dois acontecimentos.","No intervalo entre anúncios, o corredor parece mais silencioso.","Não monte cenas separadas como se fossem simultâneas."],["enquanto isso","Conector que marca simultaneidade de ações.","O funcionário organiza as caixas; enquanto isso, clientes chegam.","Não afirme simultaneidade se as cenas foram gravadas em momentos diferentes."],["mais adiante","Em ponto posterior do trajeto ou do discurso.","Mais adiante, a calçada se estreita perto da banca.","Explique se a referência é espacial ou temporal."],["posteriormente","Em momento que ocorre depois do fato mencionado.","Posteriormente, o vendedor explicou a origem do objeto.","Uma sequência de edição pode não refletir a ordem real."],["anteriormente","Em momento que ocorreu antes da referência atual.","Anteriormente, tínhamos observado a mesma solução em outra loja.","Indique o registro anterior quando isso afetar a compreensão."],["na sequência","Expressão que introduz o acontecimento posterior.","Na sequência, a porta foi aberta e as primeiras pessoas entraram.","A ordem da edição não garante a ordem dos acontecimentos."],["ao final","No encerramento de uma sequência definida.","Ao final da caminhada, retornamos ao ponto de partida.","Não generalize a conclusão para além da sequência observada."],["simultaneamente","Ao mesmo tempo.","Simultaneamente, as luzes da rua e os letreiros se acendem às 18h.","Use quando os eventos coincidem de fato, não apenas em sequência rápida."],["paulatinamente","Pouco a pouco, de forma lenta e contínua.","Paulatinamente, as bancas foram substituídas por lojas de grife.","Formal e preciso; na fala, “aos poucos” é mais natural."],["de imediato","Sem intervalo; logo em seguida.","Quando a chuva começou, os vendedores cobriram as mercadorias de imediato.","“De imediato” e “imediatamente” são equivalentes; evite “de imediato” repetido."],["em seguida","Logo depois, na sequência imediata.","O trem para; em seguida, as portas se abrem dos dois lados.","Marca ordem, não intervalo exato; diga o tempo se ele importar."],["ao longo do dia","Durante todo o período do dia, de forma contínua ou repetida.","Ao longo do dia, a sombra do prédio atravessa toda a praça.","Diga o que muda ao longo do dia e em que horários você observou."]],"model":["Na gravação imaginada, os comerciantes organizam produtos antes da chegada dos clientes.","Gradualmente, mais pessoas aparecem na passagem central, enquanto um funcionário termina de arrumar as caixas.","Na sequência, o ritmo fica mais intenso do que nos primeiros instantes filmados.","Minha leitura é que essa progressão oferece uma boa estrutura de história, desde que a montagem preserve a cronologia real."],"swaps":[{"vague":"depois","options":["posteriormente","na sequência","mais adiante"],"weak":"Depois, o mercado encheu.","strong":"Na sequência, por volta das 7h, os primeiros clientes chegaram.","flag":false},{"vague":"de repente","options":["repentinamente","no intervalo","enquanto isso"],"weak":"De repente, todo mundo saiu.","strong":"Repentinamente, quando a chuva começou, as bancas cobriram as mercadorias.","flag":false},{"vague":"aos poucos","options":["gradualmente","ao amanhecer","ao final"],"weak":"Aos poucos a rua mudou.","strong":"Gradualmente, ao amanhecer, as portas de aço foram se abrindo uma a uma.","flag":false}]},{"scene":"Um vendedor de frutas atrás da banca, no fim da manhã","focus":"Descreva traços visíveis com neutralidade. Aparência não revela idade exata, origem, renda, profissão nem estado de saúde — e quem aparece em destaque precisa consentir.","terms":[["estatura","Altura de uma pessoa percebida em relação ao ambiente ou a outras pessoas.","De estatura mediana, ele alcança o toldo da banca sem precisar se esticar.","Prefira comparações com o ambiente a números; não use estatura como qualidade ou defeito."],["compleição","Conjunto da constituição física: largura dos ombros, estrutura e proporções do corpo.","De compleição esguia, ela se move com facilidade entre as caixas empilhadas.","Descreva sem julgar o corpo; evite termos depreciativos e associações com saúde ou caráter."],["grisalho","Cabelo ou barba com fios brancos ou cinzentos misturados aos de cor original.","O cabelo grisalho aparece sob o boné azul quando ele se abaixa.","Fios brancos não indicam idade exata; não deduza quantos anos a pessoa tem."],["cacheado","Cabelo com ondas fechadas que formam cachos definidos.","Os cabelos cacheados estão presos no alto da cabeça com uma presilha.","Descreva o cabelo sem associá-lo a origem étnica ou a julgamentos de arrumação."],["rabo de cavalo","Penteado em que o cabelo é preso na parte de trás da cabeça e cai em mecha única.","Um rabo de cavalo baixo balança a cada vez que ela vira para atender alguém.","Penteado é escolha momentânea; não o use para supor personalidade ou ocupação."],["barbado","Que tem barba crescida, cheia ou aparada.","O homem barbado confere o troco contando as moedas na palma da mão.","Barba não indica religião, nacionalidade nem descuido; descreva apenas o que se vê."],["rugas de expressão","Linhas na pele formadas pela repetição de movimentos do rosto, como sorrir ou franzir.","Quando ele ri, rugas de expressão se acentuam ao redor dos olhos.","Rugas não definem idade com precisão; evite transformar a observação em comentário sobre envelhecimento."],["tatuagem","Desenho permanente feito na pele com tinta.","Uma tatuagem de folhas contorna o pulso esquerdo da vendedora.","Não interprete o significado de uma tatuagem sem perguntar; evite closes sem consentimento."],["uniformizado","Que veste roupa padronizada de uma empresa, serviço ou instituição.","Um funcionário uniformizado, de colete laranja, recolhe as caixas vazias.","Uniforme indica vínculo provável, não confirma cargo; verifique antes de afirmar a função."],["acessório","Objeto usado junto ao corpo ou à roupa, como óculos, relógio, colar ou boné.","O único acessório visível é um relógio de pulseira de couro gasta.","Acessórios não comprovam renda ou estilo de vida; descreva-os sem inferir status social."],["cabelo raspado","Cabelo cortado muito rente à cabeça.","O jovem de cabelo raspado ajusta os fones antes de atravessar.","Corte de cabelo é escolha momentânea; não deduza estilo de vida ou religião."],["franja","Mecha de cabelo cortada que cai sobre a testa.","Uma franja reta cobre as sobrancelhas da estudante.","Descreva sem julgar a aparência."],["óculos de grau","Óculos com lentes corretivas, usados para enxergar.","De óculos de grau, ela aproxima o celular do rosto para ler o mapa.","Óculos não indicam idade nem intelectualidade; evite estereótipos."],["maquiagem","Produtos aplicados ao rosto para destacar, corrigir ou colorir traços.","Com maquiagem leve, a apresentadora revisa o texto antes de gravar.","Comente maquiagem só quando for relevante para a história."],["crachá","Cartão de identificação usado no peito ou no pescoço.","Um crachá azul pendurado no pescoço identifica os funcionários da feira.","O crachá indica vínculo com o evento; confirme a função antes de afirmá-la."]],"model":["Atrás da banca, um homem de estatura mediana organiza laranjas em pirâmide sobre um caixote.","Ele está uniformizado com um avental verde, e o cabelo grisalho aparece sob um boné azul desbotado.","Enquanto o colega ao lado usa rabo de cavalo e fala com os clientes, ele trabalha em silêncio, concentrado nas frutas.","Minha impressão é que a banca funciona em dupla: um cuida da exposição, o outro do atendimento — algo que só uma conversa confirmaria."],"swaps":[{"vague":"bonita","options":["compleição","cacheado","acessório"],"weak":"A vendedora é bonita.","strong":"De compleição esguia, a vendedora tem cabelos cacheados presos e usa um único acessório: brincos de argola.","flag":true},{"vague":"velhinho","options":["grisalho","rugas de expressão","estatura"],"weak":"Um velhinho vende frutas.","strong":"Um homem grisalho, de estatura baixa, vende frutas; rugas de expressão marcam o rosto quando sorri.","flag":true},{"vague":"arrumado","options":["uniformizado","acessório","rabo de cavalo"],"weak":"Ele estava bem arrumado.","strong":"Ele estava uniformizado, com camisa passada, e usava como acessório um relógio de metal.","flag":true}]},{"scene":"Duas pessoas conversando num banco de praça","focus":"Descreva o movimento do rosto e das mãos, não a emoção. Gestos variam entre culturas e situações: o que parece irritação pode ser concentração.","terms":[["semblante","Aspecto geral do rosto em determinado momento.","O semblante dela permanece sereno enquanto o amigo fala rápido.","Semblante é aparência, não sentimento confirmado; evite afirmar o estado interior."],["cenho franzido","Testa contraída, com as sobrancelhas aproximadas.","Com o cenho franzido, ele lê a mensagem no celular duas vezes.","Franzir pode indicar dúvida, sol forte ou esforço de leitura — não necessariamente raiva."],["sorriso contido","Sorriso discreto, com os lábios pouco abertos.","Um sorriso contido aparece quando ela ouve a resposta.","Não deduza timidez ou ironia apenas pelo tamanho do sorriso."],["olhar fixo","Olhar mantido por um tempo no mesmo ponto.","Ele mantém o olhar fixo na fonte enquanto escuta.","Olhar fixo pode ser atenção, distração ou reflexão; descreva a direção, não a intenção."],["gesticulação","Uso frequente das mãos e dos braços para acompanhar a fala.","A gesticulação ampla dele desenha no ar o caminho até a estação.","Intensidade de gestos varia culturalmente; não a interprete como nervosismo ou exagero."],["aceno","Movimento curto de mão ou cabeça para cumprimentar, concordar ou chamar.","Um aceno de cabeça encerra a conversa antes de ela se levantar.","O sentido do aceno depende do contexto; confirme se é concordância ou apenas despedida."],["dar de ombros","Levantar e baixar os ombros, gesto que costuma indicar dúvida ou indiferença.","Diante da pergunta, ele dá de ombros e aponta para o mapa.","O gesto não tem o mesmo sentido em todas as culturas; trate a interpretação como hipótese."],["braços cruzados","Postura com os braços dobrados à frente do peito.","Ela escuta de braços cruzados, com o casaco fechado até o pescoço.","Braços cruzados podem ser frio ou conforto; não afirme que a pessoa está fechada ou na defensiva."],["sobrancelhas arqueadas","Sobrancelhas erguidas, formando um arco acima dos olhos.","Com as sobrancelhas arqueadas, ela repete o preço em voz alta.","Pode indicar surpresa, pergunta ou ênfase; o contexto da fala ajuda a distinguir."],["expressivo","Que demonstra muito movimento no rosto e no corpo ao se comunicar.","O rosto expressivo do senhor acompanha cada parte da história que conta.","Ser expressivo é estilo de comunicação, não sinal de exagero ou falta de seriedade."],["olhar de soslaio","Olhar de lado, sem virar a cabeça.","O vendedor observa de soslaio a câmera enquanto atende.","Pode indicar curiosidade, desconfiança ou timidez; não afirme qual."],["mão no queixo","Gesto de apoiar o queixo na mão, comum em momentos de reflexão.","Com a mão no queixo, ele analisa o tabuleiro de xadrez chinês.","Associar o gesto a reflexão é convenção; trate como impressão."],["gargalhada","Riso alto e prolongado.","Uma gargalhada interrompe a conversa na mesa ao lado.","Descreva o que provocou o riso, se souber."],["boquiaberto","Com a boca aberta, como em surpresa ou espanto.","Boquiaberto, o menino observa o dragão de papel na procissão.","A expressão sugere surpresa, mas pode ser só atenção."],["apontar","Indicar algo com o dedo ou com a mão estendida.","A turista aponta para o mapa e depois para a rua à esquerda.","Em algumas culturas, apontar com o dedo para pessoas é considerado rude."]],"model":["No banco da praça, duas pessoas conversam lado a lado, voltadas para a fonte.","Ele fala com gesticulação ampla, enquanto ela escuta de braços cruzados, com semblante sereno.","Diferentemente do amigo, que muda de expressão a cada frase, ela responde apenas com acenos curtos e um sorriso contido.","Para mim, o contraste sugere ritmos diferentes de conversa, não desacordo — mas eu não sei o que cada um sentia."],"swaps":[{"vague":"bravo","options":["cenho franzido","braços cruzados","olhar fixo"],"weak":"Ele parecia bravo.","strong":"Ele manteve o cenho franzido e o olhar fixo no celular, de braços cruzados — o motivo eu não sei.","flag":false},{"vague":"feliz","options":["sorriso contido","expressivo","semblante"],"weak":"Ela estava feliz.","strong":"Ela sorria abertamente, com o rosto expressivo, e o semblante ficou mais leve ao fim da conversa.","flag":false},{"vague":"animado","options":["gesticulação","expressivo","sobrancelhas arqueadas"],"weak":"Ele falava todo animado.","strong":"Ele falava com gesticulação ampla, sobrancelhas arqueadas e rosto expressivo a cada frase.","flag":false}]},{"scene":"Um entregador esperando o semáforo abrir, ao lado de pedestres","focus":"Postura e passo revelam relação com o espaço e com o tempo. Não conclua cansaço, pressa ou tristeza sem outros indícios.","terms":[["ereto","Com o tronco e a cabeça alinhados na vertical.","Ereto sobre a scooter, ele observa o semáforo com as mãos no guidão.","Postura ereta não prova confiança nem disciplina; descreva a forma do corpo."],["curvado","Com o tronco inclinado para a frente ou as costas arqueadas.","Curvada sobre o carrinho, a senhora empurra sacolas pela calçada.","Curvatura pode resultar de carga, frio ou hábito; evite associá-la a desânimo."],["apoiado","Com o peso do corpo sustentado em algo, como parede, grade ou objeto.","Apoiado na grade, um rapaz espera com o capacete no braço.","Apoiar-se não indica preguiça; descreva o ponto de apoio."],["agachado","Com os joelhos dobrados e o corpo próximo do chão.","Agachado, o entregador ajusta a corrente da bicicleta.","Diga o que a pessoa faz agachada; a posição sozinha não explica a ação."],["inclinado","Com o corpo pendendo levemente para um lado ou para a frente.","Inclinado para a frente, ele tenta ler o número do prédio do outro lado.","Inclinação pode ser movimento passageiro; registre o momento observado."],["passo apressado","Caminhada rápida, com passadas curtas e frequentes.","Com passo apressado, um grupo atravessa antes de o sinal fechar.","Passo rápido pode ser hábito local; não deduza atraso ou ansiedade."],["passo arrastado","Caminhada lenta, com os pés pouco levantados do chão.","Um homem segue de passo arrastado, de chinelos, rumo ao mercado.","Evite interpretar o passo como sinal de doença ou desânimo."],["imóvel","Sem se mover durante o intervalo observado.","Imóvel na esquina, uma mulher segura o guarda-chuva fechado.","Imobilidade é relativa ao tempo de observação; diga por quanto tempo observou."],["desenvolto","Que se movimenta com facilidade e naturalidade no espaço.","Desenvolto, o entregador desvia dos pedestres sem reduzir muito a velocidade.","Desenvoltura não comprova experiência profissional; é impressão de movimento."],["hesitante","Que interrompe ou retoma o movimento, como quem decide o caminho.","Hesitante, o turista dá dois passos, para e consulta o mapa outra vez.","Hesitação aparente pode ser cautela ou atenção ao trânsito; trate como hipótese."],["encostado","Com o corpo apoiado lateralmente ou de costas em algo.","Encostado no muro, o segurança observa a entrada.","Encostar é postura momentânea; não indica descaso."],["de pernas cruzadas","Sentado com uma perna sobre a outra.","De pernas cruzadas no banco, ela lê um livro de bolso.","Descreva como parte da cena, sem interpretar personalidade."],["em fila","Disposto em sequência, um atrás do outro.","Os passageiros aguardam em fila nas marcações do piso da plataforma.","Diga quantas pessoas, se souber, e por que a fila existe."],["debruçado","Inclinado para a frente, com o tronco apoiado sobre algo.","Debruçado no balcão, o cliente escolhe os bolinhos pela vitrine.","Diferencie de curvado: debruçado tem apoio."],["em marcha","Caminhando de forma ritmada e organizada, como em desfile.","Um grupo de estudantes passa em marcha, de uniforme, rumo à escola.","Use para movimentos coordenados; caminhada comum não é marcha."]],"model":["Na esquina, um entregador espera o semáforo sentado na scooter, com o capacete preso no guidão.","Ereto e imóvel, ele observa o sinal; ao lado, uma senhora curvada apoia as mãos num carrinho de compras.","Quando o sinal abre, ele parte desenvolto entre os carros, enquanto os pedestres atravessam com passo apressado.","Minha impressão é que a esquina tem dois tempos — o das rodas e o dos pés — convivendo no mesmo minuto."],"swaps":[{"vague":"cansado","options":["curvado","passo arrastado","apoiado"],"weak":"Ele parecia cansado.","strong":"Ele seguia curvado, de passo arrastado, e parou apoiado no poste por um minuto.","flag":false},{"vague":"perdido","options":["hesitante","inclinado","imóvel"],"weak":"O turista estava perdido.","strong":"Hesitante, o turista parou imóvel na esquina e se inclinou para ler a placa.","flag":false},{"vague":"rápido","options":["passo apressado","desenvolto","ereto"],"weak":"Ela andava rápido.","strong":"Ela andava de passo apressado, ereta, desviando desenvolta dos carrinhos de compras.","flag":false}]},{"scene":"Uma banca de antiguidades montada numa calçada","focus":"Marcas de uso contam histórias, mas não provam idade, valor nem autenticidade. Descreva o desgaste antes de imaginar a origem.","terms":[["desgastado","Com a superfície gasta pelo uso ou pelo tempo.","O cabo desgastado da chaleira perdeu a cor onde as mãos o seguravam.","Desgaste não indica idade exata nem antiguidade autêntica."],["intacto","Sem quebras, rachaduras ou partes faltando.","A tampa de porcelana está intacta, apesar da poeira acumulada.","Intacto descreve a integridade visível, não o funcionamento."],["lascado","Com pequenos pedaços perdidos na borda ou na superfície.","A borda lascada da tigela revela o barro claro sob o esmalte azul.","Diferencie lasca de rachadura: a lasca perde material; a rachadura abre uma fenda."],["enferrujado","Coberto por ferrugem, a oxidação avermelhada do ferro.","O cadeado enferrujado ainda prende a corrente da bicicleta.","Ferrugem indica exposição à umidade, não necessariamente abandono."],["remendado","Consertado com material ou técnica visível, diferente do original.","O guarda-chuva remendado tem uma faixa de tecido mais escura entre as varetas.","O conserto mostra cuidado ou necessidade; não deduza a situação econômica do dono."],["artesanal","Feito à mão ou em pequena escala, com variações entre peças.","As xícaras artesanais têm alças de tamanhos ligeiramente diferentes.","Não afirme que algo é artesanal só pela aparência rústica; confirme com quem vende."],["industrializado","Produzido em série por processo de fábrica, com peças idênticas.","As garrafas industrializadas se repetem na prateleira com o mesmo rótulo.","Produção em série não significa baixa qualidade."],["utilitário","Feito principalmente para cumprir uma função prática.","Um banquinho utilitário de plástico serve de apoio para as caixas.","Objetos utilitários também podem ter valor estético ou afetivo."],["ornamental","Feito principalmente para enfeitar ou decorar.","Um vaso ornamental, sem flores, ocupa o centro da mesa.","Função decorativa pode coexistir com uso prático; observe como o objeto é usado."],["portátil","Leve e pequeno o bastante para ser carregado com facilidade.","Um rádio portátil toca baixo ao lado do caixa.","Portátil descreve o tamanho e o peso, não a tecnologia do objeto."],["novo em folha","Completamente novo, sem sinais de uso.","A bicicleta nova em folha ainda tem o plástico no selim.","Concorda em gênero e número (“bicicleta nova em folha”). Expressão informal; no texto, “sem uso” é mais neutro."],["reaproveitado","Usado de novo, muitas vezes com outra função.","Latas de biscoito reaproveitadas servem de vaso para as plantas.","Diga qual era a função original e qual é a atual."],["descartável","Feito para ser usado uma vez e jogado fora.","Copos descartáveis se acumulam na lixeira ao lado da banca de chá.","Não transforme a descrição em julgamento ambiental sem contexto."],["quebradiço","Que se quebra com facilidade.","O papel quebradiço do mapa antigo exige cuidado ao desdobrar.","Quebradiço descreve fragilidade; não confirme idade do objeto."],["conservado","Mantido em bom estado apesar do tempo de uso.","O rádio antigo está conservado e ainda funciona, segundo o dono.","Bom estado pode ser restauração; pergunte antes de afirmar que é original."]],"model":["Sobre um pano estendido na calçada, há chaleiras, xícaras, cadeados e um rádio portátil.","Uma chaleira de metal tem o cabo desgastado, e ao lado uma tigela de esmalte azul aparece com a borda lascada.","Enquanto as xícaras artesanais variam de tamanho, as garrafas industrializadas se repetem com o mesmo rótulo.","Para mim, a banca é um arquivo de usos cotidianos — mas idade e procedência de cada peça só o vendedor poderia informar."],"swaps":[{"vague":"antigo","options":["desgastado","enferrujado","remendado"],"weak":"É um objeto antigo.","strong":"O objeto está desgastado, com partes enferrujadas e uma alça remendada com arame.","flag":false},{"vague":"estragado","options":["lascado","enferrujado","desgastado"],"weak":"A tigela está estragada.","strong":"A tigela está lascada na borda e o esmalte, desgastado no fundo.","flag":true},{"vague":"feito à mão","options":["artesanal","ornamental","utilitário"],"weak":"As peças são feitas à mão.","strong":"As peças parecem artesanais, segundo o vendedor; algumas são ornamentais e outras, utilitárias.","flag":false}]},{"scene":"Uma chaleira, uma lanterna de papel e uma bicicleta estacionada","focus":"Nomear as partes de um objeto substitui “aquela coisa” por precisão. Use o nome técnico só quando ele ajuda o público a visualizar.","terms":[["alça","Parte curva, geralmente lateral ou superior, feita para segurar ou carregar.","A alça de bambu da chaleira forma um arco sobre a tampa.","Diferencie alça (segurar com a mão em arco) de cabo (empunhar como haste)."],["cabo","Parte alongada por onde se segura um utensílio ou ferramenta.","O cabo de madeira da frigideira escureceu perto do encaixe.","Não chame de cabo uma alça em arco; observe como a mão segura."],["tampa","Peça que fecha a abertura de um recipiente.","A tampa de metal tem um pequeno furo por onde sai o vapor.","Diga se a tampa encaixa, rosqueia ou apenas repousa sobre a abertura."],["base","Parte inferior que sustenta o objeto.","A base larga da lanterna impede que ela tombe com o vento.","Base é a parte de apoio; não a confunda com o fundo interno de um recipiente."],["haste","Peça fina e longa que sustenta ou liga outras partes.","Uma haste de bambu prende a lanterna de papel ao beiral.","Use haste para peças finas; partes largas pedem outro termo, como coluna ou suporte."],["bojo","Parte arredondada e mais larga de um recipiente ou objeto.","O bojo da chaleira reflete as luzes da rua.","Bojo é a parte abaulada; não serve para objetos totalmente retos."],["encaixe","Ponto em que duas peças se unem por ajuste de formas.","No encaixe entre o cabo e a lâmina, a madeira está mais clara.","Descreva o tipo de união (encaixe, parafuso, solda, cola) só se for visível."],["dobradiça","Peça articulada que permite abrir e fechar portas, tampas ou abas.","A dobradiça da caixa range quando a vendedora a abre.","Não confunda dobradiça com encaixe fixo: a dobradiça permite giro."],["empilhável","Projetado para ser colocado um sobre o outro sem cair.","Cadeiras empilháveis formam uma torre colorida no canto do restaurante.","Empilhar objetos não os torna empilháveis por projeto; observe se há encaixe próprio."],["cilíndrico","Com forma de cilindro: corpo reto e seção circular.","A lanterna cilíndrica de papel vermelho tem franjas douradas na base.","Cilíndrico exige lados paralelos; formas que se estreitam são cônicas."],["gargalo","Parte estreita e alongada perto da abertura de uma garrafa.","O gargalo fino da garrafa de molho dificulta a limpeza.","Em sentido figurado, gargalo é ponto de estrangulamento; o contexto decide."],["aro","Peça circular que contorna ou reforça algo.","O aro de metal mantém a forma do cesto de bambu.","Aro é o contorno; não confunda com a peça inteira."],["rosca","Saliência em espiral que permite atarraxar uma peça na outra.","A tampa de rosca do pote de chá fecha sem deixar entrar umidade.","Diferencie tampa de rosca de tampa de pressão ou de encaixe."],["borda","Contorno ou extremidade de um objeto.","A borda dourada do prato está gasta em um dos lados.","Borda é a extremidade; o bojo é a parte abaulada."],["pegador","Parte ou utensílio feito para segurar ou pinçar algo.","Com um pegador de bambu, a vendedora tira os bolinhos do vapor.","Diga se o pegador é peça do objeto ou utensílio separado."]],"model":["Na calçada, há uma chaleira de metal, uma lanterna vermelha pendurada e uma bicicleta estacionada.","A chaleira tem bojo arredondado, tampa com furo de vapor e uma alça de bambu em arco.","Diferente da chaleira, a lanterna é cilíndrica e leve, presa ao beiral por uma haste fina de bambu.","Minha impressão é que os três objetos resolvem o mesmo problema de formas distintas: como ser segurado, pendurado ou apoiado."],"swaps":[{"vague":"negócio","options":["alça","haste","encaixe"],"weak":"Tem um negócio em cima da chaleira.","strong":"Há uma alça de bambu em arco sobre a chaleira, presa por dois encaixes de metal.","flag":false},{"vague":"redondo","options":["cilíndrico","bojo","base"],"weak":"A lanterna é redonda.","strong":"A lanterna é cilíndrica, com bojo levemente abaulado no meio e base franjada.","flag":false},{"vague":"pecinha","options":["dobradiça","tampa","encaixe"],"weak":"A caixa abre por uma pecinha.","strong":"A caixa abre por uma dobradiça de latão, e a tampa se fecha por encaixe.","flag":true}]},{"scene":"Um gato deitado na janela de uma casa antiga","focus":"Descreva pelagem, cores e partes do corpo com precisão. Raça, idade e saúde de um animal raramente podem ser afirmadas só pela aparência.","terms":[["pelagem","Conjunto dos pelos que cobrem o corpo de um animal.","A pelagem curta e cinzenta do gato brilha onde o sol bate.","Não deduza raça pela pelagem; muitas cores aparecem em animais sem raça definida."],["plumagem","Conjunto das penas de uma ave.","A plumagem do pombo muda de verde para roxo no pescoço conforme a luz.","Cores de plumagem variam com a luz e a estação; descreva o que viu naquele momento."],["malhado","Com manchas de cores diferentes distribuídas pelo corpo.","Um cachorro malhado de preto e branco dorme sob o banco.","Diga as cores e onde ficam as manchas, em vez de apenas “malhado”."],["rajado","Com listras ou faixas de cor no pelo.","O gato rajado tem listras escuras que descem da espinha para a barriga.","Rajado (listras) é diferente de malhado (manchas)."],["focinho","Parte da frente da cabeça de um animal, onde ficam o nariz e a boca.","O focinho úmido do cachorro encosta na grade do portão.","Focinho úmido ou seco não serve como diagnóstico de saúde."],["cauda","Prolongamento posterior do corpo de muitos animais; o mesmo que rabo.","A cauda do gato pende da janela e se move devagar.","Movimentos da cauda variam entre espécies; não os traduza diretamente em emoção."],["porte","Tamanho e estrutura geral de um animal.","Um cão de pequeno porte acompanha o passo da dona.","Use porte para tamanho; ele não indica idade nem raça."],["bico","Estrutura dura e alongada da boca das aves.","Com o bico curto, o pardal recolhe migalhas entre as pedras.","Formato do bico ajuda a distinguir aves, mas identificação de espécie exige fonte."],["patas","Membros de apoio e locomoção dos animais.","As patas brancas do gato contrastam com o pelo escuro do corpo.","Diferencie patas dianteiras e traseiras quando a posição importar para a cena."],["escamoso","Coberto por escamas, placas pequenas e sobrepostas.","O peixe escamoso reflete a luz no balde de água do mercado.","Escamas indicam grupo de animal, não frescor ou qualidade do alimento."],["bigodes","Pelos longos e rígidos no focinho, que ajudam alguns animais a perceber o ambiente.","Os bigodes do gato se movem quando ele fareja o ar.","Em gatos, bigodes são órgãos sensoriais, não enfeite."],["orelhas eretas","Orelhas em pé, voltadas para cima.","O cachorro de orelhas eretas vira a cabeça na direção do apito.","Orelhas eretas podem ser traço da raça ou sinal de atenção; diferencie."],["crista","Saliência de carne ou penas no alto da cabeça de algumas aves.","O galo de crista vermelha anda entre as gaiolas do mercado.","Nem toda ave tem crista; confira antes de usar."],["garras","Unhas curvas e afiadas de aves e outros animais.","As garras do pombo agarram firme o fio elétrico.","Descreva sem dramatizar; garras são parte comum da anatomia."],["pelo eriçado","Pelos levantados, afastados do corpo.","Com o pelo eriçado, o gato encara o cachorro do outro lado da grade.","Pelo eriçado pode indicar medo, frio ou alerta; não afirme qual."]],"model":["Na janela de uma casa antiga, um gato está deitado sobre o parapeito de madeira.","Ele é rajado, com pelagem cinzenta e listras escuras, e as patas dianteiras brancas pendem para fora.","Ao contrário dos pombos na calçada, cuja plumagem muda de cor com a luz, o gato quase não se move.","Para mim, o gato parece parte da fachada — uma impressão minha, já que não sei se ele vive ali."],"swaps":[{"vague":"fofo","options":["pelagem","porte","patas"],"weak":"Era um cachorro fofo.","strong":"Era um cachorro de pequeno porte, de pelagem longa e clara, com patas curtas.","flag":true},{"vague":"pintado","options":["malhado","rajado","plumagem"],"weak":"O gato é pintado.","strong":"O gato é rajado, com listras escuras sobre o fundo cinza; o vizinho é malhado de branco.","flag":true},{"vague":"bicho","options":["porte","pelagem","cauda"],"weak":"Tinha um bicho na janela.","strong":"Havia um gato de porte médio na janela, de pelagem escura e cauda longa.","flag":true}]},{"scene":"Pombos e um cachorro numa praça ao amanhecer","focus":"Descreva ações observáveis. Evite atribuir pensamentos e sentimentos humanos aos animais — o antropomorfismo pode ser charmoso, mas não é informação.","terms":[["ciscar","Revolver o chão com as patas ou o bico em busca de alimento.","Os pombos ciscam entre as pedras perto da lixeira.","Ciscar é ação de aves; não o use para outros animais."],["empoleirado","Pousado em ponto elevado, como galho, fio ou beiral.","Um pardal empoleirado no fio observa o movimento da calçada.","Diga onde a ave está pousada e por quanto tempo."],["à espreita","Observando com atenção e imóvel, como antes de uma ação.","O gato permanece à espreita atrás do vaso, com os olhos nos pombos.","A postura sugere atenção; não afirme o que o animal pretende fazer."],["arisco","Que se afasta rapidamente quando alguém se aproxima.","Arisco, o gato some sob o carro quando a criança chega perto.","Evite associar o comportamento a maus-tratos sem evidência."],["dócil","Que aceita a aproximação ou o toque sem se afastar.","Dócil, o cachorro deixa a criança acariciar sua cabeça.","Comportamento dócil num momento não garante segurança; não incentive aproximar-se de animais desconhecidos."],["enrodilhado","Deitado com o corpo curvado em círculo.","Enrodilhado sobre o capô ainda morno, o gato dorme.","Descreva a posição; frio ou conforto são hipóteses."],["saltitante","Que se desloca com pequenos saltos.","Saltitante, o pardal avança entre as mesas do café.","Use para o modo de deslocamento, não para o humor do animal."],["em bando","Em grupo, movendo-se ou permanecendo juntos.","Em bando, os pombos levantam voo quando o ônibus passa.","Bando é termo usual para aves; para outros animais, prefira grupo, matilha ou cardume."],["farejar","Cheirar repetidamente para examinar algo.","O cachorro fareja cada poste antes de seguir o passeio.","Farejar é ação observável; o que o animal identificou é suposição."],["alerta","Com a cabeça erguida e atenção voltada para um estímulo.","Com as orelhas erguidas, o cão fica alerta ao som da bicicleta.","Diga o estímulo que provocou a reação, se ele for visível ou audível."],["bicar","Tocar ou pegar algo com o bico.","Os pardais bicam as migalhas de pão deixadas no banco.","Ação de aves; para outros animais use verbos próprios."],["rosnar","Emitir som grave e contínuo mostrando os dentes, como fazem os cães.","O cachorro rosna baixo quando o ciclista se aproxima.","Rosnar é sinal de alerta; registre sem dramatizar e sem incentivar aproximação."],["ronronar","Emitir som contínuo e vibrante, típico dos gatos.","Enrodilhado no colo da dona, o gato ronrona.","Ronronar costuma indicar conforto, mas nem sempre; trate como hipótese."],["espreguiçar-se","Esticar o corpo e os membros, geralmente ao acordar.","O gato se espreguiça no parapeito antes de pular para a calçada.","Use a forma pronominal: “o gato se espreguiça”."],["territorial","Que defende um espaço contra outros animais.","O cão parece territorial: late para quem chega perto do portão.","Comportamento observado num momento; não generalize para a raça."]],"model":["Na praça, ao amanhecer, um bando de pombos cisca perto da lixeira e um cachorro fareja os canteiros.","Um pardal empoleirado no fio observa o movimento, enquanto um gato permanece à espreita atrás de um vaso.","Quando um ônibus passa, os pombos levantam voo em bando; o cachorro, alerta, apenas ergue as orelhas.","Minha impressão é que cada animal ocupa a praça num ritmo próprio — impressão de observador, não leitura do que eles sentem."],"swaps":[{"vague":"medroso","options":["arisco","alerta","à espreita"],"weak":"O gato é medroso.","strong":"O gato é arisco: afastou-se para baixo do carro e ficou alerta até a criança ir embora.","flag":false},{"vague":"bonzinho","options":["dócil","farejar","alerta"],"weak":"O cachorro é bonzinho.","strong":"O cachorro foi dócil: deixou a criança se aproximar depois de farejar sua mão.","flag":true},{"vague":"brincando","options":["saltitante","ciscar","em bando"],"weak":"Os passarinhos estavam brincando.","strong":"Os pardais estavam saltitantes entre as mesas, ciscando migalhas em bando.","flag":false}]},{"scene":"A vista do alto de um mirante sobre o rio","focus":"Uma vista ampla precisa de ordem: do primeiro plano ao horizonte. Distâncias estimadas a olho devem ser apresentadas como estimativas.","terms":[["horizonte","Linha onde o céu parece encontrar a terra ou a água.","No horizonte, as torres se dissolvem na névoa da tarde.","A visibilidade do horizonte depende do clima; registre as condições."],["skyline","Contorno dos edifícios de uma cidade recortado contra o céu.","O skyline de Lujiazui forma uma linha irregular de torres do outro lado do rio.","Termo em inglês consagrado; em português, “perfil urbano” ou “silhueta da cidade” também servem."],["mirante","Lugar elevado de onde se observa uma vista ampla.","Do mirante, o rio aparece como uma faixa cinza entre as duas margens.","Diga como se chega ao mirante e se ele é público, caso o público possa querer ir."],["panorama","Vista ampla de uma paisagem ou cidade em várias direções.","O panorama abrange a curva do rio, as pontes e os bairros baixos ao sul.","Um panorama não é visto por inteiro de uma vez; diga a direção do olhar."],["vista aérea","Visão de cima para baixo, como a partir de um ponto muito alto ou de um drone.","Na vista aérea, os pátios dos lilongs formam retângulos regulares.","Imagens de drone exigem verificação de regras locais e indicação de origem."],["ponto de fuga","Ponto em que linhas paralelas parecem se encontrar na distância.","Os trilhos convergem para um ponto de fuga sob a ponte.","É efeito de perspectiva, não característica real do espaço."],["à distância","Afastado do observador; longe.","À distância, um navio cargueiro avança devagar rio acima.","Estimativas de distância a olho são imprecisas; indique como chegou ao número."],["emoldurado","Visto através de algo que o envolve como moldura, como janela, arco ou galhos.","O pagode aparece emoldurado pelos galhos dos salgueiros.","A moldura é escolha de enquadramento; diga quando você escolheu o ângulo."],["desobstruído","Sem barreiras que impeçam a visão.","Do último andar, a vista do rio é desobstruída em toda a extensão.","Vista desobstruída num ponto não vale para o local inteiro."],["recortado","Com contorno nítido destacado contra um fundo.","As antenas das torres aparecem recortadas contra o céu laranja.","O efeito depende da luz; à noite ou com névoa, o contorno muda."],["plano geral","Enquadramento aberto que mostra o ambiente inteiro e situa o público.","Um plano geral do rio abre o vídeo antes de mostrar os personagens.","Use no início de sequências para orientar o público no espaço."],["vista em mergulho","Vista de cima para baixo, a partir de um ponto elevado.","Do 40º andar, a vista em mergulho mostra os telhados dos lilongs.","Diga de onde a vista foi feita e se o acesso é público."],["camadas de profundidade","Planos sucessivos que dão sensação de distância numa vista.","Pontes, barcos e torres formam camadas de profundidade sobre o rio.","Nomeie cada camada, do primeiro plano ao fundo."],["linha d'água","Linha em que a água encontra a margem, um casco ou uma construção.","A linha d'água marca o limite entre o rio e a escadaria de pedra.","Em barcos, é a linha até onde o casco fica submerso."],["contorno","Linha que delimita a forma de algo contra o fundo.","O contorno das montanhas aparece nítido depois da chuva.","Diga contra o que o contorno se destaca: céu, água ou névoa."]],"model":["Do mirante, vejo o rio em curva, duas pontes e, à distância, um conjunto de torres.","Em primeiro plano estão os telhados baixos; ao fundo, o skyline aparece recortado contra o céu da tarde.","Enquanto a margem próxima é horizontal e densa, a margem oposta sobe em torres que dominam o horizonte.","Minha impressão é que o rio separa duas escalas de cidade — leitura pessoal de quem a observa de um único ponto."],"swaps":[{"vague":"vista linda","options":["panorama","desobstruído","horizonte"],"weak":"Que vista linda!","strong":"Do mirante, o panorama é desobstruído até o horizonte, onde o rio faz uma curva.","flag":true},{"vague":"lá longe","options":["à distância","horizonte","ponto de fuga"],"weak":"Lá longe tem uns prédios.","strong":"À distância, perto do horizonte, há um conjunto de torres.","flag":true},{"vague":"dá pra ver tudo","options":["panorama","vista aérea","mirante"],"weak":"Lá de cima dá pra ver tudo.","strong":"Do mirante, o panorama abrange o rio, as pontes e os bairros ao sul, quase como uma vista aérea.","flag":true}]},{"scene":"Um parque com lago, ponte de pedra e colinas ao longe","focus":"Nomeie relevo, água e vegetação com precisão geográfica simples. Em parques urbanos, diferencie o que é natural do que foi construído ou plantado.","terms":[["relevo","Conjunto das formas do terreno: elevações, depressões e planos.","O relevo do parque é suave, com pequenas elevações ao redor do lago.","Parques urbanos podem ter relevo artificial; pesquise antes de chamá-lo de natural."],["colina","Elevação de terreno arredondada e de pouca altura.","Uma colina coberta de bambus fecha a vista ao norte.","Colina é menor e mais suave que um morro ou montanha."],["planície","Extensão de terreno plano ou quase plano.","Além do parque, a planície se estende até as primeiras torres.","Diga o que ocupa a planície: campo, cidade, cultivo."],["margem","Faixa de terra ao longo de um rio, lago ou canal.","Na margem do lago, salgueiros inclinam os galhos sobre a água.","Margem é a terra junto à água; a própria água junto à terra é a beira ou a orla."],["vegetação rasteira","Plantas baixas que cobrem o solo, como grama e arbustos pequenos.","Vegetação rasteira cobre as encostas entre as pedras.","Diferencie vegetação rasteira de canteiros plantados com espécies ornamentais."],["copa","Parte superior de uma árvore, formada por galhos e folhas.","As copas largas dos plátanos se encontram sobre a alameda.","Identificar a espécie da árvore exige fonte ou placa; descreva a forma se não souber."],["bosque","Área de árvores próximas, menor que uma floresta.","Um pequeno bosque de pinheiros abafa o barulho da avenida.","Em parques, o bosque costuma ser plantado; diga se não for possível saber."],["espelho d'água","Superfície de água parada que reflete o entorno.","O espelho d'água reflete o pavilhão vermelho quase sem distorção.","O reflexo depende de vento e luz; no dia seguinte a superfície pode estar agitada."],["curso d'água","Água que corre por um leito, como rio, riacho ou canal.","Um curso d'água estreito liga o lago a um canal mais antigo.","Diferencie rio, riacho e canal; canais são geralmente construídos."],["ribeirinho","Situado à beira de um rio ou que vive junto a ele.","Casas ribeirinhas de dois andares acompanham a curva do canal.","Ao falar de comunidades ribeirinhas, evite romantizar ou generalizar modos de vida."],["encosta","Terreno inclinado na lateral de um morro ou colina.","Plantações de chá cobrem a encosta em degraus.","Diferencie encosta (inclinação) de topo e de vale."],["vale","Terreno mais baixo entre elevações, muitas vezes atravessado por um rio.","O vilarejo ocupa o fundo do vale, junto ao rio.","Vale pressupõe elevações dos dois lados."],["orla","Faixa de terra junto ao mar, rio ou lago, em geral urbanizada.","A orla do rio virou calçadão com ciclovia.","Orla costuma indicar área urbanizada; margem é termo mais geral."],["arbusto","Planta lenhosa de pequeno porte, com galhos desde a base.","Arbustos podados formam uma cerca verde ao redor do lago.","Arbusto não é árvore jovem; observe se há tronco único."],["estuário","Trecho final de um rio que se abre para o mar, onde água doce e salgada se misturam.","Xangai cresceu junto ao estuário do rio Yangtzé.","Termo geográfico; confirme em fonte antes de chamar um trecho de estuário."]],"model":["No parque, um lago ocupa o centro, atravessado por uma ponte de pedra em arco.","Na margem, salgueiros inclinam as copas sobre o espelho d'água, e uma colina de bambus fecha a vista ao norte.","Diferentemente da margem sul, plana e gramada, a margem norte sobe em relevo suave coberto de vegetação rasteira.","Para mim, o parque imita uma paisagem natural — mas, como em muitos jardins urbanos, boa parte dela provavelmente foi desenhada."],"swaps":[{"vague":"natureza","options":["bosque","vegetação rasteira","copa"],"weak":"O parque tem muita natureza.","strong":"O parque tem um bosque de pinheiros, vegetação rasteira nas encostas e copas largas sobre a alameda.","flag":false},{"vague":"laguinho","options":["espelho d'água","margem","curso d'água"],"weak":"Tem um laguinho no meio.","strong":"No centro, há um espelho d'água com margens de pedra, ligado a um curso d'água estreito.","flag":true},{"vague":"morrinho","options":["colina","relevo","planície"],"weak":"Tem um morrinho no fundo.","strong":"Ao fundo, uma colina baixa quebra o relevo plano da planície ao redor.","flag":true}]},{"scene":"Uma avenida minutos antes de uma chuva de verão","focus":"Clima muda em minutos: indique a hora e o lugar. Diferencie o que você observa (nuvens, vento) de dados meteorológicos, que exigem fonte.","terms":[["encoberto","Com o céu totalmente coberto de nuvens.","Com o céu encoberto, as fachadas de vidro perdem os reflexos.","Diferencie encoberto (totalmente) de nublado com abertas."],["límpido","Claro, sem nuvens nem névoa.","Depois da chuva, o céu límpido deixa ver as colinas a oeste.","Céu límpido não significa ar limpo; qualidade do ar exige dado oficial."],["neblina","Névoa próxima do chão que reduz a visibilidade.","A neblina apaga o topo das torres às sete da manhã.","Não confunda neblina com poluição; sem medição, descreva apenas a visibilidade."],["garoa","Chuva muito fina e contínua.","Uma garoa fina deixa a calçada brilhante sem formar poças.","Garoa é diferente de chuvisco intermitente; observe a continuidade."],["aguaceiro","Chuva forte e repentina, geralmente de curta duração.","Um aguaceiro de dez minutos alaga a faixa de pedestres.","Informe a duração observada; “tempestade” exige mais que chuva forte."],["mormaço","Calor abafado com céu nublado ou sol fraco.","No mormaço da tarde, os vendedores se abrigam sob os toldos.","Mormaço é sensação local; temperatura exata exige fonte."],["abafado","Quente, úmido e com pouca circulação de ar.","O ar abafado da estação faz as pessoas abanarem os rostos com leques.","Diga se é sensação sua ou dado medido."],["crepúsculo","Período de luz difusa logo após o pôr do sol ou antes do nascer.","No crepúsculo, as luzes do rio acendem enquanto o céu ainda está azul.","Crepúsculo é intervalo de tempo; indique o horário aproximado."],["rajada","Golpe de vento forte e passageiro.","Uma rajada vira os guarda-chuvas na esquina e espalha folhas.","Rajada é vento momentâneo, diferente de ventania contínua."],["orvalho","Gotículas de água que se formam em superfícies frias durante a noite.","O orvalho ainda cobre os bancos do parque às seis da manhã.","Orvalho não é sinal de chuva noturna; observe se o chão está seco."],["nublado","Com nuvens que cobrem parte ou todo o céu.","O céu está nublado, mas o sol aparece entre as nuvens à tarde.","Diferencie nublado (com aberturas) de encoberto (totalmente coberto)."],["chuvisco","Chuva fraca, em gotas pequenas, geralmente intermitente.","Um chuvisco começa e para várias vezes durante a manhã.","Chuvisco é intermitente; garoa tende a ser contínua."],["trovoada","Tempestade com trovões e relâmpagos.","A trovoada da tarde esvazia a praça em minutos.","Ouvir trovões não basta para falar em tempestade; descreva o que viu."],["úmido","Com muita umidade no ar, o que aumenta a sensação de calor ou de frio.","O ar úmido deixa as roupas pesadas e embaça as lentes da câmera.","Umidade relativa é dado medido; sem fonte, fale da sensação."],["ventania","Vento forte e contínuo.","A ventania dobra as árvores da avenida e derruba placas.","Diferencie ventania (contínua) de rajada (momentânea)."]],"model":["Às cinco da tarde, o céu sobre a avenida está encoberto, e o ar parece parado.","No mormaço, os vendedores puxam os toldos; uma rajada levanta poeira e folhas pela calçada.","Minutos depois, a garoa fina dá lugar a um aguaceiro, e a avenida, antes abafada, se esvazia rapidamente.","Minha impressão é que a chuva reorganiza a rua em segundos — impressão de um único fim de tarde, não um padrão da cidade."],"swaps":[{"vague":"feio","options":["encoberto","neblina","aguaceiro"],"weak":"O tempo está feio.","strong":"O céu está encoberto, com neblina sobre o rio e risco de aguaceiro no fim da tarde, segundo a previsão.","flag":true},{"vague":"quente","options":["abafado","mormaço","encoberto"],"weak":"Está muito quente.","strong":"O ar está abafado, num mormaço sem vento — a temperatura exata eu não medi.","flag":false},{"vague":"chuvinha","options":["garoa","aguaceiro","neblina"],"weak":"Caiu uma chuvinha.","strong":"Caiu uma garoa fina por meia hora, sem formar poças.","flag":true}]},{"scene":"Uma rua comercial antes e depois de uma reforma","focus":"Conectores mostram a relação lógica entre as ideias. Escolha o conector pela relação que você quer expressar — e só use a conclusão se as premissas estiverem ditas.","quiz":"definition","terms":[["contudo","Conector adversativo: introduz uma oposição ao que foi dito, com registro mais formal que “mas”.","A rua ficou mais bonita; contudo, os moradores antigos dizem que perderam os vizinhos.","Pode abrir a frase ou vir entre vírgulas. Na fala, “mas” costuma soar mais natural."],["portanto","Conector conclusivo: apresenta a consequência lógica do que foi dito antes.","O aluguel dobrou e as vendas caíram; portanto, três lojas fecharam.","Só use depois de apresentar as premissas. Não confunda com “porém”, que é adversativo."],["embora","Conector concessivo: admite um fato que não impede o outro; pede subjuntivo.","Embora a obra tenha terminado, a calçada continua interditada.","Exige subjuntivo (“tenha terminado”). Não use “embora” com indicativo."],["ainda assim","Locução concessiva: reconhece o que foi dito e afirma o contrário com ênfase.","O preço subiu; ainda assim, a fila continua dobrando a esquina.","Mais enfático que “mas”; funciona bem depois de pausa na fala."],["além disso","Conector aditivo: acrescenta um argumento ou informação de mesmo peso.","A calçada foi alargada; além disso, a rua ganhou árvores.","Para acréscimos simples, “também” basta. “Ademais” é formal demais para a fala."],["por sua vez","Locução que introduz o segundo elemento de uma comparação ou sequência, com seu papel próprio.","Os comerciantes aprovaram a reforma; os moradores, por sua vez, criticam o barulho.","Exige que o primeiro elemento tenha sido apresentado antes."],["em contrapartida","Locução que apresenta uma compensação ou um contraponto ao que foi dito.","A rua perdeu vagas de estacionamento; em contrapartida, ganhou uma ciclovia.","Contrapartida é compensação; para simples oposição, prefira “por outro lado”."],["ou seja","Conector explicativo: reformula ou esclarece o que acabou de ser dito.","A reforma durou dois anos, ou seja, mais que o dobro do previsto.","O que vem depois deve esclarecer; se apenas repete, corte."],["à medida que","Locução proporcional: indica progressão simultânea entre dois fatos.","À medida que as lojas novas abriam, as bancas antigas desapareciam.","Não confunda com “na medida em que” (causa). “À medida em que” é forma não padrão."],["na medida em que","Locução causal: equivale a “porque”, “visto que” ou “no grau em que”.","A reforma importa na medida em que muda a rotina de quem mora ali.","Trocá-la por “à medida que” muda o raciocínio de causa para proporção."]],"model":["Antes da reforma, a rua tinha bancas na calçada; hoje, tem lojas de vidro e uma ciclovia.","A calçada foi alargada; além disso, a rua ganhou árvores e bancos novos.","Os comerciantes aprovaram a mudança; os moradores, por sua vez, dizem que a rua ficou mais cara. Embora mais bonita, ela perdeu as bancas.","Minha impressão, portanto, é que a reforma melhorou a rua para quem passa — e a encareceu para quem fica, o que ainda precisa de dados para ser confirmado."],"swaps":[{"vague":"e aí","options":["além disso","portanto","por sua vez"],"weak":"O preço subiu e aí as pessoas pararam de comprar.","strong":"O preço subiu; portanto, parte dos clientes deixou de comprar, segundo os vendedores.","flag":true},{"vague":"mas aí","options":["contudo","ainda assim","em contrapartida"],"weak":"O lugar é caro, mas aí tem a vista.","strong":"O lugar é caro; em contrapartida, oferece a vista mais ampla do rio.","flag":true},{"vague":"tipo","options":["ou seja","portanto","além disso"],"weak":"A reforma demorou tipo o dobro.","strong":"A reforma durou dois anos, ou seja, o dobro do previsto.","flag":false}]},{"scene":"Uma decisão de reforma que muda a vida de uma rua","focus":"Estes verbos carregam uma imagem física — a luz que incide, o som que reverbera, a onda que se propaga — e a usam para ligar causa e efeito. Escolha o verbo pela trajetória que você quer descrever: onde algo bate, como volta, até onde se espalha.","quiz":"definition","terms":[["incidir","Literalmente, cair ou bater sobre uma superfície (a luz incide na fachada). Por extensão, recair sobre algo e produzir efeito ali: aplicar-se, atingir.","A nova taxa incide sobre o aluguel das lojas térreas e chega ao preço do café.","Rege “sobre” ou “em”. Use quando houver um ponto preciso de efeito; para efeitos difusos, prefira “repercutir”."],["recair","Cair de novo ou cair sobre alguém; por extensão, ficar a cargo de alguém ou atingir determinado alvo.","O custo da obra recai sobre os comerciantes, segundo a associação.","Indica quem arca com o peso de algo. Atribua a fonte: dizer sobre quem algo recai já é uma afirmação forte."],["repercutir","Literalmente, fazer o som bater e voltar. Por extensão, produzir efeitos que se espalham além do ponto de origem.","A mudança de horário do metrô repercutiu no movimento de todo o quarteirão.","Mostre como a repercussão chega: por que caminho, até onde, com que evidência."],["reverberar","Literalmente, o som ou a luz que se refletem repetidas vezes num espaço. Por extensão, um efeito que persiste e continua ecoando depois do fato.","A demolição das casas antigas ainda reverbera nas conversas da feira.","Mais intenso e duradouro que “repercutir”. Evite em fatos pequenos: o verbo amplifica."],["ecoar","Literalmente, repetir um som por reflexão. Por extensão, retomar ou reproduzir uma ideia, uma fala ou um sentimento.","A queixa dos moradores ecoa a de outros bairros reformados nos últimos anos.","Bom para mostrar que uma ideia retorna em outro lugar; diga onde ela já tinha aparecido."],["refletir","Literalmente, devolver luz ou imagem, como um espelho. Por extensão, expressar ou mostrar algo de forma indireta.","A queda nas vendas reflete a mudança no trajeto de quem sai do metrô.","Afirma uma relação de causa; sustente com dados. Na dúvida, use “pode refletir”."],["irradiar","Literalmente, emitir raios a partir de um centro. Por extensão, espalhar-se a partir de um ponto de origem.","A valorização irradia da nova estação para as ruas vizinhas.","Use quando há um centro identificável; diga qual é."],["propagar-se","Espalhar-se, transmitir-se de um ponto a outro, como uma onda.","O rumor sobre o fechamento do mercado se propagou mais rápido que a nota oficial.","Forma pronominal: “o rumor se propagou”. Descreva o meio de propagação: boca a boca, redes, imprensa."],["desdobrar-se","Literalmente, abrir o que estava dobrado. Por extensão, desenvolver-se em consequências ou etapas sucessivas.","A decisão da prefeitura se desdobrou em três frentes: obras, aluguéis e trânsito.","Em reportagem, “desdobramento” é a continuação de uma história; enumere os desdobramentos."],["permear","Atravessar, penetrar por todos os lados, como a água em um tecido. Por extensão, estar presente em todas as partes de algo.","A preocupação com o aluguel permeia todas as entrevistas feitas na rua.","Forte: afirma presença generalizada. Use só se apareceu de fato em quase todas as fontes."],["atravessar","Passar de um lado a outro. Por extensão, perpassar diferentes partes, grupos ou momentos.","O tema da memória atravessa as falas de moradores antigos e novos.","Mostra continuidade entre partes diferentes; diga quais partes o tema atravessa."],["decorrer de","Resultar de, ser consequência de. Também: transcorrer no tempo (“o ano decorreu sem obras”).","O congestionamento decorre do fechamento de duas faixas da avenida.","Rege “de”. Liga efeito à causa; atribua a explicação se ela não for sua."],["acarretar","Trazer como consequência, causar (geralmente algo indesejado ou trabalhoso).","A reforma acarretou a perda de vinte vagas de estacionamento.","É transitivo direto: “acarretou a perda”, e não “acarretou na perda”."],["suscitar","Provocar, fazer surgir — uma dúvida, um debate, uma reação.","A proposta de demolição suscitou um abaixo-assinado entre os moradores.","Indica que algo despertou uma resposta; diga qual foi a resposta."],["convergir","Literalmente, dirigir-se para um mesmo ponto. Por extensão, chegar a uma mesma conclusão ou resultado.","Os relatos dos comerciantes convergem: o movimento caiu depois das obras.","Rege “para” ou “em”. Afirma concordância entre fontes; mostre quantas e quais."]],"model":["A prefeitura decidiu fechar duas faixas da avenida para a reforma da calçada.","A decisão incide primeiro sobre os motoristas e logo repercute nas lojas, que perdem clientes de passagem.","Enquanto o efeito sobre o trânsito se dissipa em semanas, o impacto no comércio se desdobra em aluguéis renegociados e lojas fechadas.","Minha leitura, a partir das entrevistas que convergem nesse ponto, é que a obra reverbera mais no bolso do comerciante do que no relógio do motorista — hipótese que dados de vendas confirmariam."],"swaps":[{"vague":"mexe com","options":["incidir","repercutir","recair"],"weak":"A obra mexe com as lojas.","strong":"A obra incide diretamente sobre as lojas térreas e repercute no movimento de todo o quarteirão.","flag":true},{"vague":"causa","options":["acarretar","suscitar","decorrer de"],"weak":"A obra causa problema.","strong":"A obra acarretou o fechamento de duas faixas e suscitou um abaixo-assinado.","flag":false},{"vague":"tem a ver com","options":["decorrer de","refletir","convergir"],"weak":"A fila tem a ver com o novo horário.","strong":"A fila decorre do novo horário, que concentrou a saída dos trabalhadores às 18h.","flag":true}]}];

</script>
  <script>
/* StoryLab Shanghai · Atlas Descritivo 1.4
   Ciclo lexical: entender (verbetes) → discriminar (treino de precisão)
   → produzir (prática progressiva) → revisar (repetição espaçada).
   Módulo independente; não envia rascunhos nem respostas para servidores.
   Todos os indicadores são determinísticos: não há correção por IA. */
window.StoryLabAtlas=(()=>{
'use strict';

const LEVELS=[
 ['Observar','20 s','Diga o que a câmera mostra, sem adivinhar história, autoria ou intenção.'],
 ['Descrever','40 s','Acrescente dois detalhes concretos e a relação entre eles.'],
 ['Comparar','60 s','Compare duas partes da cena usando um critério perceptível.'],
