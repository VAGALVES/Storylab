name: Verificar StoryLab
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checar integridade do conteúdo
        run: |
          python test_content.py
          python test_quality.py
          python generate_service_worker.py --check
      - name: Checar sintaxe de JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check atlas-data.js
          node --check atlas-engine.js
          node --check atlas-recorder.js
          node --check atlas-audio-ui.js
      - name: Testar interações do Atlas
        run: |
          node test_atlas.mjs
          node test_recorder.mjs
      - name: Montar versão offline
        run: |
          python build_standalone.py
          python -c "from pathlib import Path; h=Path('storylab-shanghai-offline.html').read_text(encoding='utf8'); assert h.count('<script>') == 6; assert 'STORYLAB_ATLAS_GUIDES' in h; assert 'atlas12-toolbar' in h; assert 'StoryLabRecorder' in h"
          git diff --exit-code -- storylab-shanghai-offline.html
