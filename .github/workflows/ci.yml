name: Verificar StoryLab
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checar integridade do conteúdo
        run: |
          python test_content.py
          python test_quality.py
          python generate_linguistics.py --check
          python generate_encaixes.py --check
          python generate_service_worker.py --check
      - name: Validar curadoria dos 465 alertas do Atlas
        run: python test_atlas_editorial.py
      - name: Checar sintaxe de JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check atlas-data.js
          node --check urbanism-concepts.js
          node --check urbanism-lexicon.js
          node --check urbanism-atlas.js
          node --check spatial-verbs-data.js
          node --check spatial-regency-data.js
          node --check spatial-verb-icons.js
          node --check spatial-verb-icons-extra.js
          node --check spatial-contrast-data.js
          node --check spatial-contrast.js
          node --check spatial-verbs.js
          node --check atlas-engine.js
          node --check atlas-recorder.js
          node --check atlas-audio-ui.js
          node --check interact.js
          node --check illustrations.js
          node --check linguistics-data.js
          node --check linguistics-lab.js
          node --check encaixes-data.js
          node --check encaixes-engine.js
          node --check audio-speech.js
          node --check trade-data.js
          node --check trade-hub.js
          node --check trade-field.js
          node --check trade-academy-data.js
          node --check trade-academy.js
          node --check trade-language-data.js
          node --check trade-tools.js
          node --check trade-object-data.js
          node --check trade-object.js
      - name: Testar Atlas de Produtos, Fornecedores e Fraseoteca
        run: node test_trade.mjs
      - name: Testar dossiês locais e perguntas de campo
        run: node test_trade_field.mjs
      - name: Testar academia interindustrial e radar setorial
        run: node test_trade_academy.mjs
      - name: Testar atlas descritivo universal e laboratorio narrativo
        run: node test_trade_object.mjs
      - name: Testar linguagem técnica, comparação e visita guiada
        run: node test_trade_tools.mjs
      - name: Testar áudio transversal em três idiomas
        run: node test_audio.mjs
      - name: Testar Encaixes da Fraseoteca
        run: node test_encaixes.mjs
      - name: Testar Academia da Linguagem e diagramas
        run: node test_linguistics.mjs
      - name: Testar clique da Linguística Aplicada no menu mobile
        run: node test_navigation_linguistics.mjs
      - name: Testar navegação e conteúdo do Atlas
        run: node test_atlas.mjs
      - name: Testar o Atlas Semântico do Urbanismo
        run: node test_urbanism.mjs
      - name: Testar verbos, famílias e laboratório espacial
        run: node test_spatial_verbs.mjs
      - name: Testar diagramas semânticos por verbo
        run: node test_spatial_icons.mjs
      - name: Testar 64 pictogramas semânticos e contrastes inteligentes
        run: node test_all_spatial_icons.mjs
      - name: Testar duelos visuais e reforço inteligente
        run: node test_spatial_contrast.mjs
      - name: Testar regência e construções bilíngues
        run: node test_spatial_regency.mjs
      - name: Testar busca, cartões, sequência e Monte a frase
        run: node test_interact.mjs
      - name: Testar esquemas explicativos das aulas
        run: node test_figures.mjs
      - name: Curadoria editorial, SVG e contraste dos botões
        run: node test_visual_curator.mjs
      - name: Verificar permissões e captura de áudio
        run: STORYLAB_STAGE=media node test_recorder.mjs
      - name: Verificar montagem do painel de voz
        run: STORYLAB_STAGE=interface node test_recorder.mjs
      - name: Verificar início de gravação
        run: STORYLAB_STAGE=audio-start node test_recorder.mjs
      - name: Verificar finalização do take
        run: STORYLAB_STAGE=audio-stop node test_recorder.mjs
      - name: Verificar reprodução e descarte
        run: STORYLAB_STAGE=playback node test_recorder.mjs
      - name: Verificar registro de sessão oral
        run: STORYLAB_STAGE=save node test_recorder.mjs
      - name: Testar gravador local completo
        run: node test_recorder.mjs
      - name: Montar versão offline
        run: |
          python build_standalone.py
          python -c "from pathlib import Path; h=Path('storylab-shanghai-offline.html').read_text(encoding='utf8'); assert h.count('<script>') == 32; assert 'StoryLabInteract' in h; assert 'STORYLAB_ATLAS_GUIDES' in h; assert 'atlas12-toolbar' in h; assert 'StoryLabRecorder' in h; assert 'StoryLabLinguistics' in h; assert 'StoryLabEncaixes' in h; assert 'StoryLabAudio' in h; assert 'StoryLabTrade' in h"
          # O HTML único é reconstruído no deploy do Netlify. O arquivo do repositório
          # é uma cópia histórica; não exigimos igualdade de bytes até sincronizá-lo.
          python -c "from pathlib import Path; h=Path('storylab-shanghai-offline.html').read_text(encoding='utf8'); assert 'Encaixes' in h and 'STORYLAB_ENCAIXES' in h"
      - name: Verificar pacote da hospedagem gratuita
        run: |
          python build_pages.py
          python -c "from pathlib import Path; d=Path('_site'); assert all((d / f).exists() for f in ('index.html','service-worker.js','manifest.webmanifest','app.js','trade-hub.js','trade-field.js','storylab-shanghai-offline.html','.nojekyll')); assert len(list(d.rglob('*'))) >= 30"
