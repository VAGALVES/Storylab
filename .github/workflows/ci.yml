name: Verificar StoryLab
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checar integridade do conteúdo
        run: |
          python test_content.py
          python test_quality.py
          python generate_service_worker.py --check
      - name: Checar sintaxe de JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check atlas-data.js
          node --check urbanism-concepts.js
          node --check urbanism-lexicon.js
          node --check urbanism-atlas.js
          node --check spatial-verbs-data.js
          node --check spatial-verbs.js
          node --check atlas-engine.js
          node --check atlas-recorder.js
          node --check atlas-audio-ui.js
          node --check interact.js
      - name: Testar navegação e conteúdo do Atlas
        run: node test_atlas.mjs
      - name: Testar o Atlas Semântico do Urbanismo
        run: node test_urbanism.mjs
      - name: Testar verbos, famílias e laboratório espacial
        run: node test_spatial_verbs.mjs
      - name: Testar busca, cartões, sequência e Monte a frase
        run: node test_interact.mjs
      - name: Verificar permissões e captura de áudio
        run: STORYLAB_STAGE=media node test_recorder.mjs
      - name: Verificar montagem do painel de voz
        run: STORYLAB_STAGE=interface node test_recorder.mjs
      - name: Verificar início de gravação
        run: STORYLAB_STAGE=audio-start node test_recorder.mjs
      - name: Verificar finalização do take
        run: STORYLAB_STAGE=audio-stop node test_recorder.mjs
      - name: Verificar reprodução e descarte
        run: STORYLAB_STAGE=playback node test_recorder.mjs
      - name: Verificar registro de sessão oral
        run: STORYLAB_STAGE=save node test_recorder.mjs
      - name: Testar gravador local completo
        run: node test_recorder.mjs
      - name: Montar versão offline
        run: |
          python build_standalone.py
          python -c "from pathlib import Path; h=Path('storylab-shanghai-offline.html').read_text(encoding='utf8'); assert h.count('<script>') == 12; assert 'StoryLabInteract' in h; assert 'STORYLAB_ATLAS_GUIDES' in h; assert 'atlas12-toolbar' in h; assert 'StoryLabRecorder' in h"
          git diff --exit-code -- storylab-shanghai-offline.html
