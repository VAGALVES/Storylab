name: Verificar StoryLab
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checar integridade do conteúdo
        run: python test_content.py
      - name: Checar sintaxe de JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check atlas-data.js
          node --check atlas-engine.js
